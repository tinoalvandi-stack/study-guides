/* Apply saved theme before first paint. localStorage may be unavailable
   (private mode, sandboxed previews): fail silently to "auto". */

/* ---------- iOS system tokens ---------- */
:root {
  --spring: cubic-bezier(.32,.72,0,1);
  --bg: #F2F2F7;                       /* systemGroupedBackground */
  --card: #FFFFFF;                     /* secondarySystemGroupedBackground */
  --card-press: #E5E5EA;
  --label: #000000;
  --label-2: rgba(60,60,67,.60);       /* secondaryLabel */
  --label-3: rgba(60,60,67,.30);       /* tertiaryLabel */
  --sep: rgba(60,60,67,.29);           /* separator */
  --fill: rgba(120,120,128,.12);       /* systemFill quaternary */
  --fill-2: rgba(120,120,128,.20);
  --blue: #007AFF;
  --chrome: rgba(242,242,247,.72);
  --shadow: 0 1px 2px rgba(0,0,0,.04);
  --tint: var(--blue);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #000000;
    --card: #1C1C1E;
    --card-press: #2C2C2E;
    --label: #FFFFFF;
    --label-2: rgba(235,235,245,.60);
    --label-3: rgba(235,235,245,.30);
    --sep: rgba(84,84,88,.60);
    --fill: rgba(120,120,128,.24);
    --fill-2: rgba(120,120,128,.32);
    --blue: #0A84FF;
    --chrome: rgba(0,0,0,.72);
    --shadow: none;
  }
}
:root[data-theme="dark"] {
  --bg: #000000;
  --card: #1C1C1E;
  --card-press: #2C2C2E;
  --label: #FFFFFF;
  --label-2: rgba(235,235,245,.60);
  --label-3: rgba(235,235,245,.30);
  --sep: rgba(84,84,88,.60);
  --fill: rgba(120,120,128,.24);
  --fill-2: rgba(120,120,128,.32);
  --blue: #0A84FF;
  --chrome: rgba(0,0,0,.72);
  --shadow: none;
}

/* Per-class tints: [data-theme=dark] and OS-dark both flip to the vivid set. */
.c-apush   { --tint:#FF3B30 } .c-lang  { --tint:#FF9500 } .c-phys { --tint:#30B0C7 }
.c-psych   { --tint:#FF2D55 } .c-sem   { --tint:#5856D6 } .c-span { --tint:#D9A400 }

  :root:not([data-theme="light"]) .c-apcsp{--tint:#64D2FF}
}

/* ---------- base ---------- */
* { box-sizing: border-box; margin: 0; padding: 0 }
html { -webkit-text-size-adjust: 100% }
body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display",
               "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background: var(--bg); color: var(--label);
  font-size: 17px; line-height: 1.35;
  -webkit-font-smoothing: antialiased;
  min-height: 100dvh;
}
a { color: inherit; text-decoration: none }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; border-radius: 8px }

.wrap { max-width: 640px; margin: 0 auto; padding: 0 16px calc(24px + env(safe-area-inset-bottom)) }

/* ---------- chrome (sticky header) ---------- */
header {
  position: sticky; top: 0; z-index: 20;
  background: var(--chrome);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
  backdrop-filter: saturate(180%) blur(20px);
  border-bottom: .5px solid var(--sep);
}
.bar { max-width: 640px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 10px }
.bar h1 { font-size: 17px; font-weight: 600; letter-spacing: -.2px; margin-right: auto;
          opacity: 0; transition: opacity .25s var(--spring) }
.bar h1.show { opacity: 1 }

/* segmented control */
.seg { position: relative; display: flex; background: var(--fill); border-radius: 9px; padding: 2px }
.seg button {
  position: relative; z-index: 1; padding: 3px 10px; font-size: 13px; font-weight: 500;
  color: var(--label-2); border-radius: 7px; transition: color .2s var(--spring);
}
.seg button[aria-pressed="true"] { color: var(--label) }
.seg .thumb {
  position: absolute; z-index: 0; top: 2px; bottom: 2px; border-radius: 7px;
  background: var(--card); box-shadow: 0 1px 4px rgba(0,0,0,.12), 0 0 0 .5px rgba(0,0,0,.04);
  transition: left .35s var(--spring), width .35s var(--spring);
}
.searchbtn {
  display: flex; align-items: center; gap: 6px; padding: 5px 10px;
  background: var(--fill); border-radius: 9px; color: var(--label-2); font-size: 13px; font-weight: 500;
}
.searchbtn svg { width: 13px; height: 13px }
.searchbtn kbd {
  font-family: inherit; font-size: 11px; color: var(--label-3);
  border: .5px solid var(--sep); border-radius: 4px; padding: 0 4px;
}
@media (max-width: 480px) { .searchbtn kbd, .searchbtn .lbl { display: none } .searchbtn { padding: 6px 8px } }

/* ---------- intro ---------- */
.intro { padding: 26px 0 4px }
.intro h2 { font-size: 32px; font-weight: 700; letter-spacing: -.6px }
.intro p { color: var(--label-2); margin-top: 3px; font-size: 15px }

/* ---------- section headers ---------- */
.sechead {
  margin: 26px 16px 7px; font-size: 13px; font-weight: 600;
  text-transform: uppercase; letter-spacing: .4px; color: var(--label-2);
  display: flex; align-items: baseline; gap: 8px;
}
.sechead small { font-weight: 400; text-transform: none; letter-spacing: 0; color: var(--label-3) }

/* ---------- feature card ---------- */
.feature {
  display: block; position: relative; overflow: hidden;
  background: var(--card); border-radius: 16px; box-shadow: var(--shadow);
  padding: 18px 18px 16px; margin-top: 14px;
  transition: transform .35s var(--spring), background .2s;
}
.feature::before {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(135deg, color-mix(in srgb, var(--tint) 14%, transparent), transparent 55%);
  pointer-events: none;
}
.feature:active { transform: scale(.985) }
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .6px; text-transform: uppercase; color: var(--tint) }
.feature h3 { font-size: 22px; font-weight: 700; letter-spacing: -.4px; margin: 6px 0 2px }
.feature .cls { font-size: 14px; color: var(--label-2) }
.feature .row2 { display: flex; align-items: center; gap: 8px; margin-top: 12px; flex-wrap: wrap }
.chip {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 13px; font-weight: 600; color: var(--tint);
  background: color-mix(in srgb, var(--tint) 14%, transparent);
  border-radius: 100px; padding: 4px 10px;
}
.chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--tint) }
.open { margin-left: auto; font-size: 14px; font-weight: 600; color: var(--tint); display: flex; align-items: center; gap: 2px }

/* ---------- inset grouped lists ---------- */
.group { background: var(--card); border-radius: 12px; box-shadow: var(--shadow); overflow: hidden }
.group + .group { margin-top: 18px }
.ghead { display: flex; align-items: center; gap: 10px; padding: 11px 16px 10px }
.ghead .name { font-weight: 600; font-size: 16px }
.ghead .count { margin-left: auto; font-size: 13px; color: var(--label-3) }
.glyph { width: 28px; height: 28px; flex: none; color: var(--tint) }
.glyph svg { width: 100%; height: 100% }

.row {
  display: flex; align-items: center; gap: 10px;
  padding: 11px 16px; position: relative;
  transition: background .15s;
}
.row + .row::before, .ghead + .row::before {
  content: ""; position: absolute; top: 0; left: 54px; right: 0; height: .5px; background: var(--sep);
}
.ghead + .row::before { left: 16px }
a.row:active { background: var(--card-press) }
@media (hover: hover) { a.row:hover { background: var(--fill) } .feature:hover { transform: translateY(-1px) } }
.row .t { font-size: 16px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.row .spacer { flex: 1 }
.tag {
  flex: none; font-size: 12px; font-weight: 600; color: var(--label-2);
  background: var(--fill); border-radius: 6px; padding: 2px 7px;
}
.chev { flex: none; width: 8px; height: 13px; color: var(--label-3) }
.soon { color: var(--label-2) }
.soon .t { color: inherit }
.pill-soon {
  flex: none; font-size: 12px; font-weight: 600; color: var(--label-2);
  background: var(--fill); border-radius: 100px; padding: 3px 9px;
}

/* archive */
details.archive > summary {
  list-style: none; display: flex; align-items: center; gap: 8px;
  margin: 26px 16px 7px; font-size: 13px; font-weight: 600;
  text-transform: uppercase; letter-spacing: .4px; color: var(--label-2); cursor: pointer;
  -webkit-user-select: none; user-select: none;
}
details.archive > summary::-webkit-details-marker { display: none }
details.archive > summary .dis {
  width: 11px; height: 11px; transition: transform .35s var(--spring); color: var(--label-3);
}
details.archive[open] > summary .dis { transform: rotate(90deg) }
details.archive > summary small { font-weight: 400; text-transform: none; letter-spacing: 0; color: var(--label-3) }

/* ---------- footer ---------- */
footer { margin-top: 40px; text-align: center; color: var(--label-3); font-size: 12.5px; line-height: 1.6 }

/* ---------- search overlay ---------- */
dialog#search {
  border: 0; padding: 0; background: transparent; width: min(560px, calc(100vw - 32px));
  margin: clamp(16px, 12vh, 120px) auto auto;
}
dialog#search::backdrop {
  background: rgba(0,0,0,.30);
  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
}
.panel {
  background: var(--card); border-radius: 14px; overflow: hidden;
  box-shadow: 0 24px 60px rgba(0,0,0,.25), 0 0 0 .5px var(--sep);
}
.panel input {
  width: 100%; border: 0; outline: 0; background: transparent; color: var(--label);
  font: inherit; font-size: 17px; padding: 15px 16px;
}
.panel input::placeholder { color: var(--label-3) }
#results { max-height: 46vh; overflow-y: auto; border-top: .5px solid var(--sep); padding: 6px }
#results:empty { display: none }
#results a {
  display: flex; align-items: center; gap: 10px; padding: 10px 10px; border-radius: 9px;
}
#results a .glyph { width: 22px; height: 22px }
#results a .m { min-width: 0 }
#results a .m b { display: block; font-size: 15px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
#results a .m span { font-size: 12.5px; color: var(--label-2) }
#results a[aria-selected="true"], #results a:hover { background: var(--fill) }
#results .none { padding: 14px 12px; color: var(--label-2); font-size: 15px }

/* ---------- motion ---------- */
@media (prefers-reduced-motion: no-preference) {
  .reveal { opacity: 0; transform: translateY(14px) scale(.99); animation: rise .6s var(--spring) forwards; animation-delay: var(--d, 0s) }
  @keyframes rise { to { opacity: 1; transform: none } }
  dialog#search[open] .panel { animation: pop .35s var(--spring) }
  @keyframes pop { from { opacity: 0; transform: scale(.96) translateY(-6px) } }
}
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important }
}
</style>
</head>

/* ===================================================================== */

const $ = (s, el) => (el || document).querySelector(s);
const byId = id => CLASSES.find(c => c.id === id);

/* Local-date-safe parse: "YYYY-MM-DD" as local midnight, not UTC. */
function localDate(s) {
  const [y, m, d] = s.split("-").map(Number);
  return new Date(y, m - 1, d);
}
function daysUntil(dateStr, now) {
  const n = now || new Date();
  const today = new Date(n.getFullYear(), n.getMonth(), n.getDate());
  return Math.round((localDate(dateStr) - today) / 86400000);
}
function chipText(dateStr, now) {
  const d = daysUntil(dateStr, now);
  if (d < 0) return null;                       /* expired: chip hides itself */
  if (d === 0) return "Test today";
  if (d === 1) return "Test tomorrow";
  const dt = localDate(dateStr);
  const wd = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][dt.getDay()];
  const mo = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][dt.getMonth()];
  return `Test ${wd}, ${mo} ${dt.getDate()}`;
}
/* exposed for tests */
window.__chipText = chipText;

function el(tag, cls, html) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (html !== undefined) n.innerHTML = html;
  return n;
}
function esc(s) { return s.replace(/[&<>"']/g, m => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[m])); }
function glyphSvg(id) { return `<span class="glyph" aria-hidden="true"><svg viewBox="0 0 32 32"><use href="#${id}"/></svg></span>`; }
function chev() { return `<svg class="chev" viewBox="0 0 8 13" aria-hidden="true"><use href="#g-chev"/></svg>`; }

function guideRow(g) {
  const a = el("a", "row");
  a.href = g.url; a.target = "_blank"; a.rel = "noopener noreferrer";
  a.innerHTML = `<span class="t">${esc(g.t)}</span><span class="spacer"></span>` +
                (g.tag ? `<span class="tag">${esc(g.tag)}</span>` : "") + chev();
  return a;
}

function classGroup(c, delay) {
  const g = el("section", `group ${c.cls} reveal`);
  g.style.setProperty("--d", delay + "s");
  const head = el("div", "ghead",
    glyphSvg(c.glyph) +
    `<span class="name">${esc(c.name)}</span>` +
    `<span class="count">${c.guides.length}</span>`);
  g.append(head);
  c.guides.forEach(x => g.append(guideRow(x)));
  return g;
}

function render() {
  /* Feature card */
  const fc = byId(FEATURE.classId);
  const chip = chipText(FEATURE.test);
  const a = el("a", `feature ${fc.cls} reveal`);
  a.style.setProperty("--d", ".06s");
  a.href = FEATURE.url; a.target = "_blank"; a.rel = "noopener noreferrer";
  a.innerHTML =
    `<span class="eyebrow">Up next</span>` +
    `<h3>${esc(FEATURE.title)}</h3>` +
    `<div class="cls">${esc(fc.name)}</div>` +
    `<div class="row2">${chip ? `<span class="chip">${esc(chip)}</span>` : ""}` +
    `<span class="open">Open guide ${chev()}</span></div>`;
  $("#featureSlot").append(a);

  /* This year */
  const now = $("#thisYear");
  const junior = CLASSES.filter(c => c.year === "junior");
  let d = 0.12;
  junior.filter(c => c.guides.length).forEach(c => { d += 0.04; now.append(classGroup(c, d)); });
  const empty = junior.filter(c => !c.guides.length);
  if (empty.length) {
    d += 0.04;
    const g = el("section", "group reveal");
    g.style.setProperty("--d", d + "s");
    empty.forEach(c => {
      const r = el("div", `row soon ${c.cls}`,
        glyphSvg(c.glyph) + `<span class="t">${esc(c.name)}</span><span class="spacer"></span><span class="pill-soon">Soon</span>`);
      g.append(r);
    });
    now.append(g);
  }

  /* Archive */
  const arc = $("#archive");
  let d2 = 0;
  CLASSES.filter(c => c.year === "soph").forEach(c => { arc.append(classGroup(c, d2)); d2 = 0; });
}
render();

/* ---------- theme segmented control ---------- */
const seg = $(".seg"), thumb = $(".seg .thumb"), segBtns = [...seg.querySelectorAll("button")];
function moveThumb() {
  const on = seg.querySelector('button[aria-pressed="true"]');
  thumb.style.left = on.offsetLeft + "px";
  thumb.style.width = on.offsetWidth + "px";
}
function setTheme(mode) {
  const apply = () => { document.documentElement.dataset.theme = mode; };
  if (document.startViewTransition && matchMedia("(prefers-reduced-motion: no-preference)").matches) {
    document.startViewTransition(apply);
  } else apply();
  segBtns.forEach(b => b.setAttribute("aria-pressed", String(b.dataset.set === mode)));
  moveThumb();
  try {
    if (mode === "auto") localStorage.removeItem("theme");
    else localStorage.setItem("theme", mode);
  } catch (e) {}
}
segBtns.forEach(b => b.addEventListener("click", () => setTheme(b.dataset.set)));
segBtns.forEach(b => b.setAttribute("aria-pressed", String(b.dataset.set === document.documentElement.dataset.theme)));
moveThumb();
addEventListener("resize", moveThumb);

/* ---------- search ---------- */
const dlg = $("#search"), q = $("#q"), results = $("#results");
const INDEX = [];
CLASSES.forEach(c => c.guides.forEach(g => INDEX.push({
  cls: c.cls, glyph: c.glyph, title: g.t, tag: g.tag || "",
  sub: (c.abbr || c.name) + (c.year === "soph" ? " · last year" : ""),
  hay: (c.name + " " + (c.abbr || "") + " " + g.t + " " + (g.tag || "")).toLowerCase(),
  url: g.url
})));

let sel = 0;
function drawResults(list) {
  results.innerHTML = "";
  if (!list.length) { results.append(el("div", "none", "No guides match.")); return; }
  list.slice(0, 12).forEach((it, i) => {
    const a = el("a", it.cls);
    a.href = it.url; a.target = "_blank"; a.rel = "noopener noreferrer";
    a.setAttribute("role", "option");
    a.setAttribute("aria-selected", String(i === sel));
    a.innerHTML = glyphSvg(it.glyph) +
      `<span class="m"><b>${esc(it.title)}${it.tag ? " · " + esc(it.tag) : ""}</b><span>${esc(it.sub)}</span></span>`;
    results.append(a);
  });
}
function filter() {
  sel = 0;
  const terms = q.value.trim().toLowerCase().split(/\s+/).filter(Boolean);
  const list = terms.length ? INDEX.filter(it => terms.every(t => it.hay.includes(t))) : INDEX;
  drawResults(list);
}
function openSearch() { dlg.showModal(); q.value = ""; filter(); q.focus(); }
$("#searchOpen").addEventListener("click", openSearch);
q.addEventListener("input", filter);
dlg.addEventListener("click", e => { if (e.target === dlg) dlg.close(); });
dlg.addEventListener("keydown", e => {
  if (e.key === "Escape") { e.preventDefault(); dlg.close(); return; }
  const opts = [...results.querySelectorAll("a")];
  if (!opts.length) return;
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    e.preventDefault();
    sel = (sel + (e.key === "ArrowDown" ? 1 : -1) + opts.length) % opts.length;
    opts.forEach((o, i) => o.setAttribute("aria-selected", String(i === sel)));
    opts[sel].scrollIntoView({ block: "nearest" });
  } else if (e.key === "Enter") {
    e.preventDefault();
    opts[sel] && opts[sel].click();
    dlg.close();
  }
});
/* ---------- large-title collapse ---------- */
new IntersectionObserver(([e]) => {
  $(".bar h1").classList.toggle("show", !e.isIntersecting);
}, { rootMargin: "-56px 0px 0px 0px" }).observe($(".intro h2"));

addEventListener("keydown", e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") {
    e.preventDefault();
    dlg.open ? dlg.close() : openSearch();
  }
});
</script>
