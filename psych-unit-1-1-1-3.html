<meta name="color-scheme" content="light dark">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#EEE8DC">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#151B20">

<style>
/* ═══ valentino guides · guide template (kinari, sept 2026) ═══
   Same tokens, type, corners and components as the homepage. Edit the GUIDE object below the machinery; leave the CSS alone. */
@font-face{font-family:"Bricolage Grotesque";font-style:normal;font-weight:200 800;font-display:swap;src:url(/fonts/bricolage-grotesque.woff2) format("woff2")}
@font-face{font-family:"Figtree";font-style:normal;font-weight:300 900;font-display:swap;src:url(/fonts/figtree.woff2) format("woff2")}
@font-face{font-family:"Figtree";font-style:italic;font-weight:300 900;font-display:swap;src:url(/fonts/figtree-italic.woff2) format("woff2")}

:root{--paper:#EEE8DC;--surface:#FBF8F1;--surface2:#F4EFE5;--line:#D4CABB;--line2:#B4ADA1;--ink:#20272B;--ink2:rgba(94,90,82,1);--ink3:rgba(94,90,82,.95);--accent:#294A5E;--on-accent:#FBF8F1;--hi:#944B34;--good:#4C6A48;--bad:#8E3F4C;
  --c-apush:#8A442D;--c-psych:#873E50;--c-phys:#28636A;--c-pre:#684A78;--c-sem:#56633B;--c-biz:#75601E;--c-mor:#69513D;--c-lang:#4A4E7A;--c-span:#8E3F3A;--c-apwh:#5F4A78;--c-csp:#4E5A63}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#151B20;--surface:#1D252A;--surface2:#192024;--line:#354149;--line2:#576064;--ink:#F2ECDF;--ink2:rgba(185,178,167,.97);--ink3:rgba(185,178,167,.77);--accent:#8FB7CA;--on-accent:#1D252A;--hi:#E18A67;--good:#9BBC8A;--bad:#DF8592;
  --c-apush:#E08B68;--c-psych:#DB8D9C;--c-phys:#75B8B6;--c-pre:#C39ACC;--c-sem:#AAB67A;--c-biz:#CBB15F;--c-mor:#C79E7B;--c-lang:#A9AEE0;--c-span:#E09490;--c-apwh:#BBA3D6;--c-csp:#A9B6BE}}
:root[data-theme="dark"]{--paper:#151B20;--surface:#1D252A;--surface2:#192024;--line:#354149;--line2:#576064;--ink:#F2ECDF;--ink2:rgba(185,178,167,.97);--ink3:rgba(185,178,167,.77);--accent:#8FB7CA;--on-accent:#1D252A;--hi:#E18A67;--good:#9BBC8A;--bad:#DF8592;
  --c-apush:#E08B68;--c-psych:#DB8D9C;--c-phys:#75B8B6;--c-pre:#C39ACC;--c-sem:#AAB67A;--c-biz:#CBB15F;--c-mor:#C79E7B;--c-lang:#A9AEE0;--c-span:#E09490;--c-apwh:#BBA3D6;--c-csp:#A9B6BE}

:root{
  --display:"Bricolage Grotesque",-apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",sans-serif;
  --sans:"Figtree",-apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",sans-serif;
  --w-d:600; --ls-d:-.025em;
  --t12:12px; --t13:13px; --t15:15px; --t16:16px; --t20:20px; --t26:26px;
  --r-card:14px; --r-btn:10px; --r-chip:8px;
  --spring:cubic-bezier(.32,.72,0,1); --ease:cubic-bezier(.22,.61,.36,1);
  --gap:16px;
  --cls:var(--accent);            /* set from GUIDE.id at runtime: the class color */
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:var(--t16);line-height:1.5;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;overflow-x:hidden;min-height:100vh;
  padding-bottom:calc(48px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:left}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.wrap{max-width:640px;margin:0 auto;padding:0 var(--gap)}
.lc{text-transform:lowercase}

/* bar */
.bar{position:sticky;top:0;z-index:40;background:var(--paper);padding:max(10px,env(safe-area-inset-top)) 0 10px;transition:box-shadow .3s var(--ease)}
.bar.stuck{box-shadow:0 1px 0 0 var(--line)}
.bar .wrap{display:flex;align-items:center;gap:10px}
.home{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:26px;height:26px;border-radius:5px;flex:none;display:block}
.bar h1{margin:0;font-family:var(--display);font-size:var(--t20);font-weight:var(--w-d);letter-spacing:var(--ls-d);text-transform:lowercase;white-space:nowrap}
@media (max-width:379px){.bar h1{display:none}}
.seg{position:relative;display:flex;border:1px solid var(--line);border-radius:8px;padding:2px;isolation:isolate;flex:none;background:var(--surface)}
.seg button{position:relative;z-index:2;padding:4px 9px;border-radius:6px;font-size:var(--t12);font-weight:500;color:var(--ink3);text-transform:lowercase;text-align:center;transition:color .2s var(--ease)}
.seg button[aria-pressed="true"]{color:var(--on-accent)}
.seg .thumb{position:absolute;z-index:1;top:2px;bottom:2px;left:2px;width:0;border-radius:6px;background:var(--ink);transition:left .36s var(--spring),width .36s var(--spring)}
.bar .seg{margin-left:auto}

/* intro */
main{padding-top:22px}
.crow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.cname{display:flex;align-items:center;gap:7px;font-size:var(--t12);font-weight:600;letter-spacing:.04em;color:var(--cls);text-transform:lowercase}
.cname svg{width:20px;height:20px;flex:none}
.chip{flex:none;font-size:var(--t12);font-weight:500;padding:3px 8px;border-radius:var(--r-chip);background:var(--surface2);color:var(--ink2);white-space:nowrap;font-variant-numeric:tabular-nums;border:1px solid var(--line);text-transform:lowercase}
.chip.due{color:var(--cls);border-color:var(--cls);background:transparent}
.chip.past{color:var(--ink3)}
h2.title{margin:0 0 6px;font-family:var(--display);font-size:clamp(28px,7.6vw,38px);font-weight:var(--w-d);letter-spacing:var(--ls-d);line-height:1.05;text-transform:lowercase;text-wrap:balance}
.sub{margin:0 0 18px;font-size:var(--t15);line-height:1.5;color:var(--ink2);max-width:52ch;text-transform:lowercase}

/* pane switcher */
.panes{display:flex;gap:2px;margin:0 0 22px;padding:2px;border:1px solid var(--line);border-radius:10px;background:var(--surface);position:relative;isolation:isolate;overflow-x:auto;scrollbar-width:none}
.panes::-webkit-scrollbar{display:none}
.panes button{flex:1 0 auto;position:relative;z-index:2;padding:7px 12px;border-radius:8px;text-align:center;font-size:var(--t13);font-weight:500;color:var(--ink3);text-transform:lowercase;white-space:nowrap;transition:color .2s var(--ease)}
.panes button[aria-selected="true"]{color:var(--on-accent)}
.panes .thumb{position:absolute;z-index:1;top:2px;bottom:2px;left:2px;width:0;border-radius:8px;background:var(--ink);transition:left .36s var(--spring),width .36s var(--spring)}
.panes.one{display:none}
.pane{display:none}
.pane.on{display:block;animation:rise .38s var(--spring) both}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* section head */
.sh{display:flex;align-items:center;gap:10px;margin:26px 0 10px}
.sh:first-child{margin-top:0}
.sh h3{margin:0;font-size:var(--t12);font-weight:600;letter-spacing:.05em;color:var(--ink3);text-transform:lowercase}
.sh::after{content:"";flex:1;height:1px;background:var(--line);order:2}
.shx{order:3;font-size:var(--t12);color:var(--ink3);text-transform:lowercase;font-variant-numeric:tabular-nums}

/* cards + groups */
.card{border-radius:var(--r-card);background:var(--surface);border:1px solid var(--line);padding:14px 16px;margin-bottom:10px}
.card.top{border-left:4px solid var(--cls);padding-left:15px}
.card.top p{margin:0 0 8px} .card.top p:last-child{margin-bottom:0}
.group{border-radius:var(--r-card);overflow:hidden;background:var(--surface);border:1px solid var(--line);margin-bottom:10px}
.row{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:12px 14px;position:relative;z-index:1;cursor:pointer;transition:background .16s var(--ease)}
.row + .row,.body + .row{border-top:1px solid var(--line)}
.row:active{background:var(--surface2)}
@media (hover:hover){.row:hover{background:var(--surface2)}}
.rt{min-width:0;flex:1}
.rn{display:block;font-size:var(--t16);font-weight:500;letter-spacing:-.004em;line-height:1.3}
.rd{display:block;font-size:var(--t12);color:var(--ink3);margin-top:1px;text-transform:lowercase}
.chev{flex:none;color:var(--ink3);transition:transform .24s var(--spring)}
.row[aria-expanded="true"] .chev{transform:rotate(90deg)}
.w{flex:none;font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:var(--r-chip);text-transform:lowercase;letter-spacing:0}
.w3{background:var(--cls);color:var(--surface)}
.w2{background:color-mix(in srgb,var(--cls) 16%,transparent);color:var(--cls)}
.body{display:grid;grid-template-rows:0fr;background:var(--surface2);border-top:1px solid var(--line);transition:grid-template-rows .36s var(--spring)}
.body.on{grid-template-rows:1fr}
.body > div{overflow:hidden}
.body .in{padding:12px 16px 14px}
.body p{margin:0 0 10px;color:var(--ink);line-height:1.5}
.body p:last-child{margin-bottom:0}

/* prose emphasis */
.kw{font-weight:650;color:var(--ink);text-decoration:underline;text-decoration-color:var(--cls);text-decoration-thickness:2px;text-underline-offset:3px}
.hl{background:color-mix(in srgb,var(--cls) 20%,transparent);color:var(--ink);border-radius:4px;padding:1px 4px;margin:0 -1px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.trap{color:var(--bad);font-weight:600}
.terms{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.term{font-size:var(--t12);font-weight:500;padding:3px 8px;border-radius:var(--r-chip);border:1px solid color-mix(in srgb,var(--cls) 40%,var(--line));background:color-mix(in srgb,var(--cls) 10%,transparent);color:var(--ink)}
.callout{margin:10px 0 0;padding:9px 12px 9px 13px;border-radius:var(--r-btn);font-size:var(--t15);line-height:1.45;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--cls);color:var(--ink)}
.callout.warn{border-left-color:var(--bad)} .callout.ex{border-left-color:var(--accent)} .callout.ok{border-left-color:var(--good)}
.callout .cl{font-size:11.5px;font-weight:600;text-transform:lowercase;letter-spacing:.04em;color:var(--ink3);display:block;margin-bottom:2px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
@media (max-width:479px){.cmp{grid-template-columns:1fr}}
.cmp > div{padding:10px 12px;border-radius:var(--r-btn);background:var(--surface);border:1px solid var(--line)}
.cmp h5{margin:0 0 4px;font-size:var(--t12);font-weight:600;letter-spacing:.04em;color:var(--cls);text-transform:lowercase}
.cmp p{margin:0 0 6px;font-size:var(--t15)} .cmp p:last-child{margin:0}
.steps{margin:10px 0 0;padding:0;list-style:none;counter-reset:s}
.steps li{position:relative;padding:6px 0 6px 30px;font-size:var(--t15);line-height:1.45;counter-increment:s}
.steps li::before{content:counter(s);position:absolute;left:0;top:7px;width:20px;height:20px;border-radius:6px;background:var(--cls);color:var(--surface);font-size:11.5px;font-weight:600;display:grid;place-items:center}
.steps li + li{border-top:1px solid var(--line)}
.abbr{font-size:var(--t13);color:var(--ink2);line-height:1.6}
.abbr b{color:var(--ink);font-weight:600}

/* practice mc */
.q{margin-bottom:10px}
.q .qt{padding:14px 16px 10px;font-size:var(--t16);font-weight:500;line-height:1.4}
.q .qn{font-size:var(--t12);color:var(--ink3);font-variant-numeric:tabular-nums;margin-bottom:4px;text-transform:lowercase}
.opt{display:flex;align-items:flex-start;gap:11px;width:100%;padding:11px 14px;border-top:1px solid var(--line);font-size:var(--t15);line-height:1.4;transition:background .16s var(--ease)}
.opt:active{background:var(--surface2)}
@media (hover:hover){.q:not(.done) .opt:hover{background:var(--surface2)}}
.opt .k{flex:none;width:22px;height:22px;border-radius:6px;border:1px solid var(--line);display:grid;place-items:center;font-size:11.5px;font-weight:600;color:var(--ink3);margin-top:1px}
.q.done .opt{cursor:default}
.opt.right{background:color-mix(in srgb,var(--good) 14%,transparent)}
.opt.right .k{background:var(--good);border-color:var(--good);color:var(--surface)}
.opt.wrong{background:color-mix(in srgb,var(--bad) 12%,transparent)}
.opt.wrong .k{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.why{display:none;padding:10px 16px 12px;border-top:1px solid var(--line);background:var(--surface2);font-size:var(--t15);line-height:1.45;color:var(--ink)}
.why b{color:var(--ink3);font-weight:600;font-size:var(--t12);text-transform:lowercase;letter-spacing:.04em;display:block;margin-bottom:2px}
.q.done .why{display:block}
.score{display:flex;align-items:center;gap:10px;padding:12px 16px;font-size:var(--t15)}
.score b{font-family:var(--display);font-weight:var(--w-d);font-size:var(--t26);letter-spacing:var(--ls-d);font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 14px;border-radius:var(--r-btn);background:var(--accent);color:var(--on-accent);font-size:var(--t15);font-weight:600;text-transform:lowercase;transition:filter .18s var(--ease)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.wide{width:100%}
@media (hover:hover){.btn:hover{filter:brightness(1.06)}}
.btn:active{transform:scale(.987)}

/* problems + worked examples */
.prob .qt{padding:14px 16px}
.reveal{display:none;border-top:1px solid var(--line);background:var(--surface2);padding:12px 16px 14px}
.prob.on .reveal{display:block}
.prob .go{border-top:1px solid var(--line);padding:10px 14px;display:flex;justify-content:space-between;align-items:center;font-size:var(--t13);font-weight:600;color:var(--accent);text-transform:lowercase;width:100%}
.ans{margin-top:10px;padding:8px 12px;border-radius:var(--r-btn);background:var(--surface);border:1px solid var(--line);font-size:var(--t15)}
.ans b{color:var(--ink3);font-weight:600;font-size:var(--t12);text-transform:lowercase;letter-spacing:.04em;margin-right:6px}

/* formulas */
.fx{display:grid;grid-template-columns:1fr auto;gap:2px 14px;align-items:baseline;padding:10px 14px;border-top:1px solid var(--line)}
.fx:first-child{border-top:0}
.fx .n{font-size:var(--t13);color:var(--ink2);text-transform:lowercase}
.fx .f{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:var(--t15);font-weight:500;letter-spacing:0;text-align:right;white-space:nowrap}
.fx .note{grid-column:1/-1;font-size:var(--t12);color:var(--ink3);line-height:1.45}

/* flashcards */
.deck{position:relative;perspective:1200px;margin-bottom:10px}
.fc{position:relative;min-height:190px;border-radius:var(--r-card);cursor:pointer;transform-style:preserve-3d;transition:transform .5s var(--spring)}
.fc.flip{transform:rotateY(180deg)}
.fc > div{position:absolute;inset:0;border-radius:var(--r-card);background:var(--surface);border:1px solid var(--line);padding:18px;display:grid;place-items:center;text-align:center;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.fc .f{font-family:var(--display);font-size:var(--t26);font-weight:var(--w-d);letter-spacing:var(--ls-d);line-height:1.15;text-wrap:balance}
.fc .b{transform:rotateY(180deg);background:var(--surface2);font-size:var(--t15);line-height:1.45;color:var(--ink)}
.fc .tag{position:absolute;left:14px;top:12px;font-size:11.5px;font-weight:600;color:var(--ink3);text-transform:lowercase;letter-spacing:.04em}
.fc .b .tag{color:var(--cls)}
.dnav{display:flex;align-items:center;gap:8px}
.dnav .cnt{margin-left:auto;font-size:var(--t13);color:var(--ink3);font-variant-numeric:tabular-nums;text-transform:lowercase}

/* timeline */
.tl{position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:6px;top:8px;bottom:8px;width:2px;background:var(--line)}
.tl .ev{position:relative;padding:6px 0 12px}
.tl .ev::before{content:"";position:absolute;left:-20px;top:11px;width:10px;height:10px;border-radius:3px;background:var(--cls)}
.tl .y{font-size:var(--t12);font-weight:600;letter-spacing:.04em;color:var(--cls);font-variant-numeric:tabular-nums;text-transform:lowercase}
.tl .t{font-size:var(--t16);font-weight:500;line-height:1.35}
.tl .d{font-size:var(--t15);color:var(--ink);line-height:1.45;margin-top:2px}

/* checklist */
.ck{display:flex;align-items:flex-start;gap:11px;width:100%;padding:11px 14px;border-top:1px solid var(--line);font-size:var(--t15);line-height:1.4}
.ck:first-child{border-top:0}
.ck .box{flex:none;width:20px;height:20px;border-radius:6px;border:1px solid var(--line2);margin-top:1px;display:grid;place-items:center;color:var(--surface);transition:background .16s var(--ease),border-color .16s var(--ease)}
.ck.on .box{background:var(--good);border-color:var(--good)}
.ck.on .t{color:var(--ink3);text-decoration:line-through}
.ck .d{display:block;font-size:var(--t12);color:var(--ink3);margin-top:1px}

/* footer */
footer{margin-top:34px;padding-top:16px;border-top:1px solid var(--line);font-size:var(--t12);line-height:1.6;color:var(--ink3);text-transform:lowercase}
footer a{color:var(--ink2);text-decoration:underline;text-decoration-color:var(--line2);text-underline-offset:3px}
footer .upd{display:block;margin-top:6px}

/* reveal on load */
.rv{opacity:0;transform:translateY(8px);animation:rise .5s var(--spring) forwards}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none !important;transition:none !important}.rv{opacity:1;transform:none}}
</style>
</head>

<header class="bar" id="bar">
  <div class="wrap">
    <a class="home" href="/" aria-label="all guides">
      <svg class="mark" viewBox="0 0 28 28" aria-hidden="true"><rect width="28" height="28" rx="5" fill="var(--accent)"/><path d="M8.98 20.80 4.67 7.20H8.65L11.36 17.68H11.47L14.27 7.20H18.03L13.72 20.80Z" fill="var(--on-accent)"/><circle cx="21.43" cy="18.90" r="1.9" fill="var(--hi)"/></svg>
      <h1>valentino guides</h1>
    </a>
    <div class="seg" role="group" aria-label="theme">
      <span class="thumb" aria-hidden="true"></span>
      <button type="button" data-set="auto" aria-pressed="true">auto</button>
      <button type="button" data-set="light" aria-pressed="false">light</button>
      <button type="button" data-set="dark" aria-pressed="false">dark</button>
    </div>
  </div>
</header>

<main class="wrap" id="main">
  <div class="crow rv" id="crow"></div>
  <h2 class="title rv" id="title"></h2>
  <p class="sub rv" id="sub" hidden></p>
  <div class="panes rv" id="panes" role="tablist"><span class="thumb" aria-hidden="true"></span></div>
  <div id="root" class="rv"></div>
  <footer>
    study guide written by a student, free to use. not affiliated with the school.
    check anything that matters against your own notes. <a href="/">all guides</a>
    <span class="upd" id="upd"></span>
  </footer>
</main>

<script>
/* ═══════════════════════════════════════════════════════════════════
   GUIDE — the only thing to edit. Delete panes you don't need from
   `panes`; delete the matching data too. Prose accepts **term**,
   ==fact== and !!trap!!. Everything is rendered from this object.
   ═══════════════════════════════════════════════════════════════════ */
const GUIDE = {
  id:    "psych",
  cls:   "AP Psychology",
  title: "Unit 1.1–1.3 study guide",
  test:  "2026-09-15",
  end:   "2026-09-16",
  meta:  "25 points · 3 mini FRQs + 10 MCQs",
  sub:   "built from both real versions of the quiz: every question, every answer, and the material each one comes from",
  updated: "sept 15, 2026",

  panes: [ "outline", "problems", "practice", "cards" ],
  labels: { problems:"mini frqs", practice:"the 2 quizzes", cards:"cards" },

  top: [
    "==The mini FRQs are 15 of the 25 points==, and both versions ask the ==same three prompts==: natural selection in psychology, the nervous system's main divisions, and how the nervous and endocrine systems communicate.",
    "**Main divisions**, in writing order: **CNS** decides, **PNS** carries. Inside the PNS, **somatic** moves skeletal muscle on purpose and **autonomic** runs organs. Inside autonomic, **sympathetic** arouses and **parasympathetic** calms.",
    "The two systems meet at the **hypothalamus**, which signals the **pituitary**, the master gland. ==Nerves are fast and brief, hormones slow and long-lasting==, and !!both are chemical, not electrical!!.",
    "The 20 MCQs cluster in five places: twins and gene-environment interaction (6), the neuron and the action potential (5), the nervous system's divisions (4), evolutionary psychology (2), hormones (2).",

  ],

  outline: [
    { w:3, t:"Nature, nurture and twin studies", d:"6 of the 20 MCQs, the biggest cluster",
      p:["**Behavior genetics** studies our differences and the relative power of heredity and environment. **Nature** means ==biological and genetic predispositions inherited from parents==; **nurture** is everything the environment supplies. !!Parental rearing style, socioeconomic status, cultural norms, peers and schooling are all nurture!!, and a study whose treatment is an intervention is manipulating nurture.",
         "**Gene-environment interaction** requires ==both halves in the same scenario==: an inherited predisposition plus an environmental trigger. High cholesterol that runs in the family combined with a diet heavy in saturated fat is the interaction; an inherited condition alone is not, and food poisoning alone is not.",
         "**Twin studies** hold one factor constant and vary the other. Identical (**monozygotic**) twins share ==100% of their genes==; fraternal (**dizygotic**) twins share about half, like any siblings. Same genes plus same home produces the most similarity; comparing identical twins raised apart to identical twins raised together is what isolates the environment's effect. **Heritability** describes how much of the variation among people is attributable to genes, !!never how much of one person is genetic!!, and **epigenetics** covers environmental influences that switch gene expression on or off without changing the DNA."],
      notes:[{k:"ok",t:"**Fingerprints** are the standard answer to what identical twins do !!not!! share. They form from random pressure and position in the womb, so blood type, eye color and natural hair color match but the prints do not."}],
      terms:["nature","nurture","behavior genetics","heritability","monozygotic","dizygotic","epigenetics","gene-environment interaction"] },

    { w:3, t:"The neuron and the action potential", d:"5 MCQs, and the most technical ones",
      p:["Parts in order: **dendrites** receive messages from other cells, the **soma** or cell body is the life-support center, the **axon hillock** where the axon leaves the soma ==sums the incoming graded potentials and decides whether to fire==, the **axon** carries the impulse, the **myelin sheath** insulates it, and the **axon terminals** pass the message on.",
         "At rest the neuron is **polarized**: ==negative inside the membrane, positive outside==. When **excitatory signals outnumber inhibitory ones** and cross the **threshold**, ==sodium channels open and Na⁺ rushes into the cell==. That is **depolarization**, and it is ==**all-or-none**: the neuron fires at full strength or not at all==. Potassium then moves out to repolarize, and during the **refractory period** the neuron cannot fire again no matter how strong the stimulus.",
         "**Myelin** speeds the impulse by leaving gaps. The **nodes of Ranvier** are bare patches between myelin segments, and the action potential ==jumps from one node to the next== rather than crawling down the whole membrane."],
      notes:[{k:"warn",t:"Myelin does !!not!! insulate the entire length of the axon, does !!not!! widen the axon, and does !!not!! pump extra ions. The gaps are the whole mechanism, which is why **multiple sclerosis**, a degeneration of myelin, slows messages down the axon and produces motor impairment. Separately, **glial cells** !!nourish and support neurons and do not fire or release neurotransmitters!!."}],
      terms:["dendrite","soma","axon hillock","axon","myelin sheath","nodes of Ranvier","threshold","action potential","depolarization","refractory period","all-or-none","glial cells"] },

    { w:3, t:"The nervous system's main divisions", d:"4 MCQs, plus all of mini FRQ 2",
      p:["The **nervous system** is the body's speedy electrochemical communication network. It splits into the **central nervous system (CNS)**, the brain and spinal cord, which ==processes information and makes the decisions==, and the **peripheral nervous system (PNS)**, the nerves that carry information in and commands out.",
         "The PNS splits again. The **somatic nervous system** controls ==voluntary movement of skeletal muscle==, so walking down a street is somatic. The **autonomic nervous system** controls ==the self-regulated action of internal organs and glands==, which is why digestion and heartbeat never need a decision."],
      cmp:{ a:{h:"sympathetic", p:["==Arouses and expends energy.==","Fight or flight: heart rate up, pupils dilate, digestion pauses."]},
            b:{h:"parasympathetic", p:["==Calms and conserves energy.==","Rest and digest: takes over once the stressful event has passed."]} },
      steps:["**CNS**: brain and spinal cord, the decision maker.",
             "**PNS**: everything outside it, carrying messages both ways.",
             "**Somatic**: voluntary skeletal muscle.",
             "**Autonomic**: involuntary organs and glands.",
             "Autonomic splits into **sympathetic** (arouse) and **parasympathetic** (calm)."],
      notes:[{k:"warn",t:"The three types of neurons are !!sensory, motor and interneurons!! — a **dendrite** is a part of a neuron, not a type of one. **Sensory neurons** (afferent) run body to brain, **motor neurons** (efferent) run brain to body, and **interneurons** stay inside the CNS. Impairing the motor set breaks the brain-to-body direction."}],
      terms:["central nervous system","peripheral nervous system","somatic nervous system","autonomic nervous system","sympathetic","parasympathetic","sensory neurons","motor neurons","interneurons"] },

    { w:2, t:"Nervous system meets endocrine system", d:"2 MCQs, plus all of mini FRQ 3",
      p:["The **endocrine system** is the body's ==slow chemical communication system==: a set of glands that secrete **hormones** into the bloodstream, where they travel to tissues, including the brain.",
         "The two systems meet at the **hypothalamus**, which sits in the brain and signals the **pituitary gland**. The pituitary is the ==master gland==: it releases its own hormones and directs the thyroid, adrenals and gonads, whose hormones circulate back and influence the brain and behavior."],
      steps:["The brain registers something: a threat, a need, a stressor.",
             "The **hypothalamus** signals the **pituitary gland**.",
             "The pituitary releases hormones that direct the other glands.",
             "Those glands, such as the **adrenal glands**, release hormones into the blood.",
             "Hormones reach the brain, change behavior, and feed back to the hypothalamus."],
      notes:[{k:"warn",t:"Both systems send ==chemical== messages, !!not electrical ones!!. **Neurotransmitters** are fast and their effects are brief; **hormones** are slower and their effects last much longer. Some molecules do both jobs: **epinephrine**, **norepinephrine** and **oxytocin** act as neurotransmitters at a synapse and as hormones in the blood."},
             {k:"ok",t:"**Oxytocin** is produced by the **hypothalamus** and stored and released by the ==posterior pituitary==. !!TSH, ACTH and prolactin are made by the anterior pituitary itself!!, so they are the wrong answer to that question."}],
      terms:["endocrine system","hormones","hypothalamus","pituitary gland","adrenal glands","oxytocin","epinephrine","norepinephrine"] },

    { w:2, t:"Natural selection and evolutionary psychology", d:"2 MCQs, plus all of mini FRQ 1",
      p:["**Natural selection** is the principle that ==inherited traits that better enable an organism to survive and reproduce in a particular environment will be passed on to succeeding generations==. **Evolutionary psychology** applies that principle to behavior and mind.",
         "It explains **human nature**: the tendencies that helped ancestors survive, such as a preference for sweet and fatty foods or a fast fear response to snakes and heights, turn up in everyone. That shared inheritance is why ==human genes are roughly 99.9% identical from person to person==, and why **mutations**, random errors in gene replication, supply the variation selection works on."],
      cmp:{ a:{h:"proximate", p:["The immediate mechanism, the **how** right now.","Sugar activates taste receptor cells and triggers **dopamine** release."]},
            b:{h:"ultimate", p:["The evolutionary **why**, the adaptive problem it solved.","Calories were scarce, so a sweet tooth kept ancestors alive long enough to reproduce."]} },
      notes:[{k:"warn",t:"A question can use the word why and still be giving a **proximate explanation**. !!Judge the explanation, not the question word.!! Receptors, dopamine and brain circuitry are always proximate; only an answer about surviving and reproducing is an **ultimate explanation**."},
             {k:"ok",t:"To count as a true **adaptation**, a psychological mechanism must have ==reliably solved a recurrent adaptive problem across evolutionary history==. !!It does not have to be consciously recognized, produce maximum reproductive success in the modern world, or be immune to environmental influence.!!"}],
      terms:["natural selection","evolutionary psychology","adaptation","proximate explanation","ultimate explanation","mutation"] },

    { w:1, t:"Neurotransmitters worth knowing", d:"1 MCQ, cheap insurance",
      p:["Each **neurotransmitter** has a job and the question asks for the match. **Norepinephrine** controls ==alertness and arousal==. **Acetylcholine (ACh)** handles muscle action and memory. **Dopamine** influences movement, learning, attention and reward. **Serotonin** affects mood, hunger and sleep. **Substance P** carries pain signals. **GABA** is the major inhibitory messenger, **glutamate** the major excitatory one, and **endorphins** are the body's natural painkillers."],
      notes:[{k:"ok",t:"Waking up feeling alert is **norepinephrine**. !!Dopamine is the tempting wrong answer!! because it gets called the reward chemical, but reward and pleasure are not the same thing as alertness."}],
      terms:["norepinephrine","acetylcholine","dopamine","serotonin","GABA","glutamate","endorphins","Substance P"] }
  ],

  problems: [
    { q:"Mini FRQ 1 — How does natural selection factor into psychology?",
      steps:["Define it. **Natural selection** is the principle that inherited traits which better enable an organism to survive and reproduce in a particular environment are passed on to succeeding generations.",
             "Name the field. **Evolutionary psychology** studies behavior and mind using those principles, asking what adaptive problem a tendency solved.",
             "Give a behavioral example, not a physical one: the preference for sweet and fatty foods, the fast fear response to snakes and heights, the drive to form social bonds.",
             "Say what it explains: the traits everyone shares, which is why human genes are about 99.9% alike from person to person.",
             "Name the limit: selection acts on a population over deep time through random **mutations**. It does not shape one individual within one lifetime."],
      ans:"Natural selection is the principle that inherited traits which better enable an organism to survive and reproduce in a particular environment get passed on to succeeding generations. Evolutionary psychology applies that principle to behavior and mental processes, treating a psychological tendency as something that persisted because it solved a recurring adaptive problem for our ancestors. A preference for sweet and fatty foods is the standard example: calories were scarce, so wanting them was an advantage, and the preference stayed even though the environment changed. The same logic explains a fast fear response to snakes and heights, and the human drive to form social bonds. Because the traits that were selected for are shared, natural selection also explains human nature itself, which is why human genes are roughly 99.9% identical across people. It works through random mutations across a population over evolutionary time, not by changing an individual during their own lifetime." },

    { q:"Mini FRQ 2 — What are the functions of the nervous system's MAIN DIVISIONS? Identify each main division and explain their individual functions.",
      steps:["Open with the whole system: the **nervous system** is the body's speedy electrochemical communication network.",
             "Name the two main divisions and give each a function: **CNS** (brain and spinal cord) processes and decides; **PNS** (the sensory and motor nerves) gathers information and carries commands out.",
             "Split the PNS: **somatic** controls voluntary movement of skeletal muscle; **autonomic** controls the self-regulated action of internal organs and glands.",
             "Split the autonomic: **sympathetic** arouses and expends energy for fight or flight; **parasympathetic** calms and conserves energy afterward.",
             "Close with one concrete example so the functions are ==explained, not just listed==: a startle raises heart rate through the sympathetic division, and the parasympathetic division brings it back down."],
      ans:"The nervous system is the body's speedy electrochemical communication network, and it has two main divisions. The central nervous system is the brain and the spinal cord; it receives sensory information, interprets it, and decides on a response. The peripheral nervous system is every nerve outside the brain and spinal cord; it carries sensory information in from the body and motor commands back out. The peripheral nervous system divides again. The somatic nervous system controls voluntary movement of the skeletal muscles, so it is what lets a person choose to walk. The autonomic nervous system controls the self-regulated action of internal organs and glands, so heartbeat, breathing and digestion run without a decision. The autonomic system itself has two parts that work as a pair: the sympathetic division arouses the body and expends energy for fight or flight, raising heart rate and pausing digestion, while the parasympathetic division calms the body and conserves energy once the threat has passed. A sudden scare at a movie is the sympathetic division at work, and the settling down afterward is the parasympathetic division." },

    { q:"Mini FRQ 3 — Explain the process through which the nervous system and the endocrine system communicate with each other.",
      steps:["Define the second system: the **endocrine system** is the body's slow chemical communication system, a set of glands that secrete **hormones** into the bloodstream.",
             "Name the connection point: the **hypothalamus**, a brain structure, is where the nervous system reaches the endocrine system.",
             "Trace the chain in order: hypothalamus signals the **pituitary**, the master gland; the pituitary releases hormones that direct the thyroid, adrenals and gonads.",
             "Close the loop, which is what the word ==communicate== is asking for: those hormones travel through the blood back to the brain and influence behavior, and the brain adjusts its signals in response.",
             "Give the stress example and the speed contrast: the brain perceives a threat, the sympathetic division signals the **adrenal glands**, epinephrine and norepinephrine flood the bloodstream, and the effects outlast the neural signal that started them."],
      ans:"The endocrine system is the body's slow chemical communication system: glands that secrete hormones into the bloodstream, where they travel to tissues throughout the body, including the brain. The two systems connect at the hypothalamus, a structure in the brain that monitors the body's internal state. When the hypothalamus detects a need, it signals the pituitary gland sitting just below it. The pituitary is the master gland: it releases its own hormones and directs the other endocrine glands, including the thyroid, the adrenals and the gonads. Those glands release hormones into the blood, and because the blood reaches the brain, the hormones feed back and influence the brain's activity and the person's behavior, which changes what the hypothalamus signals next. That feedback loop is the communication running in both directions. A stressor shows the chain clearly: the brain perceives a threat, the sympathetic nervous system signals the adrenal glands, and epinephrine and norepinephrine raise heart rate, blood pressure and blood sugar. The difference between the systems is speed and duration, since neural messages are fast and brief while hormonal messages are slower but last much longer, and some chemicals such as epinephrine, norepinephrine and oxytocin serve as both neurotransmitters and hormones." }
  ],

  practice: [
    { q:"V1 · In the context of behavioral genetics and psychology, to what does the term **nature** primarily refer?",
      opts:["Biological and genetic predispositions inherited from parents.","The impact of parental rearing styles and socioeconomic status.","The cultural norms absorbed during childhood development.","Peer influence and schooling environments during adolescence."],
      a:0, why:"Nature is what the genes supply. The other three are all **nurture**, meaning environment: rearing style, socioeconomic status, cultural norms, peers, schooling. !!Every wrong option here is the same wrong idea in a different costume.!!" },
    { q:"V1 · Dr. Grant studied the extent to which humans share genes with each other and with other animals, and how genes contribute to behavior. Which conclusion would she most likely reach?",
      opts:["Chimpanzees share very few genes with humans.","Complex behaviors are determined by specific individual genes.","Human genes are mostly the same across all people.","Genetic predispositions do not explain our shared human nature."],
      a:2, why:"Humans are about ==99.9% genetically identical== to each other, and chimpanzees share 96% or more, so the first option is factually wrong. !!Complex behavior is polygenic!!, produced by many genes each with a small effect, never one gene. And genetic predispositions are exactly what does explain shared human nature." },
    { q:"V1 · Which of the following is an example of gene-environment interaction?",
      opts:["Yen Lin experiences flushing syndrome, which often occurs in people of Asian heritage.","Alfonso gets food poisoning from eating undercooked meat.","Ted develops high cholesterol, which runs in his family, because his diet contains too much saturated fat.","Jordan has an autoimmune disorder that causes him to lose hair."],
      a:2, why:"Interaction needs ==a genetic predisposition and an environmental trigger in the same sentence==. Only Ted has both: cholesterol that runs in the family plus a high-fat diet. !!Flushing syndrome and the autoimmune disorder are heredity alone; food poisoning is environment alone.!!" },
    { q:"V1 · An evolutionary psychologist asks why humans prefer sweet tastes and explains that sugar activates taste receptor cells on the tongue and triggers dopamine release in the brain. That is which type of explanation?",
      opts:["ultimate explanation","proximate explanation","by-product explanation","phylogenetic explanation"],
      a:1, why:"**Proximate** explanations give the immediate mechanism, the how right now: receptors, dopamine, brain circuitry. **Ultimate** explanations give the evolutionary why, which here would be that calories were scarce and a sweet tooth kept ancestors alive. !!The word \"why\" in the stem is the trap!! — judge the explanation, not the question word." },
    { q:"V1 · Which trait is unique and NOT shared by identical twins?",
      opts:["blood type","eye color","fingerprints","natural hair color"],
      a:2, why:"Identical twins are **monozygotic**, so anything coded directly by DNA matches: blood type, eye color, natural hair color. ==Fingerprints form from random pressure and position in the womb==, which is prenatal environment rather than genetics, so they differ." },
    { q:"V1 · Which part of a neuron is primarily responsible for the summation of graded potentials and the initiation of an action potential?",
      opts:["dendrite","synaptic knob","axon hillock","Node of Ranvier"],
      a:2, why:"The **axon hillock** is where the axon leaves the cell body, and it is the point that ==adds up the incoming signals and decides whether threshold was crossed==. !!Dendrites receive the signals but do not initiate!!, the synaptic knob releases neurotransmitters at the far end, and a Node of Ranvier propagates an impulse that already started." },
    { q:"V1 · During the depolarization phase of an action potential, which ion channels open and what is the direction of ion movement?",
      opts:["Sodium channels open, moving into the cell.","Potassium channels open, moving into the cell.","Sodium channels open, moving out of the cell.","Calcium channels open, moving out of the cell."],
      a:0, why:"==Sodium (Na⁺) rushes in==, which flips the inside of the membrane from negative to positive. !!Potassium moving out is repolarization!!, the step after, and getting the direction backwards is the most common miss on this question." },
    { q:"V1 · How does the myelin sheath increase the speed of nerve impulse propagation?",
      opts:["By increasing the diameter of the axon significantly.","By actively pumping more sodium and potassium ions continuously across the membrane.","By completely insulating the entire length of the axon from any ion exchange.","By forcing the action potential to jump from one Node of Ranvier to the next."],
      a:3, why:"That jumping is saltatory conduction, and ==the gaps are the mechanism==. !!Option c is the trap!!: myelin deliberately does not cover the entire axon, because an impulse that could not exchange ions anywhere would never propagate at all. Myelin is passive insulation, so it neither pumps ions nor widens the axon." },
    { q:"V1 · Which hormone is produced by the hypothalamus and subsequently stored and released by the posterior pituitary gland?",
      opts:["Oxytocin","Thyroid-stimulating hormone","Adrenocorticotropic hormone","Prolactin"],
      a:0, why:"**Oxytocin** is made in the **hypothalamus** and shipped to the ==posterior pituitary== for storage and release. !!TSH, ACTH and prolactin are all produced by the anterior pituitary itself!!, so they fail the \"produced by the hypothalamus\" half of the question." },
    { q:"V1 · Which of the following is NOT one of the 3 types of neurons?",
      opts:["sensory neurons","motor neurons","dendrites","interneurons"],
      a:2, why:"The three types are ==sensory, motor and interneurons==. A **dendrite** is a part of a neuron, !!not a category of neuron!!. Sensory run body to brain, motor run brain to body, interneurons stay inside the CNS." },
    { q:"V2 · Dr. Yondu randomly assigns 100 children to two conditions: one group receives a social skills intervention, the other listens to a talk about how to whistle. Both complete an emotional stability questionnaire four weeks later. What does his independent variable measure?",
      opts:["The impact of nature.","The impact of epigenetics.","The impact of nurture.","The impact of evolution."],
      a:2, why:"The independent variable is the thing the researcher manipulates, and here that is ==an environmental intervention==, which is **nurture**. !!\"Nature\" is the trap!! because the outcome, emotional stability, sounds like a trait. **Epigenetics** would require an environmental factor switching gene expression on or off, which is not what is being measured." },
    { q:"V2 · Which of the following criteria is essential for identifying a psychological mechanism as a true evolutionary adaptation?",
      opts:["It must be consciously recognized by the individual possessing it.","It must lead to maximal reproductive success in the modern environment.","It must have reliably solved a recurrent adaptive problem across evolutionary history.","It must be immutable and impervious to environmental influence."],
      a:2, why:"An adaptation is defined by ==what it solved, repeatedly, in ancestral environments==. !!Most adaptations are unconscious!!, the standard is the ancestral environment rather than the modern one, and !!nothing in psychology is impervious to the environment!!, which is the whole point of gene-environment interaction." },
    { q:"V2 · Dr. Kent studied 1000 sets of identical and fraternal twins raised in the same household versus different households. Based on previous research, who should he expect to be most alike?",
      opts:["Fraternal twins raised in the same households.","Identical twins raised in two different households.","Fraternal twins raised in two different households.","Identical twins raised in the same households."],
      a:3, why:"==Same genes plus same environment is maximum similarity==. Identical twins share 100% of their genes and fraternal twins share about half, so any identical pair beats any fraternal pair; among identical pairs, the ones sharing a household add environment on top. !!Identical twins raised apart is the second-most alike, not the most.!!" },
    { q:"V2 · Which division of the nervous system calms a person down once a stressful event has passed?",
      opts:["Parasympathetic","Central","Somatic","Sympathetic"],
      a:0, why:"**Parasympathetic** calms and conserves energy. !!Sympathetic is the trap!! because it is the division that actually appears in the scenario, but it caused the arousal rather than ending it. Somatic moves skeletal muscle and central is the brain and spinal cord, neither of which is the calming division." },
    { q:"V2 · Thomas is walking down his favorite street in town. Which division of the nervous system enables him to move the muscles necessary to do this?",
      opts:["Central","Sympathetic","Parasympathetic","Somatic"],
      a:3, why:"**Somatic** controls ==voluntary movement of skeletal muscle==. !!\"Central\" is the tempting answer!! because the brain gave the order, but the question asks which division moves the muscle, and that is the somatic branch of the peripheral nervous system carrying the command out." },
    { q:"V2 · If Drew's motor neurons were impaired, he would experience a disruption in the ability to",
      opts:["send messages from specific body parts to the brain.","transmit and process information within the brain and spinal cord.","process neurotransmitters in the brain.","send messages from the brain to the body parts."],
      a:3, why:"**Motor (efferent)** neurons carry instructions ==out from the CNS to the muscles and glands==. !!The first option describes sensory (afferent) neurons!! and the second describes interneurons, so both are the right idea pointed the wrong way." },
    { q:"V2 · What must a neuron do to generate an action potential?",
      opts:["The neuron must be in the refractory period.","Glial cells must release neurotransmitters into the axon.","Excitatory impulses must outnumber the inhibitory impulses.","Dopamine and serotonin must be present in equal amounts."],
      a:2, why:"Firing happens when ==excitatory signals minus inhibitory signals cross the threshold==. !!The refractory period is the opposite!!, the window right after firing when the neuron cannot fire at all. **Glial cells** nourish and support neurons rather than releasing neurotransmitters, and no neurotransmitter ratio is required." },
    { q:"V2 · On the neuron diagram, A and B label the branches coming off the cell body, C labels the long fiber running away from it, and D labels the branches at the far end. Which letter corresponds to the neuron's axon?",
      opts:["A","B","C","D"],
      a:2, why:"The **axon** is ==the single long fiber that carries the impulse away from the cell body==, so it is C. !!A and B are dendrites!!, which receive messages, and D is the axon terminals, which pass the message on to the next cell." },
    { q:"V2 · Andy woke up feeling alert. Which neurotransmitter impacted his alertness?",
      opts:["Acetylcholine","Norepinephrine","Substance P","Dopamine"],
      a:1, why:"**Norepinephrine** controls ==alertness and arousal==. **Acetylcholine** handles muscle action and memory, **Substance P** carries pain signals, and !!dopamine is the trap!! because it gets labeled the reward chemical, but reward is not the same thing as being alert." },
    { q:"V2 · A friend says \"Hormones are the same thing as neurotransmitters.\" Which statement BEST modifies that claim to make it more accurate?",
      opts:["Both are electrical messages, but neurotransmitters travel much more slowly than hormones and their effects last longer.","Both are chemical messages, but hormones travel much more slowly than neurotransmitters and their effects last longer.","Both are electrical messages, but neurotransmitters travel much more quickly than hormones and their effects last longer.","Both are chemical messages, but neurotransmitters travel much more quickly than hormones and their effects last longer."],
      a:1, why:"Two things have to be right at once. ==Both are chemical messages, not electrical==, which eliminates half the options immediately. Then ==hormones are the slow ones with the long-lasting effects==, because they travel through the bloodstream, while neurotransmitters cross a synapse in an instant and are cleared just as fast. !!Option d gets the chemistry right and the speed backwards.!!" }
  ],

    { f:"Gene-environment interaction", b:"A genetic predisposition ==plus== an environmental trigger producing the outcome. Both halves must be present." },

  abbr: { "CNS":"central nervous system", "PNS":"peripheral nervous system", "ANS":"autonomic nervous system", "ACh":"acetylcholine", "GABA":"gamma-aminobutyric acid", "Na⁺":"sodium ion", "MS":"multiple sclerosis", "TSH":"thyroid-stimulating hormone", "ACTH":"adrenocorticotropic hormone", "MCQ":"multiple choice question", "FRQ":"free response question", "V1 / V2":"version 1 and version 2 of the quiz" }

/* ═══ machinery. nothing below needs editing. ═══ */
const $=s=>document.querySelector(s);
const el=(t,c,h)=>{const n=document.createElement(t);if(c)n.className=c;if(h!=null)n.innerHTML=h;return n};
const REDUCED=matchMedia("(prefers-reduced-motion:reduce)").matches;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b class="kw">$1</b>').replace(/==(.+?)==/g,'<mark class="hl">$1</mark>').replace(/!!(.+?)!!/g,'<span class="trap">$1</span>');
const CHEV='<svg class="chev" width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3l4 4-4 4"/></svg>';
const ICON={
 apush:'<path d="M7 22V5"/><path d="M7 6.4h10.5c.8 0 1.2.9.7 1.5L16 10l2.2 2.1c.5.6.1 1.5-.7 1.5H7"/>',
 lang:'<path d="M6 22 9.3 15"/><path d="M9 15.4 17.4 5.2c.5-.6 1.4-.5 1.8.1l1.2 2c.3.6.1 1.4-.5 1.7L8.6 14.9"/><path d="M11.6 10.4 15 12.4"/>',
 psych:'<path d="M18.4 20.4v-2.6h1.9c.7 0 1.1-.7.8-1.3l-1.6-3a7.2 7.2 0 1 0-6.8 4.2"/><path d="M9.2 21v-3.3"/>',
 phys:'<circle cx="13.5" cy="13.5" r="2"/><ellipse cx="13.5" cy="13.5" rx="9" ry="3.6"/><ellipse cx="13.5" cy="13.5" rx="9" ry="3.6" transform="rotate(60 13.5 13.5)"/><ellipse cx="13.5" cy="13.5" rx="9" ry="3.6" transform="rotate(120 13.5 13.5)"/>',
 pre:'<path d="M5 5v16h16"/><path d="M7.5 18.6c3.2 0 3.6-9.4 6.6-9.4 2.6 0 3.3 6 6.6 6"/>',
 sem:'<path d="M4.6 8.2a2 2 0 0 1 2-2h8.6a2 2 0 0 1 2 2v4.4a2 2 0 0 1-2 2h-4l-3.4 2.7v-2.7h-1.2a2 2 0 0 1-2-2z"/><path d="M19.2 10.6h.4a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-.6v2.4l-2.9-2.4"/>',
 span:'<path d="M4.5 8a2.2 2.2 0 0 1 2.2-2.2h12.6A2.2 2.2 0 0 1 21.5 8v7.3a2.2 2.2 0 0 1-2.2 2.2h-7.4L7 21.6v-4.1H6.7a2.2 2.2 0 0 1-2.2-2.2z"/><path d="M11 9.4c.4-.9 1.3-1.4 2.2-1.2 1 .2 1.6 1.1 1.4 2-.2.8-1 1-1.4 1.7"/><path d="M13 14.1h.01"/>',
 apwh:'<circle cx="13" cy="13" r="8.6"/><path d="M4.4 13h17.2"/><ellipse cx="13" cy="13" rx="3.6" ry="8.6"/>',
 biz:'<path d="M5 5v16h16"/><rect x="8.4" y="13" width="3" height="5.2" rx=".8"/><rect x="13.4" y="9.6" width="3" height="8.6" rx=".8"/><rect x="18.4" y="6.4" width="3" height="11.8" rx=".8"/>',
 mor:'<path d="M13 4.5v17"/><path d="M7.5 9.5h11"/>',
 csp:'<path d="m9 8-5 5 5 5"/><path d="m17 8 5 5-5 5"/><path d="m14.5 5-3 16"/>'
};
const icon=id=>'<svg viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(ICON[id]||ICON.apush)+'</svg>';
const LABEL={outline:"guide",practice:"practice",problems:"problems",formulas:"formulas",cards:"cards",timeline:"timeline",checklist:"checklist"};

/* header */
document.documentElement.style.setProperty("--cls",`var(--c-${GUIDE.id})`);
document.title=`${GUIDE.title} · ${GUIDE.cls} · Valentino guides`;
$("#title").textContent=GUIDE.title;
if(GUIDE.sub){$("#sub").textContent=GUIDE.sub;$("#sub").hidden=false}
$("#upd").textContent=GUIDE.updated?`last updated ${GUIDE.updated}`:"";
(function(){
  const c=$("#crow");
  c.appendChild(el("span","cname",icon(GUIDE.id)+"<span>"+esc(GUIDE.cls)+"</span>"));
  if(GUIDE.test){
    const t=new Date(GUIDE.test+"T00:00:00"), e=new Date((GUIDE.end||GUIDE.test)+"T00:00:00");
    const now=new Date(); now.setHours(0,0,0,0);
    const days=Math.round((t-now)/864e5);
    const md=`${t.getMonth()+1}/${t.getDate()}`+(GUIDE.end?`–${e.getMonth()+1}/${e.getDate()}`:"");
    let txt, past=e<now;
    if(past)txt=`test was ${md}`;
    else if(days<=0)txt=`test today · ${md}`;
    else if(days===1)txt=`test tomorrow · ${md}`;
    else if(days<=14)txt=`test in ${days} days · ${md}`;
    else txt=`test ${md}`;
    c.appendChild(el("span","chip"+(past?" past":" due"),esc(txt)));
  }
  if(GUIDE.meta)c.appendChild(el("span","chip",esc(GUIDE.meta)));
})();

/* panes */
const root=$("#root"), panesEl=$("#panes"), pthumb=panesEl.querySelector(".thumb");
const PANES=(GUIDE.panes||[]).filter(id=>Array.isArray(GUIDE[id])&&GUIDE[id].length||(id==="outline"&&GUIDE.top?.length));
const builders={outline:buildOutline,practice:buildPractice,problems:buildProblems,formulas:buildFormulas,cards:buildCards,timeline:buildTimeline,checklist:buildChecklist};
const tabs=[];
PANES.forEach((id,i)=>{
  const sec=el("section","pane"); sec.id="p-"+id; sec.setAttribute("role","tabpanel");
  builders[id](sec); root.appendChild(sec);
  const b=el("button",null,esc((GUIDE.labels||{})[id]||LABEL[id]||id)); b.type="button"; b.setAttribute("role","tab"); b.dataset.pane=id;
  b.addEventListener("click",()=>show(id,true)); panesEl.appendChild(b); tabs.push(b);
});
if(PANES.length<2)panesEl.classList.add("one");
function moveP(){const on=panesEl.querySelector('button[aria-selected="true"]');if(!on)return;pthumb.style.left=on.offsetLeft+"px";pthumb.style.width=on.offsetWidth+"px"}
function show(id,user){
  tabs.forEach(b=>b.setAttribute("aria-selected",String(b.dataset.pane===id)));
  document.querySelectorAll(".pane").forEach(p=>p.classList.toggle("on",p.id==="p-"+id));
  moveP(); if(user){try{history.replaceState(null,"","#"+id)}catch(e){}}
}
const want=location.hash.slice(1);
show(PANES.includes(want)?want:PANES[0],false);
requestAnimationFrame(moveP); addEventListener("resize",moveP);

/* outline */
function shead(txt,extra){const h=el("div","sh",`<h3>${esc(txt)}</h3>`+(extra?`<span class="shx">${esc(extra)}</span>`:""));return h}
function extras(s){
  let h="";
  if(s.cmp)h+=`<div class="cmp"><div><h5>${esc(s.cmp.a.h)}</h5>${s.cmp.a.p.map(x=>`<p>${fmt(x)}</p>`).join("")}</div><div><h5>${esc(s.cmp.b.h)}</h5>${s.cmp.b.p.map(x=>`<p>${fmt(x)}</p>`).join("")}</div></div>`;
  if(s.steps)h+=`<ol class="steps">${s.steps.map(x=>`<li>${fmt(x)}</li>`).join("")}</ol>`;
  if(s.notes)h+=s.notes.map(n=>`<div class="callout ${esc(n.k||"")}"><span class="cl">${({warn:"watch out",ex:"example",ok:"rule"})[n.k]||esc(n.k||"note")}</span>${fmt(n.t)}</div>`).join("");
  if(s.terms?.length)h+=`<div class="terms">${s.terms.map(t=>`<span class="term">${esc(t)}</span>`).join("")}</div>`;
  return h;
}
function buildOutline(sec){
  if(GUIDE.top?.length){
    sec.appendChild(shead("start here","the whole guide in one screen"));
    sec.appendChild(el("div","card top",GUIDE.top.map(x=>`<p>${fmt(x)}</p>`).join("")));
  }
  const list=GUIDE.outline||[]; if(!list.length)return;
  const n3=list.filter(s=>s.w===3).length;
  sec.appendChild(shead("the unit",`${list.length} sections`+(n3?` · ${n3} tested most`:"")));
  const g=el("div","group");
  list.forEach((s,i)=>{
    const row=el("button","row"); row.type="button"; row.setAttribute("aria-expanded",String(s.w===3));
    row.innerHTML=`<span class="rt"><span class="rn">${esc(s.t)}</span>${s.d?`<span class="rd">${esc(s.d)}</span>`:""}</span>`+(s.w>=2?`<span class="w w${s.w}">${s.w===3?"tested most":"tested"}</span>`:"")+CHEV;
    const body=el("div","body"+(s.w===3?" on":""),`<div><div class="in">${(s.p||[]).map(x=>`<p>${fmt(x)}</p>`).join("")}${extras(s)}</div></div>`);
    row.addEventListener("click",()=>{const on=!body.classList.contains("on");body.classList.toggle("on",on);row.setAttribute("aria-expanded",String(on))});
    g.appendChild(row); g.appendChild(body);
  });
  sec.appendChild(g);
  if(GUIDE.abbr&&Object.keys(GUIDE.abbr).length){
    sec.appendChild(shead("abbreviations"));
    sec.appendChild(el("div","card abbr",Object.entries(GUIDE.abbr).map(([k,v])=>`<b>${esc(k)}</b> ${esc(v)}`).join(" · ")));
  }
}

/* practice mc */
function buildPractice(sec){
  const qs=GUIDE.practice||[]; let done=0, right=0;
  sec.appendChild(shead("practice",`${qs.length} questions`));
  const sc=el("div","group score"); sc.innerHTML=`<b id="scn">0</b><span>of ${qs.length} right</span><button type="button" class="btn ghost" id="reset" style="margin-left:auto">start over</button>`; sc.hidden=true; const scn=sc.querySelector("#scn");
  qs.forEach((q,i)=>{
    const card=el("div","group q");
    card.innerHTML=`<div class="qt"><div class="qn">question ${i+1}</div>${fmt(q.q)}</div>`+
      q.opts.map((o,j)=>`<button type="button" class="opt" data-i="${j}"><span class="k">${"abcd"[j]||j+1}</span><span>${fmt(o)}</span></button>`).join("")+
      `<div class="why"><b>${"why"}</b>${fmt(q.why||"")}</div>`;
    card.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>{
      if(card.classList.contains("done"))return;
      card.classList.add("done"); const j=+b.dataset.i;
      if(j===q.a){b.classList.add("right");right++}else{b.classList.add("wrong");card.querySelectorAll(".opt")[q.a].classList.add("right")}
      done++; scn.textContent=right; sc.hidden=false; if(done===qs.length)sc.scrollIntoView({block:"nearest",behavior:REDUCED?"auto":"smooth"});
    }));
    sec.appendChild(card);
  });
  sec.appendChild(sc);
  sc.querySelector("#reset").addEventListener("click",()=>{done=0;right=0;scn.textContent=0;sc.hidden=true;sec.querySelectorAll(".q").forEach(c=>{c.classList.remove("done");c.querySelectorAll(".opt").forEach(o=>o.classList.remove("right","wrong"))});sec.scrollIntoView({behavior:REDUCED?"auto":"smooth"})});
}

/* problems / worked examples */
function buildProblems(sec){
  const ps=GUIDE.problems||[];
  sec.appendChild(shead("problems",`${ps.length} to work`));
  ps.forEach((p,i)=>{
    const card=el("div","group prob");
    card.innerHTML=`<div class="qt"><div class="qn">problem ${i+1}</div>${fmt(p.q)}</div><button type="button" class="go"><span>show the steps</span>${CHEV}</button><div class="reveal"><ol class="steps" style="margin-top:0">${(p.steps||[]).map(s=>`<li>${fmt(s)}</li>`).join("")}</ol>${p.ans?`<div class="ans"><b>answer</b>${fmt(p.ans)}</div>`:""}</div>`;
    const go=card.querySelector(".go");
    go.addEventListener("click",()=>{const on=!card.classList.contains("on");card.classList.toggle("on",on);go.firstElementChild.textContent=on?"hide the steps":"show the steps"});
    sec.appendChild(card);
  });
}

/* formulas */
function buildFormulas(sec){
  const fs=GUIDE.formulas||[];
  sec.appendChild(shead("formulas",`${fs.length}`));
  sec.appendChild(el("div","group",fs.map(f=>`<div class="fx"><span class="n">${esc(f.n)}</span><span class="f">${esc(f.f)}</span>${f.note?`<span class="note">${fmt(f.note)}</span>`:""}</div>`).join("")));
}

/* flashcards */
function buildCards(sec){
  const cs=GUIDE.cards||[]; let i=0, order=cs.map((_,k)=>k);
  sec.appendChild(shead("cards",`${cs.length}`));
  const deck=el("div","deck"); const fc=el("div","fc"); fc.setAttribute("role","button"); fc.tabIndex=0; deck.appendChild(fc); sec.appendChild(deck);
  const nav=el("div","dnav",`<button type="button" class="btn ghost" id="prev">back</button><button type="button" class="btn" id="next">next</button><button type="button" class="btn ghost" id="shuf">shuffle</button><span class="cnt" id="cnt"></span>`); sec.appendChild(nav);
  const cnt=nav.querySelector("#cnt");
  const draw=()=>{const c=cs[order[i]];fc.classList.remove("flip");fc.innerHTML=`<div class="f"><span class="tag">term</span><span>${esc(c.f)}</span></div><div class="b"><span class="tag">${esc(GUIDE.cls)}</span><span>${fmt(c.b)}</span></div>`;cnt.textContent=`${i+1} of ${cs.length}`};
  const flip=()=>fc.classList.toggle("flip");
  fc.addEventListener("click",flip); fc.addEventListener("keydown",e=>{if(e.key===" "||e.key==="Enter"){e.preventDefault();flip()}});
  nav.querySelector("#next").addEventListener("click",()=>{i=(i+1)%cs.length;draw()});
  nav.querySelector("#prev").addEventListener("click",()=>{i=(i-1+cs.length)%cs.length;draw()});
  nav.querySelector("#shuf").addEventListener("click",()=>{for(let k=order.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[order[k],order[j]]=[order[j],order[k]]}i=0;draw()});
  addEventListener("keydown",e=>{if(!sec.classList.contains("on")||e.target.tagName==="INPUT")return;if(e.key==="ArrowRight"){i=(i+1)%cs.length;draw()}if(e.key==="ArrowLeft"){i=(i-1+cs.length)%cs.length;draw()}});
  let x0=null; fc.addEventListener("touchstart",e=>{x0=e.touches[0].clientX},{passive:true}); fc.addEventListener("touchend",e=>{if(x0==null)return;const dx=e.changedTouches[0].clientX-x0;x0=null;if(dx<-40){i=(i+1)%cs.length;draw()}else if(dx>40){i=(i-1+cs.length)%cs.length;draw()}},{passive:true});
  draw();
}

/* timeline */
function buildTimeline(sec){
  const ts=GUIDE.timeline||[];
  sec.appendChild(shead("timeline",`${ts.length} events`));
  sec.appendChild(el("div","card",`<div class="tl">${ts.map(t=>`<div class="ev"><div class="y">${esc(t.y)}</div><div class="t">${fmt(t.t)}</div>${t.d?`<div class="d">${fmt(t.d)}</div>`:""}</div>`).join("")}</div>`));
}

/* checklist */
function buildChecklist(sec){
  const cs=GUIDE.checklist||[]; const key="ck:"+location.pathname; let saved={}; try{saved=JSON.parse(localStorage.getItem(key)||"{}")}catch(e){}
  sec.appendChild(shead("checklist",`${cs.length} items`));
  const g=el("div","group");
  cs.forEach((c,i)=>{
    const b=el("button","ck"+(saved[i]?" on":""),`<span class="box"><svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 6.5l2.5 2.5 4.5-5"/></svg></span><span><span class="t">${fmt(c.t)}</span>${c.d?`<span class="d">${fmt(c.d)}</span>`:""}</span>`);
    b.type="button"; b.addEventListener("click",()=>{b.classList.toggle("on");saved[i]=b.classList.contains("on");try{localStorage.setItem(key,JSON.stringify(saved))}catch(e){}});
    g.appendChild(b);
  });
  sec.appendChild(g);
}

/* theme (shared with the homepage via localStorage "theme") */
const seg=$(".seg"), thumb=$(".seg .thumb"), segBtns=[...seg.querySelectorAll("button")];
function moveThumb(){const on=seg.querySelector('button[aria-pressed="true"]')||segBtns[0];thumb.style.left=on.offsetLeft+"px";thumb.style.width=on.offsetWidth+"px"}
function setTheme(mode){
  const apply=()=>{if(mode==="auto")delete document.documentElement.dataset.theme;else document.documentElement.dataset.theme=mode};
  if(document.startViewTransition&&!REDUCED)document.startViewTransition(apply);else apply();
  segBtns.forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.set===mode)));moveThumb();
  try{mode==="auto"?localStorage.removeItem("theme"):localStorage.setItem("theme",mode)}catch(e){}
}
segBtns.forEach(b=>b.addEventListener("click",()=>setTheme(b.dataset.set)));
(function(){let saved=null;try{saved=localStorage.getItem("theme")}catch(e){}
  const mode=saved==="light"||saved==="dark"?saved:"auto";
  if(mode!=="auto")document.documentElement.dataset.theme=mode;
  segBtns.forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.set===mode)));
})();
requestAnimationFrame(moveThumb);addEventListener("resize",moveThumb);
document.fonts?.ready.then(()=>{moveThumb();moveP()});

/* sticky bar shadow + staggered reveal */
(function(){const bar=$("#bar");let raf=0;const tick=()=>{raf=0;bar.classList.toggle("stuck",scrollY>6)};addEventListener("scroll",()=>{if(!raf)raf=requestAnimationFrame(tick)},{passive:true});tick()})();
document.querySelectorAll(".rv").forEach((n,i)=>n.style.animationDelay=(i*55)+"ms");
</script>
</body>
</html>
