<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>chapter 3 jeopardy · valentino guides</title>
<meta name="description" content="Chapter 3 review game for Catholic Morality. Made by a student.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#EEE8DC">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#151B20">
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg?v=3" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3">
<link rel="preload" href="/fonts/bricolage-grotesque.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/figtree.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* ═══ valentino guides · guide template (kinari, sept 2026) ═══
   Same tokens, type, corners and components as the homepage. Edit the GUIDE object below the machinery; leave the CSS alone. */
@font-face{font-family:"Bricolage Grotesque";font-style:normal;font-weight:200 800;font-display:swap;src:url(/fonts/bricolage-grotesque.woff2) format("woff2")}
@font-face{font-family:"Figtree";font-style:normal;font-weight:300 900;font-display:swap;src:url(/fonts/figtree.woff2) format("woff2")}
@font-face{font-family:"Figtree";font-style:italic;font-weight:300 900;font-display:swap;src:url(/fonts/figtree-italic.woff2) format("woff2")}

:root{--paper:#EEE8DC;--surface:#FBF8F1;--surface2:#F4EFE5;--line:#D4CABB;--line2:#B4ADA1;--ink:#20272B;--ink2:rgba(94,90,82,1);--ink3:rgba(94,90,82,.95);--accent:#294A5E;--on-accent:#FBF8F1;--hi:#944B34;--good:#4C6A48;--bad:#8E3F4C;
  --c-apush:#8A442D;--c-psych:#873E50;--c-phys:#28636A;--c-pre:#684A78;--c-sem:#56633B;--c-biz:#75601E;--c-mor:#69513D;--c-lang:#4A4E7A;--c-span:#8E3F3A;--c-apwh:#5F4A78;--c-csp:#4E5A63}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#151B20;--surface:#1D252A;--surface2:#192024;--line:#354149;--line2:#576064;--ink:#F2ECDF;--ink2:rgba(185,178,167,.97);--ink3:rgba(185,178,167,.77);--accent:#8FB7CA;--on-accent:#1D252A;--hi:#E18A67;--good:#9BBC8A;--bad:#DF8592;
  --c-apush:#E08B68;--c-psych:#DB8D9C;--c-phys:#75B8B6;--c-pre:#C39ACC;--c-sem:#AAB67A;--c-biz:#CBB15F;--c-mor:#C79E7B;--c-lang:#A9AEE0;--c-span:#E09490;--c-apwh:#BBA3D6;--c-csp:#A9B6BE}}
:root[data-theme="dark"]{--paper:#151B20;--surface:#1D252A;--surface2:#192024;--line:#354149;--line2:#576064;--ink:#F2ECDF;--ink2:rgba(185,178,167,.97);--ink3:rgba(185,178,167,.77);--accent:#8FB7CA;--on-accent:#1D252A;--hi:#E18A67;--good:#9BBC8A;--bad:#DF8592;
  --c-apush:#E08B68;--c-psych:#DB8D9C;--c-phys:#75B8B6;--c-pre:#C39ACC;--c-sem:#AAB67A;--c-biz:#CBB15F;--c-mor:#C79E7B;--c-lang:#A9AEE0;--c-span:#E09490;--c-apwh:#BBA3D6;--c-csp:#A9B6BE}
:root{--display:"Bricolage Grotesque",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;--sans:"Figtree",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;--r-card:14px;--r-btn:10px;--r-chip:8px;--spring:cubic-bezier(.32,.72,0,1);--cls:var(--c-mor)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--paper)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
.wrap{max-width:980px;margin:0 auto;padding:14px 16px 48px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;color:var(--ink);text-decoration:none;font-family:var(--display);font-weight:600;font-size:20px;letter-spacing:-.025em;text-transform:lowercase;white-space:nowrap}
@media (max-width:420px){.brand{font-size:17px}.seg button{padding:5px 8px}}
.brand i{display:grid;place-items:center;width:26px;height:26px;border-radius:7px;background:var(--accent);color:var(--on-accent);font-style:normal;font-size:15px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r-btn);padding:2px;background:var(--surface)}
.seg button{border:0;background:none;color:var(--ink2);font:500 13px var(--sans);padding:5px 10px;border-radius:8px;cursor:pointer;text-transform:lowercase}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.meta{display:flex;align-items:center;gap:8px;margin-top:18px;font-size:13px;font-weight:650;color:var(--cls);text-transform:lowercase}
.meta a{color:var(--ink2);font-weight:500;text-decoration:none;border:1px solid var(--line);border-radius:var(--r-chip);padding:2px 8px}
h1{font-family:var(--display);font-weight:600;letter-spacing:-.03em;font-size:clamp(30px,6vw,44px);line-height:1.05;margin:8px 0 4px;text-transform:lowercase}
.sub{color:var(--ink2);margin:0 0 18px;text-transform:lowercase;font-size:15px}
.scores{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-bottom:12px}
.team{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.team input{border:0;background:none;color:var(--ink2);font:600 13px var(--sans);text-transform:lowercase;padding:0;width:100%;outline:none}
.team b{font-family:var(--display);font-weight:600;font-size:26px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.team b.neg{color:var(--bad)}
.board{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.cat{background:var(--ink);color:var(--paper);border-radius:var(--r-btn);padding:10px 6px;min-height:58px;display:grid;place-items:center;text-align:center;font:700 clamp(8.5px,1.9vw,14px)/1.15 var(--sans);hyphens:manual;text-transform:uppercase;letter-spacing:.02em}
.tile{appearance:none;border:0;cursor:pointer;background:var(--cls);color:var(--paper);border-radius:var(--r-btn);aspect-ratio:1.7;min-width:0;font-family:var(--display);font-weight:700;font-size:clamp(18px,4.4vw,34px);letter-spacing:-.02em;transition:transform .25s var(--spring),opacity .2s}
.tile:hover{transform:scale(1.04)}.tile:active{transform:scale(.96)}
.tile.used{background:var(--surface2);color:transparent;cursor:default;transform:none;box-shadow:inset 0 0 0 1px var(--line)}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 14px var(--sans);padding:9px 14px;border-radius:var(--r-btn);cursor:pointer;text-transform:lowercase}
.btn.pri{background:var(--accent);color:var(--on-accent);border-color:transparent}
.btn:disabled{opacity:.4;cursor:default}
.ov{position:fixed;inset:0;background:var(--paper);display:none;flex-direction:column;align-items:center;justify-content:center;padding:24px 18px;z-index:9;text-align:center}
.ov.on{display:flex;animation:pop .35s var(--spring)}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
.ov .tag{font:700 13px var(--sans);color:var(--cls);text-transform:lowercase;letter-spacing:.02em}
.ov .dd{font-family:var(--display);font-weight:700;font-size:clamp(36px,9vw,72px);color:var(--cls);letter-spacing:-.03em;margin:6px 0}
.ov .clue{font-family:var(--display);font-weight:600;font-size:clamp(24px,4.6vw,42px);line-height:1.15;letter-spacing:-.02em;max-width:820px;margin:12px 0 22px}
.ov .ans{font-size:clamp(18px,3vw,24px);font-weight:650;color:var(--good);min-height:1.5em;margin-bottom:20px}
.ov .row{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;max-width:720px}
.ov .row .btn.ok{border-color:var(--good);color:var(--good)}.ov .row .btn.no{border-color:var(--bad);color:var(--bad)}
.ov label{font-size:14px;color:var(--ink2)}.ov input[type=number]{font:600 16px var(--sans);width:110px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.hint{color:var(--ink3);font-size:13px;margin-top:14px;text-transform:lowercase}
footer{margin-top:28px;color:var(--ink3);font-size:12px;text-transform:lowercase}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
<header><a class="brand" href="/"><i>V</i>valentino guides</a>
<div class="seg" role="group" aria-label="theme"><button data-m="auto">auto</button><button data-m="light">light</button><button data-m="dark">dark</button></div></header>
<div class="meta">✝ catholic morality <a href="/morality-ch3">study guide</a></div>
<h1>chapter 3 jeopardy</h1>
<p class="sub">law as a guide to freedom · for fun, not a study guide</p>
<div class="scores" id="scores"></div>
<div class="board" id="board"></div>
<div class="bar"><button class="btn" id="addTeam">add team</button><button class="btn" id="final">final jeopardy</button><button class="btn" id="reset">new game</button></div>
<p class="hint">tap a tile. whoever buzzes first answers in the form of a question. one tile is a daily double.</p>
<footer>valentinoguides.com · made by a student</footer>
</div>
<div class="ov" id="ov"><div class="tag" id="oTag"></div><div class="dd" id="oDD"></div><div class="clue" id="oClue"></div><div class="ans" id="oAns"></div><div class="row" id="oRow"></div></div>
<script>
const CATS=[
 {n:"Freedom",q:[
  ["Unlimited, undisciplined freedom that abuses true freedom","What is license?"],
  ["The belief that fate, the stars, or your genes decide every choice","What is determinism?"],
  ["Poverty and tyranny threaten this kind of freedom","What is external freedom?"],
  ["The belief that there are no absolute moral truths","What is moral relativism?"],
  ["Absolute truth is not a position but this person","Who is Jesus Christ?"]]},
 {n:"Imped\u00ADiments",q:[
  ["A cashier hands over cash at gunpoint, acting under this","What is duress?"],
  ["Repeated behavior that can turn into a vice","What is habit?"],
  ["A driver crashes because a toddler threw a toy at the windshield","What is inadvertence?"],
  ["Being enslaved to money and possessions","What is inordinate attachment?"],
  ["Being responsible and deserving blame for a wrong act","What is culpability?"]]},
 {n:"Types of Law",q:[
  ["The law written into the human soul","What is natural law?"],
  ["The Ten Commandments sum up this law","What is the Old Law?"],
  ["The New Law is expressed most clearly in this sermon","What is the Sermon on the Mount?"],
  ["God's wise and loving plan, the source of all law","What is divine (eternal) law?"],
  ["The Old Law is a \"law of\" this, since it names sin but can't remove it","What is bondage?"]]},
 {n:"Grace & Merit",q:[
  ["God's free and undeserved help","What is grace?"],
  ["Another name for habitual grace","What is sanctifying grace?"],
  ["The \"spark\": cleansing from sin through faith and Baptism","What is justification?"],
  ["Special graces for the common good, like praying in tongues","What are charisms?"],
  ["The source of all merit","What is the love of Jesus Christ?"]]},
 {n:"Just Law & Church",q:[
  ["He said \"an unjust law is no law at all\"","Who is St. Augustine?"],
  ["The minimum number of times a year you must go to confession","What is once?"],
  ["Aquinas: law is reasonable, for the common good, and from this","What is competent authority?"],
  ["The Church's official body of rules","What is canon law?"],
  ["Catholics must receive the Eucharist at least during this season","What is the Easter season?"]]}
];
const FINAL=["The three evangelical counsels included in the New Law","What are poverty, chastity, and obedience?"];
const $=s=>document.querySelector(s);
let teams,used,dd;
function newGame(){teams=[{n:"team 1",s:0},{n:"team 2",s:0}];used={};dd=Math.floor(Math.random()*5)+","+(2+Math.floor(Math.random()*3));draw()}
function draw(){
 const sc=$("#scores");sc.innerHTML="";
 teams.forEach((t,i)=>{const d=document.createElement("div");d.className="team";const inp=document.createElement("input");inp.value=t.n;inp.setAttribute("aria-label","team name");inp.oninput=()=>t.n=inp.value;const b=document.createElement("b");b.textContent=t.s;if(t.s<0)b.className="neg";d.append(inp,b);sc.append(d)});
 $("#addTeam").disabled=teams.length>=4;
 const bd=$("#board");bd.innerHTML="";
 CATS.forEach(c=>{const h=document.createElement("div");h.className="cat";h.textContent=c.n;bd.append(h)});
 for(let r=0;r<5;r++)CATS.forEach((c,ci)=>{const k=ci+","+r;const b=document.createElement("button");b.className="tile"+(used[k]?" used":"");b.textContent=(r+1)*100;b.setAttribute("aria-label",c.n+" for "+(r+1)*100);if(!used[k])b.onclick=()=>openClue(ci,r);bd.append(b)});
}
function btn(t,cls,fn){const b=document.createElement("button");b.className="btn "+(cls||"");b.textContent=t;b.onclick=fn;return b}
function close(){$("#ov").classList.remove("on");draw()}
function openClue(ci,r){
 const k=ci+","+r,[clue,ans]=CATS[ci].q[r];let val=(r+1)*100;used[k]=1;
 $("#oTag").textContent=CATS[ci].n+" · "+val;$("#oAns").textContent="";$("#oClue").textContent="";$("#oDD").textContent="";
 const row=$("#oRow");row.innerHTML="";$("#ov").classList.add("on");
 const showClue=()=>{$("#oDD").textContent="";$("#oClue").textContent=clue;row.innerHTML="";row.append(btn("show answer","pri",reveal))};
 const reveal=()=>{$("#oAns").textContent=ans;row.innerHTML="";
  teams.forEach(t=>{row.append(btn(t.n+" +"+val,"ok",()=>{t.s+=val;close()}));row.append(btn(t.n+" −"+val,"no",()=>{t.s-=val;draw();}))});
  row.append(btn("nobody","",close))};
 if(k===dd){$("#oDD").textContent="daily double";row.append((()=>{const l=document.createElement("label");l.textContent="wager ";const i=document.createElement("input");i.type="number";i.min=0;i.value=val;i.id="wg";l.append(i);return l})());row.append(btn("show clue","pri",()=>{val=Math.max(0,parseInt($("#wg").value)||0);$("#oTag").textContent=CATS[ci].n+" · wager "+val;showClue()}))}
 else showClue();
}
function openFinal(){
 const row=$("#oRow");row.innerHTML="";$("#oTag").textContent="final jeopardy · grace & the new law";$("#oDD").textContent="";$("#oClue").textContent="Everyone writes a secret wager, then taps show clue.";$("#oAns").textContent="";$("#ov").classList.add("on");
 row.append(btn("show clue","pri",()=>{$("#oClue").textContent=FINAL[0];row.innerHTML="";row.append(btn("show answer","pri",()=>{$("#oAns").textContent=FINAL[1];row.innerHTML="";
  teams.forEach(t=>{const l=document.createElement("label");l.textContent=t.n+" ";const i=document.createElement("input");i.type="number";i.min=0;i.value=0;l.append(i);row.append(l,btn("right","ok",()=>{t.s+=parseInt(i.value)||0;draw()}),btn("wrong","no",()=>{t.s-=parseInt(i.value)||0;draw()}))});
  row.append(btn("done","pri",close))}))}));
 row.append(btn("back","",close));
}
$("#addTeam").onclick=()=>{if(teams.length<4){teams.push({n:"team "+(teams.length+1),s:0});draw()}};
$("#reset").onclick=newGame;$("#final").onclick=openFinal;
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$("#ov").classList.contains("on"))close()});
(function(){let mode="auto";try{mode=localStorage.getItem("theme")||"auto"}catch(e){}
 const bs=document.querySelectorAll(".seg button");
 const apply=()=>{if(mode==="auto")delete document.documentElement.dataset.theme;else document.documentElement.dataset.theme=mode;bs.forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.m===mode)))};
 bs.forEach(b=>b.onclick=()=>{mode=b.dataset.m;try{mode==="auto"?localStorage.removeItem("theme"):localStorage.setItem("theme",mode)}catch(e){}apply()});apply()})();
newGame();
</script>
</body>
</html>
