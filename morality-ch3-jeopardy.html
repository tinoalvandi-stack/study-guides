<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>chapter 3 jeopardy · valentino guides</title>
<meta name="description" content="Chapter 3 review game for Catholic Morality. Made by a student.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0B1030">
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg?v=3" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3">
<link rel="preload" href="/fonts/oswald.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/eb-garamond-600.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/figtree.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"Oswald";font-weight:200 700;font-display:swap;src:url(/fonts/oswald.woff2) format("woff2")}
@font-face{font-family:"EB Garamond";font-weight:400;font-display:swap;src:url(/fonts/eb-garamond-400.woff2) format("woff2")}
@font-face{font-family:"EB Garamond";font-weight:600;font-display:swap;src:url(/fonts/eb-garamond-600.woff2) format("woff2")}
@font-face{font-family:"Figtree";font-weight:300 900;font-display:swap;src:url(/fonts/figtree.woff2) format("woff2")}
:root{--night:#0C1233;--blue:#1C2B7A;--blue2:#16225F;--gold:#D9B45A;--gold-d:#9C7A2E;--cream:#F3EBD6;--mist:#B9B3A2;--rule:#3A4270;--good:#86C79A;--bad:#E48585;
 --serif:"EB Garamond",Garamond,Georgia,serif;--cond:"Oswald","Arial Narrow",sans-serif;--sans:"Figtree",system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--night);color:var(--cream);font-family:var(--sans);-webkit-font-smoothing:antialiased}
.wrap{max-width:1000px;margin:0 auto;padding:14px 16px 48px}
header{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--rule);padding-bottom:10px}
.home{color:var(--mist);text-decoration:none;font:500 13px var(--sans);letter-spacing:.02em}
.home:hover{color:var(--gold)}
.hero{text-align:center;margin:26px 0 22px}
.cross{width:22px;height:30px;display:block;margin:0 auto 10px}
.kicker{font:500 12px var(--cond);letter-spacing:.24em;text-transform:uppercase;color:var(--gold)}
h1{font-family:var(--serif);font-weight:600;font-size:clamp(36px,7vw,60px);line-height:1;margin:8px 0 6px;color:var(--cream);letter-spacing:-.005em}
.sub{color:var(--mist);font-family:var(--serif);font-style:italic;font-size:18px;margin:0}
.rule{display:flex;align-items:center;gap:12px;justify-content:center;margin:14px auto 0;max-width:260px;color:var(--gold)}
.rule::before,.rule::after{content:"";flex:1;height:1px;background:var(--gold-d)}
.scores{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:6px;margin:0 0 14px}
.team{border:1px solid var(--rule);border-top:3px solid var(--tc);padding:8px 10px;background:var(--blue2)}
.team .n{font:500 12px var(--cond);letter-spacing:.08em;text-transform:uppercase;color:var(--tc);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.team b{font:600 26px var(--cond);font-variant-numeric:tabular-nums}
.team b.neg{color:var(--bad)}
.team.lead{outline:1px solid var(--gold);outline-offset:-1px}
.team.lead .n::after{content:" ✝";color:var(--gold)}
.board{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;padding:4px;background:#05081C;border:1px solid var(--gold-d)}
.cat{background:var(--blue);color:var(--cream);padding:10px 4px;min-height:64px;display:grid;place-items:center;text-align:center;font:600 clamp(9.5px,2vw,16px)/1.1 var(--cond);text-transform:uppercase;letter-spacing:.04em;border-bottom:2px solid #05081C}
.tile{appearance:none;border:0;border-radius:2px;cursor:pointer;min-width:0;aspect-ratio:1.6;background:var(--blue);color:var(--gold);font:600 clamp(20px,5vw,42px) var(--cond);letter-spacing:.01em;transition:background .15s}
.tile:hover{background:#26379A}
.tile:focus-visible{outline:2px solid var(--gold);outline-offset:-2px}
.tile.used{background:#0A1030;color:transparent;cursor:default}
.cat{border-radius:2px}
.bar{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:16px}
.btn{appearance:none;border:1px solid var(--rule);background:transparent;color:var(--cream);font:500 13px var(--cond);letter-spacing:.12em;text-transform:uppercase;padding:10px 16px;border-radius:2px;cursor:pointer}
.btn:hover{border-color:var(--gold);color:var(--gold)}
.btn.pri{background:var(--gold);color:#1A1405;border-color:var(--gold)}
.btn.pri:hover{background:#E6C46E;color:#1A1405}
.btn.ok{border-color:#4E7A5B;color:var(--good)}.btn.no{border-color:#8A4B4B;color:var(--bad)}
.btn:disabled{opacity:.35;cursor:default}
.hint{color:var(--mist);font:italic 16px var(--serif);text-align:center;margin-top:14px}
footer{margin-top:26px;color:#6E6B82;font-size:12px;text-align:center}
.ov{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;padding:24px 18px;z-index:9;text-align:center;overflow:auto;background:var(--blue)}
.ov.on{display:flex;animation:fade .2s ease-out}
@keyframes fade{from{opacity:0}to{opacity:1}}
.ov .tag{font:500 13px var(--cond);letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
.ov .dd{font:600 clamp(40px,9vw,80px) var(--cond);text-transform:uppercase;letter-spacing:.02em;color:var(--gold);margin:6px 0}
.ov .clue{font-family:var(--serif);font-weight:600;font-size:clamp(28px,5vw,50px);line-height:1.12;max-width:880px;margin:14px 0 22px;color:#fff;text-transform:uppercase;letter-spacing:.01em}
.ov .ans{font:600 clamp(20px,3.2vw,28px) var(--serif);font-style:italic;color:var(--gold);min-height:1.4em;margin-bottom:22px}
.ov .row{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;max-width:820px}
.ov .grp{display:flex;gap:4px;align-items:center;padding:4px 4px 4px 10px;border:1px solid rgba(255,255,255,.18);border-left:3px solid var(--tc);background:rgba(0,0,0,.15)}
.ov .grp span{font:500 12px var(--cond);letter-spacing:.08em;text-transform:uppercase;color:var(--tc);max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-right:4px}
.ov .grp .btn{padding:7px 10px}
.ov input[type=number]{font:500 16px var(--cond);width:88px;padding:7px 8px;border:1px solid rgba(255,255,255,.25);border-radius:2px;background:rgba(0,0,0,.2);color:#fff}
.ov label{color:var(--cream);font:500 13px var(--cond);letter-spacing:.12em;text-transform:uppercase}
.setup{width:100%;max-width:520px}
.setup h2{font:600 clamp(30px,6vw,42px) var(--serif);margin:6px 0 4px}
.setup p{color:var(--cream);opacity:.8;font:italic 18px var(--serif);margin:0 0 18px}
.step{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:16px}
.step b{font:600 32px var(--cond);min-width:28px}
.step .btn{width:44px;height:44px;padding:0;font-size:20px;letter-spacing:0}
.names{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:20px}
@media (max-width:520px){.names{grid-template-columns:1fr}}
.nm{display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.18);border:1px solid rgba(255,255,255,.18);border-left:3px solid var(--tc);padding:2px 4px 2px 10px}
.nm i{display:none}
.nm input{flex:1;min-width:0;border:0;background:none;color:#fff;font:500 16px var(--sans);padding:9px 0;outline:none}
.nm input::placeholder{color:rgba(255,255,255,.4)}
.nm .dice{border:0;background:none;color:var(--gold);cursor:pointer;font:500 11px var(--cond);letter-spacing:.12em;text-transform:uppercase;padding:6px}
.win .crown{display:none}
.win .wt{font:600 clamp(34px,7vw,56px) var(--serif);color:var(--gold)}
.win ol{list-style:none;padding:0;margin:18px auto 22px;display:grid;gap:4px;min-width:280px;max-width:420px}
.win li{display:flex;justify-content:space-between;gap:20px;padding:10px 14px;border:1px solid rgba(255,255,255,.18);font:500 18px var(--cond);letter-spacing:.04em;text-transform:uppercase;text-align:left}
.win li:first-child{border-color:var(--gold)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
<header><a class="home" href="/">← valentino guides</a><a class="home" href="/morality-ch3">Ch. 3 study guide</a></header>
<div class="hero">
<svg class="cross" viewBox="0 0 22 30" aria-hidden="true"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF3C9"/><stop offset="1" stop-color="#B8913A"/></linearGradient></defs><path d="M9.5 0h3v9h9.5v3h-9.5v18h-3V12H0V9h9.5z" fill="#D9B45A"/></svg>
<div class="kicker">Catholic Morality · Chapter 3</div>
<h1>Chapter 3 Jeopardy</h1>
<p class="sub">Law as a Guide to Freedom</p>
</div>
<div class="scores" id="scores"></div>
<div class="board" id="board"></div>
<div class="bar"><button class="btn" id="editTeams">edit teams</button><button class="btn pri" id="final">final jeopardy</button><button class="btn" id="reset">new game</button></div>
<p class="hint">Pick a tile. Answer in the form of a question. One tile hides a Daily Double.</p>
<footer>valentinoguides.com</footer>
</div>
<div class="ov" id="ov"><div class="tag" id="oTag"></div><div class="dd" id="oDD"></div><div class="clue" id="oClue"></div><div class="ans" id="oAns"></div><div class="row" id="oRow"></div></div>
<div class="ov" id="su"><div class="setup">
<div class="kicker">Before we begin</div><h2>Name your teams</h2><p>Up to eight teams.</p>
<div class="step"><button class="btn" id="minus" aria-label="fewer teams">−</button><b id="cnt">2</b><button class="btn" id="plus" aria-label="more teams">+</button></div>
<div class="names" id="names"></div>
<button class="btn pri" id="start">let's play</button>
</div></div>
<script>
const CATS=[
 {n:"Freedom",q:[
  ["Unlimited, undisciplined freedom that abuses true freedom","What is license?"],
  ["The belief that fate, the stars, or your genes decide every choice","What is determinism?"],
  ["Poverty and tyranny threaten this kind of freedom","What is external freedom?"],
  ["The belief that there are no absolute moral truths","What is moral relativism?"],
  ["Absolute truth is not a position but this person","Who is Jesus Christ?"]]},
 {n:"Imped\u00ADiments",q:[
  ["A cashier hands over cash at gunpoint, acting under this","What is duress?"],
  ["Repeated behavior that can turn into a vice","What is habit?"],
  ["A driver crashes because a toddler threw a toy at the windshield","What is inadvertence?"],
  ["Being enslaved to money and possessions","What is inordinate attachment?"],
  ["Being responsible and deserving blame for a wrong act","What is culpability?"]]},
 {n:"Types of Law",q:[
  ["The law written into the human soul","What is natural law?"],
  ["The Ten Commandments sum up this law","What is the Old Law?"],
  ["The New Law is expressed most clearly in this sermon","What is the Sermon on the Mount?"],
  ["God's wise and loving plan, the source of all law","What is divine (eternal) law?"],
  ["The Old Law is a \"law of\" this, since it names sin but can't remove it","What is bondage?"]]},
 {n:"Grace & Merit",q:[
  ["God's free and undeserved help","What is grace?"],
  ["Another name for habitual grace","What is sanctifying grace?"],
  ["The \"spark\": cleansing from sin through faith and Baptism","What is justification?"],
  ["Special graces for the common good, like praying in tongues","What are charisms?"],
  ["The source of all merit","What is the love of Jesus Christ?"]]},
 {n:"Just Law & Church",q:[
  ["He said \"an unjust law is no law at all\"","Who is St. Augustine?"],
  ["The minimum number of times a year you must go to confession","What is once?"],
  ["Aquinas: law is reasonable, for the common good, and from this","What is competent authority?"],
  ["The Church's official body of rules","What is canon law?"],
  ["Catholics must receive the Eucharist at least during this season","What is the Easter season?"]]}
];
const FINAL=["The three evangelical counsels included in the New Law","What are poverty, chastity, and obedience?"];

const COLORS=["#D9B45A","#7FA8F0","#E48585","#86C79A","#C0A2E8","#E8A56A","#6FC9C9","#E8E1CF"];
const IDEAS=["The Apostles","Holy Rollers","Saintly Squad","Divine Minds","The Beatitudes","Grace Chasers","Team Aquinas","The Evangelists","Merit Makers","Natural Lawyers","The Disciples","Heaven Bound","Pew Crew","Sons of Thunder","The Faithful","Loaves & Fishes"];
const $=s=>document.querySelector(s);
let teams=[],used={},dd="",draft=[];
function pickIdea(ex){const pool=IDEAS.filter(x=>!ex.includes(x));return pool[Math.floor(Math.random()*pool.length)]||"Team"}
function mk(t,c,h){const n=document.createElement(t);if(c)n.className=c;if(h!=null)n.textContent=h;return n}
function btn(t,cls,fn){const b=mk("button","btn "+(cls||""),t);b.type="button";b.onclick=fn;return b}
function rollDD(){dd=Math.floor(Math.random()*5)+","+(2+Math.floor(Math.random()*3))}
function openSetup(first){
 draft=teams.length?teams.map(t=>({n:t.n,s:t.s})):[{n:"",s:0},{n:"",s:0}];
 $("#start").textContent=first?"let's play":"save teams";
 renderSetup();$("#su").classList.add("on");
}
function renderSetup(){
 $("#cnt").textContent=draft.length;$("#minus").disabled=draft.length<=2;$("#plus").disabled=draft.length>=8;
 const box=$("#names");box.innerHTML="";
 draft.forEach((t,i)=>{const r=mk("div","nm");r.style.setProperty("--tc",COLORS[i]);const dot=mk("i");const inp=mk("input");inp.value=t.n;inp.placeholder="Team "+(i+1);inp.maxLength=28;inp.setAttribute("aria-label","team "+(i+1)+" name");inp.oninput=()=>t.n=inp.value;
  const d=mk("button","dice","random");d.type="button";d.title="random name";d.setAttribute("aria-label","random name");d.onclick=()=>{t.n=pickIdea(draft.map(x=>x.n));inp.value=t.n};
  r.append(dot,inp,d);box.append(r)});
}
$("#minus").onclick=()=>{if(draft.length>2){draft.pop();renderSetup()}};
$("#plus").onclick=()=>{if(draft.length<8){draft.push({n:"",s:0});renderSetup()}};
$("#start").onclick=()=>{teams=draft.map((t,i)=>({n:(t.n||"").trim()||"Team "+(i+1),s:t.s||0,c:COLORS[i]}));$("#su").classList.remove("on");draw()};
function draw(){
 const sc=$("#scores");sc.innerHTML="";const top=Math.max(...teams.map(t=>t.s));
 teams.forEach(t=>{const d=mk("div","team"+(t.s>0&&t.s===top?" lead":""));d.style.setProperty("--tc",t.c);const b=mk("b",t.s<0?"neg":"",t.s);d.append(mk("span","n",t.n),b);sc.append(d)});
 const bd=$("#board");bd.innerHTML="";
 CATS.forEach(c=>bd.append(mk("div","cat",c.n)));
 for(let r=0;r<5;r++)CATS.forEach((c,ci)=>{const k=ci+","+r;const b=mk("button","tile"+(used[k]?" used":""),(r+1)*100);b.type="button";b.setAttribute("aria-label",c.n+" for "+(r+1)*100);if(!used[k])b.onclick=()=>openClue(ci,r);bd.append(b)});
}
function close(){$("#ov").classList.remove("on");draw();if(Object.keys(used).length===25&&!finalDone)setTimeout(()=>{},0)}
let finalDone=false;
function scoreRow(val,after){const row=$("#oRow");row.innerHTML="";
 teams.forEach(t=>{const g=mk("div","grp");g.style.setProperty("--tc",t.c);g.append(mk("span","",t.n),btn("+"+val,"ok",()=>{t.s+=val;after()}),btn("−"+val,"no",()=>{t.s-=val;draw();g.style.opacity=".4"}));row.append(g)});
 row.append(btn("nobody","",close));}
function openClue(ci,r){
 const k=ci+","+r,[clue,ans]=CATS[ci].q[r];let val=(r+1)*100;used[k]=1;
 $("#oTag").textContent=CATS[ci].n.replace("­","")+" · "+val;$("#oAns").textContent="";$("#oClue").textContent="";$("#oDD").textContent="";
 const row=$("#oRow");row.innerHTML="";$("#ov").classList.add("on");
 const showClue=()=>{$("#oDD").textContent="";$("#oClue").textContent=clue;row.innerHTML="";row.append(btn("reveal answer","pri",()=>{$("#oAns").textContent=ans;scoreRow(val,close)}))};
 if(k===dd){$("#oDD").textContent="Daily Double";const l=mk("label","","wager ");const i=mk("input");i.type="number";i.min=0;i.value=Math.max(val,500);l.append(i);row.append(l,btn("show clue","pri",()=>{val=Math.max(0,parseInt(i.value)||0);$("#oTag").textContent=CATS[ci].n.replace("­","")+" · wager "+val;showClue()}))}
 else showClue();
}
function openFinal(){
 const row=$("#oRow");row.innerHTML="";$("#oTag").textContent="final jeopardy · the new law";$("#oDD").textContent="Final Jeopardy";$("#oClue").textContent="Every team secretly writes down a wager.";$("#oAns").textContent="";$("#ov").classList.add("on");
 row.append(btn("show clue","pri",()=>{$("#oDD").textContent="";$("#oClue").textContent=FINAL[0];row.innerHTML="";row.append(btn("reveal answer","pri",()=>{$("#oAns").textContent=FINAL[1];row.innerHTML="";
  teams.forEach(t=>{const g=mk("div","grp");g.style.setProperty("--tc",t.c);const i=mk("input");i.type="number";i.min=0;i.value=0;i.setAttribute("aria-label",t.n+" wager");
   const ok=btn("right","ok",()=>{t.s+=parseInt(i.value)||0;g.style.opacity=".4";ok.disabled=no.disabled=true}),no=btn("wrong","no",()=>{t.s-=parseInt(i.value)||0;g.style.opacity=".4";ok.disabled=no.disabled=true});
   g.append(mk("span","",t.n),i,ok,no);row.append(g)});
  row.append(btn("crown the winner","pri",winner))}))}));
 row.append(btn("back","",close));
}
function winner(){finalDone=true;const row=$("#oRow");row.innerHTML="";const s=[...teams].sort((a,b)=>b.s-a.s);
 $("#oTag").textContent="";$("#oDD").textContent="";$("#oAns").textContent="";
 const c=$("#oClue");c.innerHTML="";const w=mk("div","win");const tie=s.length>1&&s[0].s===s[1].s;w.append(mk("div","wt",tie?"It's a tie!":s[0].n+" wins!"));const ol=mk("ol");s.forEach(t=>{const li=mk("li");const nm=mk("span","",t.n);nm.style.color=t.c;li.append(nm,mk("span","",t.s));ol.append(li)});w.append(ol);c.append(w);
 row.append(btn("back to board","",close),btn("new game","pri",()=>{$("#ov").classList.remove("on");newGame()}));}
function newGame(){used={};finalDone=false;rollDD();teams.forEach(t=>t.s=0);draw();openSetup(true)}
$("#editTeams").onclick=()=>openSetup(false);$("#reset").onclick=newGame;$("#final").onclick=openFinal;
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$("#ov").classList.contains("on"))close()});
rollDD();teams=[];draw();openSetup(true);
</script>
</body>
</html>
