<title>ap psychology unit 0 · study guide</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
:root{
  --text:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro",system-ui,sans-serif;
  --display:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro",system-ui,sans-serif;
  --round:ui-rounded,"SF Pro Rounded","SF Compact Rounded",-apple-system,system-ui,sans-serif;

  /* ap psychology + tide palette */
  --accent:#FF2D55;
  --amb1:var(--accent); --amb2:#0A84FF; --amb3:#40C8E0; --amb4:#5E5CE6;

  --ground:color-mix(in oklab,#E3E3EE 91%,var(--amb1)); --ink:#08080D;
  --ink2:rgba(56,56,64,.68); --ink3:rgba(56,56,64,.40);
  --glass:rgba(255,255,255,.54); --glass-hi:rgba(255,255,255,.72);
  --rim-a:rgba(255,255,255,.95); --rim-b:rgba(255,255,255,.10); --rim-c:rgba(255,255,255,.42);
  --gloss:rgba(255,255,255,.55); --spec:rgba(255,255,255,.34);
  --sep:rgba(56,56,64,.10); --fill:rgba(118,118,128,.10); --fill2:rgba(118,118,128,.055);
  --blue:#007AFF; --good:#2FB350; --bad:#FF3B30; --mint:#1FA97A;
  --blur:22px; --sat:195%;
  --shadow:0 1px 1px rgba(14,14,38,.04), 0 10px 28px -10px rgba(14,14,38,.22);
  --spring:cubic-bezier(.32,.72,0,1); --ease:cubic-bezier(.22,.61,.36,1);
  --amb:.82; --amb-blur:66px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --accent:#FF375F;
  --ground:color-mix(in oklab,#06060B 89%,var(--amb1)); --ink:#FFFFFF;
  --ink2:rgba(235,235,245,.66); --ink3:rgba(235,235,245,.38);
  --glass:rgba(255,255,255,.06); --glass-hi:rgba(255,255,255,.095);
  --rim-a:rgba(255,255,255,.42); --rim-b:rgba(255,255,255,.04); --rim-c:rgba(255,255,255,.16);
  --gloss:rgba(255,255,255,.16); --spec:rgba(255,255,255,.14);
  --sep:rgba(255,255,255,.085); --fill:rgba(255,255,255,.085); --fill2:rgba(255,255,255,.045);
  --blue:#0A84FF; --good:#30D158; --bad:#FF453A; --mint:#3DD598;
  --blur:26px; --sat:175%;
  --shadow:0 1px 1px rgba(0,0,0,.5), 0 12px 32px -12px rgba(0,0,0,.85);
  --amb:.62; --amb-blur:82px;
}}
:root[data-theme="dark"]{
  --accent:#FF375F;
  --ground:color-mix(in oklab,#06060B 89%,var(--amb1)); --ink:#FFFFFF;
  --ink2:rgba(235,235,245,.66); --ink3:rgba(235,235,245,.38);
  --glass:rgba(255,255,255,.06); --glass-hi:rgba(255,255,255,.095);
  --rim-a:rgba(255,255,255,.42); --rim-b:rgba(255,255,255,.04); --rim-c:rgba(255,255,255,.16);
  --gloss:rgba(255,255,255,.16); --spec:rgba(255,255,255,.14);
  --sep:rgba(255,255,255,.085); --fill:rgba(255,255,255,.085); --fill2:rgba(255,255,255,.045);
  --blue:#0A84FF; --good:#30D158; --bad:#FF453A; --mint:#3DD598;
  --blur:26px; --sat:175%;
  --shadow:0 1px 1px rgba(0,0,0,.5), 0 12px 32px -12px rgba(0,0,0,.85);
  --amb:.62; --amb-blur:82px;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--text);
  font-optical-sizing:auto;font-size:17px;line-height:1.45;letter-spacing:-.012em;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;min-height:100vh;
  padding-bottom:calc(48px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
:focus-visible{outline:2.5px solid var(--blue);outline-offset:3px;border-radius:11px}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}
.hidden{display:none !important}

#amb{position:fixed;inset:-20vh -20vw;z-index:-1;pointer-events:none;contain:strict;
  filter:blur(var(--amb-blur)) saturate(160%);opacity:var(--amb);animation:hue 120s linear infinite}
#amb i{position:absolute;display:block;border-radius:50%;animation:drift 38s var(--ease) infinite alternate}
#amb i:nth-child(1){width:64vw;height:64vw;left:-12vw;top:-10vh;background:radial-gradient(circle,var(--amb1),transparent 66%)}
#amb i:nth-child(2){width:58vw;height:58vw;right:-14vw;top:8vh;background:radial-gradient(circle,var(--amb2),transparent 66%);
  animation-duration:45s;animation-delay:-10s}
#amb i:nth-child(3){width:70vw;height:70vw;left:2vw;top:46vh;background:radial-gradient(circle,var(--amb3),transparent 66%);
  animation-duration:41s;animation-delay:-20s}
#amb i:nth-child(4){width:52vw;height:52vw;right:-6vw;bottom:-8vh;background:radial-gradient(circle,var(--amb4),transparent 66%);
  animation-duration:48s;animation-delay:-30s}
@keyframes drift{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(7vw,-6vh,0) scale(1.2)}}
@keyframes hue{
  0%,100%{filter:blur(var(--amb-blur)) saturate(160%) hue-rotate(-7deg)}
  50%    {filter:blur(var(--amb-blur)) saturate(172%) hue-rotate(7deg)}
}

.g{position:relative;isolation:isolate;background:var(--glass);
  -webkit-backdrop-filter:blur(var(--blur)) saturate(var(--sat));
  backdrop-filter:blur(var(--blur)) saturate(var(--sat));box-shadow:var(--shadow)}
.g::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;
  pointer-events:none;z-index:3;
  background:linear-gradient(150deg,var(--rim-a),var(--rim-b) 32%,transparent 56%,var(--rim-c));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  mask-composite:exclude}
.g::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:2;
  background:linear-gradient(180deg,var(--gloss),transparent 38%);opacity:.5}
.spec{position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:2;opacity:0;
  background:radial-gradient(260px circle at var(--mx,50%) var(--my,0%),var(--spec),transparent 68%);
  transition:opacity .4s var(--ease)}
@media (hover:hover){.g:hover > .spec{opacity:1}}

/* header */
header{position:sticky;top:0;z-index:40;background:var(--glass);
  -webkit-backdrop-filter:blur(20px) saturate(var(--sat));backdrop-filter:blur(20px) saturate(var(--sat));
  transition:background .4s var(--ease),box-shadow .4s var(--ease)}
header.stuck{background:var(--glass-hi);box-shadow:inset 0 -.5px 0 0 var(--sep),0 6px 26px -12px rgba(14,14,38,.4)}
.hrow{display:flex;align-items:center;gap:12px;padding:14px 0 12px}
.glyph{width:40px;height:40px;border-radius:12px;flex:none;
  background:linear-gradient(160deg,color-mix(in srgb,var(--accent) 80%,#fff),var(--accent));
  box-shadow:inset 0 .5px 0 rgba(255,255,255,.55),0 4px 10px -4px rgba(0,0,0,.4)}
.glyph path,.glyph circle,.glyph ellipse{stroke-dasharray:1;stroke-dashoffset:1;animation:ink 1.1s var(--ease) .15s forwards}
@keyframes ink{to{stroke-dashoffset:0}}
.cls{font-family:var(--round);font-size:12.5px;font-weight:740;color:var(--accent);text-transform:lowercase}
h1{margin:0;font-family:var(--display);font-size:23px;font-weight:780;letter-spacing:-.042em;
  line-height:1.08;text-transform:lowercase;text-wrap:balance}
.chip{font-family:var(--round);font-size:12.5px;font-weight:700;padding:5px 11px;border-radius:999px;
  background:color-mix(in srgb,var(--accent) 22%,transparent);color:var(--accent);
  white-space:nowrap;margin-left:auto;flex:none;text-transform:lowercase}

/* segmented control */
.seg{position:relative;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:2px;
  background:var(--fill);border-radius:11px;padding:2px;margin-bottom:14px;
  box-shadow:inset 0 .5px 0 0 var(--gloss)}
.seg button{position:relative;z-index:1;padding:7px 4px;border-radius:9px;font-family:var(--round);
  font-size:13.5px;font-weight:640;color:var(--ink2);text-transform:lowercase;
  transition:color .25s var(--ease)}
.seg button[aria-selected="true"]{color:var(--ink)}
.seg .ind{position:absolute;z-index:0;top:2px;bottom:2px;border-radius:9px;background:var(--glass-hi);
  box-shadow:inset 0 .5px 0 0 var(--gloss),0 2px 6px -2px rgba(0,0,0,.28);
  transition:transform .42s var(--spring),width .42s var(--spring)}

main{padding-top:20px}
.sh{font-family:var(--round);font-size:13.5px;font-weight:680;color:var(--ink3);
  margin:30px 4px 10px;text-transform:lowercase}
.sh:first-child{margin-top:0}
.note{margin:0 4px 14px;font-size:14px;line-height:1.5;color:var(--ink2);text-transform:lowercase}

/* outline */
.card{border-radius:18px;overflow:hidden;margin-bottom:10px}
.chead{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:14px 16px;
  position:relative;z-index:1;transition:transform .34s var(--spring)}
.chead:active{transform:scale(.99)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--accent);flex:none;
  box-shadow:0 0 10px color-mix(in srgb,var(--accent) 70%,transparent)}
.dot.m{background:var(--mint);box-shadow:0 0 10px color-mix(in srgb,var(--mint) 70%,transparent)}
.ct{flex:1;font-size:16.5px;font-weight:580;letter-spacing:-.018em;text-transform:lowercase}
.tw{color:var(--ink3);transition:transform .34s var(--spring)}
.chead[aria-expanded="true"] .tw{transform:rotate(90deg)}
.cbody{display:grid;grid-template-rows:0fr;transition:grid-template-rows .44s var(--spring)}
.cbody.on{grid-template-rows:1fr}
.cbody > div{overflow:hidden}
.cbody p{margin:0 0 10px;padding:0 16px;font-size:15.5px;line-height:1.5;color:var(--ink2);
  text-transform:lowercase}
.cbody p.lead{color:var(--ink);font-weight:520}
.cbody p:last-child{padding-bottom:16px}
.terms{display:flex;flex-wrap:wrap;gap:6px;padding:2px 16px 16px}
.term{font-family:var(--round);font-size:12.5px;font-weight:640;padding:5px 10px;border-radius:9px;
  background:var(--fill2);color:var(--ink2);box-shadow:inset 0 .5px 0 0 var(--gloss);
  text-transform:lowercase}

/* nested rows inside a module card */
.rows{padding:0 10px 10px}
.row{border-radius:12px;background:var(--fill2);box-shadow:inset 0 .5px 0 0 var(--gloss);margin-bottom:6px;overflow:hidden}
.rq{display:flex;align-items:flex-start;gap:9px;width:100%;text-align:left;padding:11px 12px;
  font-size:15px;font-weight:560;letter-spacing:-.016em;line-height:1.35;text-transform:lowercase}
.rq .tw{margin-top:3px;flex:none}
.rq .lt{font-family:var(--round);font-size:11.5px;font-weight:740;color:var(--accent);flex:none;
  padding-top:2px;min-width:38px;font-variant-numeric:tabular-nums}
.ra{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s var(--spring)}
.ra.on{grid-template-rows:1fr}
.ra > div{overflow:hidden}
.ra p{margin:0;padding:0 12px 10px 12px;font-size:14.5px;line-height:1.5;color:var(--ink2);text-transform:lowercase}
.ra p:first-child{padding-top:2px}
.ra p b{color:var(--ink);font-weight:600}

/* practice */
.score{display:flex;align-items:center;gap:12px;font-family:var(--round);font-size:13.5px;font-weight:660;
  color:var(--ink2);margin:0 4px 14px;text-transform:lowercase;font-variant-numeric:tabular-nums}
.score b{color:var(--ink);font-weight:740}
.score button{margin-left:auto;color:var(--blue);padding:6px 10px;border-radius:9px}
.qcard{border-radius:18px;padding:18px 16px;margin-bottom:12px}
.qn{font-family:var(--round);font-size:12px;font-weight:740;color:var(--ink3);text-transform:lowercase;
  display:flex;gap:8px;align-items:center}
.tag{font-family:var(--round);font-size:11px;font-weight:740;padding:3px 8px;border-radius:999px;
  background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent);text-transform:lowercase}
.tag.m{background:color-mix(in srgb,var(--mint) 18%,transparent);color:var(--mint)}
.qt{margin:8px 0 14px;font-size:17px;font-weight:560;line-height:1.35;letter-spacing:-.02em;
  text-transform:lowercase}
.qt .pass{display:block;margin-bottom:8px;font-size:15px;font-weight:460;color:var(--ink2)}
.opt{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:12px 13px;
  border-radius:12px;background:var(--fill2);margin-bottom:7px;font-size:15.5px;
  box-shadow:inset 0 .5px 0 0 var(--gloss);text-transform:lowercase;
  transition:background .2s var(--ease),transform .3s var(--spring)}
.opt:active{transform:scale(.988)}
.opt .k{font-family:var(--round);font-weight:740;font-size:13px;color:var(--ink3);flex:none;
  width:20px;text-transform:uppercase}
.opt.right{background:color-mix(in srgb,var(--good) 20%,transparent);color:var(--good)}
.opt.wrong{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.opt.right .k,.opt.wrong .k{color:inherit}
.why{margin:10px 2px 0;font-size:13.5px;line-height:1.5;color:var(--ink3);text-transform:lowercase}

/* compare tables */
.tcard{border-radius:18px;padding:14px 4px 6px;margin-bottom:12px}
.tt{font-family:var(--round);font-size:13px;font-weight:720;color:var(--accent);padding:0 12px 8px;text-transform:lowercase}
.tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;padding:0 6px 8px}
table{border-collapse:collapse;width:100%;min-width:100%;font-size:14px;line-height:1.4;text-transform:lowercase}
th,td{text-align:left;vertical-align:top;padding:8px 8px}
th{font-family:var(--round);font-size:12px;font-weight:720;color:var(--ink3);border-bottom:.5px solid var(--sep)}
td{color:var(--ink2);border-bottom:.5px solid var(--sep)}
td:first-child{color:var(--ink);font-weight:580;white-space:nowrap}
tr:last-child td{border-bottom:0}
.tnote{padding:4px 12px 8px;font-size:13.5px;line-height:1.5;color:var(--ink3);text-transform:lowercase}
.traps{padding:6px 12px 10px}
.trap{display:flex;gap:10px;padding:9px 0;border-bottom:.5px solid var(--sep);font-size:14.5px;line-height:1.45;color:var(--ink2);text-transform:lowercase}
.trap:last-child{border-bottom:0}
.trap .x{font-family:var(--round);font-weight:800;color:var(--accent);flex:none}
.trap b{color:var(--ink);font-weight:600}

/* flashcards */
.filt{display:flex;flex-wrap:wrap;gap:6px;margin:0 2px 14px}
.filt button{font-family:var(--round);font-size:12.5px;font-weight:660;padding:6px 11px;border-radius:999px;
  background:var(--fill2);color:var(--ink2);box-shadow:inset 0 .5px 0 0 var(--gloss);text-transform:lowercase;
  transition:background .2s var(--ease),color .2s var(--ease)}
.filt button[aria-pressed="true"]{background:color-mix(in srgb,var(--accent) 22%,transparent);color:var(--accent)}
.deck{perspective:1400px;margin-bottom:14px}
.fc{position:relative;width:100%;min-height:230px;transform-style:preserve-3d;
  transition:transform .62s var(--spring);cursor:pointer}
.fc.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  border-radius:20px;display:grid;place-items:center;padding:26px;text-align:center}
.face.back{transform:rotateY(180deg)}
.face .fw{font-family:var(--display);font-size:24px;font-weight:760;letter-spacing:-.036em;
  line-height:1.15;text-transform:lowercase;position:relative;z-index:1;text-wrap:balance}
.face.back .fw{font-family:var(--text);font-size:16px;font-weight:480;letter-spacing:-.014em;
  line-height:1.45;color:var(--ink2)}
.face .fm{position:absolute;top:14px;left:16px;font-family:var(--round);font-size:11.5px;font-weight:720;color:var(--ink3);text-transform:lowercase;z-index:1}
.fbar{display:flex;align-items:center;gap:12px}
.fbar button{font-family:var(--round);font-size:14px;font-weight:660;color:var(--blue);
  padding:8px 12px;border-radius:10px;text-transform:lowercase}
.fcount{margin-left:auto;font-family:var(--round);font-size:13px;color:var(--ink3);
  font-variant-numeric:tabular-nums}

.rise{opacity:0;transform:translateY(18px) scale(.98);filter:blur(8px);
  animation:rise .9s var(--spring) forwards;animation-delay:calc(var(--i,0)*55ms)}
@keyframes rise{to{opacity:1;transform:none;filter:blur(0)}}

footer{text-align:center;font-size:12.5px;line-height:1.6;color:var(--ink3);padding:42px 8px 6px;
  text-transform:lowercase}
.key{max-width:560px;margin:0 auto 14px;text-align:left;font-size:12.5px;line-height:1.6;color:var(--ink3)}
.key b{color:var(--ink2);font-weight:640}

@media (prefers-reduced-motion:reduce){
  #amb{animation:none}
  #amb i{animation:none}
  .glyph path,.glyph circle,.glyph ellipse{animation:none;stroke-dashoffset:0}
  .rise{opacity:1;transform:none;filter:none;animation:none}
  *,*::before,*::after{transition-duration:.01ms !important;animation-duration:.01ms !important}
}
</style>

<div id="amb" aria-hidden="true"><i></i><i></i><i></i><i></i></div>

<header id="hdr"><div class="wrap">
  <div class="hrow">
    <span id="gly" class="glyph" aria-hidden="true"></span>
    <div>
      <div class="cls" id="cls"></div>
      <h1 id="ttl"></h1>
    </div>
    <span class="chip" id="due"></span>
  </div>
  <div class="seg" id="seg" role="tablist"><span class="ind"></span></div>
</div></header>

<main class="wrap">
  <section id="p-outline"></section>
  <section id="p-compare" class="hidden"></section>
  <section id="p-practice" class="hidden"></section>
  <section id="p-cards" class="hidden"></section>
  <footer>
    <div class="key" id="key"></div>
    study guide written by a student. not affiliated with the school. built from the unit 0 study guide, the slides, both quizzes and the textbook practice items.
  </footer>
</main>

<script>
/* ═══ everything you edit lives in this block ════════════════════════ */
const GUIDE = {
  cls:   "AP Psychology",
  glyph: "head",
  title: "Unit 0 study guide",
  due:   "test thu 9/3",

  outline:[
  { t:"test day", open:true, mint:true,
    p:["25 multiple choice, 2 points each, 50 points, on GradeCam. Three versions.",
       "30 minutes of partner review first, then 50 minutes: mark the paper, transfer to GradeCam, check they match before submitting. Idle after finishing costs 10 points.",
       "Both medium-level quizzes and the textbook AP practice items are the question pool. The five read aloud in class open the practice tab."] },

  { t:"the five read aloud in class", mint:true,
    items:[
      { n:"1", q:"best illustrates a skeptical attitude?",
        a:["<b>demanding empirical evidence and a clear operational definition before testing a claim.</b> accepting without review = gullible; assuming your prediction = overconfidence; 'knew it all along' = hindsight bias."] },
      { n:"2", q:"caffeine pill vs. identical sugar pill, 20 words to recall. the sugar pill is the ___.",
        a:["<b>placebo.</b> caffeine = independent variable, words recalled = dependent variable."] },
      { n:"6", q:"why is an operational definition necessary?",
        a:["<b>it allows others to replicate the study.</b>"] },
      { n:"7", q:"research approach that involves asking 'why?'",
        a:["<b>scientific</b> is the expected key (the class version of this answer set was keyed scientific; the class notes' method starts with 'ask a question: why does this happen?'). 'qualitative' is the textbook answer to a 'why' question. ask in the review window."] },
      { n:"", q:"the scientific attitude = which three elements?",
        a:["<b>curiosity, skepticism, humility.</b>"] }
    ] },

  { t:"0.1 scientific attitude and critical thinking",
    items:[
      { n:"0.1-1", q:"how is psychology a science?",
        a:["<b>psychology</b> = the science of behavior (observable) and mental processes (thoughts, feelings). a science because it tests claims against data. goals: describe, explain, predict, control."] },
      { n:"0.1-2", q:"the three elements of the scientific attitude",
        a:["<b>curiosity:</b> does it work? <b>skepticism:</b> how do you know? <b>humility:</b> i might be wrong; follow the data. skeptical but not cynical, open-minded but not gullible."] },
      { n:"0.1-3", q:"critical thinking",
        a:["<b>critical thinking</b> = does not blindly accept arguments; examines assumptions, appraises the source, discerns hidden biases, evaluates evidence, assesses conclusions.",
           "ask: how do they know? what's the agenda? anecdote or evidence? does it justify cause and effect? other explanations?"] }
    ],
    terms:["critical thinking","curiosity","skepticism","humility","behavior","mental processes"] },

  { t:"0.2 the need for psychological science",
    items:[
      { n:"0.2-1", q:"why science beats common sense: three biases",
        a:["<b>hindsight bias:</b> 'i knew it all along' after the outcome (the election you 'could have guessed').",
           "<b>overconfidence:</b> more confident than correct. seeing the anagram's answer makes it look easy; experts 80% sure were right under 40% of the time.",
           "<b>perceiving order in random events:</b> streaks feel meaningful. four c's in a row change nothing; random sequences don't look random.",
           "repetition makes a claim feel true. science checks with evidence."] }
    ],
    terms:["hindsight bias","overconfidence","perceiving order in random events"] },

  { t:"0.3 the scientific method",
    items:[
      { n:"0.3-1", q:"theories, hypotheses, operational definitions, replication",
        a:["<b>scientific method:</b> self-correcting; observe, question, hypothesize, test, analyze, conclude, report.",
           "<b>theory:</b> broad explanation that organizes observations and predicts. <b>hypothesis:</b> testable prediction from a theory. <b>falsifiable:</b> can be proven false.",
           "<b>operational definition:</b> exact, measurable procedures (learning = score on the 20-item test) so others can <b>replicate</b>. replication is confirmation.",
           "<b>peer reviewers</b> judge theory, originality and accuracy before publication."] },
      { n:"0.3-2", q:"case study, naturalistic observation, survey, sampling",
        a:["non-experimental methods describe and manipulate nothing.",
           "<b>case study:</b> one person or group in depth (phineas gage); an atypical case misleads.",
           "<b>naturalistic observation:</b> record natural behavior; describes, doesn't explain. <b>hawthorne effect</b> (watched people act differently), <b>observer bias</b> (seeing what you expect).",
           "<b>survey:</b> many people, self-report. <b>social desirability bias</b> (answer to look good), <b>self-report bias</b> (misremember), <b>wording effects</b> ('welfare' vs 'aid to those in need').",
           "<b>population</b> = whole group. <b>random sample</b> = everyone has an equal chance. <b>sampling bias</b> = unrepresentative sample (polling your friends). a representative 100 beats an unrepresentative 500."] }
    ],
    terms:["scientific method","theory","hypothesis","falsifiable","operational definition","replication","peer reviewers","case study","naturalistic observation","survey","hawthorne effect","observer bias","social desirability bias","self-report bias","wording effects","sampling bias","population","random sample"] },

  { t:"0.4 correlation and experimentation",
    items:[
      { n:"0.4-1", q:"correlation, r, scatterplots, positive vs. negative",
        a:["<b>correlation:</b> two variables vary together, so one predicts the other. <b>r</b> runs -1.00 to +1.00: sign = direction, size = strength (-.80 beats +.40).",
           "<b>scatterplot:</b> slope = direction, scatter = strength (tight = strong).",
           "<b>positive:</b> same direction, both up or both down. <b>negative:</b> opposite directions. <b>zero:</b> no relation.",
           "correlation predicts, never proves cause: direction problem, third-variable problem."] },
      { n:"0.4-2", q:"illusory correlation, regression toward the mean",
        a:["<b>illusory correlation:</b> seeing a relationship that isn't there (lucky token, joint pain 'predicting' rain).",
           "<b>regression toward the mean:</b> extreme scores drift back toward average on retest."] },
      { n:"0.4-3", q:"what makes an experiment show cause and effect",
        a:["<b>experiment:</b> manipulate the <b>independent variable</b> (what the researcher changes), measure the <b>dependent variable</b> (the outcome), hold everything else constant. the only method that shows cause and effect.",
           "<b>experimental group</b> gets the treatment; <b>control group</b> doesn't and is the comparison. <b>random assignment</b> = groups by chance; it minimizes <b>confounding variables</b> (third factors).",
           "<b>placebo:</b> inert treatment. <b>placebo effect:</b> results from expectation alone. <b>single-blind:</b> participants don't know (blocks social desirability). <b>double-blind:</b> staff don't either (blocks <b>experimenter bias</b>).",
           "<b>validity:</b> measures what it claims. repeat 2 or more times to prove causation."] }
    ],

  { t:"0.5 research design and ethics",

      { n:"0.5-1", q:"choosing a design",

      { n:"0.5-2", q:"why simplified lab conditions help",
        a:["the lab re-creates psychological forces under controlled conditions to test general principles. it is not meant to copy everyday life."] },
      { n:"0.5-3", q:"animals and the ethics rules",

/* ═══ below here is the machinery ═══════════════════════════════════ */

const $=s=>document.querySelector(s);
const el=(t,c)=>{const n=document.createElement(t);if(c)n.className=c;return n};
const REDUCED=matchMedia("(prefers-reduced-motion:reduce)").matches;
const TW='<svg class="tw" width="8" height="14" viewBox="0 0 8 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 1l6 6-6 6"/></svg>';

const G={
 head:'<path d="M18.4 20.4v-2.6h1.9c.7 0 1.1-.7.8-1.3l-1.6-3a7.2 7.2 0 1 0-6.8 4.2"/><path d="M9.2 21v-3.3"/>'
};

$("#cls").textContent=GUIDE.cls;
$("#ttl").textContent=GUIDE.title;
$("#due").textContent=GUIDE.due;
document.title=GUIDE.title.toLowerCase();
$("#gly").innerHTML='<svg viewBox="0 0 26 26" width="40" height="40" aria-hidden="true">'+
  '<g transform="scale(0.85) translate(2.3,2.3)" fill="none" stroke="#fff" stroke-width="1.7" '+
  'stroke-linecap="round" stroke-linejoin="round" opacity=".97" pathLength="1">'+
  (G[GUIDE.glyph]||G.head).replace(/<(path|circle|ellipse)/g,'<$1 pathLength="1"')+'</g></svg>';

/* outline */
GUIDE.outline.forEach((s,i)=>{
  const card=el("div","card g");
  card.innerHTML='<span class="spec" aria-hidden="true"></span>'+
    '<button class="chead" aria-expanded="false"><span class="dot'+(s.mint?' m':'')+'"></span>'+
    '<span class="ct"></span>'+TW+'</button>'+
    '<div class="cbody"><div class="cin"></div></div>';
  card.querySelector(".ct").textContent=s.t;
  const cin=card.querySelector(".cin");
  if(s.p){ s.p.forEach((t,j)=>{const p=el("p"); if(j===0&&s.open)p.className="lead"; p.innerHTML=t; cin.appendChild(p)}); }
  if(s.items){
    const rows=el("div","rows");
    s.items.forEach(it=>{
      const r=el("div","row");
      const b=el("button","rq"); b.setAttribute("aria-expanded","false");
      b.innerHTML=(it.n?'<span class="lt"></span>':'')+'<span class="rtext"></span>'+TW;
      if(it.n)b.querySelector(".lt").textContent=it.n;
      b.querySelector(".rtext").textContent=it.q;
      const ra=el("div","ra"); const inner=el("div");
      it.a.forEach(t=>{const p=el("p"); p.innerHTML=t; inner.appendChild(p)});
      ra.appendChild(inner);
      b.onclick=()=>{const o=b.getAttribute("aria-expanded")==="true"; b.setAttribute("aria-expanded",String(!o)); ra.classList.toggle("on",!o)};
      r.append(b,ra); rows.appendChild(r);
    });
    cin.appendChild(rows);
  }
  if(s.terms){const box=el("div","terms"); s.terms.forEach(t=>{const c=el("span","term");c.textContent=t;box.appendChild(c)}); cin.appendChild(box)}
  const head=card.querySelector(".chead"), body=card.querySelector(".cbody");
  head.onclick=()=>{const o=head.getAttribute("aria-expanded")==="true";
    head.setAttribute("aria-expanded",String(!o));body.classList.toggle("on",!o)};
  if(s.open){head.setAttribute("aria-expanded","true");body.classList.add("on")}
  if(!REDUCED){card.classList.add("rise");card.style.setProperty("--i",i)}
  $("#p-outline").appendChild(card);
});

/* compare */
(function(){
  const host=$("#p-compare");
  GUIDE.compare.forEach((tb,i)=>{
    const card=el("div","tcard g");
    card.innerHTML='<span class="spec" aria-hidden="true"></span><div class="tt"></div><div class="tscroll"><table><thead><tr></tr></thead><tbody></tbody></table></div>';
    card.querySelector(".tt").textContent=tb.t;
    const hr=card.querySelector("thead tr"); tb.cols.forEach(c=>{const th=el("th");th.textContent=c;hr.appendChild(th)});
    const tbd=card.querySelector("tbody");
    tb.rows.forEach(r=>{const tr=el("tr"); r.forEach(c=>{const td=el("td");td.textContent=c;tr.appendChild(td)}); tbd.appendChild(tr)});
    if(tb.note){const n=el("div","tnote");n.textContent=tb.note;card.appendChild(n)}
    if(!REDUCED){card.classList.add("rise");card.style.setProperty("--i",i)}
    host.appendChild(card);
  });
  const sh=el("div","sh"); sh.textContent="traps the questions are built on"; host.appendChild(sh);
  const tc=el("div","tcard g"); tc.innerHTML='<span class="spec" aria-hidden="true"></span><div class="traps"></div>';
  const tl=tc.querySelector(".traps");
  GUIDE.traps.forEach(t=>{const d=el("div","trap"); d.innerHTML='<span class="x">!</span><span></span>'; d.lastChild.innerHTML=t; tl.appendChild(d)});
  if(!REDUCED){tc.classList.add("rise");tc.style.setProperty("--i",GUIDE.compare.length)}
  host.appendChild(tc);
})();

/* practice */
(function(){
  const host=$("#p-practice");
  let done=0, right=0;
  const bar=el("div","score");
  bar.innerHTML='<span><b id="sr">0</b> right of <b id="sd">0</b> answered · '+GUIDE.practice.length+' questions</span><button id="reset">reset</button>';
  host.appendChild(bar);
  const cards=[];
  const upd=()=>{$("#sr").textContent=right;$("#sd").textContent=done};
  GUIDE.practice.forEach((q,i)=>{
    const card=el("div","qcard g");
    card.innerHTML='<span class="spec" aria-hidden="true"></span>'+
      '<div class="qn">question '+(i+1)+(q.tag?' <span class="tag'+(q.tag==='read aloud'?' m':'')+'"></span>':'')+'</div><div class="qt"></div>';
    if(q.tag)card.querySelector(".tag").textContent=q.tag;
    const qt=card.querySelector(".qt");
    if(q.pass){const ps=el("span","pass");ps.textContent=q.pass;qt.appendChild(ps)}
    qt.appendChild(document.createTextNode(q.q));
    q.opts.forEach((o,j)=>{
      const b=el("button","opt");
      b.innerHTML='<span class="k">'+"abcde"[j]+'</span><span></span>';
      b.lastChild.textContent=o;
      b.onclick=()=>{
        if(card.dataset.done)return;
        card.dataset.done="1"; done++; if(j===q.a)right++; upd();
        card.querySelectorAll(".opt").forEach((x,k)=>{
          if(k===q.a)x.classList.add("right");
          else if(k===j)x.classList.add("wrong");
        });
        const w=el("p","why"); w.textContent=q.why; card.appendChild(w);
      };
      card.appendChild(b);
    });
    if(!REDUCED){card.classList.add("rise");card.style.setProperty("--i",Math.min(i,12))}
    host.appendChild(card); cards.push(card);
  });
  $("#reset").onclick=()=>{
    done=0;right=0;upd();
    cards.forEach(c=>{delete c.dataset.done;c.querySelectorAll(".opt").forEach(x=>x.classList.remove("right","wrong"));c.querySelector(".why")?.remove()});
    host.scrollIntoView({behavior:REDUCED?"auto":"smooth",block:"start"});
  };
})();

/* flashcards */
(function(){
  const mods=["all",...new Set(GUIDE.cards.map(c=>c.m))];
  let filt="all", pool=GUIDE.cards.slice(), n=0;
  const host=$("#p-cards");
  const fr=el("div","filt");
  mods.forEach(m=>{const b=el("button");b.textContent=m;b.setAttribute("aria-pressed",String(m==="all"));
    b.onclick=()=>{filt=m;pool=m==="all"?GUIDE.cards.slice():GUIDE.cards.filter(c=>c.m===m);n=0;
      fr.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));draw()};
    fr.appendChild(b)});
  const deck=el("div","deck"), fc=el("div","fc g");
  fc.innerHTML='<span class="spec" aria-hidden="true"></span>'+
    '<div class="face front"><span class="fm"></span><div class="fw"></div></div>'+
    '<div class="face back g"><span class="fm">tap to flip back</span><div class="fw"></div></div>';
  deck.appendChild(fc);
  const bar=el("div","fbar");
  bar.innerHTML='<button id="prev">back</button><button id="next">next</button><button id="shuf">shuffle</button><span class="fcount"></span>';
  const draw=()=>{
    fc.classList.remove("flip");
    const c=pool[n];
    fc.querySelector(".front .fm").textContent=c.m;
    fc.querySelector(".front .fw").textContent=c.f;
    fc.querySelector(".back .fw").textContent=c.b;
    bar.querySelector(".fcount").textContent=(n+1)+" of "+pool.length;
  };
  fc.onclick=()=>fc.classList.toggle("flip");
  bar.querySelector("#prev").onclick=()=>{n=(n-1+pool.length)%pool.length;draw()};
  bar.querySelector("#next").onclick=()=>{n=(n+1)%pool.length;draw()};
  bar.querySelector("#shuf").onclick=()=>{for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}n=0;draw()};
  addEventListener("keydown",e=>{
    if(host.classList.contains("hidden"))return;
    if(e.key==="ArrowRight")bar.querySelector("#next").click();
    if(e.key==="ArrowLeft")bar.querySelector("#prev").click();
    if(e.key===" "){e.preventDefault();fc.click()}
  });
  let sx=0; fc.addEventListener("touchstart",e=>{sx=e.touches[0].clientX},{passive:true});
  fc.addEventListener("touchend",e=>{const dx=e.changedTouches[0].clientX-sx; if(Math.abs(dx)>48)(dx<0?bar.querySelector("#next"):bar.querySelector("#prev")).click()},{passive:true});
  host.append(fr,deck,bar); draw();
})();

/* abbreviation key */
$("#key").innerHTML='<b>key:</b> '+GUIDE.key.map(([k,v])=>'<b>'+k+'</b> '+v).join(' · ');

/* segmented control */
(function(){
  const tabs=[["outline","outline"],["compare","compare"],["practice","practice"],["cards","flashcards"]];
  const seg=$("#seg"), ind=seg.querySelector(".ind");
  tabs.forEach(([id,label],i)=>{
    const b=el("button"); b.textContent=label; b.setAttribute("role","tab");
    b.setAttribute("aria-selected",String(i===0));
    b.onclick=()=>select(i);
    seg.appendChild(b);
  });
  function select(i){
    const btns=[...seg.querySelectorAll("button")];
    btns.forEach((b,j)=>b.setAttribute("aria-selected",String(i===j)));
    tabs.forEach(([id],j)=>$("#p-"+id).classList.toggle("hidden",i!==j));
    move();
  }
  function move(){
    const btns=[...seg.querySelectorAll("button")];
    const i=btns.findIndex(b=>b.getAttribute("aria-selected")==="true");
    const b=btns[i]; if(!b)return;
    ind.style.width=b.offsetWidth+"px";
    ind.style.transform="translateX("+(b.offsetLeft-2)+"px)";
  }
  addEventListener("resize",move); requestAnimationFrame(move);
})();

/* header state + pointer specular */
(function(){
  const hdr=$("#hdr"); let raf=0;
  addEventListener("scroll",()=>{ if(raf)return;
    raf=requestAnimationFrame(()=>{raf=0;hdr.classList.toggle("stuck",scrollY>6)}) },{passive:true});
  if(matchMedia("(hover:hover)").matches && !REDUCED){
    addEventListener("pointermove",e=>{
      const c=e.target.closest && e.target.closest(".g"); if(!c)return;
      const r=c.getBoundingClientRect();
      c.style.setProperty("--mx",(e.clientX-r.left)+"px");
      c.style.setProperty("--my",(e.clientY-r.top)+"px");
    },{passive:true});
  }
})();
</script>
