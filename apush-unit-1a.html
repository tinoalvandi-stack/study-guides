<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>study guide · valentino guides</title>
<meta name="description" content="A free study guide from valentinoguides.com. Made by a student.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#F1F5F9">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0C1220">
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg?v=3" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3">
<link rel="preload" href="/fonts/figtree.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* ═══ valentino guides · guide template v3, design revision 3 (blue and navy, calm reading flow, sept 30 2026) ═══
   Same tokens, type and corners as the homepage (site.css). Edit the GUIDE object below the machinery; leave the CSS alone. */
@font-face{font-family:"Figtree";font-style:normal;font-weight:300 900;font-display:swap;src:url(/fonts/figtree.woff2) format("woff2")}
@font-face{font-family:"Figtree";font-style:italic;font-weight:300 900;font-display:swap;src:url(/fonts/figtree-italic.woff2) format("woff2")}

:root{--paper:#F1F5F9;--surface:#FCFDFF;--body:#2F3B54;--surface2:#EEF3F8;--tint:#E3ECF6;--line:#D8E1EB;--line2:#B4C2D2;--ink:#0E1B3D;--ink2:#3A4862;--ink3:#56637D;--accent:#274B7E;--on-accent:#FFFFFF;--hi:#8A5300;--amber:#D99A2B;--amber-bg:#FCF6E8;--good:#2D7048;--bad:#A8392F;--c-apush:#9A4A33;--c-psych:#5C5689;--c-phys:#2E6378;--c-pre:#1F5A55;--c-sem:#46604F;--c-biz:#7E5A22;--c-mor:#7A4A5E;--c-lang:#4A5874;--c-span:#8E3F3A;--c-apwh:#5F4A78;--c-csp:#4E5A63;--sh1:0 1px 2px #0e1b3d0a,0 4px 14px #0e1b3d0b;--sh2:0 2px 4px #0e1b3d0d,0 14px 32px #0e1b3d17}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#0C1220;--surface:#131B2C;--body:#D3DBE8;--surface2:#182235;--tint:#1C2A44;--line:#263249;--line2:#3D4C67;--ink:#E8EDF6;--ink2:#B8C3D6;--ink3:#98A5BC;--accent:#8EB3EA;--on-accent:#0B1630;--hi:#F0C273;--amber:#E2AE4E;--amber-bg:#251F12;--good:#8ACB9C;--bad:#F19A90;--c-apush:#E9A07F;--c-psych:#BDB6EA;--c-phys:#8BC4D6;--c-pre:#8FD0BF;--c-sem:#A9C8B2;--c-biz:#E2C17A;--c-mor:#E6AEC3;--c-lang:#AEBBD8;--c-span:#E09490;--c-apwh:#BBA3D6;--c-csp:#A9B6BE;--sh1:0 1px 2px #0007,0 6px 18px #0005;--sh2:0 2px 4px #0007,0 14px 32px #0006}}
:root[data-theme="dark"]{--paper:#0C1220;--surface:#131B2C;--body:#D3DBE8;--surface2:#182235;--tint:#1C2A44;--line:#263249;--line2:#3D4C67;--ink:#E8EDF6;--ink2:#B8C3D6;--ink3:#98A5BC;--accent:#8EB3EA;--on-accent:#0B1630;--hi:#F0C273;--amber:#E2AE4E;--amber-bg:#251F12;--good:#8ACB9C;--bad:#F19A90;--c-apush:#E9A07F;--c-psych:#BDB6EA;--c-phys:#8BC4D6;--c-pre:#8FD0BF;--c-sem:#A9C8B2;--c-biz:#E2C17A;--c-mor:#E6AEC3;--c-lang:#AEBBD8;--c-span:#E09490;--c-apwh:#BBA3D6;--c-csp:#A9B6BE;--sh1:0 1px 2px #0007,0 6px 18px #0005;--sh2:0 2px 4px #0007,0 14px 32px #0006}

:root{
  --display:"Figtree",-apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",sans-serif;
  --sans:"Figtree",-apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",sans-serif;
  --w-d:780; --ls-d:-.03em;
  --t12:12px; --t13:13px; --t15:15px; --t16:16px; --t17:17px; --t20:20px; --t26:26px;
  --r-card:14px; --r-btn:10px; --r-chip:8px;
  --spring:cubic-bezier(.32,.72,0,1); --ease:cubic-bezier(.22,.61,.36,1);
  --cls:var(--accent);            /* set from GUIDE.id at runtime: the class color */
  --maxw:1180px; --gut:clamp(16px,3.4vw,36px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;scroll-padding-top:calc(var(--barh,58px) + 14px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:var(--t16);line-height:1.55;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;overflow-x:hidden;min-height:100vh;
  padding-bottom:calc(64px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:left}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
[hidden]{display:none !important}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 var(--gut)}
.vh{position:absolute !important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* reading aids */
.skipl{position:fixed;left:12px;top:-72px;z-index:200;padding:10px 15px;border-radius:var(--r-btn);background:var(--accent);color:var(--on-accent);font-weight:600;font-size:14px;transition:top .24s var(--spring)}
.skipl:focus{top:12px;outline:none}
#prog{position:fixed;top:0;left:0;right:0;height:2px;z-index:120;pointer-events:none}
#prog i{display:block;height:100%;width:0;background:var(--accent)}

/* ═══ bar: brand + theme; once the guide's own controls scroll away it carries sections / topics / search ═══ */
.bar{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--paper) 88%,transparent);-webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px);padding:max(9px,env(safe-area-inset-top)) 0 9px;transition:box-shadow .3s var(--ease)}
.bar.stuck{box-shadow:0 1px 0 0 var(--line)}
.bar .wrap{display:flex;align-items:center;gap:10px;min-height:38px}
.home{display:flex;align-items:center;gap:10px;min-width:0;margin-right:auto}
.mark{width:28px;height:28px;border-radius:7px;flex:none;display:block}
.bar h1{margin:0;font-size:18px;font-weight:760;letter-spacing:-.03em;white-space:nowrap}
.seg{position:relative;display:flex;border:1px solid var(--line);border-radius:10px;padding:2px;isolation:isolate;flex:none;background:var(--surface)}
.seg button{position:relative;z-index:2;padding:4px 10px;border-radius:8px;font-size:var(--t12);font-weight:600;color:var(--ink3);text-transform:lowercase;text-align:center;transition:color .2s var(--ease)}
.seg button[aria-pressed="true"]{color:var(--on-accent)}
.seg .thumb{position:absolute;z-index:1;top:2px;bottom:2px;left:2px;width:0;border-radius:8px;background:var(--accent);transition:left .36s var(--spring),width .36s var(--spring)}
.sbtn{flex:none;width:38px;height:34px;display:grid;place-items:center;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink2);transition:color .16s var(--ease)}
@media (hover:hover){.sbtn:hover{color:var(--ink)}}
.bctl{display:none;align-items:center;gap:2px;min-width:0}
.bar.compact .bctl{display:flex}
.bar.compact .seg,.bar.compact .sbtn{display:none}
.bctl .cur{max-width:150px;overflow:hidden;text-overflow:ellipsis}
.bnm{font-size:var(--t13);font-weight:600;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px;padding-right:10px;margin-right:4px;border-right:1px solid var(--line)}
.bctl .mbtn{border:0;background:none;box-shadow:none;height:34px;padding:0 10px}
@media (hover:hover){.bctl .mbtn:hover{background:var(--surface2)}}
@media (max-width:699px){.bnm{display:none}.bar.compact h1{display:none}}
@media (max-width:420px){.bar .wrap{gap:8px}.bar h1{font-size:17px}.seg button{padding:4px 7px}.bctl .mbtn{padding:0 8px}}
/* comfortable tap targets on phones and touch screens (44px): theme switch, and the search button beside it at the same height */
@media (max-width:719px),(pointer:coarse){.seg button{min-height:44px;min-width:44px;display:inline-flex;align-items:center;justify-content:center}.sbtn{width:44px;height:44px}}
/* narrow phones: the bigger targets need the room, so the wordmark text steps aside (kept for screen readers); the mark stays and still links home */
@media (max-width:389px){.bar h1{position:absolute;width:1px;height:1px;margin:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}}

/* ═══ header: compact title + meta line, small class cover ═══ */
main{padding-top:14px}
.ghead{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:24px;align-items:center}
h2.title{margin:0;font-family:var(--display);font-size:clamp(28px,4vw,42px);font-weight:var(--w-d);letter-spacing:-.035em;line-height:1.06;text-wrap:balance;color:var(--ink)}
.crow{display:flex;align-items:center;flex-wrap:wrap;gap:2px 0;margin-top:7px;font-size:var(--t15);color:var(--ink3);line-height:1.45}
.crow > *:not(:last-child)::after{content:"·";margin:0 8px;color:var(--ink3);font-weight:600}
.cname{display:inline-flex;align-items:center;gap:6px;font-weight:600;color:var(--ink2)}
.cname svg{width:18px;height:18px;flex:none;color:var(--cls)}
a.cname{border-radius:6px}
@media (hover:hover){a.cname:hover{color:var(--ink);text-decoration:underline;text-decoration-color:var(--line2);text-underline-offset:3px}}
.chip{min-width:0;font-variant-numeric:tabular-nums}
.chip.due,.chip.past{white-space:nowrap}
.chip.due{color:var(--hi);font-weight:650}
.chip.past{color:var(--ink3)}
.sub{margin:6px 0 0;font-size:var(--t15);line-height:1.5;color:var(--ink2);max-width:78ch}
.gcov{position:relative;width:clamp(84px,13vw,132px);aspect-ratio:1.42;border-radius:12px;overflow:hidden;box-shadow:var(--sh1);border:1px solid var(--line)}
.gcov svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.gcov svg text{font-family:var(--sans)}
.gcov:empty{display:none}
@media (max-width:519px){
  /* phone: title and a small cover share the first row; the meta line and sub use the full width below */
  .ghead{column-gap:12px;align-items:center}
  .ghead .gtxt{display:contents}
  #title{grid-column:1;grid-row:1}
  .gcov{grid-column:2;grid-row:1;width:64px;border-radius:10px}
  .crow,.sub{grid-column:1 / -1}
  .crow{margin-top:6px;font-size:var(--t13)}
  .sub{font-size:var(--t13);margin-top:4px}
  main{padding-top:8px}
  .focus{padding:12px 14px 12px 16px}
  .focus h3{font-size:17px;margin-bottom:6px}
  .tops{gap:4px}
  .tops .tp,.tops .tm{font-size:var(--t15);padding-left:32px;line-height:1.42}
  .tops .tp::before,.tops .tm::before{width:22px;height:22px;font-size:12px}
  .fqk{display:flex;width:fit-content;margin:8px 0 0 32px}
  .ol > .sec:first-of-type{margin-top:10px}
  .sec{padding-top:18px;margin-top:16px}
}

/* ═══ practice PDFs: the printable tests, above everything else ═══ */
.pdfs{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:16px 0 0;padding:12px;border-radius:var(--r-card);background:var(--tint);border:1px solid color-mix(in srgb,var(--accent) 16%,var(--line))}
.pdf{display:inline-flex;align-items:center;gap:8px;min-height:42px;padding:7px 14px 7px 11px;border-radius:var(--r-btn);background:var(--surface);border:1px solid color-mix(in srgb,var(--accent) 38%,var(--line));color:var(--accent);font-size:var(--t15);font-weight:650;line-height:1.25;box-shadow:var(--sh1);transition:border-color .16s var(--ease),transform .2s var(--spring)}
.pdf svg{flex:none}
@media (hover:hover){.pdf:hover{border-color:var(--accent)}}
.pdf:active{transform:scale(.985)}
.pgrp{display:flex;flex-wrap:wrap;align-items:center;gap:8px;flex-basis:100%}
.pgl{display:inline-flex;align-items:center;gap:7px;margin-right:2px;font-size:var(--t15);font-weight:700;color:var(--ink)}
.pgl svg{color:var(--accent)}
.pgrp .pdf{padding:7px 13px;min-width:44px;justify-content:center}
.pdfs .pn{flex:1 1 300px;margin:0 4px;font-size:var(--t13);line-height:1.45;color:var(--ink2)}
@media (max-width:599px){
  .pdfs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:10px;margin-top:12px}
  .pdfs .pn{margin:0 2px;font-size:var(--t12)}
  .pdf{font-size:var(--t13);padding:7px 10px 7px 9px;gap:7px;min-height:44px}
  .pdfs > .pdf:only-of-type{grid-column:1 / -1}
  .pgrp,.pdfs .pn{grid-column:1 / -1}
  .pgrp{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .pgl{grid-column:1 / -1;font-size:var(--t13)}
}

/* ═══ controls: the Sections row, then Topics, Search, Show answers and Print ═══ */
.gctl{display:grid;gap:10px;margin:16px 0 18px}
.secs{display:flex;align-items:center;gap:10px;min-width:0}
.secl{flex:none;font-size:var(--t12);font-weight:700;letter-spacing:.06em;color:var(--ink3);text-transform:uppercase}
.segs{position:relative;display:flex;gap:2px;min-width:0;max-width:100%;padding:3px;border-radius:12px;background:var(--surface2);border:1px solid var(--line);overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;scroll-padding:0 16px}
.segs::-webkit-scrollbar{display:none}
.sg{flex:none;display:inline-flex;align-items:center;gap:7px;min-height:38px;padding:0 14px;border-radius:9px;font-size:var(--t15);font-weight:600;color:var(--ink2);white-space:nowrap;transition:background .2s var(--ease),color .2s var(--ease),box-shadow .2s var(--ease)}
.sg .n{font-size:var(--t12);font-weight:700;color:var(--ink3);font-variant-numeric:tabular-nums}
.sg[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px #0e1b3d14,0 2px 8px #0e1b3d12;outline:1px solid var(--line)}
.sg[aria-selected="true"] .n{color:var(--accent)}
@media (hover:hover){.sg:not([aria-selected="true"]):hover{color:var(--ink);background:color-mix(in srgb,var(--surface) 55%,transparent)}}
.sg:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.util{display:flex;align-items:center;gap:10px;min-width:0}
.mbtn{flex:none;display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 14px;border-radius:var(--r-btn);border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:var(--t15);font-weight:600;white-space:nowrap;transition:border-color .16s var(--ease),background .16s var(--ease)}
.mbtn svg{flex:none;color:var(--ink3)}
.mbtn .cv{transition:transform .24s var(--spring)}
.mbtn[aria-expanded="true"] .cv{transform:rotate(180deg)}
.mbtn[aria-pressed="true"]{background:var(--tint);border-color:color-mix(in srgb,var(--accent) 45%,var(--line));color:var(--accent)}
.mbtn[aria-pressed="true"] svg{color:var(--accent)}
@media (hover:hover){.mbtn:hover{border-color:var(--line2)}}
.srch{position:relative;flex:1 1 auto;min-width:0;max-width:440px}
.srch > svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--ink3);pointer-events:none}
.srch input{display:block;width:100%;height:42px;padding:0 38px 0 38px;border-radius:var(--r-btn);border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:var(--t16);-webkit-appearance:none;appearance:none}
.srch input::placeholder{color:var(--ink3);opacity:1}
.srch input::-webkit-search-cancel-button,.srch input::-webkit-search-decoration{-webkit-appearance:none;appearance:none}
.srch input:focus{outline:none;border-color:var(--accent)}
.srch input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.srch .x{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:7px;display:none;place-items:center;color:var(--ink3)}
.srch.has .x{display:grid}
@media (hover:hover){.srch .x:hover{color:var(--ink);background:var(--surface2)}}
.util .acts{display:flex;gap:10px;margin-left:auto}
@media (max-width:719px){
  .gctl{gap:8px;margin:12px 0 14px}
  .secl{font-size:11px}
  .segs{margin-right:calc(-1 * var(--gut));border-radius:12px 0 0 12px;border-right:0;padding-right:var(--gut)}
  .segs.ovf{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 44px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 44px),transparent)}
  .segs.ovl{-webkit-mask-image:linear-gradient(90deg,transparent,#000 30px);mask-image:linear-gradient(90deg,transparent,#000 30px)}
  .segs.ovl.ovf{-webkit-mask-image:linear-gradient(90deg,transparent,#000 30px,#000 calc(100% - 44px),transparent);mask-image:linear-gradient(90deg,transparent,#000 30px,#000 calc(100% - 44px),transparent)}
  .sg{min-height:44px;padding:0 12px;font-size:var(--t15)}
  .util{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px}
  .util .srch{max-width:none}
  .util .acts{grid-column:1 / -1;margin:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .util .acts .mbtn{justify-content:center;height:40px;font-size:var(--t13)}
  .util .acts .mbtn[hidden] + .mbtn{grid-column:1 / -1}
}
@media (max-width:379px){.gctl .mbtn{padding:0 11px}}

/* menus (topics, sections): one panel each, opened from the controls or the bar */
.menu{position:fixed;z-index:90;width:min(360px,calc(100vw - 24px));max-height:min(70vh,560px);overflow:auto;overscroll-behavior:contain;padding:6px;border-radius:14px;background:var(--surface);border:1px solid var(--line2);box-shadow:var(--sh2);animation:pop .22s var(--spring)}
@keyframes pop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.menu .ml{padding:8px 10px 4px;font-size:var(--t12);font-weight:650;letter-spacing:.06em;color:var(--ink3);text-transform:uppercase}
.menu .mg + .mg{border-top:1px solid var(--line);margin-top:6px;padding-top:4px}
.mi{display:flex;align-items:flex-start;gap:10px;width:100%;padding:9px 10px;border-radius:9px;font-size:var(--t15);line-height:1.35;color:var(--ink);text-align:left}
.mi .mn{flex:none;min-width:22px;font-size:var(--t13);font-weight:650;color:var(--ink3);font-variant-numeric:tabular-nums;padding-top:1px}
.mi .mt{flex:1;min-width:0}
.mi .ms{display:block;font-size:var(--t12);color:var(--ink3);margin-top:1px}
.mi i{flex:none;width:8px;height:8px;margin-top:7px;border-radius:50%;border:1.5px solid var(--accent)}
.mi i.w3{background:var(--accent)} .mi i.w2{background:color-mix(in srgb,var(--accent) 35%,transparent)}
.mi[aria-current="true"]{background:var(--tint)}
.mi[aria-current="true"] .mn{color:var(--accent)}
@media (hover:hover){.mi:hover{background:var(--surface2)}.mi[aria-current="true"]:hover{background:var(--tint)}}
.mi .mck{flex:none;width:18px;height:18px;margin-top:1px;color:var(--accent);visibility:hidden}
.mi[aria-current="true"] .mck,.mi[aria-pressed="true"] .mck{visibility:visible}
.mi svg{flex:none}
.menu .pn{margin:2px 10px 6px;font-size:var(--t13);line-height:1.45;color:var(--ink2)}
.menu .mleg{display:flex;flex-wrap:wrap;gap:4px 14px;padding:8px 10px 6px;font-size:var(--t12);color:var(--ink3);border-top:1px solid var(--line);margin-top:6px}
.menu .mleg span{display:inline-flex;align-items:center;gap:6px}
.menu .mleg i{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--accent)}
.menu .mleg i.w3{background:var(--accent)} .menu .mleg i.w2{background:color-mix(in srgb,var(--accent) 35%,transparent)}

/* search status */
.sstat{display:none;align-items:center;flex-wrap:wrap;gap:6px 8px;margin:-6px 0 16px;font-size:var(--t13);color:var(--ink2)}
.sstat.on{display:flex}
.sstat > span{margin-right:2px}
.sstat q{color:var(--ink)}
.sstat button,.nores button{padding:5px 10px;border-radius:var(--r-chip);border:1px solid var(--line);background:var(--surface);font-size:var(--t12);font-weight:600;color:var(--ink2)}
.sstat button[aria-current="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.sstat b,.nores b{font-weight:650;font-variant-numeric:tabular-nums;margin-left:4px}
.nores{margin:0 0 16px;padding:16px 18px;border:1px dashed var(--line2);border-radius:var(--r-card);color:var(--ink2);font-size:var(--t15)}
.nores p{margin:0}
.nores div{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.sx{display:none !important}
mark.hit{background:color-mix(in srgb,var(--amber) 34%,transparent);color:inherit;border-radius:3px;padding:0 1px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.pane{display:none;container-type:inline-size}
.pane.on{display:block;animation:rise .38s var(--spring) both}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* small section label (panes) */
.sh{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;margin:26px 0 12px}
.sh:first-child{margin-top:0}
.sh h3{margin:0;font-size:var(--t20);font-weight:760;letter-spacing:-.02em;color:var(--ink);min-width:0}
.sh h3::first-letter{text-transform:uppercase}
.sh::after{content:"";flex:1;height:1px;background:var(--line);order:2;align-self:center}
.shx{order:3;min-width:0;font-size:var(--t13);color:var(--ink3);font-variant-numeric:tabular-nums}

/* ═══ guide: focus box, then every lesson open in reading order ═══ */
.ol{max-width:100%}
.focus{position:relative;margin:0 0 6px;padding:16px 20px 16px 22px;border-radius:var(--r-card);background:var(--surface);border:1px solid var(--line);box-shadow:var(--sh1);overflow:hidden}
.focus::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--amber)}
.focus h3{margin:0 0 8px;font-size:var(--t20);font-weight:760;letter-spacing:-.02em}
.tops{margin:0;padding:0;list-style:none;counter-reset:tp;display:grid;gap:6px}
.tops .tp,.tops .tm{counter-increment:tp;position:relative;padding:2px 0 2px 36px;font-size:var(--t16);line-height:1.45;max-width:96ch}
.tops .tm{color:var(--body)}
.tops .tp::before,.tops .tm::before{content:counter(tp);position:absolute;left:0;top:2px;width:24px;height:24px;border-radius:50%;background:var(--amber);color:#241600;font-weight:700;font-size:var(--t13);display:grid;place-items:center;font-variant-numeric:tabular-nums}
@media (min-width:520px){.fqk + .fqk{margin-left:18px}}
.fqk{display:inline-flex;align-items:center;gap:6px;margin:10px 0 0 36px;font-size:var(--t13);font-weight:650;color:var(--accent)}
@media (hover:hover){.fqk:hover{text-decoration:underline;text-underline-offset:3px}}
.toptbl{margin:14px 0 0}
.sec{position:relative;container-type:inline-size;border-top:1px solid var(--line);padding:28px 0 26px;margin-top:22px}
.ol > .sec:first-of-type{margin-top:18px}
.sec > header{margin:0 0 14px}
.eyb{display:flex;align-items:center;gap:6px;margin:0 0 4px;font-size:var(--t12);font-weight:650;letter-spacing:.08em;color:var(--ink3);text-transform:uppercase}
.eyb .num{font-variant-numeric:tabular-nums}
.eyb .w{font-weight:650}
.eyb .w3{color:var(--accent)} .eyb .w2{color:var(--ink2)}
.sec h3{margin:0;font-family:var(--display);font-size:clamp(24px,2.9vw,34px);font-weight:760;letter-spacing:-.03em;line-height:1.12;text-wrap:balance;color:var(--ink)}
.sec .sd{margin:5px 0 0;font-size:var(--t15);color:var(--ink2);line-height:1.45}
.sec h3:focus{outline:none}
.sb{display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
.sb .duo{display:grid;gap:18px}
@container (min-width:720px){
  .sb .duo{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:34px;align-items:start}
  .sb .duo.wide-side{grid-template-columns:minmax(0,1fr) minmax(0,1.05fr)}
  .sb .duo > .side{position:sticky;top:calc(var(--barh,58px) + 18px)}
}
.duo > .main,.duo > .side{container-type:inline-size;min-width:0}
.sb .main{display:grid;gap:14px;align-content:start}
.sb .main.solo{max-width:78ch}
.sb .main > *{margin:0}
.sb p{margin:0 0 12px;font-size:var(--t17);line-height:1.6;color:var(--body)}
.sb p:last-child{margin-bottom:0}
.sb .main > .ptx{display:block}
b.kw{font-weight:700;color:var(--ink)}
.nxt{display:flex;justify-content:flex-end;margin-top:16px}
.nxt a{display:inline-flex;align-items:center;gap:6px;padding:6px 4px;font-size:var(--t13);font-weight:600;color:var(--ink2)}
@media (hover:hover){.nxt a:hover{color:var(--accent)}}

/* bullets */
.pts{margin:0;padding:0;list-style:none}
.pts li{position:relative;padding:4px 0 4px 20px;font-size:var(--t16);line-height:1.55;color:var(--body)}
.pts li::before{content:"";position:absolute;left:3px;top:13px;width:7px;height:7px;border-radius:50%;background:var(--accent)}
.pts.two{columns:2 240px;column-gap:28px}
.pts.two li{break-inside:avoid}

/* label rows */
.rows{margin:0;display:grid;grid-template-columns:max-content 1fr;column-gap:16px}
.rows dt{padding:8px 0;font-size:var(--t13);font-weight:700;line-height:24px;color:var(--ink)}
.rows dd{margin:0;padding:8px 0;font-size:var(--t15);line-height:1.5;color:var(--body)}
.rows dt + dd{border-top:1px solid var(--line)} .rows dt{border-top:1px solid var(--line)}
.rows dt:first-of-type,.rows dd:first-of-type{border-top:0}
@container (max-width:420px){.rows{grid-template-columns:1fr}.rows dt{padding-bottom:0}.rows dd{border-top:0 !important;padding-top:2px}}

/* numbered steps */
.steps{margin:0;padding:0;list-style:none;counter-reset:s}
.steps li{position:relative;padding:8px 0 8px 36px;font-size:var(--t16);line-height:1.5;color:var(--body);counter-increment:s}
.steps li::before{content:counter(s);position:absolute;left:0;top:9px;width:24px;height:24px;border-radius:50%;background:var(--tint);color:var(--accent);font-size:var(--t12);font-weight:750;display:grid;place-items:center}
.steps li + li{border-top:1px solid var(--line)}

/* flow: cause -> effect chain */
.flow{display:flex;flex-wrap:wrap;align-items:stretch;gap:10px 0;margin:0;padding:0;list-style:none}
.flow li{position:relative;flex:1 1 0;min-width:120px;display:flex;align-items:center;padding:10px 13px;border-radius:var(--r-btn);background:var(--surface);border:1px solid var(--line);font-size:var(--t15);line-height:1.4;color:var(--ink);margin-right:30px}
.flow li:last-child{margin-right:0;border-color:color-mix(in srgb,var(--accent) 45%,var(--line));background:var(--tint)}
.flow li:not(:last-child)::after{content:"";position:absolute;right:-22px;top:50%;width:13px;height:12px;margin-top:-6px;background:var(--ink3);clip-path:polygon(0 15%,100% 50%,0 85%)}
@container (max-width:639px){
  .flow{flex-direction:column;gap:0}
  .flow li{margin:0 0 24px;min-width:0}
  .flow li:last-child{margin-bottom:0}
  .flow li:not(:last-child)::after{right:auto;left:50%;top:auto;bottom:-18px;margin:0 0 0 -6px;clip-path:polygon(15% 0,85% 0,50% 100%)}
}

/* tiles: parallel items as one readable list (two columns when there is room) */
.tlist{margin:0}
.tlist .tlh{margin:0 0 8px;font-size:var(--t13);font-weight:700;letter-spacing:.06em;color:var(--ink3);text-transform:uppercase}
.tlist ul{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:minmax(0,1fr);gap:12px 32px}
@container (min-width:620px){.tlist.two ul{grid-template-columns:repeat(2,minmax(0,1fr))}}
@container (min-width:900px){.tlist.n3 ul,.tlist.n6 ul{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tlist li{display:grid;grid-template-columns:38px minmax(0,1fr);gap:0 12px;align-items:start}
.tlist .ti{grid-row:span 2;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--tint);color:var(--accent)}
.tlist h5{margin:2px 0 0;font-size:var(--t16);font-weight:700;line-height:1.35;color:var(--ink)}
.tlist .tt{font-size:var(--t15);line-height:1.5;color:var(--body)}
.tlist .tk{display:inline-block;margin-left:6px;font-size:var(--t12);font-weight:600;color:var(--ink3)}

/* tree (org chart; indented list on narrow columns) */
.tree{overflow-x:auto}
.tree ul{position:relative;display:flex;justify-content:center;margin:0;padding:16px 0 0;list-style:none}
.tree > ul{padding-top:0}
.tree li{position:relative;flex:1 1 0;padding:16px 4px 0;text-align:center;min-width:0}
.tree li::before,.tree li::after{content:"";position:absolute;top:0;right:50%;width:50%;height:16px;border-top:1.5px solid var(--line2)}
.tree li::after{right:auto;left:50%;border-left:1.5px solid var(--line2)}
.tree li:only-child::before,.tree li:only-child::after{display:none}
.tree li:only-child{padding-top:0}
.tree li:first-child::before,.tree li:last-child::after{border:0}
.tree li:last-child::before{border-right:1.5px solid var(--line2);border-radius:0 6px 0 0}
.tree li:first-child::after{border-radius:6px 0 0 0}
.tree ul ul::before{content:"";position:absolute;top:0;left:50%;height:16px;border-left:1.5px solid var(--line2)}
.tree .nd{display:inline-block;max-width:100%;padding:7px 10px;border-radius:var(--r-btn);background:var(--surface);border:1px solid var(--line);font-size:var(--t13);line-height:1.35;vertical-align:top}
.tree .nd b{display:block;font-size:var(--t15);font-weight:700}
.tree .nd span{display:block;color:var(--ink2);margin-top:2px}
.tree > ul > li > .nd{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.tree > ul > li > .nd span{color:color-mix(in srgb,var(--on-accent) 85%,transparent)}
.tree > ul > li > ul > li > .nd{border-color:color-mix(in srgb,var(--accent) 45%,var(--line));background:var(--tint)}
@container (max-width:379px){
  .tree ul{display:block;padding:0 0 0 18px}
  .tree > ul{padding-left:0}
  .tree li{padding:6px 0 0 16px;text-align:left}
  .tree > ul > li{padding-left:0}
  .tree li::before{top:0;left:0;right:auto;width:12px;height:22px;border-top:0;border-left:1.5px solid var(--line2);border-bottom:1.5px solid var(--line2);border-radius:0 0 0 6px}
  .tree li::after{top:22px;left:0;right:auto;width:0;height:calc(100% - 22px);border:0;border-left:1.5px solid var(--line2);border-radius:0}
  .tree li:last-child::after{display:none}
  .tree li:first-child::before,.tree li:last-child::before{border-top:0;border-right:0;border-left:1.5px solid var(--line2);border-bottom:1.5px solid var(--line2);border-radius:0 0 0 6px}
  .tree li:first-child::after{border-radius:0}
  .tree > ul > li::before,.tree > ul > li::after{display:none}
  .tree ul ul::before{display:none}
  .tree li:only-child::before{display:block}
  .tree li:only-child{padding-top:6px}
  .tree > ul > li:only-child{padding:0}
  .tree > ul > li:only-child::before,.tree > ul > li:only-child::after{display:none}
}

/* figure (inline svg drawn per guide): sits beside its explanation, no box around it */
.fig{margin:0;padding:0}
.fig svg{display:block;width:100%;height:auto;max-height:440px;font-family:var(--sans);overflow:visible}
.fig figcaption{margin-top:10px;font-size:var(--t13);color:var(--ink3);line-height:1.45}
.fig .ln{fill:none;stroke:var(--ink2);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.fig .lc{fill:none;stroke:var(--cls);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.fig .la{fill:none;stroke:var(--accent);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.fig .lb{fill:none;stroke:var(--bad);stroke-width:2;stroke-linecap:round}
.fig .lg{fill:none;stroke:var(--good);stroke-width:2;stroke-linecap:round}
.fig .dash{stroke-dasharray:5 5}
.fig .fc{fill:var(--cls)} .fig .fa{fill:var(--accent)} .fig .fb{fill:var(--bad)} .fig .fg{fill:var(--good)} .fig .fi{fill:var(--ink)}
.fig .fs{fill:color-mix(in srgb,var(--cls) 18%,var(--surface))}
.fig .fsa{fill:color-mix(in srgb,var(--accent) 16%,var(--surface))}
.fig .fp{fill:var(--surface);stroke:var(--line2);stroke-width:1.2}
.fig .fn{fill:none}
.fig text{fill:var(--ink);font-size:14px}
.fig .tm{fill:var(--ink2);font-size:12.5px}
.fig .tb{font-weight:650}
.fig .tc{fill:var(--cls);font-weight:650}
.fig .ta{fill:var(--accent);font-weight:650}
.fig .tw{fill:var(--surface);font-weight:650}
.fig .tbd{fill:var(--bad);font-weight:650}
.fig .mid{text-anchor:middle} .fig .end{text-anchor:end}
.mk-ink{fill:var(--ink2)} .mk-cls{fill:var(--cls)} .mk-acc{fill:var(--accent)} .mk-bad{fill:var(--bad)}

/* compare: columns divided by a rule */
.cmp{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.cmp > div{padding:14px 18px 14px 0}
.cmp > div + div{padding-left:18px;border-left:1px solid var(--line)}
@container (max-width:479px){.cmp > div + div{padding-left:0;border-left:0;border-top:1px solid var(--line)}}
.cmp h5{margin:0 0 6px;font-size:var(--t15);font-weight:750;color:var(--ink)}
.cmp p{margin:0 0 6px;font-size:var(--t15);line-height:1.5;color:var(--body)} .cmp p:last-child{margin:0}

/* tables */
.tbw{overflow-x:auto;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.tbl{width:100%;border-collapse:collapse;font-size:var(--t15);line-height:1.5}
.tbl th{padding:10px 14px;text-align:left;font-size:var(--t13);font-weight:700;color:var(--ink2);background:var(--tint);border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px 14px;vertical-align:top;border-top:1px solid var(--line);color:var(--body)}
.tbl tbody tr:first-child td{border-top:0}
.tbl td:first-child{font-weight:700;color:var(--ink)}
.tcap{margin:0 0 8px;font-size:var(--t15);font-weight:750;color:var(--ink)}
@container (max-width:519px){
  .tbw .tbl thead{display:none}
  .tbw .tbl tr{display:block;padding:10px 14px;border-top:1px solid var(--line)}
  .tbw .tbl tbody tr:first-child{border-top:0}
  .tbw .tbl td{display:block;padding:0;border:0}
  .tbw .tbl.two td:not(:first-child)::before{display:none}
  .tbw .tbl.two td:first-child{margin-bottom:2px}
  .tbw .tbl td:not(:first-child)::before{content:attr(data-l);display:block;margin-top:6px;font-size:var(--t12);font-weight:700;letter-spacing:.04em;color:var(--ink3);text-transform:uppercase}
}

/* on the test: every example of a lesson in one panel */
.exs{border-radius:var(--r-card);border:1px solid var(--line);background:var(--surface2);overflow:hidden}
.exs .exh{display:flex;align-items:center;gap:8px;padding:12px 16px 0;font-size:var(--t13);font-weight:700;color:var(--ink2)}
.exs .exh svg{flex:none;color:var(--accent)}
.tq{padding:10px 16px 14px}
.tq + .tq{border-top:1px solid var(--line);padding-top:14px}
.tq .el{display:none}
.tq .eqr{display:flex;align-items:center;gap:12px 18px}
.tq .eq{flex:1;min-width:0;font-size:var(--t16);line-height:1.5;font-weight:500;color:var(--ink)}
.tq .eb{flex:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 16px;border-radius:var(--r-btn);background:var(--accent);color:var(--on-accent);font-size:var(--t15);font-weight:650;text-align:center;transition:filter .18s var(--ease)}
@media (hover:hover){.tq .eb:hover{filter:brightness(1.08)}}
.tq .eb .chev{display:none}
@container (max-width:560px){.tq .eqr{flex-direction:column;align-items:stretch}.tq .eb{width:100%}}
.tq .ea{display:none;margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:var(--t15);line-height:1.5}
.tq.on .ea{display:block;animation:rise .3s var(--spring) both}
.tq .ea b.aa{display:block;font-weight:700;color:var(--ink);margin-bottom:3px}
.tq .ea .why{color:var(--ink2)}
/* multiple-choice "on the test": {q, opts, a, why} */
.tq.mc .eq{margin-bottom:8px}
.tq.mc .opts{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
.tq.mc .opt{border:1px solid var(--line);border-radius:11px;background:var(--surface)}
@container (min-width:640px){.tq.mc .opts{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tq.done .opt{cursor:default}
.tq.mc .ea .why{color:var(--ink)}

/* watch out + callouts */
.watch{border-radius:0 12px 12px 0;background:var(--amber-bg);border-left:3px solid var(--amber);padding:11px 16px 12px}
.watch .wl,.callout .cl{display:flex;align-items:center;gap:7px;font-size:var(--t13);font-weight:750;color:var(--ink);margin-bottom:3px}
.watch .wl svg{color:var(--hi)}
.watch ul{margin:0;padding:0;list-style:none}
.watch li{position:relative;padding:3px 0 3px 16px;font-size:var(--t15);line-height:1.5;color:var(--ink)}
.watch li::before{content:"";position:absolute;left:1px;top:12px;width:7px;height:2px;border-radius:1px;background:var(--hi)}
.callout{border-radius:0 12px 12px 0;padding:10px 16px 11px;font-size:var(--t15);line-height:1.5;background:var(--surface);border-left:3px solid var(--accent);color:var(--body)}
.callout .cl{color:var(--ink)}
.callout.ok{border-left-color:var(--good)}
.callout.ex{border-left-color:var(--accent)}
.callout.cls{border-left-color:var(--cls)}

/* terms */
.terms{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.terms .tl{font-size:var(--t12);font-weight:700;letter-spacing:.06em;color:var(--ink3);text-transform:uppercase;margin-right:4px}
.term{font-size:var(--t13);font-weight:550;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink2)}

.abbr{padding:14px 16px;border-radius:var(--r-card);background:var(--surface);border:1px solid var(--line);font-size:var(--t13);color:var(--ink2);line-height:1.7}
.abbr b{color:var(--ink);font-weight:700}
.olh{margin:30px 0 10px;font-size:var(--t13);font-weight:700;letter-spacing:.06em;color:var(--ink3);text-transform:uppercase}

/* generic cards / groups */
.card{border-radius:var(--r-card);background:var(--surface);border:1px solid var(--line);padding:14px 16px;margin-bottom:12px}
.card.top{border-left:4px solid var(--accent);padding-left:15px}
.card.top p{margin:0 0 8px} .card.top p:last-child{margin-bottom:0}
.group{border-radius:var(--r-card);overflow:hidden;background:var(--surface);border:1px solid var(--line);margin-bottom:12px;box-shadow:var(--sh1)}
.row{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:13px 15px;position:relative;z-index:1;cursor:pointer;transition:background .16s var(--ease)}
.row + .row,.body + .row{border-top:1px solid var(--line)}
@media (hover:hover){.row:hover{background:var(--surface2)}}
.rt{min-width:0;flex:1}
.rn{display:block;font-size:var(--t16);font-weight:600;line-height:1.35}
.rd{display:block;font-size:var(--t12);color:var(--ink3);margin-top:1px;text-transform:lowercase}
.chev{flex:none;color:var(--ink3);transition:transform .24s var(--spring)}
.row[aria-expanded="true"] .chev{transform:rotate(90deg)}
.body{display:grid;grid-template-rows:0fr;background:var(--surface2);border-top:1px solid var(--line);transition:grid-template-rows .36s var(--spring)}
.body.on{grid-template-rows:1fr}
.body > div{overflow:hidden}
.body .in{padding:12px 16px 14px;display:grid;gap:10px}
.body p{margin:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:40px;padding:9px 16px;border-radius:var(--r-btn);background:var(--accent);color:var(--on-accent);font-size:var(--t15);font-weight:650;transition:filter .18s var(--ease)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
@media (hover:hover){.btn:hover{filter:brightness(1.08)}}
.btn:active,.mbtn:active,.tq .eb:active{transform:scale(.987)}

/* practice mc */
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,440px),1fr));gap:14px;align-items:start}
.q{margin:0}
.q .qt{padding:15px 17px 11px;font-size:var(--t16);font-weight:500;line-height:1.45}
.qn{font-size:var(--t12);font-weight:600;color:var(--ink3);font-variant-numeric:tabular-nums;margin-bottom:4px;text-transform:lowercase}
.opt{display:flex;align-items:flex-start;gap:11px;width:100%;min-height:44px;padding:11px 15px;border-top:1px solid var(--line);font-size:var(--t15);line-height:1.45;color:var(--ink);transition:background .16s var(--ease)}
@media (hover:hover){#root:not(.showall) .q:not(.done) .opt:hover,#root:not(.showall) .tq:not(.done) .opt:hover{background:var(--surface2)}}
.opt .k{flex:none;width:23px;height:23px;border-radius:50%;border:1px solid var(--line2);display:grid;place-items:center;font-size:11.5px;font-weight:650;color:var(--ink3);margin-top:0}
.q.done .opt{cursor:default}
.opt.right{background:color-mix(in srgb,var(--good) 13%,transparent)}
.opt.right .k{background:var(--good);border-color:var(--good);color:var(--surface)}
.opt.wrong{background:color-mix(in srgb,var(--bad) 11%,transparent)}
.opt.wrong .k{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.q .why{display:none;padding:11px 17px 13px;border-top:1px solid var(--line);background:var(--surface2);font-size:var(--t15);line-height:1.5}
.q .why b{color:var(--ink3);font-weight:650;font-size:var(--t12);text-transform:lowercase;letter-spacing:.04em;display:block;margin-bottom:2px}
.q.done .why{display:block}
/* select-all questions: a is an array of right indexes */
.opt.sel{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.opt.sel .k{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.mchk{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 15px;border-top:1px solid var(--line);font-size:var(--t13);color:var(--ink3);text-transform:lowercase}
.mchk .btn{min-height:36px;padding:6px 12px;font-size:var(--t13)}
.q.done .mchk,.showall .mchk{display:none}
/* show all answers */
.showall .q .opt,.showall .tq .opt{cursor:default}
.showall .q .opt[data-c],.showall .tq .opt[data-c]{background:color-mix(in srgb,var(--good) 13%,transparent)}
.showall .q .opt[data-c] .k,.showall .tq .opt[data-c] .k{background:var(--good);border-color:var(--good);color:var(--surface)}
/* answer feedback in words, not only color */
.opt .ftag{margin-left:auto;padding-left:10px;align-self:center;font-size:var(--t12);font-weight:700;white-space:nowrap;text-transform:lowercase}
.opt.right .ftag{color:var(--good)} .opt.wrong .ftag{color:var(--bad)}
.showall .q:not(.done) .opt[data-c]::after,.showall .tq:not(.done) .opt[data-c]::after{content:"\2713  answer";margin-left:auto;padding-left:10px;align-self:center;font-size:var(--t12);font-weight:700;color:var(--good);white-space:nowrap}
.showall .q .why,.showall .tq .ea{display:block}
.showall .tq .eb,.showall .prob .go{display:none}
.showall .prob .reveal{display:block}
.scorepill{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(140%);z-index:60;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:12px;width:max-content;max-width:calc(100vw - 24px);padding:8px 8px 8px 16px;border-radius:14px;background:var(--ink);color:var(--paper);font-size:var(--t15);box-shadow:0 8px 28px rgba(8,16,40,.22);opacity:0;visibility:hidden;pointer-events:none;transition:transform .4s var(--spring),opacity .25s var(--ease),visibility 0s linear .4s}
.scorepill.show{transform:translateX(-50%);opacity:1;visibility:visible;pointer-events:auto;transition-delay:0s}
.scorepill b{font-family:var(--display);font-weight:var(--w-d);font-size:var(--t20);font-variant-numeric:tabular-nums}
.scorepill button{padding:7px 12px;border-radius:9px;background:color-mix(in srgb,var(--paper) 16%,transparent);color:var(--paper);font-size:var(--t13);font-weight:650;text-transform:lowercase}
.scorepill button[hidden]{display:none}
.scorepill button:focus-visible{outline-color:var(--paper)}
/* retry missed questions */
.rbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin:0 0 14px;padding:10px 12px 10px 16px;border-radius:var(--r-card);border:1px solid var(--line);background:var(--surface);box-shadow:var(--sh1)}
.rbar[hidden],.rbar [hidden]{display:none !important}
.rbar:focus,.qgrid:focus{outline:none}
.rbar .rst{margin:0;flex:1 1 220px;font-size:var(--t15);line-height:1.4;text-transform:lowercase}
.rbar .rbtns{display:flex;flex-wrap:wrap;gap:8px}
.rbar .btn{min-height:36px;padding:6px 12px;font-size:var(--t13)}
@media screen{.q.rx{display:none}}

/* problems: compact cards two across; a card opens to full width with its steps beside it */
.pgrid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,460px),1fr));align-items:start}
.prob{container-type:inline-size;margin:0}
.prob.on,.showall .prob{grid-column:1/-1}
.prob .pi{display:grid;grid-template-columns:minmax(0,1fr)}
.prob .qt{padding:15px 17px;font-size:var(--t16);font-weight:500;line-height:1.5}
.prob .go{border-top:1px solid var(--line);padding:12px 17px;display:flex;justify-content:space-between;align-items:center;font-size:var(--t15);font-weight:650;color:var(--accent);width:100%}
.prob .reveal{display:none;border-top:1px solid var(--line);background:var(--surface2);padding:13px 17px 15px}
.prob.on .reveal{display:block;animation:rise .3s var(--spring) both}
.prob.on .go .chev{transform:rotate(90deg)}
@container (min-width:820px){
  .prob .pi{grid-template-columns:minmax(0,5fr) minmax(0,7fr)}
  .prob .qside{border-right:1px solid var(--line);display:flex;flex-direction:column}
  .prob .qside .qt{flex:1}
  .prob .reveal{border-top:0;display:block;min-height:100%}
  #root:not(.showall) .prob:not(.on) .pi{grid-template-columns:minmax(0,1fr)}
  #root:not(.showall) .prob:not(.on) .reveal{display:none}
  #root:not(.showall) .prob:not(.on) .qside{border-right:0}
}
.ans{margin-top:10px;padding:9px 12px;border-radius:var(--r-btn);background:var(--surface);border:1px solid var(--line);font-size:var(--t15);border-left:3px solid var(--good)}
.ans b{color:var(--ink3);font-weight:650;font-size:var(--t12);text-transform:lowercase;letter-spacing:.04em;margin-right:6px}
.work{margin:0;padding:0;list-style:none}
.work li{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:2px 16px;padding:7px 0;align-items:baseline}
.work li + li{border-top:1px solid var(--line)}
.work .wm{font-size:var(--t15);line-height:1.45;color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums}
.work .wm.cont{padding-left:1.1em}
.work .wy{font-size:var(--t13);line-height:1.45;color:var(--ink2);padding-left:12px;border-left:2px solid var(--line)}
.work .wy:empty{border-left-color:transparent}
.work li.hd{padding:0 0 4px}
.work .wh{font-size:var(--t12);font-weight:650;letter-spacing:.04em;text-transform:lowercase;color:var(--ink3)}
.work li.hd .wh + .wh{padding-left:14px}
@container (max-width:479px){.work li{grid-template-columns:1fr;gap:1px}.work .wy{border-left:0;padding-left:0}.work li.hd{display:none}}

/* formulas */
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:12px}
.fx{padding:13px 15px;border-radius:12px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:4px;box-shadow:var(--sh1)}
.fx .n{font-size:var(--t12);font-weight:700;letter-spacing:.04em;color:var(--ink3);text-transform:uppercase}
.fx .f{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:var(--t16);font-weight:500;overflow-wrap:anywhere;color:var(--ink)}
.fx .note{font-size:var(--t13);color:var(--ink2);line-height:1.45}

/* flashcards */
.dk{display:grid;gap:14px;max-width:760px;margin:0 auto}
.deck{position:relative;perspective:1200px}
.fc{position:relative;min-height:230px;border-radius:var(--r-card);cursor:pointer;transform-style:preserve-3d;transition:transform .5s var(--spring)}
.fc.flip{transform:rotateY(180deg)}
.fc > div{position:absolute;inset:0;border-radius:var(--r-card);background:var(--surface);border:1px solid var(--line);padding:22px;display:grid;place-items:center;text-align:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:var(--sh1)}
.fc .f{font-family:var(--display);font-size:clamp(24px,3.4vw,32px);font-weight:var(--w-d);letter-spacing:var(--ls-d);line-height:1.15;text-wrap:balance}
.fc .b{transform:rotateY(180deg);background:var(--surface2);font-size:var(--t16);line-height:1.5;color:var(--ink)}
.fc .tag{position:absolute;left:16px;top:13px;font-size:11.5px;font-weight:650;color:var(--ink3);text-transform:lowercase;letter-spacing:.04em}
.fc .b .tag{color:var(--accent)}
.dnav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dnav .cnt{margin-left:auto;font-size:var(--t13);color:var(--ink3);font-variant-numeric:tabular-nums;text-transform:lowercase}
.clist{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:12px;margin-top:6px}
.clist > div{padding:13px 15px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.clist b{display:block;font-weight:700;margin-bottom:3px}
.clist span{font-size:var(--t15);line-height:1.5;color:var(--ink2)}

/* timeline */
.tln{border-radius:var(--r-card);background:var(--surface);border:1px solid var(--line);overflow:hidden;box-shadow:var(--sh1)}
.tln .ev{display:grid;grid-template-columns:96px minmax(0,1fr);gap:4px 18px;padding:13px 17px;border-top:1px solid var(--line);position:relative}
.tln .ev:first-child{border-top:0}
.tln .y{font-family:var(--display);font-weight:760;font-size:var(--t16);color:var(--accent);font-variant-numeric:tabular-nums;line-height:1.4}
.tln .t{font-size:var(--t16);font-weight:650;line-height:1.4}
.tln .d{font-size:var(--t15);color:var(--ink2);line-height:1.5;margin-top:2px}
@media (min-width:900px){.tln .ev{grid-template-columns:110px minmax(0,.9fr) minmax(0,1.3fr)}.tln .d{margin-top:0}}
@media (max-width:479px){.tln .ev{grid-template-columns:1fr;gap:2px}}

/* cram */
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,460px),1fr));gap:14px;align-items:start}
.cgrid .group{margin:0}
.cgrid .gh{padding:12px 15px;border-bottom:1px solid var(--line);font-size:var(--t13);font-weight:750;color:var(--ink);display:flex;justify-content:space-between;gap:10px;background:var(--tint)}
.cgrid .gh span{color:var(--ink3);font-weight:550}
.cr{display:grid;grid-template-columns:minmax(0,10em) 1fr;gap:2px 14px;padding:10px 15px;border-top:1px solid var(--line)}
.gh + .cr{border-top:0}
.cr .n{font-size:var(--t15);font-weight:700;line-height:1.4}
.cr .y{display:block;margin-top:2px;font-size:var(--t12);font-weight:650;color:var(--accent);font-variant-numeric:tabular-nums}
.cr .t{font-size:var(--t15);line-height:1.5;color:var(--ink2)}
@media (max-width:479px){.cr{grid-template-columns:1fr}.cr .n{display:flex;align-items:baseline;flex-wrap:wrap;gap:0 8px}.cr .y{margin:0}}

/* tables pane */
.tpane{display:grid;gap:22px}
.tpane .tblk{container-type:inline-size}

/* checklist */
.ckg{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,420px),1fr));gap:0 12px}
.ck{display:flex;align-items:flex-start;gap:11px;width:100%;padding:12px 14px;border-radius:12px;font-size:var(--t15);line-height:1.45;background:var(--surface);border:1px solid var(--line);margin-bottom:8px}
.ck .box{flex:none;width:20px;height:20px;border-radius:6px;border:1px solid var(--line2);margin-top:1px;display:grid;place-items:center;color:var(--surface);transition:background .16s var(--ease),border-color .16s var(--ease)}
.ck.on .box{background:var(--good);border-color:var(--good)}
.ck.on .t{color:var(--ink3);text-decoration:line-through}
.ck .d{display:block;font-size:var(--t12);color:var(--ink3);margin-top:1px}

/* essay panes (leq / prompts) */
.bul{margin:0;padding-left:18px}
.bul li{margin:3px 0;line-height:1.5}
.pl{font-size:var(--t12);font-weight:700;letter-spacing:.06em;color:var(--ink3);text-transform:uppercase;margin-top:6px}
.so{padding:9px 12px;border-radius:0 10px 10px 0;background:var(--surface);border-left:3px solid var(--accent);font-size:var(--t15)}
.so .cl{display:block;font-size:var(--t12);font-weight:700;color:var(--accent);letter-spacing:.04em;text-transform:lowercase}
.pace{display:flex;height:34px;border-radius:8px;overflow:hidden;gap:2px}
.pace > div{display:grid;place-items:center;color:var(--on-accent);font-size:var(--t12);font-weight:700;background:var(--accent)}
.pace > div:nth-child(2n){background:color-mix(in srgb,var(--accent) 70%,var(--ink))}
.pace > div:nth-child(3n){background:var(--ink2);color:var(--paper)}
.fnl{margin:0;padding-left:20px;font-size:var(--t15)}
.fnl li{margin:4px 0}

/* footer */
footer{margin-top:40px;padding-top:16px;border-top:1px solid var(--line);font-size:var(--t12);line-height:1.6;color:var(--ink3);text-transform:lowercase}
footer a{color:var(--ink2);text-decoration:underline;text-decoration-color:var(--line2);text-underline-offset:3px}
footer .upd{display:block;margin-top:6px}

.rv{opacity:0;transform:translateY(8px);animation:rise .5s var(--spring) forwards}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none !important;transition:none !important}.rv{opacity:1;transform:none}}

@media print{
  :root{--paper:#fff;--surface:#fff;--surface2:#f5f6f8;--tint:#eef1f5;--ink:#111;--ink2:#333;--ink3:#555;--line:#ccc;--line2:#999;--amber-bg:#fff}
  .bar,.gctl,.pdfs,.menu,.nxt,.sstat,.nores,.skipl,#prog,.scorepill,.rbar,.tq .eb,.prob .go,.seg,.gcov{display:none !important}
  body{background:#fff;padding:0}
  .focus,.tq,.q,.prob,.tln,.fx,.rbar{box-shadow:none !important}
  .rv{opacity:1 !important;transform:none !important;animation:none !important}
  .tq .ea,.prob .reveal,.q .why{display:block !important}
  .q:not(.done) .opt[data-c]::after,.tq:not(.done) .opt[data-c]::after{content:"\2713  correct answer";margin-left:auto;padding-left:10px;font-size:var(--t12);font-weight:700;white-space:nowrap}
  .prob:not(.on) .reveal > *{display:block !important;visibility:visible !important}
  #root:not(.showall) .prob:not(.on) .reveal{display:block !important}
  .sec{padding:16px 0}
  .group,.card,.tq,.fig,.tlist li,.focus,.watch,.tbw tr{break-inside:avoid}
  .sec h3,.eyb,.exs .exh,.tcap,.tlist .tlh{break-after:avoid}
  .exs{break-inside:auto}
  @page{margin:.6in}
}
</style>
</head>

<script>
/* ═══════════════════════════════════════════════════════════════════

const VIS=["fig","tree","tiles"], SIDE=["fig","tree"];

function section(s,i,next){
  scope();
  const watch=[...(s.watch||[]),...(s.notes||[]).filter(n=>n.k==="warn").map(n=>n.t)];
  const notes=(s.notes||[]).filter(n=>n.k!=="warn");
  const mainKeys=["p","pts","rows","flow","steps"].filter(k=>has(s[k]));
  const vis=VIS.filter(k=>has(s[k]));
  const sideKey=SIDE.find(k=>has(s[k]))||(mainKeys.length?null:vis[0])||null;
  const main=mainKeys.map(k=>B[k](s[k])).join("")+(notes.length?B.notes(notes):"");
  let wb=watch.length?B.watch(watch):"";
  const side=sideKey?B[sideKey](s[sideKey]):"";
  let h="";
  /* text left, the section's own diagram (or list) beside it; the watch box closes the text column */
  if(main&&side){h+=`<div class="duo${sideKey==="tree"||sideKey==="fig"?" wide-side":""}"><div class="main">${main}${wb}</div><div class="side">${side}</div></div>`;wb=""}
  else if(main){h+=`<div class="main solo">${main}${wb}</div>`;wb=""}
  else if(side)h+=side;
  const rest=vis.filter(k=>k!==sideKey).concat(["table","cmp"].filter(k=>has(s[k])));
  rest.forEach(k=>{h+=B[k](s[k])});
  if(has(s.tables))s.tables.forEach(t=>{h+=B.table(t)});
  if(wb)h+=wb;
  if(has(s.ex))h+=B.ex(s.ex);
  if(has(s.terms))h+=B.terms(s.terms);
  const n=String(i+1).padStart(2,"0"), w=WN[s.w];

  const nx=next?`<div class="nxt"><a href="#s-${i+2}" data-j="s-${i+2}">Next: ${esc(next.t)}${I_NEXT}</a></div>`:tp?`<div class="nxt"><a href="#${tp}" data-p="${tp}">Next: ${esc(lab(tp))}${cnt(tp)?` (${cnt(tp)})`:""}${I_NEXT}</a></div>`:"";
  const node=el("section","sec",`<header>${eyb}<h3 id="h-s-${i+1}" tabindex="-1">${esc(s.t)}</h3>${s.d?`<p class="sd">${esc(s.d)}</p>`:""}</header><div class="sb">${h}</div>${nx}`);
  node.id="s-"+(i+1); node.setAttribute("aria-labelledby","h-s-"+(i+1));

let SCORE={done:0,right:0,total:0}, RESEARCH=()=>{};

function tagOpt(o,t){if(!o.querySelector(".ftag"))o.insertAdjacentHTML("beforeend",`<span class="ftag">${t}</span>`)}

function buildPractice(sec){
  const qs=GUIDE.practice||[]; SCORE.total=qs.length; $("#sct").textContent=qs.length;
  /* retry missed questions: in memory for this page visit only, nothing stored or sent.
     SCORE counts first tries only. Retries change the missed set and the round progress, never SCORE.
     HOLD ignores a second click for half a second after a retry step, so a double click can't hit the control that moved under it. */
  const FIRST=new Map(), MISSED=new Set(); let RT=null, ROUND=0, HOLD=-1e9;
  const hold=()=>{const t=performance.now();if(t-HOLD<500)return true;HOLD=t;return false};
  const rbar=el("div","rbar"); rbar.hidden=true; rbar.tabIndex=-1; rbar.setAttribute("role","group"); rbar.setAttribute("aria-label","retry missed questions");
  rbar.innerHTML=`<p class="rst"></p><p class="vh" role="status" aria-live="polite"></p><div class="rbtns"><button type="button" class="btn" data-r="again" hidden></button><button type="button" class="btn ghost" data-r="all">all questions</button><button type="button" class="btn ghost" data-r="over">start over</button></div>`;
  sec.insertBefore(rbar,sec.firstChild);
  $("#reset").insertAdjacentHTML("beforebegin",'<button type="button" id="retry" hidden></button>');
  const rbtn=$("#retry"), rst=rbar.querySelector(".rst"), rsay=rbar.querySelector(".vh"), ragain=rbar.querySelector('[data-r="again"]');
  const g=el("div","qgrid"); g.tabIndex=-1;
  const clearCard=c=>{c.classList.remove("done");c.querySelectorAll(".opt").forEach(o=>o.classList.remove("right","wrong","sel"));c.querySelectorAll(".ftag").forEach(t=>t.remove());say(c,"")};
  const firstTxt=()=>`first-try score stays ${SCORE.right} of ${SCORE.total}.`;
  function rsync(){
    const n=MISSED.size; rbar.hidden=!RT;
    if(!RT){rbtn.hidden=!n;rbtn.textContent=`retry missed (${n})`;return}
    const all=RT.set.length, end=RT.done>=all;
    rbtn.hidden=false; rbtn.textContent=!end?`round ${RT.round}: ${RT.done} of ${all}`:n?`retry the ${n} still missed`:"all fixed · all questions";
    ragain.hidden=!(end&&n); ragain.textContent=`retry the ${n} still missed`;
    rst.textContent=!end?`retry round ${RT.round}: ${RT.done} of ${all} answered, ${RT.fixed} now right. ${firstTxt()}`
      :n?`round ${RT.round} done: ${RT.fixed} of ${all} now right, ${n} still missed. ${firstTxt()}`:`all fixed: every missed question is now right. ${firstTxt()}`;
    if(end&&!RT.said){RT.said=1;rsay.textContent=rst.textContent}
  }
  function record(i,ok){
    if(!FIRST.has(i)){FIRST.set(i,ok);if(ok)SCORE.right++;else MISSED.add(i);SCORE.done++;$("#scn").textContent=SCORE.right}
    else{if(ok)MISSED.delete(i);else MISSED.add(i);if(RT&&RT.set.includes(i)){RT.done++;if(ok)RT.fixed++}}
    scoreVis(); rsync();
  }
  function startRetry(){
    if(!MISSED.size||hold())return;
    if($("#root").classList.contains("showall"))$("#showall").click();
    RT={round:++ROUND,set:[...MISSED].sort((a,b)=>a-b),done:0,fixed:0,said:0};
    g.querySelectorAll(".q").forEach(c=>{const on=RT.set.includes(+c.dataset.qi);c.classList.toggle("rx",!on);if(on)clearCard(c)});
    rsay.textContent=""; rsync(); RESEARCH();
    const r=rbar.getBoundingClientRect(); if(r.top<$("#bar").offsetHeight||r.bottom>innerHeight)sec.scrollIntoView({behavior:REDUCED?"auto":"smooth"});
    rbar.focus({preventScroll:true});
    const msg=`retry round ${RT.round}: ${RT.set.length} missed question${RT.set.length===1?"":"s"}. ${firstTxt()}`; setTimeout(()=>{if(RT&&RT.round===ROUND&&!RT.said)rsay.textContent=msg},120);
  }
  function endRetry(){if(hold())return;RT=null;rsay.textContent="";g.querySelectorAll(".q.rx").forEach(c=>c.classList.remove("rx"));rsync();RESEARCH();g.focus({preventScroll:true})}
  qs.forEach((q,i)=>{
    const card=el("div","group q"), multi=Array.isArray(q.a), keys=multi?q.a:[q.a]; card.dataset.qi=i;
    card.innerHTML=`<div class="qt"><div class="qn">question ${i+1}</div>${plain(q.q)}</div>`+
      q.opts.map((o,j)=>`<button type="button" class="opt" data-i="${j}"${keys.includes(j)?" data-c":""}><span class="k">${"abcdef"[j]||j+1}</span><span>${plain(o)}</span></button>`).join("")+
      (multi?`<div class="mchk"><span>select all that apply</span><button type="button" class="btn ghost">check</button></div>`:"")+
      `<p class="vh" role="status" aria-live="polite"></p><div class="why"><b>why</b>${plain(q.why||"")}</div>`;
    const opts=[...card.querySelectorAll(".opt")], locked=()=>card.classList.contains("done")||$("#root").classList.contains("showall")||performance.now()-HOLD<500;
    const finish=ok=>{card.classList.add("done");record(i,ok)};
    opts.forEach(b=>b.addEventListener("click",()=>{
      if(locked())return;
      if(multi){b.classList.toggle("sel");return}
      const j=+b.dataset.i;
      if(j===q.a){b.classList.add("right");tagOpt(b,"\u2713 correct");say(card,"Correct.")}else{b.classList.add("wrong");tagOpt(b,"\u2717 your answer");opts[q.a].classList.add("right");tagOpt(opts[q.a],"\u2713 correct");say(card,"Not quite. The answer is ("+("abcdef"[q.a]||q.a+1)+").")}
      finish(j===q.a);
    }));
    if(multi)card.querySelector(".mchk .btn").addEventListener("click",e=>{
      if(locked())return;
      let ok=true; const had=document.activeElement===e.currentTarget;
      opts.forEach((o,j)=>{const s=o.classList.contains("sel"),c=keys.includes(j);o.classList.remove("sel");if(c){o.classList.add("right");tagOpt(o,"\u2713 correct")}else if(s){o.classList.add("wrong");tagOpt(o,"\u2717 your answer")}if(s!==c)ok=false});
      say(card,ok?"Correct.":"Not quite. The correct choices are marked.");

  });
  sec.appendChild(g);

}

/* search: filters every pane as you type and marks the hits; "/" focuses it.

(function(){

  const ITEMS={outline:".tp,.toptbl,.sec,#s-abbr",practice:".q",problems:".prob",formulas:".fx",cards:".clist > div",timeline:".ev",checklist:".ck",cram:".cr",tables:".tblk tbody tr",prompts:".group",leq:".card,.tbw"};
  const SKIP=".eb,.go,.qn,.el,.wl,.k,.num,.w,.tl,.tag,.cl,.chev,.x,.ftag,.vh,.eyb,.nxt,.exh,.ti,.fqk";
  const fold=s=>String(s).normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[\u2018\u2019]/g,"'").replace(/[\u201c\u201d]/g,'"').replace(/\s+/g," ");
  const IDX=PANES.map(id=>{
    const p=$("#p-"+id), sel=ITEMS[id]||"";
    const items=sel?[...p.querySelectorAll(sel)].map(n=>{const c=n.cloneNode(true);c.querySelectorAll(SKIP).forEach(x=>x.remove());let sp="";const w=document.createTreeWalker(c,NodeFilter.SHOW_TEXT);while(w.nextNode())sp+=w.currentNode.nodeValue+" ";return {n,t:fold(c.textContent)+"\n"+fold(sp)}}):[];
    const nr=el("div","nores sx"); p.prepend(nr);

  });
  const unmark=()=>{root.querySelectorAll("mark.hit").forEach(m=>{const pa=m.parentNode;if(!pa)return;pa.replaceChild(document.createTextNode(m.textContent),m);pa.normalize()})};
  const mark=(node,re)=>{
    const w=document.createTreeWalker(node,NodeFilter.SHOW_TEXT,{acceptNode:t=>t.parentElement.closest("svg,mark,"+SKIP)?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});

    ts.forEach(t=>{const s=t.nodeValue;re.lastIndex=0;if(!re.test(s))return;re.lastIndex=0;const f=document.createDocumentFragment();let i=0,m;
      while((m=re.exec(s))){if(!m[0].length){re.lastIndex++;continue}if(m.index>i)f.appendChild(document.createTextNode(s.slice(i,m.index)));const k=document.createElement("mark");k.className="hit";k.textContent=m[0];f.appendChild(k);i=m.index+m[0].length}
      if(i<s.length)f.appendChild(document.createTextNode(s.slice(i)));t.parentNode.replaceChild(f,t)});
  };
  const flip=(g,hide)=>{g.classList.toggle("sx",hide);const h=g.previousElementSibling;if(h&&h.classList.contains("sh"))h.classList.toggle("sx",hide)};
  let RAW="", LAST=null, COUNTS={};
  const chips=ids=>ids.map(id=>`<button type="button" data-p="${id}"${id===CUR?' aria-current="true"':""}>${esc(lab(id))}<b>${COUNTS[id]}</b></button>`).join("");
  function status(){
    const on=LAST&&LAST.length>0;
    stat.classList.toggle("on",!!on);
    IDX.forEach(P=>P.nr.classList.toggle("sx",!on||COUNTS[P.id]>0||!P.items.length));
    if(!on){stat.innerHTML="";return}
    const tot=IDX.reduce((a,P)=>a+COUNTS[P.id],0), hits=PANES.filter(id=>COUNTS[id]>0);
    stat.innerHTML=(tot?`<span>${tot} match${tot===1?"":"es"} for <q>${esc(RAW)}</q></span>`:`<span>No matches for <q>${esc(RAW)}</q>. Try fewer or shorter words.</span>`)+(PANES.length>1?chips(hits):"");
    IDX.forEach(P=>{if(COUNTS[P.id]||!P.items.length)return;P.nr.innerHTML=hits.length?`<p>Nothing in this section matches. These do:</p><div>${chips(hits)}</div>`:`<p>Nothing in this guide matches.</p>`});
  }
  function run(){
    RAW=q.value.trim(); box.classList.toggle("has",!!q.value);
    const f=fold(RAW).trim(), terms=f.length>=2?f.split(" "):[];
    const key=terms.join(" "); if(key===(LAST||[]).join(" ")&&LAST!==null)return;
    LAST=terms; unmark();
    const on=terms.length>0;
    root.classList.toggle("searching",on);
    const re=on?new RegExp(terms.map(t=>t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&").replace(/'/g,"['\u2018\u2019]")).sort((a,b)=>b.length-a.length).join("|"),"gi"):null;
    IDX.forEach(P=>{
      let c=0;
      P.items.forEach(it=>{const hit=!on||terms.every(t=>it.t.includes(t));it.n.classList.toggle("sx",!hit);if(on&&hit&&!it.n.classList.contains("rx")){c++;mark(it.n,re)}});
      COUNTS[P.id]=c;
      const p=P.p;
      p.querySelectorAll(".focus,.clist,.cgrid,.cgrid > .group,.tblk,.qgrid,.pgrid,.fgrid,.tln,.ckg").forEach(g=>flip(g,on&&!g.querySelector(P.vis)));
      p.querySelectorAll(".dk").forEach(g=>flip(g,on));
      const ab=p.querySelector("#s-abbr"); if(ab)flip(ab,ab.classList.contains("sx"));
    });
    document.querySelectorAll("#m-jump a[data-j]").forEach(a=>{const t=document.getElementById(a.dataset.j);a.classList.toggle("sx",!!(t&&t.classList.contains("sx")))});
    status();
  }
  let T=0;
  q.addEventListener("input",()=>{box.classList.toggle("has",!!q.value);clearTimeout(T);T=setTimeout(run,140)});
  q.addEventListener("keydown",e=>{if(e.key==="Escape"){q.value="";run();q.blur()}else if(e.key==="Enter"){clearTimeout(T);run();q.blur()}});
  $("#qx").addEventListener("click",()=>{q.value="";run();q.focus()});
  const go=e=>{const b=e.target.closest("button[data-p]");if(b)show(b.dataset.p,true)};
  stat.addEventListener("click",go); root.addEventListener("click",e=>{if(e.target.closest(".nores"))go(e)});
  afterShow=status;
  RESEARCH=()=>{if(LAST&&LAST.length){LAST=null;run()}};
  const focusQ=()=>{closeMenu(false);const top=$("#gctl").getBoundingClientRect().top+scrollY-bar.offsetHeight-16;if(scrollY>top+4)scrollTo({top:Math.max(0,top),behavior:REDUCED?"auto":"smooth"});q.focus({preventScroll:true})};
  $("#sbtn").addEventListener("click",focusQ);
  document.querySelectorAll('[data-act="search"]').forEach(b=>b.addEventListener("click",focusQ));
  addEventListener("keydown",e=>{if(e.key==="/"&&!e.metaKey&&!e.ctrlKey&&!e.altKey&&!/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)){e.preventDefault();focusQ()}});
  if(has(GUIDE.practice)||has(GUIDE.problems)||(GUIDE.outline||[]).some(s=>has(s.ex))){
    sall.hidden=false;
    sall.addEventListener("click",()=>{const on=!root.classList.contains("showall");root.classList.toggle("showall",on);sall.setAttribute("aria-pressed",String(on));sall.querySelector(".mt").textContent=on?"Hide answers":"Show answers";closeMenu(false)});
  }
  $("#printb").addEventListener("click",()=>{closeMenu(false);print()});
})();

/* theme (shared with the homepage via localStorage "theme") */
const seg=$(".seg"), thumb=$(".seg .thumb"), segBtns=[...seg.querySelectorAll("button")];
function moveThumb(){const on=seg.querySelector('button[aria-pressed="true"]')||segBtns[0];if(!on.offsetWidth)return;thumb.style.left=on.offsetLeft+"px";thumb.style.width=on.offsetWidth+"px"}
function setTheme(mode){
  const apply=()=>{if(mode==="auto")delete document.documentElement.dataset.theme;else document.documentElement.dataset.theme=mode};
  if(document.startViewTransition&&!REDUCED)document.startViewTransition(apply);else apply();
  segBtns.forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.set===mode)));moveThumb();
  try{mode==="auto"?localStorage.removeItem("theme"):localStorage.setItem("theme",mode)}catch(e){}
}
segBtns.forEach(b=>b.addEventListener("click",()=>setTheme(b.dataset.set)));
(function(){let saved=null;try{saved=localStorage.getItem("theme")}catch(e){}
  const mode=saved==="light"||saved==="dark"?saved:"auto";
  if(mode!=="auto")document.documentElement.dataset.theme=mode;
  segBtns.forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.set===mode)));
})();
requestAnimationFrame(moveThumb);addEventListener("resize",moveThumb);
document.fonts?.ready.then(()=>{moveThumb();setBarH()});

/* bar: shadow once scrolled; carries sections / topics / search once the guide's own controls scroll away. reading progress, staggered reveal */
(function(){const p=$("#prog i"),ctl=$("#gctl");let raf=0;const tick=()=>{raf=0;bar.classList.toggle("stuck",scrollY>6);const gone=ctl.getBoundingClientRect().bottom<bar.offsetHeight;if(gone!==bar.classList.contains("compact")){bar.classList.toggle("compact",gone);if(OPEN&&OPENBY&&!OPENBY.offsetParent)closeMenu(false);if(!gone)moveThumb()}const se=document.scrollingElement,h=se.scrollHeight-se.clientHeight;p.style.width=(h>0?Math.min(100,se.scrollTop/h*100):0)+"%"};addEventListener("scroll",()=>{if(!raf)raf=requestAnimationFrame(tick)},{passive:true});tick()})();
document.querySelectorAll(".rv").forEach((n,i)=>n.style.animationDelay=(i*55)+"ms");
</script>
