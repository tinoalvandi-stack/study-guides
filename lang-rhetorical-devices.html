  cards: [
    { f:"Anaphora", b:"Same **opening** repeated across back-to-back clauses. “We shall fight … we shall fight …”" },
    { f:"Antithesis", b:"Opposites contrasted, **often in parallel grammar**. “the best of times … the worst of times”" },
    { f:"Juxtaposition", b:"Two things **side by side** so the gap makes the point. No parallel grammar needed." },
    { f:"Asyndeton", b:"List with the **conjunctions cut**. “I came, I saw, I conquered.”" },
    { f:"Polysyndeton", b:"List with **a conjunction between every item**. “squash and rugby and … sail boats”" },
    { f:"Allusion", b:"Brief reference to a **famous text, event, or figure**. Name the type: biblical, historical, literary." },
    { f:"Epistrophe", b:"Same **ending** repeated across back-to-back clauses. “of the people, by the people, for the people”" },
    { f:"Analogy", b:"Point-by-point comparison that **makes an argument**. College admissions as a luxury brand." },
    { f:"Extended metaphor", b:"One metaphor **carried across a passage**, adding detail. “All the world’s a stage …”" },
    { f:"Concession", b:"**Granting** the other side a point before pushing back." },
    { f:"Procatalepsis", b:"**Raising the objection** before the audience does, then answering it." },
    { f:"Hypophora", b:"Ask a question, **answer it right away**." },
    { f:"Refrain", b:"A line that **returns at intervals** across a piece. “Nevermore.”" },
    { f:"Verbal irony", b:"Saying **the opposite** of what’s meant. “Brutus is an honourable man.”" },
    { f:"Understatement", b:"Making something sound **smaller** than it is. A fatal wound called “a scratch.”" },
    { f:"Anticlimax (bathos)", b:"Builds up, then **drops to something trivial**. “counsel take—and sometimes tea”" },
    { f:"Pun", b:"Play on a word’s **double meaning** or sound. “a grave man”" },
    { f:"Sentence fragment", b:"**No independent clause**, often used on purpose for impact. “Again.”" },
    { f:"Self-deprecation", b:"**Mocking yourself** to lower the audience’s guard." },
    { f:"Anecdote", b:"A **short account of an incident** (personal or not) used as evidence." },
    { f:"Litotes", b:"Understatement by **denying the opposite**. “no mean city” = an important city" },
    { f:"Euphemism", b:"A **soft word** for a harsh thing. “shuffled off this mortal coil”" },
    { f:"Dysphemism", b:"A **harsh word** for a neutral thing. “indoctrination mills” for schools" },
    { f:"Motif", b:"An image or idea that **recurs across a work**; wording can change. The green light." },
    { f:"Symbolism", b:"A **concrete object** standing for an abstract idea. “the torch has been passed”" },
    { f:"Colloquialism", b:"**Casual wording** in a formal setting. “felt screwed by life”" },
    { f:"Direct address", b:"Speaking **straight to the audience**. “Friends, Romans, countrymen”" },
    { f:"Aside", b:"A **brief side comment**, often in parentheses. “Not my channel, by the way.”" },
    { f:"Enumeratio", b:"A **list of parts or details**. “blood, toil, tears and sweat”" },
    { f:"Amplification", b:"Repeat a word, then **expand it**. “a flop … a big bold flop”" },
    { f:"Hypothetical example", b:"An **invented scenario** that illustrates or tests reasoning, not evidence. Singer’s drowning child." },
    { f:"Chiasmus", b:"Ideas **mirrored**, A-B then B-A. “Fair is foul, and foul is fair”" },
    { f:"Antimetabole", b:"Chiasmus with **the same words reversed**. “ask not what your country can do for you …”" },
    { f:"Symploce", b:"**Same start and same end** on back-to-back clauses. Anaphora + epistrophe." },
    { f:"Epizeuxis", b:"One word **back to back**. “Never, never, never, never, never.”" },
    { f:"Antanaclasis", b:"Same word, **different meaning** each time. “let the dead bury their dead”" },
    { f:"Periphrasis", b:"A **roundabout description** instead of the plain name. “whale-road” for the sea" },
    { f:"Distinctio", b:"**Defining a word** on the spot. “When I say ‘we,’ I mean …”" },
    { f:"Aporia", b:"Voicing **doubt** about what to say or think. “To be, or not to be”" },
    { f:"Paradox", b:"Seems **self-contradictory** but holds a truth. “The Child is father of the Man”" },
    { f:"Periodic sentence", b:"Main clause **held to the end**. Builds suspense." },
    { f:"Cumulative sentence", b:"Main clause **first**, then details pile on. Also called a loose sentence." },
    { f:"Neologism", b:"A **newly invented word**. “Beyonceness,” “chortled”" },
    { f:"Parallelism", b:"**Same grammatical shape** repeated. “one small step for man, one giant leap for mankind”" },
    { f:"Connotation", b:"The **feeling** a word carries beyond its dictionary meaning. “manacles,” “chains”" },
    { f:"Aphorism", b:"A **short, quotable truth**. “Early to bed and early to rise …”" },
    { f:"Imperative sentence", b:"A **direct command**. “Simplify, simplify.”" },
    { f:"Jargon", b:"**Insider or inflated** language. Can show expertise, exclude readers, or be quoted to mock." },
    { f:"Appositive", b:"A noun phrase that **renames** the noun beside it. “your roommate, Alfred Simkins”" },
    { f:"Ellipsis", b:"**Leaving out words** the reader fills in. “Toil and torn ligaments.”" },
    { f:"Etymology", b:"Arguing from a word’s **origin**. “which word is beautifully derived …”" },
    { f:"Satire", b:"**Mocking to criticize**. Swift’s “A Modest Proposal”" },
    { f:"Parody", b:"**Imitating a style** to mock it. “Twinkle, twinkle, little bat!”" }
  ]
};

/* ═══ machinery. nothing below needs editing. ═══ */
const $=s=>document.querySelector(s);
const el=(t,c,h)=>{const n=document.createElement(t);if(c)n.className=c;if(h!=null)n.innerHTML=h;return n};
const REDUCED=matchMedia("(prefers-reduced-motion:reduce)").matches;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b class="kw">$1</b>').replace(/==(.+?)==/g,'<mark class="hl">$1</mark>').replace(/!!(.+?)!!/g,'<span class="trap">$1</span>');
const CHEV='<svg class="chev" width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3l4 4-4 4"/></svg>';
const ICON={
 apush:'<path d="M7 22V5"/><path d="M7 6.4h10.5c.8 0 1.2.9.7 1.5L16 10l2.2 2.1c.5.6.1 1.5-.7 1.5H7"/>',
 lang:'<path d="M6 22 9.3 15"/><path d="M9 15.4 17.4 5.2c.5-.6 1.4-.5 1.8.1l1.2 2c.3.6.1 1.4-.5 1.7L8.6 14.9"/><path d="M11.6 10.4 15 12.4"/>',
 psych:'<path d="M18.4 20.4v-2.6h1.9c.7 0 1.1-.7.8-1.3l-1.6-3a7.2 7.2 0 1 0-6.8 4.2"/><path d="M9.2 21v-3.3"/>',
 phys:'<circle cx="13.5" cy="13.5" r="2"/><ellipse cx="13.5" cy="13.5" rx="9" ry="3.6"/><ellipse cx="13.5" cy="13.5" rx="9" ry="3.6" transform="rotate(60 13.5 13.5)"/><ellipse cx="13.5" cy="13.5" rx="9" ry="3.6" transform="rotate(120 13.5 13.5)"/>',
 pre:'<path d="M5 5v16h16"/><path d="M7.5 18.6c3.2 0 3.6-9.4 6.6-9.4 2.6 0 3.3 6 6.6 6"/>',
 sem:'<path d="M4.6 8.2a2 2 0 0 1 2-2h8.6a2 2 0 0 1 2 2v4.4a2 2 0 0 1-2 2h-4l-3.4 2.7v-2.7h-1.2a2 2 0 0 1-2-2z"/><path d="M19.2 10.6h.4a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-.6v2.4l-2.9-2.4"/>',
 span:'<path d="M4.5 8a2.2 2.2 0 0 1 2.2-2.2h12.6A2.2 2.2 0 0 1 21.5 8v7.3a2.2 2.2 0 0 1-2.2 2.2h-7.4L7 21.6v-4.1H6.7a2.2 2.2 0 0 1-2.2-2.2z"/><path d="M11 9.4c.4-.9 1.3-1.4 2.2-1.2 1 .2 1.6 1.1 1.4 2-.2.8-1 1-1.4 1.7"/><path d="M13 14.1h.01"/>',
 apwh:'<circle cx="13" cy="13" r="8.6"/><path d="M4.4 13h17.2"/><ellipse cx="13" cy="13" rx="3.6" ry="8.6"/>',
 biz:'<path d="M5 5v16h16"/><rect x="8.4" y="13" width="3" height="5.2" rx=".8"/><rect x="13.4" y="9.6" width="3" height="8.6" rx=".8"/><rect x="18.4" y="6.4" width="3" height="11.8" rx=".8"/>',
 mor:'<path d="M13 4.5v17"/><path d="M7.5 9.5h11"/>',
 csp:'<path d="m9 8-5 5 5 5"/><path d="m17 8 5 5-5 5"/><path d="m14.5 5-3 16"/>'
};
const icon=id=>'<svg viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(ICON[id]||ICON.apush)+'</svg>';
const LABEL={outline:"guide",practice:"practice",problems:"problems",formulas:"formulas",cards:"cards",timeline:"timeline",checklist:"checklist"};

/* header */
document.documentElement.style.setProperty("--cls",`var(--c-${GUIDE.id})`);
document.title=`${GUIDE.title} · ${GUIDE.cls} · Valentino guides`;
$("#title").textContent=GUIDE.title;
if(GUIDE.sub){$("#sub").textContent=GUIDE.sub;$("#sub").hidden=false}
$("#upd").textContent=GUIDE.updated?`last updated ${GUIDE.updated}`:"";
(function(){
  const c=$("#crow");
  c.appendChild(el("span","cname",icon(GUIDE.id)+"<span>"+esc(GUIDE.cls)+"</span>"));
  if(GUIDE.test){
    const t=new Date(GUIDE.test+"T00:00:00"), e=new Date((GUIDE.end||GUIDE.test)+"T00:00:00");
    const now=new Date(); now.setHours(0,0,0,0);
    const days=Math.round((t-now)/864e5);
    const md=`${t.getMonth()+1}/${t.getDate()}`+(GUIDE.end?`–${e.getMonth()+1}/${e.getDate()}`:"");
    let txt, past=e<now;
    if(past)txt=`test was ${md}`;
    else if(days<=0)txt=`test today · ${md}`;
    else if(days===1)txt=`test tomorrow · ${md}`;
    else if(days<=14)txt=`test in ${days} days · ${md}`;
    else txt=`test ${md}`;
    c.appendChild(el("span","chip"+(past?" past":" due"),esc(txt)));
  }
  if(GUIDE.meta)c.appendChild(el("span","chip",esc(GUIDE.meta)));
})();

/* panes */
const root=$("#root"), panesEl=$("#panes"), pthumb=panesEl.querySelector(".thumb");
const PANES=(GUIDE.panes||[]).filter(id=>Array.isArray(GUIDE[id])&&GUIDE[id].length||(id==="outline"&&GUIDE.top?.length));
const builders={outline:buildOutline,practice:buildPractice,problems:buildProblems,formulas:buildFormulas,cards:buildCards,timeline:buildTimeline,checklist:buildChecklist};
const tabs=[];
PANES.forEach((id,i)=>{
  const sec=el("section","pane"); sec.id="p-"+id; sec.setAttribute("role","tabpanel");
  builders[id](sec); root.appendChild(sec);
  const b=el("button",null,esc((GUIDE.labels||{})[id]||LABEL[id]||id)); b.type="button"; b.setAttribute("role","tab"); b.dataset.pane=id;
  b.addEventListener("click",()=>show(id,true)); panesEl.appendChild(b); tabs.push(b);
});
if(PANES.length<2)panesEl.classList.add("one");
function moveP(){const on=panesEl.querySelector('button[aria-selected="true"]');if(!on)return;pthumb.style.left=on.offsetLeft+"px";pthumb.style.width=on.offsetWidth+"px"}
function show(id,user){
  tabs.forEach(b=>b.setAttribute("aria-selected",String(b.dataset.pane===id)));
  document.querySelectorAll(".pane").forEach(p=>p.classList.toggle("on",p.id==="p-"+id));
  moveP(); if(user){try{history.replaceState(null,"","#"+id)}catch(e){}}
}
const want=location.hash.slice(1);
show(PANES.includes(want)?want:PANES[0],false);
requestAnimationFrame(moveP); addEventListener("resize",moveP);

/* outline */
function shead(txt,extra){const h=el("div","sh",`<h3>${esc(txt)}</h3>`+(extra?`<span class="shx">${esc(extra)}</span>`:""));return h}
function extras(s){
  let h="";
  if(s.cmp)h+=`<div class="cmp"><div><h5>${esc(s.cmp.a.h)}</h5>${s.cmp.a.p.map(x=>`<p>${fmt(x)}</p>`).join("")}</div><div><h5>${esc(s.cmp.b.h)}</h5>${s.cmp.b.p.map(x=>`<p>${fmt(x)}</p>`).join("")}</div></div>`;
  if(s.steps)h+=`<ol class="steps">${s.steps.map(x=>`<li>${fmt(x)}</li>`).join("")}</ol>`;
  if(s.notes)h+=s.notes.map(n=>`<div class="callout ${esc(n.k||"")}"><span class="cl">${({warn:"watch out",ex:"example",ok:"rule"})[n.k]||esc(n.k||"note")}</span>${fmt(n.t)}</div>`).join("");
  if(s.terms?.length)h+=`<div class="terms">${s.terms.map(t=>`<span class="term">${esc(t)}</span>`).join("")}</div>`;
  return h;
}
function buildOutline(sec){
  if(GUIDE.top?.length){
    sec.appendChild(shead("start here","the whole guide in one screen"));
    sec.appendChild(el("div","card top",GUIDE.top.map(x=>`<p>${fmt(x)}</p>`).join("")));
  }
  const list=GUIDE.outline||[]; if(!list.length)return;
  const n3=list.filter(s=>s.w===3).length;
  sec.appendChild(shead("the unit",`${list.length} sections`+(n3?` · ${n3} tested most`:"")));
  const g=el("div","group");
  list.forEach((s,i)=>{
    const row=el("button","row"); row.type="button"; row.setAttribute("aria-expanded",String(s.w===3));
    row.innerHTML=`<span class="rt"><span class="rn">${esc(s.t)}</span>${s.d?`<span class="rd">${esc(s.d)}</span>`:""}</span>`+(s.w>=2?`<span class="w w${s.w}">${s.w===3?"tested most":"tested"}</span>`:"")+CHEV;
    const body=el("div","body"+(s.w===3?" on":""),`<div><div class="in">${(s.p||[]).map(x=>`<p>${fmt(x)}</p>`).join("")}${extras(s)}</div></div>`);
    row.addEventListener("click",()=>{const on=!body.classList.contains("on");body.classList.toggle("on",on);row.setAttribute("aria-expanded",String(on))});
    g.appendChild(row); g.appendChild(body);
  });
  sec.appendChild(g);
  if(GUIDE.abbr&&Object.keys(GUIDE.abbr).length){
    sec.appendChild(shead("abbreviations"));
    sec.appendChild(el("div","card abbr",Object.entries(GUIDE.abbr).map(([k,v])=>`<b>${esc(k)}</b> ${esc(v)}`).join(" · ")));
  }
}

/* practice mc */
function buildPractice(sec){
  const qs=GUIDE.practice||[]; let done=0, right=0;
  sec.appendChild(shead("practice",`${qs.length} questions`));
  const sc=el("div","group score"); sc.innerHTML=`<b id="scn">0</b><span>of ${qs.length} right</span><button type="button" class="btn ghost" id="reset" style="margin-left:auto">start over</button>`; sc.hidden=true; const scn=sc.querySelector("#scn");
  qs.forEach((q,i)=>{
    const card=el("div","group q");
    card.innerHTML=`<div class="qt"><div class="qn">question ${i+1}</div>${fmt(q.q)}</div>`+
      q.opts.map((o,j)=>`<button type="button" class="opt" data-i="${j}"><span class="k">${"abcd"[j]||j+1}</span><span>${fmt(o)}</span></button>`).join("")+
      `<div class="why"><b>${"why"}</b>${fmt(q.why||"")}</div>`;
    card.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>{
      if(card.classList.contains("done"))return;
      card.classList.add("done"); const j=+b.dataset.i;
      if(j===q.a){b.classList.add("right");right++}else{b.classList.add("wrong");card.querySelectorAll(".opt")[q.a].classList.add("right")}
      done++; scn.textContent=right; sc.hidden=false; if(done===qs.length)sc.scrollIntoView({block:"nearest",behavior:REDUCED?"auto":"smooth"});
    }));
    sec.appendChild(card);
  });
  sec.appendChild(sc);
  sc.querySelector("#reset").addEventListener("click",()=>{done=0;right=0;scn.textContent=0;sc.hidden=true;sec.querySelectorAll(".q").forEach(c=>{c.classList.remove("done");c.querySelectorAll(".opt").forEach(o=>o.classList.remove("right","wrong"))});sec.scrollIntoView({behavior:REDUCED?"auto":"smooth"})});
}

/* problems / worked examples */
function buildProblems(sec){
  const ps=GUIDE.problems||[];
  sec.appendChild(shead("problems",`${ps.length} to work`));
  ps.forEach((p,i)=>{
    const card=el("div","group prob");
    card.innerHTML=`<div class="qt"><div class="qn">problem ${i+1}</div>${fmt(p.q)}</div><button type="button" class="go"><span>show the steps</span>${CHEV}</button><div class="reveal"><ol class="steps" style="margin-top:0">${(p.steps||[]).map(s=>`<li>${fmt(s)}</li>`).join("")}</ol>${p.ans?`<div class="ans"><b>answer</b>${fmt(p.ans)}</div>`:""}</div>`;
    const go=card.querySelector(".go");
    go.addEventListener("click",()=>{const on=!card.classList.contains("on");card.classList.toggle("on",on);go.firstElementChild.textContent=on?"hide the steps":"show the steps"});
    sec.appendChild(card);
  });
}

/* formulas */
function buildFormulas(sec){
  const fs=GUIDE.formulas||[];
  sec.appendChild(shead("formulas",`${fs.length}`));
  sec.appendChild(el("div","group",fs.map(f=>`<div class="fx"><span class="n">${esc(f.n)}</span><span class="f">${esc(f.f)}</span>${f.note?`<span class="note">${fmt(f.note)}</span>`:""}</div>`).join("")));
}

/* flashcards */
function buildCards(sec){
  const cs=GUIDE.cards||[]; let i=0, order=cs.map((_,k)=>k);
  sec.appendChild(shead("cards",`${cs.length}`));
  const deck=el("div","deck"); const fc=el("div","fc"); fc.setAttribute("role","button"); fc.tabIndex=0; deck.appendChild(fc); sec.appendChild(deck);
  const nav=el("div","dnav",`<button type="button" class="btn ghost" id="prev">back</button><button type="button" class="btn" id="next">next</button><button type="button" class="btn ghost" id="shuf">shuffle</button><span class="cnt" id="cnt"></span>`); sec.appendChild(nav);
  const cnt=nav.querySelector("#cnt");
  const draw=()=>{const c=cs[order[i]];fc.classList.remove("flip");fc.innerHTML=`<div class="f"><span class="tag">term</span><span>${esc(c.f)}</span></div><div class="b"><span class="tag">${esc(GUIDE.cls)}</span><span>${fmt(c.b)}</span></div>`;cnt.textContent=`${i+1} of ${cs.length}`};
  const flip=()=>fc.classList.toggle("flip");
  fc.addEventListener("click",flip); fc.addEventListener("keydown",e=>{if(e.key===" "||e.key==="Enter"){e.preventDefault();flip()}});
  nav.querySelector("#next").addEventListener("click",()=>{i=(i+1)%cs.length;draw()});
  nav.querySelector("#prev").addEventListener("click",()=>{i=(i-1+cs.length)%cs.length;draw()});
  nav.querySelector("#shuf").addEventListener("click",()=>{for(let k=order.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[order[k],order[j]]=[order[j],order[k]]}i=0;draw()});
  addEventListener("keydown",e=>{if(!sec.classList.contains("on")||e.target.tagName==="INPUT")return;if(e.key==="ArrowRight"){i=(i+1)%cs.length;draw()}if(e.key==="ArrowLeft"){i=(i-1+cs.length)%cs.length;draw()}});
  let x0=null; fc.addEventListener("touchstart",e=>{x0=e.touches[0].clientX},{passive:true}); fc.addEventListener("touchend",e=>{if(x0==null)return;const dx=e.changedTouches[0].clientX-x0;x0=null;if(dx<-40){i=(i+1)%cs.length;draw()}else if(dx>40){i=(i-1+cs.length)%cs.length;draw()}},{passive:true});
  draw();
}

/* timeline */
function buildTimeline(sec){
  const ts=GUIDE.timeline||[];
  sec.appendChild(shead("timeline",`${ts.length} events`));
  sec.appendChild(el("div","card",`<div class="tl">${ts.map(t=>`<div class="ev"><div class="y">${esc(t.y)}</div><div class="t">${fmt(t.t)}</div>${t.d?`<div class="d">${fmt(t.d)}</div>`:""}</div>`).join("")}</div>`));
}

/* checklist */
function buildChecklist(sec){
  const cs=GUIDE.checklist||[]; const key="ck:"+location.pathname; let saved={}; try{saved=JSON.parse(localStorage.getItem(key)||"{}")}catch(e){}
  sec.appendChild(shead("checklist",`${cs.length} items`));
  const g=el("div","group");
  cs.forEach((c,i)=>{
    const b=el("button","ck"+(saved[i]?" on":""),`<span class="box"><svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 6.5l2.5 2.5 4.5-5"/></svg></span><span><span class="t">${fmt(c.t)}</span>${c.d?`<span class="d">${fmt(c.d)}</span>`:""}</span>`);
    b.type="button"; b.addEventListener("click",()=>{b.classList.toggle("on");saved[i]=b.classList.contains("on");try{localStorage.setItem(key,JSON.stringify(saved))}catch(e){}});
    g.appendChild(b);
  });
  sec.appendChild(g);
}

/* theme (shared with the homepage via localStorage "theme") */
const seg=$(".seg"), thumb=$(".seg .thumb"), segBtns=[...seg.querySelectorAll("button")];
function moveThumb(){const on=seg.querySelector('button[aria-pressed="true"]')||segBtns[0];thumb.style.left=on.offsetLeft+"px";thumb.style.width=on.offsetWidth+"px"}
function setTheme(mode){
  const apply=()=>{if(mode==="auto")delete document.documentElement.dataset.theme;else document.documentElement.dataset.theme=mode};
  if(document.startViewTransition&&!REDUCED)document.startViewTransition(apply);else apply();
  segBtns.forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.set===mode)));moveThumb();
  try{mode==="auto"?localStorage.removeItem("theme"):localStorage.setItem("theme",mode)}catch(e){}
}
segBtns.forEach(b=>b.addEventListener("click",()=>setTheme(b.dataset.set)));
(function(){let saved=null;try{saved=localStorage.getItem("theme")}catch(e){}
  const mode=saved==="light"||saved==="dark"?saved:"auto";
  if(mode!=="auto")document.documentElement.dataset.theme=mode;
  segBtns.forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.set===mode)));
})();
requestAnimationFrame(moveThumb);addEventListener("resize",moveThumb);
document.fonts?.ready.then(()=>{moveThumb();moveP()});

/* sticky bar shadow + staggered reveal */
(function(){const bar=$("#bar");let raf=0;const tick=()=>{raf=0;bar.classList.toggle("stuck",scrollY>6)};addEventListener("scroll",()=>{if(!raf)raf=requestAnimationFrame(tick)},{passive:true});tick()})();
document.querySelectorAll(".rv").forEach((n,i)=>n.style.animationDelay=(i*55)+"ms");
</script>
