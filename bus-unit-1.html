*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--text);
  font-optical-sizing:auto;font-size:17px;line-height:1.45;letter-spacing:-.012em;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;min-height:100vh;
  padding-bottom:calc(48px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
:focus-visible{outline:2.5px solid var(--blue);outline-offset:3px;border-radius:11px}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}
.hidden{display:none !important}

#amb{position:fixed;inset:-20vh -20vw;z-index:-1;pointer-events:none;contain:strict;
  filter:blur(var(--amb-blur)) saturate(160%);opacity:var(--amb);
  animation:hue 120s linear infinite}

@keyframes hue{
  0%,100%{filter:blur(var(--amb-blur)) saturate(160%) hue-rotate(-7deg)}
  50%    {filter:blur(var(--amb-blur)) saturate(172%) hue-rotate(7deg)}
}
#amb i{position:absolute;display:block;border-radius:50%;animation:drift 38s var(--ease) infinite alternate}
#amb i:nth-child(1){width:64vw;height:64vw;left:-12vw;top:-10vh;
  background:radial-gradient(circle,var(--amb1),transparent 66%)}
#amb i:nth-child(2){width:58vw;height:58vw;right:-14vw;top:8vh;
  background:radial-gradient(circle,var(--amb2),transparent 66%);
  animation-duration:45s;animation-delay:-10s}
#amb i:nth-child(3){width:70vw;height:70vw;left:2vw;top:46vh;
  background:radial-gradient(circle,var(--amb3),transparent 66%);
  animation-duration:41s;animation-delay:-20s}
#amb i:nth-child(4){width:54vw;height:54vw;right:-8vw;top:64vh;
  background:radial-gradient(circle,var(--amb4),transparent 66%);
  animation-duration:48s;animation-delay:-30s}
@keyframes drift{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(7vw,-6vh,0) scale(1.2)}}

.g{position:relative;isolation:isolate;background:var(--glass);
  -webkit-backdrop-filter:blur(var(--blur)) saturate(var(--sat));
  backdrop-filter:blur(var(--blur)) saturate(var(--sat));box-shadow:var(--shadow)}
.g::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;
  pointer-events:none;z-index:3;
  background:linear-gradient(150deg,var(--rim-a),var(--rim-b) 32%,transparent 56%,var(--rim-c));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  mask-composite:exclude}
.g::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:2;

.spec{position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:2;opacity:0;
  background:radial-gradient(260px circle at var(--mx,50%) var(--my,0%),var(--spec),transparent 68%);
  transition:opacity .4s var(--ease)}

@media (hover:hover){.g:hover > .spec{opacity:1}}

/* header */
header{position:sticky;top:0;z-index:40;background:var(--glass);
  -webkit-backdrop-filter:blur(20px) saturate(var(--sat));backdrop-filter:blur(20px) saturate(var(--sat));
  transition:background .4s var(--ease),box-shadow .4s var(--ease)}
header.stuck{background:var(--glass-hi);box-shadow:inset 0 -.5px 0 0 var(--sep),0 6px 26px -12px rgba(14,14,38,.4)}
.hrow{display:flex;align-items:center;gap:12px;padding:14px 0 12px}
.glyph{width:40px;height:40px;border-radius:12px;flex:none;
  background:linear-gradient(160deg,color-mix(in srgb,var(--accent) 80%,#fff),var(--accent));
  box-shadow:inset 0 .5px 0 rgba(255,255,255,.55),0 4px 10px -4px rgba(0,0,0,.4)}
.cls{font-family:var(--round);font-size:12.5px;font-weight:740;color:var(--accent);text-transform:lowercase}
h1{margin:0;font-family:var(--display);font-size:23px;font-weight:780;letter-spacing:-.042em;
  line-height:1.08;text-transform:lowercase}
.chip{font-family:var(--round);font-size:12.5px;font-weight:700;padding:5px 11px;border-radius:999px;
  background:color-mix(in srgb,var(--accent) 22%,transparent);color:var(--accent);
  white-space:nowrap;margin-left:auto;flex:none;text-transform:lowercase}

/* segmented control */
.seg{position:relative;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:2px;
  background:var(--fill);border-radius:11px;padding:2px;margin-bottom:14px;
  box-shadow:inset 0 .5px 0 0 var(--gloss)}
.seg button{position:relative;z-index:1;padding:7px 4px;border-radius:9px;font-family:var(--round);
  font-size:13.5px;font-weight:640;color:var(--ink2);text-transform:lowercase;
  transition:color .25s var(--ease)}
.seg button[aria-selected="true"]{color:var(--ink)}
.seg .ind{position:absolute;z-index:0;top:2px;bottom:2px;border-radius:9px;background:var(--glass-hi);
  box-shadow:inset 0 .5px 0 0 var(--gloss),0 2px 6px -2px rgba(0,0,0,.28);
  transition:transform .42s var(--spring),width .42s var(--spring)}

main{padding-top:20px}
.sh{font-family:var(--round);font-size:13.5px;font-weight:680;color:var(--ink3);

  margin:30px 4px 10px;text-transform:lowercase}
.sh:first-child{margin-top:0}

/* outline */
.card{border-radius:18px;overflow:hidden;margin-bottom:10px}
.chead{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:14px 16px;
  position:relative;z-index:1;transition:transform .34s var(--spring)}
.chead:active{transform:scale(.99)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--accent);flex:none;
  box-shadow:0 0 10px color-mix(in srgb,var(--accent) 70%,transparent)}
.ct{flex:1;font-size:16.5px;font-weight:580;letter-spacing:-.018em;text-transform:lowercase}
.tw{color:var(--ink3);transition:transform .34s var(--spring)}
.chead[aria-expanded="true"] .tw{transform:rotate(90deg)}
.cbody{display:grid;grid-template-rows:0fr;transition:grid-template-rows .44s var(--spring)}
.cbody.on{grid-template-rows:1fr}
.cbody > div{overflow:hidden}
.cbody p{margin:0 0 10px;padding:0 16px;font-size:15.5px;line-height:1.5;color:var(--ink2);
  text-transform:lowercase}
.cbody p:last-child{padding-bottom:16px}
.terms{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 16px}
.term{font-family:var(--round);font-size:12.5px;font-weight:640;padding:5px 10px;border-radius:9px;
  background:var(--fill2);color:var(--ink2);box-shadow:inset 0 .5px 0 0 var(--gloss);
  text-transform:lowercase}

/* practice */
.qcard{border-radius:18px;padding:18px 16px;margin-bottom:12px}
.qn{font-family:var(--round);font-size:12px;font-weight:740;color:var(--ink3);text-transform:lowercase}
.qt{margin:6px 0 14px;font-size:17px;font-weight:560;line-height:1.35;letter-spacing:-.02em;
  text-transform:lowercase}
.opt{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:12px 13px;
  border-radius:12px;background:var(--fill2);margin-bottom:7px;font-size:15.5px;
  box-shadow:inset 0 .5px 0 0 var(--gloss);text-transform:lowercase;

  transition:background .2s var(--ease),transform .3s var(--spring)}
.opt:active{transform:scale(.988)}
.opt .k{font-family:var(--round);font-weight:740;font-size:13px;color:var(--ink3);flex:none;
  width:20px;text-transform:uppercase}
.opt.right{background:color-mix(in srgb,var(--good) 20%,transparent);color:var(--good)}
.opt.wrong{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.opt.right .k,.opt.wrong .k{color:inherit}
.why{margin:10px 2px 0;font-size:13.5px;line-height:1.5;color:var(--ink3);text-transform:lowercase}

/* flashcards */
.deck{perspective:1400px;margin-bottom:14px}
.fc{position:relative;width:100%;min-height:210px;transform-style:preserve-3d;
  transition:transform .62s var(--spring);cursor:pointer}
.fc.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  border-radius:20px;display:grid;place-items:center;padding:26px;text-align:center}
.face.back{transform:rotateY(180deg)}
.face .fw{font-family:var(--display);font-size:24px;font-weight:760;letter-spacing:-.036em;
  line-height:1.15;text-transform:lowercase;position:relative;z-index:1}
.face.back .fw{font-family:var(--text);font-size:16.5px;font-weight:480;letter-spacing:-.014em;
  line-height:1.45;color:var(--ink2)}
.fbar{display:flex;align-items:center;gap:12px}
.fbar button{font-family:var(--round);font-size:14px;font-weight:660;color:var(--blue);
  padding:8px 12px;border-radius:10px;text-transform:lowercase}
.fcount{margin-left:auto;font-family:var(--round);font-size:13px;color:var(--ink3);
  font-variant-numeric:tabular-nums}

.rise{opacity:0;transform:translateY(18px) scale(.98);filter:blur(8px);
  animation:rise .9s var(--spring) forwards;animation-delay:calc(var(--i,0)*55ms)}
@keyframes rise{to{opacity:1;transform:none;filter:blur(0)}}

footer{text-align:center;font-size:12.5px;line-height:1.6;color:var(--ink3);padding:42px 8px 6px;

  text-transform:lowercase}

@media (prefers-reduced-motion:reduce){
  #amb,#amb i{animation:none}
  .rise{opacity:1;transform:none;filter:none;animation:none}
  *,*::before,*::after{transition-duration:.01ms !important;animation-duration:.01ms !important}
}

/* review-sheet rows nested inside a lesson card */
.item{border-top:.5px solid var(--sep)}
.item:first-child{border-top:0}
.ihead{display:flex;align-items:flex-start;gap:9px;width:100%;text-align:left;
  padding:12px 15px;position:relative;z-index:1;transition:transform .3s var(--spring)}
.ihead:active{transform:scale(.993)}
.inum{font-family:var(--round);font-size:11.5px;font-weight:740;color:var(--accent);
  flex:none;min-width:16px;padding-top:3px;font-variant-numeric:tabular-nums;
  text-transform:lowercase}
.iq{flex:1;font-size:15px;font-weight:520;line-height:1.35;letter-spacing:-.014em;
  text-transform:lowercase}
.itw{color:var(--ink3);flex:none;margin-top:4px;transition:transform .3s var(--spring)}
.ihead[aria-expanded="true"] .itw{transform:rotate(90deg)}
.ibody{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s var(--spring)}
.ibody.on{grid-template-rows:1fr}
.ibody > div{overflow:hidden}
.ibody p{margin:0 0 9px;padding:0 15px 0 40px;font-size:14.5px;line-height:1.5;
  color:var(--ink2);text-transform:lowercase}
.ibody p:last-child{padding-bottom:13px}
.ibody .terms{padding:0 15px 14px 40px}

/* practice test */
.pt{font-family:var(--round);font-size:12px;font-weight:740;color:var(--ink3);
  text-transform:lowercase;margin:24px 4px 9px}

.pt:first-child{margin-top:2px}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.mopt{display:block;width:100%;text-align:left;padding:11px 12px;border-radius:12px;
  background:var(--fill2);font-size:13.5px;line-height:1.35;
  box-shadow:inset 0 .5px 0 0 var(--gloss);text-transform:lowercase;
  transition:background .2s var(--ease),transform .3s var(--spring),color .2s var(--ease)}
.mopt:active{transform:scale(.985)}
.mopt.sel{background:color-mix(in srgb,var(--accent) 24%,transparent);color:var(--accent)}
.mopt.right{background:color-mix(in srgb,var(--good) 20%,transparent);color:var(--good)}
.mopt.wrong{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.mcount{font-family:var(--round);font-size:13px;color:var(--ink3);text-transform:lowercase;
  font-variant-numeric:tabular-nums;margin:12px 2px 0}
.stem{font-size:15.5px;line-height:1.5;color:var(--ink2);margin:4px 0 2px;text-transform:lowercase}
.sq{font-size:15.5px;font-weight:540;line-height:1.4;margin:15px 0 9px;text-transform:lowercase}
.rv{font-family:var(--round);font-size:13.5px;font-weight:660;color:var(--blue);
  padding:7px 12px;border-radius:10px;background:var(--fill2);text-transform:lowercase;
  box-shadow:inset 0 .5px 0 0 var(--gloss);transition:transform .3s var(--spring)}
.rv:active{transform:scale(.985)}
</style>

    { n:"11", q:"What do businesses do?",
      a:["Business is about people managing business functions. Use that sentence.",
         "Everything else is a subset of one of the six. Manufacturing sits under operations. Promotion and product/service management sit under marketing."] },
    { n:"12", q:"How do the business functions work together?",
      a:["They are interdependent, and a weak one drags the others. Marketing sells 500 orders, human resources never hired the second producer, so operations cannot fill them and finance never sees the revenue.",
         "On the 1-1 quiz: strategy, information management and marketing are the three that work together to compile information about the target market."] },
    { n:"13", q:"Describe the importance of a mission for a business",
      a:["It keeps the organization on the same page and focused on the journey. Great companies are anchored in their mission, and it informs everything else, including strategy.",
         "Every employee action needs to connect back to it. Without one, strategy has nothing to aim at: if you do not know where you are going, any road will get you there."] },
    { n:"", q:"For each of the 6 business functions, tell me at least ONE aspect of that area",
      a:["Human resources: onboarding a new hire. Strategy: setting the mission and the goals. Information management: pulling last quarter's sales data.",
         "Operations: quality control before anything ships. Marketing: choosing the target market and pricing. Finance and accounting: recording the sales, then deciding if there is cash for the next machine."] },
    { n:"", q:"Review the 1-1 lesson quiz, 18 questions",
      a:["All 18 are in the tests tab under quizzes, part a, with answers.",
         "The traps there: customer service is one of marketing's eight functions, not a business function. Accounting records and reports, finance manages and plans. Both get asked back to back."] }
  ]},

  { t:"unit 1-2: management", items:[
    { n:"", q:"What is management?",
      a:["Planning, organizing, staffing, controlling and leading people, processes and assets in order to achieve a goal or task in the best way possible.",
         "On the board it is five verbs: plans, organizes, staffs, controls, leads. Leads is the one he starred and tied to company culture."] },

    { n:"", q:"What percent of employees left a job because of a manager or leader?",
      a:["57 percent, from a 2019 study. Board wording: they leave because of poor leadership. People leave managers, not companies."] },
    { n:"1", q:"Glossary terms",
      a:["Chain of command, company culture, company values, emotional intelligence, leadership, management, people skills, problem-solving skills, procedural skills, staffing.",
         "All ten are in the flashcards tab. Company values are the claim, company culture is whether it is true on a busy night."],
      terms:["chain of command","company culture","company values","emotional intelligence","leadership","people skills","procedural skills","staffing"] },
    { n:"2", q:"What do managers manage?",
      a:["People, processes and assets, straight from the definition. And the six business functions, working with human resources plus operations, accounting and information management."] },
    { n:"3", q:"What are the functions of management?",
      a:["Planning maps the course of action and what people and resources are needed. Organizing arranges them. Staffing means recruit, interview, hire and orient. Controlling checks results against the goal, measures the metrics and corrects. Leading is communicating, motivating, guiding, coaching and reviewing.",
         "The lesson graphic shows only four, dropping organizing, but the written definition and the review sheet both list five. Answer five."] },
    { n:"4", q:"What business functions do managers manage?",
      a:["All six: human resources, strategy, information management, operations, marketing, finance and accounting."] },
    { n:"5", q:"What is the role of leadership in managing business functions and companies?",
      a:["Leadership inspires, motivates, influences and maximizes the efforts of people toward a common purpose.",
         "How managers treat others reveals their leadership and the true character of a company. Values put into practice build the culture, so how managers manage is what makes or breaks the company."] },
    { n:"6", q:"What skills are required to be an effective manager?",
      a:["Problem-solving: good trade-offs with limited resources. People skills: empathizing and understanding while still influencing, communicating and interacting. Procedural: learning and performing methods and sequences quickly.",
         "On the board the fourth item is leadership, annotated inspire and motivate. The review sheet glossary lists emotional intelligence instead. Know both."] },
    { n:"7", q:"What is the chain of command?",
      a:["An organizational structure that shows who each person reports to.",
         "Front-line and entry-level employees report to supervisors, supervisors report to middle managers, middle managers report to executives. Big companies stack many layers inside the middle."] },
    { n:"8", q:"What are levels of management, and why are they important?",
      a:["Officer and executive handle vision, strategy and the big decisions. Middle management is the link between senior management and the lower levels. Supervisory runs the day to day, and front-line employees report to them.",
         "He compared the levels at this school against Apple. School: president and principal, then deans and department chairs, then teachers and moderators, then students. Apple: CEO and CFO, then regional and store managers, then shift leads, then the floor.",
         "They matter because they are what the chain of command is built from, and the skill mix changes at each level."] },
    { n:"9", q:"What is the difference between management and leadership?",
      a:["Management is doing things right, leadership is doing the right things. Another framing: leaders initiate a plan and managers execute it.",
         "It is not that clean, because leaders also manage and managers also lead. The difference may have more to do with a focus on growth.",
         "Colin Powell: leadership is the art of accomplishing more than the science of management says is possible."] },
    { n:"10", q:"Does leadership quality affect employees? How? What percent leave?",
      a:["Yes. We spend most of our productive years working, and managers are often the deciding factor in whether someone likes their work and whether they stay.",

         "Managers have a big impact, good and bad, on the work environment and on work enjoyment. 57 percent of employees have left a job because of a manager or leader."] },
    { n:"", q:"Review the 1-2 scenario: a friend gets promoted to coffee supervisor",
      a:["The exact scenario text is not in the lesson notes, so this is the shape of the answer.",
         "The friendship and the chain of command are now separate things: work decisions go by policy and performance. No favoritism, same rules and standards and discipline for everyone. Set expectations early, before there is a conflict.",
         "Supervisory work leans on procedural skills, plus people skills to empathize while still directing. How you treat people as a manager shapes the culture. Being liked is not the job."] },
    { n:"\u2605", q:"From the board: the 5 stages of the entrepreneurial process",
      a:["Its own box on the review board, and it is not on the review sheet or in the lesson notes, so expect a question.",
         "Discovery, business plan, resourcing, run business, harvesting. Discovery is finding the idea. The business plan is writing it down. Resourcing is getting the money, people and equipment. Run business is operating it. Harvesting is the payoff at the end, selling it or cashing out."],
      terms:["discovery","business plan","resourcing","run business","harvesting"] }
  ]},

  { t:"unit 1-3: human resources", items:[
    { n:"1", q:"Understand ethical and legal issues that impact business",
      a:["Businesses follow employment law on discrimination, harassment, wages and safety, then act ethically on top of it, because plenty of things are legal and still wrong.",
         "Getting it wrong costs lawsuits, fines, turnover and reputation, and most of it lands on human resources."] },
    { n:"2", q:"Understand the role and function of human resources",
      a:["Human resources is the people who work in an organization, and the group that staffs the organization, maintains personnel records, and administers benefits like medical insurance.",
         "As a business function it recruits, hires, onboards, trains, evaluates and terminates. Its C word is cultivate."] },
    { n:"3", q:"Explain the role of human resources in business operations",
      a:["HR works with all five other functions to plan their staffing needs. Every other function needs staffed, trained, motivated people to work at all, so HR failure shows up as an operations failure or a lawsuit."] },
    { n:"4", q:"Explain the role of human resources in business",
      a:["Finding, cultivating and keeping key people is the primary determinant of whether a business succeeds or fails. When companies get it right it is usually the leading indicator of future success."] },
    { n:"5", q:"Explain the role of ethics in human resources management",
      a:["HR decides who gets hired, what they are paid, who gets promoted and who gets fired. All of that affects livelihoods and all of it is legally exposed.",
         "Ethical HR means fair and consistent treatment, confidentiality of personnel records, no discrimination or favoritism, honest job descriptions, and walking the talk of the company values."] },
    { n:"6", q:"Describe the hiring / firing process",
      a:["Hiring: be clear about the job description and expectations, know the education, experience and skills wanted, recruit and screen, interview with more than one interviewer and share notes, use personality surveys and aptitude tests, then hire, orient, onboard and train.",
         "Firing: document performance, run performance management, follow the law and company policy, terminate, then hold an exit interview.",
         "Why be methodical: recruiting, interviewing, background checks, hiring, orienting and training is expensive, so a hire that fails in a few months wastes all of it. Retraining is usually cheaper than hiring again."] },
    { n:"7", q:"Describe the hiring / firing process",
      a:["Listed twice on his sheet. Same answer as 6."] },
    { n:"8", q:"Business management",

      a:["Human resources is one of the six functions managers manage. The manager runs day-to-day performance and discipline, HR owns the process, the records and the legal side."] },
    { n:"9", q:"Understand ethical and legal issues that impact business",
      a:["Repeat of 1."] },
    { n:"10", q:"Explain the role of employment law as it relates to the national marketplace",
      a:["Federal law sets rules that apply everywhere and states add their own on top, which is why HR has to know employee laws by state.",
         "The one the lesson names is the Equal Employment Opportunity Act. Others worth knowing: the Americans with Disabilities Act, the Age Discrimination in Employment Act, the Fair Labor Standards Act, FMLA, and OSHA."] },
    { n:"11", q:"Explain the different types of agents that govern employment",
      a:["Federal agencies like the EEOC, OSHA and the Department of Labor. State labor agencies and state law. Courts, which decide discrimination and wrongful termination claims.",
         "Plus the internal ones: employment contracts, company policy and the employee handbook, and unions."] },
    { n:"12", q:"Understand the role and function of human resources",
      a:["Repeat of 2."] },
    { n:"13", q:"Explain the role of human resources in business operations",
      a:["Repeat of 3."] },
    { n:"14", q:"Explain the role of human resources in business",
      a:["Repeat of 4."] },
    { n:"15", q:"Explain the role of ethics in human resources management",
      a:["Repeat of 5."] },
    { n:"16", q:"Describe the hiring / firing process",
      a:["Repeat of 6."] },
    { n:"17", q:"Describe the hiring / firing process",
      a:["Repeat of 6. Four of the twenty objectives on his sheet are this one question."] },
    { n:"18", q:"Evaluate practices to manage and retain staff",
      a:["Competitive compensation checked against the market rate, employee benefits, a culture that walks the talk of its values, training and professional development, good managers, clear job descriptions, fair appraisals, retraining instead of replacing, and exit interviews that actually change something.",
         "Good managers matter most, since 57 percent leave because of a manager or leader."] },
    { n:"19", q:"Examine strategies to assess employee performance",
      a:["Performance management processes that HR makes sure exist and are complied with. Reviews and appraisals, in some companies twice per year, run primarily by the direct supervisor and sometimes including feedback from fellow employees.",
         "Also checking that training was thoroughly given and understood before concluding someone is a bad fit."] },
    { n:"20", q:"Explain the need for employee development, growth, and recognition",
      a:["Training gives people the skills for the job they have. Professional development is the ongoing education that lets them excel in their career. Great companies cultivate, serve and develop their people, which is why cultivate is the C attached to HR.",
         "Branson: train people well enough so they can leave, treat them well enough so they do not want to."] },
    { n:"21", q:"Glossary terms",
      a:["Company culture, company values, compensation, employee benefits, employee appraisal, employee relations, employee termination, exit interviews, human resources, job description, onboarding, orientation, performance management, professional development, recruiting, staffing, training.",

         "All seventeen are in the flashcards tab in his wording. Orientation versus onboarding is the one that decides points."],
      terms:["orientation","onboarding","compensation","recruiting","job description","performance management"] },
    { n:"22", q:"What is the human resources business function?",
      a:["Same as 2. The people function: get them, keep them, pay them, develop them, and stay legal doing it."] },
    { n:"23", q:"Why is human resources so important?",
      a:["Because business is about people. Every other function is only as good as the people running it, and HR is what makes them show up and stay.",
         "HR is also what keeps the company out of court on hiring, firing and safety. It is a hard job because it deals with people at every stage of their careers."] },
    { n:"24", q:"What activities does the human resources function perform?",
      a:["The twelve from the notes, in order: recruiting, staffing, legal issues, job descriptions, orientation and onboarding, training and professional development, performance management, compensation, company culture, employee terminations, exit interviews, employee benefits.",
         "Compensation is total cash and benefits. Training teaches the job you already have, professional development is career-wide."] },
    { n:"25", q:"How are legal issues a major part of human resources?",
      a:["HR needs the dos and don'ts of hiring. The Equal Employment Opportunity Act blocks questions that could create even the appearance of discrimination: age, country of origin, marital status, and sex on the board.",
         "Terminations need the same care plus documented performance records, so a wrongful termination claim can be defended. Interviews and terminations are the two functions needing the most legal knowledge, and that pairing was a quiz answer."] },
    { n:"26", q:"What is HR's involvement in company expansions and downsizings?",
      a:["Expansion: planning staffing needs with the other five functions, writing job descriptions, recruiting and interviewing at volume, onboarding and training, and complying with employment law wherever the company grows.",
         "Downsizing: handling terminations with legal care and documentation, running exit interviews, and protecting the morale and culture of everyone who stays."] },
    { n:"27", q:"What trends create challenges for HR and require HR to adapt?",
      a:["Forms of communication keep changing and technology changes rapidly. Virtual and remote work make it harder for managers to see and interact with their teams.",
         "Competition for talent, since great companies are looking for rockstars to join their band. Employment law that varies by state. The cost of turnover and bad hires."] },
    { n:"28", q:"What does \"business is about people\" mean?",
      a:["In Good to Great, Jim Collins says first who, then what. Get the right people on the bus, and in the right seats, meaning roles matching their interests, skills and experience, before you figure out where to drive the bus.",
         "His reasoning: with constant change, the right people adapt and solve whatever comes. Great vision does not matter without great people to respond when things get hard.",
         "Know the author, the book, the phrase and the bus analogy."] },
    { n:"", q:"Review the 1-3 lesson quiz, 12 questions",
      a:["All 12 are in the tests tab under quizzes, part b, with answers. This one can be retried, so retake it.",
         "Question 6 is orientation, not onboarding. Its stem is the orientation definition word for word. Question 7 is onboarding and question 8 is orientation."] },
    { n:"", q:"Class assignment: best places to work",
      a:["Name a company and say why in the course vocabulary, not your own words.",
         "In-N-Out: above-market pay, which is compensation, and health coverage for part-timers, which is employee benefits. He names it in the notes himself. NVIDIA: culture and almost no layoffs. Bain: mentorship and promote from within, which is professional development. Crew Carwash: entry-level hiring with a promotion path plus tuition assistance."] },
    { n:"\u2605", q:"From the board: the right people, and the 6 employee benefits",
      a:["The right people means interests, skills and experience matched to the role, so the employee is productive and fulfilled. He starred that pairing.",
         "The six benefits, circled and marked VIP: health meaning medical, dental and vision. Retirement, a 401k and stock options. PTO, paid time off, plus sick time. Life insurance plus long and short term disability. Maternity and paternity, bereavement, and mental health. Free childcare or reimbursement.",

         "Professional development sits next to it with four: school reimbursement, continuing education, paid training, educational seminars. The best places to work checklist runs company culture, company values, compensation, employee benefits, professional development."],
      terms:["health","retirement","PTO","life insurance","maternity","childcare"] }
  ]},

  { t:"unit 1-4: strategy", items:[
    { n:"1", q:"Glossary terms",
      a:["Business strategy, goal, marketing strategy, mission, objective, strategy, tactic, vision.",
         "Timeframes are the giveaway. A goal is stated, observable and measurable within a timeframe, long term, even 3 to 5 years. An objective is more specific, achieved within a timeframe with available resources, usually one year."],
      terms:["business strategy","marketing strategy","goal","objective","tactic","mission","vision"] },
    { n:"2", q:"What is the strategy business function?",
      a:["Strategy is a route or plan of action designed to achieve certain goals and objectives, and it is informed by the company's vision and mission.",
         "It is not just a department by itself. Strategy is everywhere, and it affects, or should affect, every decision a company makes."] },
    { n:"3", q:"Why is strategy important? What exactly is strategy?",
      a:["It answers what a company should be doing and, more importantly, helps it say no to what it should not be doing. It provides a map, a route, a direction, a plan. The clearer the plan, the clearer the expectations for employees.",
         "Picasso: goals can only be reached through the vehicle of a plan. Lee Bolman: a vision without a strategy remains an illusion."] },
    { n:"4", q:"What is the difference between business strategy and marketing strategy?",
      a:["Business strategy is a business's route or plan of action to achieve goals and objectives. It includes choosing what business to be in, is built around how the product is unique, and ensures the company earns a profit.",
         "Marketing strategy is the game plan for reaching the target market and converting it to customers. It shines a light on that uniqueness, positions the brand through the 4Ps, and ensures the products earn a profit.",
         "One-line version: business strategy means the company earns a profit, marketing strategy means the products do."] },
    { n:"5", q:"What is the role of a leader or manager in developing strategy?",
      a:["Begin with the end in mind. Contemplate the mission first, since mission informs everything else including strategy, then pick the route.",
         "Decide what the company should be doing and say no to the rest. Set goals over 3 to 5 years and the objectives of about a year that ladder up to them, and work with human resources on the structure to deliver it."] },
    { n:"6", q:"What is the role of a leader or manager in managing strategy?",
      a:["Turn the strategy into tactics, the specific procedures and actions that support it. Make the plan clear enough that employees know exactly what is expected.",
         "Track KPIs, since what gets measured gets done, and use the controlling function of management to check results against the goal and correct course. Every employee action needs to connect back to the mission and vision."] },
    { n:"7", q:"How is the strategy function interrelated with the other business functions?",
      a:["Eight places strategy is found: purpose, people, action, key performance indicators, then information management, operations, finance and accounting, and marketing. The last four are just the other business functions.",
         "The quiz pairings, worth memorizing: with human resources it determines who reports to whom. With information management it ensures the proper data is mined and analyzed. With operations it ensures all actions and tactics are aligned to goals. With finance it influences capital structure and debt.",
         "Strategy is carried out through tactics, goals and objectives. Mission and vision inspire, they are not the how."],
      terms:["purpose","people","action","KPIs"] },
    { n:"", q:"We know for profit, but what is non-profit?",
      a:["Both count as business under the definition, which says a for-profit or non-profit organization.",

         "A for-profit earns a profit for its owners. A non-profit serves a mission, and the money goes back into that mission rather than to owners. It is usually funded by donations and volunteers.",
         "His angle: a charity's vision could amount to putting itself out of business. If everyone had a home, Habitat would have nothing left to build."] },
    { n:"", q:"What is Habitat for Humanity? What is their mission and vision?",
      a:["A non-profit that brings people together to build homes for people in need. Ask it his way: what do they do? Bring people together to build homes. Why? To build communities and to build hope.",
         "Mission: seeking to put God's love into action, Habitat for Humanity brings people together to build homes, communities and hope. Vision: a world where everyone has a decent place to live.",
         "On the 1-4 quiz the vision option is worded a world where everyone has a home."] },
    { n:"", q:"What about IKEA, what is their mission and vision?",
      a:["Mission: to offer a wide range of well-designed, functional home furnishing products at prices so low that as many people as possible will be able to afford them.",
         "Vision: to create a better everyday life for the many people.",
         "The mission is what they do. If they pull it off, the vision comes true. Flat-pack furniture exists because of that mission, since it cuts shipping and labor cost."] },
    { n:"", q:"Review the 1-4 lesson quiz, 20 questions",
      a:["All 20 are in the tests tab under quizzes, part c, with answers. This one can be retried, so retake it.",
         "Four questions map strategy onto a function, and one is a select-THREE and one a select-TWO. Those are the ones to run twice."] },
    { n:"", q:"Class assignment: mission and vision",
      a:["Mission is the why you exist and the what you do. Vision is the where you end up if successful.",
         "Other pairs from the notes. Southwest: warm, friendly, prideful, spirited high quality customer service, with a vision of the world's most loved, most flown and most profitable airline. Nike: expanding human potential through sustainable sports innovation, with a vision of bringing inspiration and innovation to every athlete in the world."] },
    { n:"\u2605", q:"From the board: this school's mission and vision, and the student goal example",
      a:["He starred this school next to mission, so know it. Mission: to teach students the Gospel of Jesus Christ, prepare students for higher education, and create a community where service is valued and celebrated. Vision: to be a national leader in college preparatory education in an environment distinguished by Catholic values.",
         "His student example for goal versus objective: the goal is to graduate in four years. The objectives are to maintain a 3.0 GPA and complete AP courses. Accomplish the objectives and you accomplish the goal."],
      terms:["mission","vision","goal","objective"] }
  ]}
  ],

    'stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" '+
    'aria-hidden="true"><path d="M1 1l6 6-6 6"/></svg></button>'+
    '<div class="cbody"><div class="cin"></div></div>';
  card.querySelector(".ct").textContent=s.t;
  const box=card.querySelector(".cin");
  s.items.forEach(it=>{
    const row=el("div","item");
    row.innerHTML='<button class="ihead" aria-expanded="false"><span class="inum"></span>'+
      '<span class="iq"></span><svg class="itw" width="7" height="12" viewBox="0 0 8 14" fill="none" '+
      'stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" '+
      'aria-hidden="true"><path d="M1 1l6 6-6 6"/></svg></button>'+
      '<div class="ibody"><div></div></div>';
    row.querySelector(".inum").textContent=it.n||"";
    row.querySelector(".iq").textContent=it.q;
    const bd=row.querySelector(".ibody > div");
    it.a.forEach(t=>{const p=el("p");p.textContent=t;bd.appendChild(p)});
    if(it.terms){
      const tb=el("div","terms");
      it.terms.forEach(t=>{const c=el("span","term");c.textContent=t;tb.appendChild(c)});
      bd.appendChild(tb);
    }

    const ih=row.querySelector(".ihead"), ib=row.querySelector(".ibody");
    ih.onclick=()=>{const o=ih.getAttribute("aria-expanded")==="true";
      ih.setAttribute("aria-expanded",String(!o));ib.classList.toggle("on",!o)};
    box.appendChild(row);
  });
  const head=card.querySelector(".chead"), body=card.querySelector(".cbody");
  head.onclick=()=>{const o=head.getAttribute("aria-expanded")==="true";
    head.setAttribute("aria-expanded",String(!o));body.classList.toggle("on",!o)};
  if(!REDUCED){card.classList.add("rise");card.style.setProperty("--i",i)}
  $("#p-outline").appendChild(card);
});

/* practice tests: matching, multiple choice, scenarios, free response */
(function(){
  const host=$("#p-tests");
  const seg=el("div","seg"); seg.setAttribute("role","tablist");
  const ind=el("span","ind"); seg.appendChild(ind); host.appendChild(seg);
  const panels=[];

  const shuffle=a=>{const b=a.slice();
    for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}
    return b};

  const part=(txt)=>{const d=el("div","pt");d.textContent=txt;return d};

  function matching(pairs){
    const card=el("div","qcard g");
    card.innerHTML='<span class="spec" aria-hidden="true"></span>'+
      '<div class="qn">part a. matching</div>'+
      '<div class="qt">tap a term, then tap its match.</div>';
    const grid=el("div","mgrid");
    const left=el("div"), right=el("div");

    left.style.display=right.style.display="grid";
    left.style.gap=right.style.gap="7px";
    left.style.alignContent=right.style.alignContent="start";
    const defs=shuffle(pairs.map((p,i)=>({d:p.d,i:i})));
    let sel=null, done=0;
    const count=el("div","mcount");
    const tick=()=>count.textContent=done+" of "+pairs.length+" matched";
    pairs.forEach((p,i)=>{
      const b=el("button","mopt"); b.textContent=p.t; b.dataset.i=i;
      b.onclick=()=>{ if(b.dataset.done)return;
        left.querySelectorAll(".mopt").forEach(x=>x.classList.remove("sel"));
        b.classList.add("sel"); sel=b; };
      left.appendChild(b);
    });
    defs.forEach(o=>{
      const b=el("button","mopt"); b.textContent=o.d; b.dataset.i=o.i;
      b.onclick=()=>{ if(b.dataset.done||!sel)return;
        if(b.dataset.i===sel.dataset.i){
          b.classList.add("right"); sel.classList.remove("sel"); sel.classList.add("right");
          b.dataset.done=sel.dataset.done="1"; sel=null; done++; tick();
        }else{
          b.classList.add("wrong");
          setTimeout(()=>b.classList.remove("wrong"),520);
        } };
      right.appendChild(b);
    });
    grid.append(left,right); card.append(grid,count); tick();
    return card;
  }

  function mcq(q,n){
    const card=el("div","qcard g");

    card.innerHTML='<span class="spec" aria-hidden="true"></span>'+
      '<div class="qn">question '+n+'</div><div class="qt"></div>';
    card.querySelector(".qt").textContent=q.q;
    q.opts.forEach((o,j)=>{
      const b=el("button","opt");
      b.innerHTML='<span class="k">'+"abcd"[j]+'</span><span></span>';
      b.lastChild.textContent=o;
      b.onclick=()=>{
        if(card.dataset.done)return; card.dataset.done="1";
        card.querySelectorAll(".opt").forEach((x,k)=>{
          if(k===q.a)x.classList.add("right"); else if(k===j)x.classList.add("wrong");
        });
        const w=el("p","why"); w.textContent=q.why; card.appendChild(w);
      };
      card.appendChild(b);
    });
    return card;
  }

  function reveal(card,answerLines){
    const btn=el("button","rv"); btn.textContent="show answer";
    const wrap=el("div"); wrap.className="hidden";
    answerLines.forEach(t=>{const p=el("p","why");p.textContent=t;wrap.appendChild(p)});
    btn.onclick=()=>{wrap.classList.remove("hidden");btn.remove()};
    card.append(btn,wrap);
  }

  function scenario(sc,n){
    const card=el("div","qcard g");
    card.innerHTML='<span class="spec" aria-hidden="true"></span>'+
      '<div class="qn">scenario '+n+'</div>';
    const stem=el("p","stem"); stem.textContent=sc.stem; card.appendChild(stem);

    sc.qs.forEach(x=>{
      const q=el("div","sq"); q.textContent=x.q; card.appendChild(q);
      reveal(card,[x.a]);
    });
    return card;
  }

  function frq(f,n){
    const card=el("div","qcard g");
    card.innerHTML='<span class="spec" aria-hidden="true"></span>'+
      '<div class="qn">free response '+n+'</div><div class="qt"></div>';
    card.querySelector(".qt").textContent=f.q;
    reveal(card,f.pts);
    return card;
  }

  GUIDE.tests.forEach((t,ti)=>{
    const b=el("button"); b.textContent=t.name; b.setAttribute("role","tab");
    b.setAttribute("aria-selected",String(ti===0)); b.onclick=()=>select(ti);
    seg.appendChild(b);

    const panel=el("section"); if(ti!==0)panel.classList.add("hidden");
    if(t.matching && t.matching.length) panel.appendChild(matching(t.matching));
    if(t.mc && t.mc.length){
      if(!t.mc[0].part) panel.appendChild(part("part b. multiple choice"));
      let n=0;
      t.mc.forEach(q=>{ if(q.part){panel.appendChild(part(q.part));n=0} n++;
        panel.appendChild(mcq(q,n)); });
    }
    if(t.scenarios && t.scenarios.length){
      panel.appendChild(part("part c. scenarios"));
      t.scenarios.forEach((s,i)=>panel.appendChild(scenario(s,i+1)));

    }
    if(t.frq && t.frq.length){
      panel.appendChild(part("part d. free response"));
      t.frq.forEach((f,i)=>panel.appendChild(frq(f,i+1)));
    }
    panels.push(panel); host.appendChild(panel);
  });

  function select(i){
    [...seg.querySelectorAll("button")].forEach((b,j)=>b.setAttribute("aria-selected",String(i===j)));
    panels.forEach((p,j)=>p.classList.toggle("hidden",i!==j));
    move(); scrollTo({top:0,behavior:REDUCED?"auto":"smooth"});
  }
  function move(){
    const btns=[...seg.querySelectorAll("button")];
    const i=btns.findIndex(b=>b.getAttribute("aria-selected")==="true");
    const b=btns[i]; if(!b)return;
    ind.style.width=b.offsetWidth+"px";
    ind.style.transform="translateX("+(b.offsetLeft-2)+"px)";
  }
  addEventListener("resize",move); requestAnimationFrame(move);
  host.__move=move;
})();

/* flashcards */
(function(){
  let n=0;
  const deck=el("div","deck"), fc=el("div","fc g");
  fc.innerHTML='<span class="spec" aria-hidden="true"></span>'+
    '<div class="face front"><div class="fw"></div></div>'+
    '<div class="face back g"><div class="fw"></div></div>';
  deck.appendChild(fc);

  const bar=el("div","fbar");
  bar.innerHTML='<button id="prev">back</button><button id="next">next</button>'+
    '<span class="fcount"></span>';
  const draw=()=>{
    fc.classList.remove("flip");
    fc.querySelector(".front .fw").textContent=GUIDE.cards[n].f;
    fc.querySelector(".back .fw").textContent=GUIDE.cards[n].b;
    bar.querySelector(".fcount").textContent=(n+1)+" of "+GUIDE.cards.length;
  };
  fc.onclick=()=>fc.classList.toggle("flip");
  bar.querySelector("#prev").onclick=()=>{n=(n-1+GUIDE.cards.length)%GUIDE.cards.length;draw()};
  bar.querySelector("#next").onclick=()=>{n=(n+1)%GUIDE.cards.length;draw()};
  addEventListener("keydown",e=>{
    if($("#p-cards").classList.contains("hidden"))return;
    if(e.key==="ArrowRight")bar.querySelector("#next").click();
    if(e.key==="ArrowLeft")bar.querySelector("#prev").click();
    if(e.key===" "){e.preventDefault();fc.click()}
  });
  $("#p-cards").append(deck,bar); draw();
})();

/* segmented control */
(function(){
  const tabs=[["outline","outline"],["tests","tests"],["cards","flashcards"]];
  const seg=$("#seg"), ind=seg.querySelector(".ind");
  tabs.forEach(([id,label],i)=>{
    const b=el("button"); b.textContent=label; b.setAttribute("role","tab");
    b.setAttribute("aria-selected",String(i===0));
    b.onclick=()=>select(i);
    seg.appendChild(b);
  });
  function select(i){

    const btns=[...seg.querySelectorAll("button")];
    btns.forEach((b,j)=>b.setAttribute("aria-selected",String(i===j)));
    tabs.forEach(([id],j)=>$("#p-"+id).classList.toggle("hidden",i!==j));
    move();
    const h=$("#p-tests"); if(h && h.__move) requestAnimationFrame(h.__move);
  }
  function move(){
    const btns=[...seg.querySelectorAll("button")];
    const i=btns.findIndex(b=>b.getAttribute("aria-selected")==="true");
    const b=btns[i]; if(!b)return;
    ind.style.width=b.offsetWidth+"px";
    ind.style.transform="translateX("+(b.offsetLeft-2)+"px)";
  }
  addEventListener("resize",move); requestAnimationFrame(move);
})();

/* header state + pointer specular */
(function(){
  const hdr=$("#hdr"); let raf=0;
  addEventListener("scroll",()=>{ if(raf)return;
    raf=requestAnimationFrame(()=>{raf=0;hdr.classList.toggle("stuck",scrollY>6)}) },{passive:true});
  if(matchMedia("(hover:hover)").matches && !REDUCED){
    addEventListener("pointermove",e=>{
      const c=e.target.closest && e.target.closest(".g"); if(!c)return;
      const r=c.getBoundingClientRect();
      c.style.setProperty("--mx",(e.clientX-r.left)+"px");
      c.style.setProperty("--my",(e.clientY-r.top)+"px");
    },{passive:true});
  }
})();
</script>
