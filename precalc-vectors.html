<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>vectors study guide</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>
:root{
  --text:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro",system-ui,sans-serif;
  --display:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro",system-ui,sans-serif;
  --round:ui-rounded,"SF Pro Rounded","SF Compact Rounded",-apple-system,system-ui,sans-serif;

  /* honors precalculus bc */
  --accent:#007AFF;
  /* palette: dusk */
  --amb1:var(--accent); --amb2:#BF5AF2; --amb3:#5E5CE6; --amb4:#FF375F;

  --ground:color-mix(in oklab,#E3E3EE 91%,var(--amb1));
  --ink:#08080D;
  --ink2:rgba(56,56,64,.68); --ink3:rgba(56,56,64,.40);
  --glass:rgba(255,255,255,.54); --glass-hi:rgba(255,255,255,.72);
  --rim-a:rgba(255,255,255,.95); --rim-b:rgba(255,255,255,.10); --rim-c:rgba(255,255,255,.42);
  --gloss:rgba(255,255,255,.55); --spec:rgba(255,255,255,.34);
  --sep:rgba(56,56,64,.10); --fill:rgba(118,118,128,.10); --fill2:rgba(118,118,128,.055);
  --blue:#007AFF; --good:#2FB350; --bad:#FF3B30;
  --blur:22px; --sat:195%;
  --shadow:0 1px 1px rgba(14,14,38,.04), 0 10px 28px -10px rgba(14,14,38,.22);
  --spring:cubic-bezier(.32,.72,0,1); --ease:cubic-bezier(.22,.61,.36,1);
  --amb:.82; --amb-blur:66px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --accent:#0A84FF;
  --ground:color-mix(in oklab,#06060B 89%,var(--amb1));
  --ink:#FFFFFF;
  --ink2:rgba(235,235,245,.66); --ink3:rgba(235,235,245,.38);

  --glass:rgba(255,255,255,.06); --glass-hi:rgba(255,255,255,.095);
  --rim-a:rgba(255,255,255,.42); --rim-b:rgba(255,255,255,.04); --rim-c:rgba(255,255,255,.16);
  --gloss:rgba(255,255,255,.16); --spec:rgba(255,255,255,.14);
  --sep:rgba(255,255,255,.085); --fill:rgba(255,255,255,.085); --fill2:rgba(255,255,255,.045);
  --blue:#0A84FF; --good:#30D158; --bad:#FF453A;
  --blur:26px; --sat:175%;
  --shadow:0 1px 1px rgba(0,0,0,.5), 0 12px 32px -12px rgba(0,0,0,.85);
  --amb:.62; --amb-blur:82px;
}}
:root[data-theme="dark"]{
  --accent:#0A84FF; --ground:color-mix(in oklab,#06060B 89%,var(--amb1)); --ink:#FFFFFF;
  --ink2:rgba(235,235,245,.66); --ink3:rgba(235,235,245,.38);
  --glass:rgba(255,255,255,.06); --glass-hi:rgba(255,255,255,.095);
  --rim-a:rgba(255,255,255,.42); --rim-b:rgba(255,255,255,.04); --rim-c:rgba(255,255,255,.16);
  --gloss:rgba(255,255,255,.16); --spec:rgba(255,255,255,.14);
  --sep:rgba(255,255,255,.085); --fill:rgba(255,255,255,.085); --fill2:rgba(255,255,255,.045);
  --blue:#0A84FF; --good:#30D158; --bad:#FF453A;
  --blur:26px; --sat:175%;
  --shadow:0 1px 1px rgba(0,0,0,.5), 0 12px 32px -12px rgba(0,0,0,.85);
  --amb:.62; --amb-blur:82px;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--text);
  font-optical-sizing:auto;font-size:17px;line-height:1.45;letter-spacing:-.012em;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;min-height:100vh;
  padding-bottom:calc(48px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
:focus-visible{outline:2.5px solid var(--blue);outline-offset:3px;border-radius:11px}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}
.hidden{display:none !important}


/* math keeps its capitals and stays out of the lowercase pass */
.m{text-transform:none;font-variant-numeric:tabular-nums;letter-spacing:-.004em;
  overflow-wrap:break-word}

#amb{position:fixed;inset:-20vh -20vw;z-index:-1;pointer-events:none;contain:strict;
  filter:blur(var(--amb-blur)) saturate(160%);opacity:var(--amb);
  animation:hue 120s linear infinite}
#amb i{position:absolute;display:block;border-radius:50%;
  animation:drift 38s var(--ease) infinite alternate}
#amb i:nth-child(1){width:64vw;height:64vw;left:-12vw;top:-10vh;
  background:radial-gradient(circle,var(--amb1),transparent 66%)}
#amb i:nth-child(2){width:58vw;height:58vw;right:-14vw;top:4vh;
  background:radial-gradient(circle,var(--amb2),transparent 66%);
  animation-duration:45s;animation-delay:-10s}
#amb i:nth-child(3){width:70vw;height:70vw;left:2vw;top:44vh;
  background:radial-gradient(circle,var(--amb3),transparent 66%);
  animation-duration:41s;animation-delay:-20s}
#amb i:nth-child(4){width:52vw;height:52vw;right:-8vw;bottom:-8vh;
  background:radial-gradient(circle,var(--amb4),transparent 66%);
  animation-duration:48s;animation-delay:-30s}
@keyframes drift{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(7vw,-6vh,0) scale(1.2)}}
@keyframes hue{
  0%,100%{filter:blur(var(--amb-blur)) saturate(160%) hue-rotate(-7deg)}
  50%    {filter:blur(var(--amb-blur)) saturate(172%) hue-rotate(7deg)}
}

.g{position:relative;isolation:isolate;background:var(--glass);
  -webkit-backdrop-filter:blur(var(--blur)) saturate(var(--sat));
  backdrop-filter:blur(var(--blur)) saturate(var(--sat));box-shadow:var(--shadow)}
.g::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;
  pointer-events:none;z-index:3;

  background:linear-gradient(150deg,var(--rim-a),var(--rim-b) 32%,transparent 56%,var(--rim-c));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  mask-composite:exclude}
.g::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:2;
  background:linear-gradient(180deg,var(--gloss),transparent 38%);opacity:.5}
.spec{position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:2;opacity:0;
  background:radial-gradient(260px circle at var(--mx,50%) var(--my,0%),var(--spec),transparent 68%);
  transition:opacity .4s var(--ease)}
@media (hover:hover){.g:hover > .spec{opacity:1}}

/* header */
header{position:sticky;top:0;z-index:40;background:var(--glass);
  -webkit-backdrop-filter:blur(20px) saturate(var(--sat));backdrop-filter:blur(20px) saturate(var(--sat));
  transition:background .4s var(--ease),box-shadow .4s var(--ease)}
header.stuck{background:var(--glass-hi);box-shadow:inset 0 -.5px 0 0 var(--sep),0 6px 26px -12px rgba(14,14,38,.4)}
.hrow{display:flex;align-items:center;gap:12px;padding:14px 0 12px}
.glyph{width:40px;height:40px;border-radius:12px;flex:none;
  background:linear-gradient(160deg,color-mix(in srgb,var(--accent) 80%,#fff),var(--accent));
  box-shadow:inset 0 .5px 0 rgba(255,255,255,.55),0 4px 10px -4px rgba(0,0,0,.4)}
.cls{font-family:var(--round);font-size:12.5px;font-weight:740;color:var(--accent);text-transform:lowercase}
h1{margin:0;font-family:var(--display);font-size:23px;font-weight:780;letter-spacing:-.042em;
  line-height:1.08;text-transform:lowercase}
.chip{font-family:var(--round);font-size:12.5px;font-weight:700;padding:5px 11px;border-radius:999px;
  background:color-mix(in srgb,var(--accent) 22%,transparent);color:var(--accent);
  white-space:nowrap;margin-left:auto;flex:none;text-transform:lowercase;
  font-variant-numeric:tabular-nums}

/* segmented control */
.seg{position:relative;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:2px;
  background:var(--fill);border-radius:11px;padding:2px;margin-bottom:14px;
  box-shadow:inset 0 .5px 0 0 var(--gloss)}

.seg button{position:relative;z-index:1;padding:7px 4px;border-radius:9px;font-family:var(--round);
  font-size:13.5px;font-weight:640;color:var(--ink2);text-transform:lowercase;
  transition:color .25s var(--ease)}
.seg button[aria-selected="true"]{color:var(--ink)}
.seg .ind{position:absolute;z-index:0;top:2px;bottom:2px;border-radius:9px;background:var(--glass-hi);
  box-shadow:inset 0 .5px 0 0 var(--gloss),0 2px 6px -2px rgba(0,0,0,.28);
  transition:transform .42s var(--spring),width .42s var(--spring)}

main{padding-top:20px}
.sh{display:flex;align-items:baseline;gap:8px;font-family:var(--round);font-size:13.5px;
  font-weight:680;color:var(--ink3);margin:30px 4px 10px;text-transform:lowercase}
.sh:first-child{margin-top:0}
.sh h2{margin:0;font:inherit;letter-spacing:.008em}
.sh .shx{margin-left:auto;font-size:12.5px;font-variant-numeric:tabular-nums}

/* collapsible card */
.card{border-radius:18px;overflow:hidden;margin-bottom:10px}
.chead{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:14px 16px;
  position:relative;z-index:1;transition:transform .34s var(--spring)}
.chead:active{transform:scale(.99)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--accent);flex:none;
  box-shadow:0 0 10px color-mix(in srgb,var(--accent) 70%,transparent)}
.ct{flex:1;font-size:16.5px;font-weight:580;letter-spacing:-.018em;text-transform:lowercase}
.tag{font-family:var(--round);font-size:11px;font-weight:740;padding:3px 8px;border-radius:7px;
  background:var(--fill2);color:var(--ink3);text-transform:lowercase;flex:none}
.tag.calc{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent)}
.tw{color:var(--ink3);transition:transform .34s var(--spring);flex:none}
.chead[aria-expanded="true"] .tw{transform:rotate(90deg)}
.cbody{display:grid;grid-template-rows:0fr;transition:grid-template-rows .44s var(--spring)}
.cbody.on{grid-template-rows:1fr}
.cbody > div{overflow:hidden}
.pad{padding:0 16px 16px}


.bp{font-size:15px;line-height:1.55;color:var(--ink2);text-transform:lowercase;margin:0 0 10px}
.fig{display:block;width:100%;height:auto;margin:4px 0 12px;overflow:visible}
.fig text{font-family:var(--round);font-size:11px;font-weight:680;fill:var(--ink2);
  text-transform:none;letter-spacing:0}
.fig .va{stroke:var(--accent);stroke-width:2.1;fill:none;stroke-linecap:round;marker-end:url(#mA)}
.fig .vg{stroke:var(--ink2);stroke-width:1.9;fill:none;stroke-linecap:round;marker-end:url(#mG)}
.fig .ln{stroke:var(--ink3);stroke-width:1.4;fill:none;stroke-linecap:round}
.fig .dsh{stroke:var(--ink3);stroke-width:1.4;fill:none;stroke-dasharray:4 4}
.fig .la{fill:var(--accent)}
.terms{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.term{font-family:var(--round);font-size:12.5px;font-weight:640;padding:5px 10px;border-radius:9px;
  background:var(--fill2);color:var(--ink2);box-shadow:inset 0 .5px 0 0 var(--gloss);
  text-transform:lowercase}
.prob{font-size:15.5px;line-height:1.5;color:var(--ink);text-transform:lowercase;
  padding:0 0 12px;margin:0}
.step{display:flex;gap:10px;padding:9px 0;box-shadow:inset 0 .5px 0 var(--sep)}
.sn{font-family:var(--round);font-size:11.5px;font-weight:740;color:var(--accent);
  text-transform:lowercase;flex:none;width:74px;line-height:1.35;padding-top:2px}
.sd{flex:1;font-size:14.5px;line-height:1.55;color:var(--ink2);text-transform:lowercase}
.ans{margin-top:12px;padding:10px 12px;border-radius:12px;background:var(--fill2);
  box-shadow:inset 0 .5px 0 0 var(--gloss);font-size:15px;line-height:1.5;
  text-transform:lowercase}
.ans b{font-family:var(--round);font-size:11.5px;font-weight:740;color:var(--ink3);
  display:block;margin-bottom:2px}

/* formula rows */
.frow{display:flex;align-items:baseline;gap:12px;padding:10px 0;
  box-shadow:inset 0 .5px 0 var(--sep)}
.frow:first-child{box-shadow:none}
.fk{font-family:var(--round);font-size:12.5px;font-weight:660;color:var(--ink3);
  text-transform:lowercase;flex:none;width:104px;line-height:1.35}

.fv{flex:1;font-size:15.5px;line-height:1.5;text-transform:lowercase}

/* traps */
.trap{border-radius:18px;padding:15px 16px;margin-bottom:10px}
.tt{font-family:var(--round);font-size:15px;font-weight:700;letter-spacing:-.012em;
  text-transform:lowercase;margin-bottom:5px;position:relative;z-index:1}
.tp{font-size:14.5px;line-height:1.55;color:var(--ink2);text-transform:lowercase;
  position:relative;z-index:1;margin:0}
.tp + .tp{margin-top:6px}

/* tests */
/* ── printable quiz sheets: white paper, serif, her layout ─────────── */
.ctl{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-radius:16px;
  padding:11px 14px;margin-bottom:14px}
.ctl .tv{font-family:var(--round);font-size:22px;font-weight:760;
  font-variant-numeric:tabular-nums;letter-spacing:-.02em;position:relative;z-index:1}
.ctl .tv.low{color:var(--bad)}
.ctl .tlab{font-size:13px;color:var(--ink3);text-transform:lowercase;position:relative;z-index:1}
.cbtn{font-family:var(--round);font-size:13.5px;font-weight:680;color:var(--blue);
  padding:7px 12px;border-radius:10px;background:var(--fill2);text-transform:lowercase;
  position:relative;z-index:1;transition:transform .3s var(--spring)}
.cbtn:active{transform:scale(.97)}
.cbtn.on{background:color-mix(in srgb,var(--accent) 20%,transparent);color:var(--accent)}
.ctl .push{margin-left:auto}
.pnote{flex-basis:100%;font-size:12.5px;line-height:1.4;color:var(--ink3);
  text-transform:lowercase;position:relative;z-index:1;margin-top:2px}

.page{background:#fff;color:#111;border-radius:8px;padding:26px 28px 30px;margin-bottom:14px;
  font-family:ui-serif,Georgia,"Times New Roman",Times,serif;font-size:14px;line-height:1.34;
  letter-spacing:0;text-transform:none;box-shadow:0 10px 30px -14px rgba(14,14,38,.5);
  border:1px solid rgba(0,0,0,.12)}
.page .m{text-transform:none;font-variant-numeric:normal}

.qhead{display:flex;align-items:baseline;gap:10px;font-size:12.5px}
.qhead .nm{flex:1;border-bottom:1px solid #111;min-width:70px;margin-right:16px}
.qmode{text-align:center;font-style:italic;margin:7px 0 10px}
.honor{font-weight:700;margin-bottom:16px}
.hrule{border-top:1px solid #111;margin:0 0 17px}
.sig{width:2.4in;margin:2px 0 14px auto;text-align:center;border-top:1px solid #111;
  padding-top:2px;font-size:12px}
.showall{font-weight:700;margin-bottom:12px}
.memo{display:grid;grid-template-columns:1fr 1fr;gap:9px 13px;align-items:start}
.mcard{border:1px solid #111;border-radius:2px;padding:8px 10px}
.mcard h4{margin:0 0 4px;font-size:13.5px;font-weight:700}
.mcard div{margin:2px 0;font-size:13px;line-height:1.35}
.mcard table{border-collapse:collapse;font-size:13px;margin:2px 0 4px}
.mcard th,.mcard td{padding:1px 10px 1px 0;text-align:left;font-weight:400}
.mcard thead th{font-style:italic;border-bottom:1px solid #111;padding-bottom:2px}
.mtitle{text-align:center;font-weight:700;font-size:16px;margin-bottom:2px}
.msub{text-align:center;font-size:12.5px;margin-bottom:12px}
@media (max-width:560px){.memo{grid-template-columns:1fr}}
@media print{.memo{grid-template-columns:1fr 1fr}}
.qitem{margin-bottom:13px}
.qdir{margin:0 0 6px;font-size:13.5px}
.qbox{border:1px solid #111;border-radius:2px;padding:9px 11px}
.qnum{font-weight:700;margin-right:8px}
.qsol{margin-top:9px}
.qsol > div{margin:5px 0}
.bx{border:1px solid #111;padding:0 5px;display:inline-block;line-height:1.5}
.qsol{display:none}
.kpage .qsol{display:block}
.kpage .qbox{min-height:0 !important}

@media print{
  @page{size:letter;margin:0.62in 0.8in}

  html,body{background:#fff !important;padding:0 !important;margin:0 !important}
  #amb,header,.ctl,footer{display:none !important}
  main{padding:0 !important}
  .wrap{max-width:none !important;padding:0 !important}
  #p-basics,#p-worked,#p-formulas,#p-traps{display:none !important}
  #p-tests{display:block !important}
  .page{border:0;border-radius:0;box-shadow:none;padding:0;margin:0;font-size:11pt;
    break-after:page;page-break-after:always}
  .sheet:last-child .page:last-child{break-after:auto;page-break-after:auto}
  .qitem,.qbox{break-inside:avoid;page-break-inside:avoid}
}

.timer{display:flex;align-items:center;gap:10px;border-radius:16px;padding:11px 14px;margin-bottom:12px}
.tv{font-family:var(--round);font-size:22px;font-weight:760;font-variant-numeric:tabular-nums;
  letter-spacing:-.02em;position:relative;z-index:1}
.tv.low{color:var(--bad)}
.tlab{font-size:13px;color:var(--ink3);text-transform:lowercase;position:relative;z-index:1}
.tbtn{margin-left:auto;font-family:var(--round);font-size:14px;font-weight:680;color:var(--blue);
  padding:7px 12px;border-radius:10px;background:var(--fill2);text-transform:lowercase;
  position:relative;z-index:1;transition:transform .3s var(--spring)}
.tbtn:active{transform:scale(.97)}
.paper{border-radius:18px;padding:15px 16px;margin-bottom:6px}
.prow{display:flex;align-items:baseline;gap:14px;position:relative;z-index:1}
.pt{font-size:14.5px;font-weight:580;letter-spacing:-.014em;text-transform:lowercase;
  position:relative;z-index:1;margin-bottom:9px}
.pname{flex:1;font-size:12.5px;color:var(--ink3);text-transform:lowercase;
  box-shadow:inset 0 -1px 0 var(--sep);min-width:54px}
.ppts{font-family:var(--round);font-size:13px;font-weight:740;color:var(--ink3);
  font-variant-numeric:tabular-nums}
.pshow{margin-top:9px;font-family:var(--round);font-size:12px;font-weight:740;
  color:var(--accent);text-transform:lowercase;position:relative;z-index:1}
.mode{font-style:italic;text-align:center;font-size:14.5px;color:var(--ink2);

  text-transform:lowercase;margin:20px 0 10px}
.cell{border:1px solid var(--sep);border-radius:10px;padding:12px 13px;
  position:relative;z-index:1}
.qcard{border-radius:18px;padding:16px;margin-bottom:10px}
.qtop{display:flex;align-items:center;gap:9px;margin-bottom:8px;position:relative;z-index:1}
.qn{font-family:var(--round);font-size:15.5px;font-weight:760;color:var(--ink);
  font-variant-numeric:tabular-nums;margin-right:9px}
.dir{font-style:italic;font-size:14px;line-height:1.45;color:var(--ink2);
  text-transform:lowercase;margin-bottom:10px;position:relative;z-index:1}
.src{font-family:var(--round);font-size:11.5px;font-weight:740;color:var(--ink3);
  text-transform:lowercase;margin-bottom:7px}
.qt{font-size:16px;font-weight:520;line-height:1.45;letter-spacing:-.014em;
  text-transform:lowercase}
.reveal{display:block;width:100%;margin-top:12px;padding:11px;border-radius:12px;
  background:var(--fill2);box-shadow:inset 0 .5px 0 0 var(--gloss);font-family:var(--round);
  font-size:14px;font-weight:660;color:var(--blue);text-transform:lowercase;
  position:relative;z-index:1;transition:transform .3s var(--spring)}
.reveal:active{transform:scale(.988)}
.sol{position:relative;z-index:1;margin-top:6px}

.rise{opacity:0;transform:translateY(18px) scale(.98);filter:blur(8px);
  animation:rise .9s var(--spring) forwards;animation-delay:calc(var(--i,0)*55ms)}
@keyframes rise{to{opacity:1;transform:none;filter:blur(0)}}

footer{text-align:center;font-size:12.5px;line-height:1.6;color:var(--ink3);padding:42px 8px 6px;
  text-transform:lowercase}

@media (prefers-reduced-motion:reduce){
  #amb,#amb i{animation:none}
  .rise{opacity:1;transform:none;filter:none;animation:none}
  *,*::before,*::after{transition-duration:.01ms !important;animation-duration:.01ms !important}
}

</style>

<link rel="apple-touch-icon" href="/apple-touch-icon.png">

<body>


<div id="amb" aria-hidden="true"><i></i><i></i><i></i><i></i></div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <marker id="mA" markerWidth="4.6" markerHeight="4.6" refX="3.7" refY="2.3" orient="auto">
    <path d="M0 .5L4.1 2.3 0 4.1z" fill="var(--accent)"/></marker>
  <marker id="mG" markerWidth="4.6" markerHeight="4.6" refX="3.7" refY="2.3" orient="auto">
    <path d="M0 .5L4.1 2.3 0 4.1z" fill="var(--ink2)"/></marker>
</defs></svg>

const $=s=>document.querySelector(s);
const el=(t,c)=>{const n=document.createElement(t);if(c)n.className=c;return n};
const REDUCED=matchMedia("(prefers-reduced-motion:reduce)").matches;

/* split on backticks: odd chunks are math and skip the lowercase pass */
/* spaces inside ⟨ ⟩ or ( ) become non-breaking so a pair never splits across lines */
function tight(t){
  let d=0,o="";
  for(const c of t){
    if(c==="⟨"||c==="(")d++;
    else if(c==="⟩"||c===")")d=Math.max(0,d-1);
    o+=(c===" "&&d>0)?"\u00A0":c;
  }
  return o;
}
function mk(str,node){

  String(str).split("`").forEach((part,i)=>{
    if(!part)return;
    if(i%2){const s=el("span","m");s.textContent=tight(part);node.appendChild(s)}
    else node.appendChild(document.createTextNode(part));
  });
  return node;
}

/* the rise animation can't run inside a display:none pane, so stagger on first reveal */
function stagger(sec){
  if(REDUCED||sec.dataset.risen)return;
  sec.dataset.risen="1";
  [...sec.children].forEach((n,i)=>{
    if(!n.matches(".card,.qcard,.trap,.ctl,.sheet"))return;
    n.style.setProperty("--i",i);n.classList.add("rise");
  });
}

/* steps + answer block, shared by worked examples and the tests */
function solution(item){
  const box=el("div");
  item.steps.forEach(s=>{
    const row=el("div","step");
    const n=el("div","sn");n.textContent=s.n;
    const d=el("div","sd");mk(s.d,d);
    row.append(n,d);box.appendChild(row);
  });
  const a=el("div","ans");
  const lab=el("b");lab.textContent="answer";
  a.appendChild(lab);mk(item.a,a);
  box.appendChild(a);
  return box;
}

/* tests: printable quiz sheets */
function esc(t){return t.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}
function sheetText(str,node){
  String(str).split("`").forEach((part,i)=>{
    if(!part)return;

    if(i%2){
      const sp=el("span","m");
      let h=esc(tight(part)).replace(/-/g,"\u2212");
      h=h.replace(/\[\[(.+?)\]\]/g,'<span class="bx">$1<\/span>');
      h=h.replace(/(^|[^A-Za-z])([uvijw])(?![A-Za-z])/g,"$1<b>$2<\/b>");
      sp.innerHTML=h;node.appendChild(sp);
    } else node.appendChild(document.createTextNode(part));
  });
  return node;
}

/* segmented control */
stagger($("#p-basics"));
(function(){

  const tabs=[["basics","basics"],["worked","worked"],["formulas","formulas"],["traps","traps"],["tests","quizzes"]];
  const seg=$("#seg"), ind=seg.querySelector(".ind");
  tabs.forEach(([id,label],i)=>{
    const b=el("button"); b.textContent=label; b.setAttribute("role","tab");
    b.setAttribute("aria-selected",String(i===0));
    b.onclick=()=>select(i);
    seg.appendChild(b);
  });
  function select(i){
    const btns=[...seg.querySelectorAll("button")];
    btns.forEach((b,j)=>b.setAttribute("aria-selected",String(i===j)));
    tabs.forEach(([id],j)=>$("#p-"+id).classList.toggle("hidden",i!==j));
    stagger($("#p-"+tabs[i][0]));
    move(); scrollTo({top:0,behavior:REDUCED?"auto":"smooth"});
  }
  function move(){
    const btns=[...seg.querySelectorAll("button")];
    const i=btns.findIndex(b=>b.getAttribute("aria-selected")==="true");
    const b=btns[i]; if(!b)return;
    ind.style.width=b.offsetWidth+"px";
    ind.style.transform="translateX("+(b.offsetLeft-2)+"px)";
  }
  addEventListener("resize",move); requestAnimationFrame(move);
})();

/* header state + pointer specular */
(function(){
  const hdr=$("#hdr"); let raf=0;
  addEventListener("scroll",()=>{ if(raf)return;
    raf=requestAnimationFrame(()=>{raf=0;hdr.classList.toggle("stuck",scrollY>6)}) },{passive:true});
  if(matchMedia("(hover:hover)").matches && !REDUCED){
    addEventListener("pointermove",e=>{

      const c=e.target.closest && e.target.closest(".g"); if(!c)return;
      const r=c.getBoundingClientRect();
      c.style.setProperty("--mx",(e.clientX-r.left)+"px");
      c.style.setProperty("--my",(e.clientY-r.top)+"px");
    },{passive:true});
  }
})();
