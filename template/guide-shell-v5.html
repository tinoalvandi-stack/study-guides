:root{--vg-bg:#f3f4f0;--vg-ink:#202421;--vg-muted:#6b716c;--vg-line:#cbd0c8;--vg-blue:#195bdb;--vg-sans:Arial,Helvetica,"Helvetica Neue",sans-serif;--vg-mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace}

.vg-bar{position:relative;z-index:12;padding-top:env(safe-area-inset-top);background:var(--vg-bg);color:var(--vg-ink);font:16px/1.4 var(--vg-sans)}

.vg-brand{margin-right:auto;display:inline-flex;align-items:center;min-height:44px;color:var(--vg-ink);text-decoration:none;font-size:22px;font-weight:700;letter-spacing:-1px;white-space:nowrap}
.vg-brand::after{content:"";width:10px;height:10px;margin-left:4px;border-radius:50%;background:var(--vg-blue);transform:translateY(3px)}
.vg-ibtn{display:inline-grid;place-items:center;flex:none;width:44px;height:44px;padding:0;border:1px solid var(--vg-line);border-radius:50%;background:none;color:var(--vg-ink);cursor:pointer}

@media (hover:hover){.vg-ibtn:hover{border-color:var(--vg-ink)}}
.vg-crumb{flex-basis:100%;display:flex;flex-wrap:wrap;gap:4px 8px;margin-top:10px;padding:0 0 14px;border-bottom:1px solid var(--vg-line);font:12px/1.5 var(--vg-mono);color:var(--vg-muted);text-transform:lowercase}
.vg-crumb a{color:var(--vg-ink);text-decoration:underline;text-decoration-color:var(--vg-line);text-underline-offset:4px}
.vg-bar :focus-visible,.vg-foot :focus-visible{outline:3px solid var(--vg-blue);outline-offset:4px}
.vg-foot{max-width:var(--vg-max,1100px);margin:48px auto 0;padding:24px var(--vg-pad,20px) calc(40px + env(safe-area-inset-bottom));border-top:1px solid var(--vg-line);font:12px/1.6 var(--vg-sans);color:var(--vg-muted);text-transform:lowercase}

<script>
/* valentino guides · shell for standalone guides: theme button (shared localStorage "theme": auto, light or dark; new visitors start dark),
   print with every answer panel and tab included, #s-n topic deep links (opens the tab or details that hold it), offline copies. */
(function(){
  var T=["auto","light","dark"],b=document.getElementById("vg-thm"),R=matchMedia("(prefers-reduced-motion:reduce)").matches,root=document.documentElement;
  var I={auto:'<svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><circle cx="9" cy="9" r="7" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M9 2a7 7 0 0 1 0 14z" fill="currentColor"/></svg>',
    light:'<svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="9" r="3.4"/><path d="M9 1.5v2M9 14.5v2M1.5 9h2M14.5 9h2M3.7 3.7l1.4 1.4M12.9 12.9l1.4 1.4M3.7 14.3l1.4-1.4M12.9 5.1l1.4-1.4"/></svg>',
    dark:'<svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><path d="M14.6 11.4A6.5 6.5 0 0 1 6.6 3.4a6.5 6.5 0 1 0 8 8z"/></svg>'};
  var m="dark";try{var s=localStorage.getItem("theme");if(s==="light"||s==="auto")m=s}catch(e){}
  function paint(){if(!b)return;var n=T[(T.indexOf(m)+1)%T.length];b.innerHTML=I[m];b.title="theme: "+m;b.setAttribute("aria-label","theme: "+m+". switch to "+n)}
  paint();
  if(b)b.addEventListener("click",function(){m=T[(T.indexOf(m)+1)%T.length];var ap=function(){if(m==="auto")delete root.dataset.theme;else root.dataset.theme=m};
    if(document.startViewTransition&&!R)document.startViewTransition(ap);else ap();paint();try{localStorage.setItem("theme",m)}catch(e){}});
  var shut=[];
  addEventListener("beforeprint",function(){shut=[].slice.call(document.querySelectorAll("details:not([open])"));shut.forEach(function(d){d.open=true})});
  addEventListener("afterprint",function(){shut.forEach(function(d){d.open=false});shut=[]});
  var p=document.getElementById("vg-print");if(p)p.addEventListener("click",function(){print()});
  function go(){var h=location.hash;if(!/^#s-\d+$/.test(h))return;var e=document.getElementById(h.slice(1));if(!e)return;
    var pn=e.closest('[role="tabpanel"]');if(pn&&pn.hidden){var t=document.querySelector('[role="tab"][aria-controls="'+pn.id+'"]');if(t)t.click()}
    var d=e.closest("details");if(d)d.open=true;e.scrollIntoView({block:"start"})}
  addEventListener("hashchange",go);
  if(document.readyState==="loading")addEventListener("DOMContentLoaded",function(){setTimeout(go,0)});else setTimeout(go,0);
  if("serviceWorker" in navigator&&isSecureContext)addEventListener("load",function(){navigator.serviceWorker.register("/sw.js").catch(function(){})});
})();
</script>
