<meta name="color-scheme" content="light dark">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#EEE8DC">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#151B20">
<meta name="robots" content="noindex">

<link rel="preload" href="/fonts/figtree.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* ═══ valentino guides · guide template (kinari, sept 2026) ═══
   Same tokens, type, corners and components as the homepage. Edit the GUIDE object below the machinery; leave the CSS alone. */
@font-face{font-family:"Bricolage Grotesque";font-style:normal;font-weight:200 800;font-display:swap;src:url(/fonts/bricolage-grotesque.woff2) format("woff2")}
@font-face{font-family:"Figtree";font-style:normal;font-weight:300 900;font-display:swap;src:url(/fonts/figtree.woff2) format("woff2")}
@font-face{font-family:"Figtree";font-style:italic;font-weight:300 900;font-display:swap;src:url(/fonts/figtree-italic.woff2) format("woff2")}

:root{--paper:#EEE8DC;--surface:#FBF8F1;--surface2:#F4EFE5;--line:#D4CABB;--line2:#B4ADA1;--ink:#20272B;--ink2:rgba(94,90,82,1);--ink3:rgba(94,90,82,.95);--accent:#294A5E;--on-accent:#FBF8F1;--hi:#944B34;--good:#4C6A48;--bad:#8E3F4C;
  --c-apush:#8A442D;--c-psych:#873E50;--c-phys:#28636A;--c-pre:#684A78;--c-sem:#56633B;--c-biz:#75601E;--c-mor:#69513D;--c-lang:#4A4E7A;--c-span:#8E3F3A;--c-apwh:#5F4A78;--c-csp:#4E5A63}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#151B20;--surface:#1D252A;--surface2:#192024;--line:#354149;--line2:#576064;--ink:#F2ECDF;--ink2:rgba(185,178,167,.97);--ink3:rgba(185,178,167,.77);--accent:#8FB7CA;--on-accent:#1D252A;--hi:#E18A67;--good:#9BBC8A;--bad:#DF8592;
  --c-apush:#E08B68;--c-psych:#DB8D9C;--c-phys:#75B8B6;--c-pre:#C39ACC;--c-sem:#AAB67A;--c-biz:#CBB15F;--c-mor:#C79E7B;--c-lang:#A9AEE0;--c-span:#E09490;--c-apwh:#BBA3D6;--c-csp:#A9B6BE}}
:root[data-theme="dark"]{--paper:#151B20;--surface:#1D252A;--surface2:#192024;--line:#354149;--line2:#576064;--ink:#F2ECDF;--ink2:rgba(185,178,167,.97);--ink3:rgba(185,178,167,.77);--accent:#8FB7CA;--on-accent:#1D252A;--hi:#E18A67;--good:#9BBC8A;--bad:#DF8592;
  --c-apush:#E08B68;--c-psych:#DB8D9C;--c-phys:#75B8B6;--c-pre:#C39ACC;--c-sem:#AAB67A;--c-biz:#CBB15F;--c-mor:#C79E7B;--c-lang:#A9AEE0;--c-span:#E09490;--c-apwh:#BBA3D6;--c-csp:#A9B6BE}

:root{
  --display:"Bricolage Grotesque",-apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",sans-serif;
  --sans:"Figtree",-apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",sans-serif;
  --w-d:600; --ls-d:-.025em;
  --t12:12px; --t13:13px; --t15:15px; --t16:16px; --t20:20px; --t26:26px;
  --r-card:14px; --r-btn:10px; --r-chip:8px;
  --spring:cubic-bezier(.32,.72,0,1); --ease:cubic-bezier(.22,.61,.36,1);
  --gap:16px;
  --cls:var(--accent);            /* set from GUIDE.id at runtime: the class color */
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:var(--t16);line-height:1.5;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;overflow-x:hidden;min-height:100vh;
  padding-bottom:calc(48px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:left}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.wrap{max-width:640px;margin:0 auto;padding:0 var(--gap)}
.lc{text-transform:lowercase}

/* bar */
.bar{position:sticky;top:0;z-index:40;background:var(--paper);padding:max(10px,env(safe-area-inset-top)) 0 10px;transition:box-shadow .3s var(--ease)}
.bar.stuck{box-shadow:0 1px 0 0 var(--line)}
.bar .wrap{display:flex;align-items:center;gap:10px}
.home{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:26px;height:26px;border-radius:5px;flex:none;display:block}
.bar h1{margin:0;font-family:var(--display);font-size:var(--t20);font-weight:var(--w-d);letter-spacing:var(--ls-d);text-transform:lowercase;white-space:nowrap}
@media (max-width:379px){.bar h1{display:none}}
.seg{position:relative;display:flex;border:1px solid var(--line);border-radius:8px;padding:2px;isolation:isolate;flex:none;background:var(--surface)}
.seg button{position:relative;z-index:2;padding:4px 9px;border-radius:6px;font-size:var(--t12);font-weight:500;color:var(--ink3);text-transform:lowercase;text-align:center;transition:color .2s var(--ease)}
.seg button[aria-pressed="true"]{color:var(--on-accent)}
.seg .thumb{position:absolute;z-index:1;top:2px;bottom:2px;left:2px;width:0;border-radius:6px;background:var(--ink);transition:left .36s var(--spring),width .36s var(--spring)}
.bar .seg{margin-left:auto}

/* intro */
main{padding-top:22px}
.crow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.cname{display:flex;align-items:center;gap:7px;font-size:var(--t12);font-weight:600;letter-spacing:.04em;color:var(--cls);text-transform:lowercase}
.cname svg{width:20px;height:20px;flex:none}
.chip{flex:none;font-size:var(--t12);font-weight:500;padding:3px 8px;border-radius:var(--r-chip);background:var(--surface2);color:var(--ink2);white-space:nowrap;font-variant-numeric:tabular-nums;border:1px solid var(--line);text-transform:lowercase}
.chip.due{color:var(--cls);border-color:var(--cls);background:transparent}
.chip.past{color:var(--ink3)}
h2.title{margin:0 0 6px;font-family:var(--display);font-size:clamp(28px,7.6vw,38px);font-weight:var(--w-d);letter-spacing:var(--ls-d);line-height:1.05;text-transform:lowercase;text-wrap:balance}
.sub{margin:0 0 18px;font-size:var(--t15);line-height:1.5;color:var(--ink2);max-width:52ch;text-transform:lowercase}

/* pane switcher */
.panes{display:flex;gap:2px;margin:0 0 22px;padding:2px;border:1px solid var(--line);border-radius:10px;background:var(--surface);position:relative;isolation:isolate;overflow-x:auto;scrollbar-width:none}
.panes::-webkit-scrollbar{display:none}
.panes button{flex:1 0 auto;position:relative;z-index:2;padding:7px 12px;border-radius:8px;text-align:center;font-size:var(--t13);font-weight:500;color:var(--ink3);text-transform:lowercase;white-space:nowrap;transition:color .2s var(--ease)}
.panes button[aria-selected="true"]{color:var(--on-accent)}
.panes .thumb{position:absolute;z-index:1;top:2px;bottom:2px;left:2px;width:0;border-radius:8px;background:var(--ink);transition:left .36s var(--spring),width .36s var(--spring)}
.panes.one{display:none}
.pane{display:none}
.pane.on{display:block;animation:rise .38s var(--spring) both}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* section head */
.sh{display:flex;align-items:center;gap:10px;margin:26px 0 10px}
.sh:first-child{margin-top:0}
.sh h3{margin:0;font-size:var(--t12);font-weight:600;letter-spacing:.05em;color:var(--ink3);text-transform:lowercase}
.sh::after{content:"";flex:1;height:1px;background:var(--line);order:2}
.shx{order:3;font-size:var(--t12);color:var(--ink3);text-transform:lowercase;font-variant-numeric:tabular-nums}

/* cards + groups */
.card{border-radius:var(--r-card);background:var(--surface);border:1px solid var(--line);padding:14px 16px;margin-bottom:10px}
.card.top{border-left:4px solid var(--cls);padding-left:15px}
.card.top p{margin:0 0 8px} .card.top p:last-child{margin-bottom:0}
.group{border-radius:var(--r-card);overflow:hidden;background:var(--surface);border:1px solid var(--line);margin-bottom:10px}
.row{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:12px 14px;position:relative;z-index:1;cursor:pointer;transition:background .16s var(--ease)}
.row + .row,.body + .row{border-top:1px solid var(--line)}
.row:active{background:var(--surface2)}
@media (hover:hover){.row:hover{background:var(--surface2)}}
.rt{min-width:0;flex:1}
.rn{display:block;font-size:var(--t16);font-weight:500;letter-spacing:-.004em;line-height:1.3}
.rd{display:block;font-size:var(--t12);color:var(--ink3);margin-top:1px;text-transform:lowercase}
.chev{flex:none;color:var(--ink3);transition:transform .24s var(--spring)}
.row[aria-expanded="true"] .chev{transform:rotate(90deg)}
.w{flex:none;font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:var(--r-chip);text-transform:lowercase;letter-spacing:0}
.w3{background:var(--cls);color:var(--surface)}
.w2{background:color-mix(in srgb,var(--cls) 16%,transparent);color:var(--cls)}
.body{display:grid;grid-template-rows:0fr;background:var(--surface2);border-top:1px solid var(--line);transition:grid-template-rows .36s var(--spring)}
.body.on{grid-template-rows:1fr}
.body > div{overflow:hidden}
.body .in{padding:12px 16px 14px}
.body p{margin:0 0 10px;color:var(--ink);line-height:1.5}
.body p:last-child{margin-bottom:0}

/* prose emphasis */
.kw{font-weight:650;color:var(--ink);text-decoration:underline;text-decoration-color:var(--cls);text-decoration-thickness:2px;text-underline-offset:3px}
.hl{background:color-mix(in srgb,var(--cls) 20%,transparent);color:var(--ink);border-radius:4px;padding:1px 4px;margin:0 -1px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.trap{color:var(--bad);font-weight:600}
.terms{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.term{font-size:var(--t12);font-weight:500;padding:3px 8px;border-radius:var(--r-chip);border:1px solid color-mix(in srgb,var(--cls) 40%,var(--line));background:color-mix(in srgb,var(--cls) 10%,transparent);color:var(--ink)}
.callout{margin:10px 0 0;padding:9px 12px 9px 13px;border-radius:var(--r-btn);font-size:var(--t15);line-height:1.45;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--cls);color:var(--ink)}
.callout.warn{border-left-color:var(--bad)} .callout.ex{border-left-color:var(--accent)} .callout.ok{border-left-color:var(--good)}
.callout .cl{font-size:11.5px;font-weight:600;text-transform:lowercase;letter-spacing:.04em;color:var(--ink3);display:block;margin-bottom:2px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
@media (max-width:479px){.cmp{grid-template-columns:1fr}}
.cmp > div{padding:10px 12px;border-radius:var(--r-btn);background:var(--surface);border:1px solid var(--line)}
.cmp h5{margin:0 0 4px;font-size:var(--t12);font-weight:600;letter-spacing:.04em;color:var(--cls);text-transform:lowercase}
.cmp p{margin:0 0 6px;font-size:var(--t15)} .cmp p:last-child{margin:0}
.steps{margin:10px 0 0;padding:0;list-style:none;counter-reset:s}
.steps li{position:relative;padding:6px 0 6px 30px;font-size:var(--t15);line-height:1.45;counter-increment:s}
.steps li::before{content:counter(s);position:absolute;left:0;top:7px;width:20px;height:20px;border-radius:6px;background:var(--cls);color:var(--surface);font-size:11.5px;font-weight:600;display:grid;place-items:center}
.steps li + li{border-top:1px solid var(--line)}
.abbr{font-size:var(--t13);color:var(--ink2);line-height:1.6}
.abbr b{color:var(--ink);font-weight:600}

/* practice mc */
.q{margin-bottom:10px}
.q .qt{padding:14px 16px 10px;font-size:var(--t16);font-weight:500;line-height:1.4}
.q .qn{font-size:var(--t12);color:var(--ink3);font-variant-numeric:tabular-nums;margin-bottom:4px;text-transform:lowercase}
.opt{display:flex;align-items:flex-start;gap:11px;width:100%;padding:11px 14px;border-top:1px solid var(--line);font-size:var(--t15);line-height:1.4;transition:background .16s var(--ease)}
.opt:active{background:var(--surface2)}
@media (hover:hover){.q:not(.done) .opt:hover{background:var(--surface2)}}
.opt .k{flex:none;width:22px;height:22px;border-radius:6px;border:1px solid var(--line);display:grid;place-items:center;font-size:11.5px;font-weight:600;color:var(--ink3);margin-top:1px}
.q.done .opt{cursor:default}
.opt.right{background:color-mix(in srgb,var(--good) 14%,transparent)}
.opt.right .k{background:var(--good);border-color:var(--good);color:var(--surface)}
.opt.wrong{background:color-mix(in srgb,var(--bad) 12%,transparent)}
.opt.wrong .k{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.why{display:none;padding:10px 16px 12px;border-top:1px solid var(--line);background:var(--surface2);font-size:var(--t15);line-height:1.45;color:var(--ink)}
.why b{color:var(--ink3);font-weight:600;font-size:var(--t12);text-transform:lowercase;letter-spacing:.04em;display:block;margin-bottom:2px}
.q.done .why{display:block}
.score{display:flex;align-items:center;gap:10px;padding:12px 16px;font-size:var(--t15)}
.score b{font-family:var(--display);font-weight:var(--w-d);font-size:var(--t26);letter-spacing:var(--ls-d);font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 14px;border-radius:var(--r-btn);background:var(--accent);color:var(--on-accent);font-size:var(--t15);font-weight:600;text-transform:lowercase;transition:filter .18s var(--ease)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.wide{width:100%}
.pdfs{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px}
.pdfs a{text-decoration:none}
.pdfs .pn{font-size:var(--t13);color:var(--ink2);width:100%;margin:0 0 2px;text-transform:lowercase}
@media (hover:hover){.btn:hover{filter:brightness(1.06)}}
.btn:active{transform:scale(.987)}

/* problems + worked examples */
.prob .qt{padding:14px 16px}
.reveal{display:none;border-top:1px solid var(--line);background:var(--surface2);padding:12px 16px 14px}
.prob.on .reveal{display:block}
.prob .go{border-top:1px solid var(--line);padding:10px 14px;display:flex;justify-content:space-between;align-items:center;font-size:var(--t13);font-weight:600;color:var(--accent);text-transform:lowercase;width:100%}
.ans{margin-top:10px;padding:8px 12px;border-radius:var(--r-btn);background:var(--surface);border:1px solid var(--line);font-size:var(--t15)}
.ans b{color:var(--ink3);font-weight:600;font-size:var(--t12);text-transform:lowercase;letter-spacing:.04em;margin-right:6px}

/* formulas */
.fx{display:grid;grid-template-columns:1fr auto;gap:2px 14px;align-items:baseline;padding:10px 14px;border-top:1px solid var(--line)}
.fx:first-child{border-top:0}
.fx .n{font-size:var(--t13);color:var(--ink2);text-transform:lowercase}
.fx .f{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:var(--t15);font-weight:500;letter-spacing:0;text-align:right;white-space:nowrap}
.fx .note{grid-column:1/-1;font-size:var(--t12);color:var(--ink3);line-height:1.45}

/* flashcards */
.deck{position:relative;perspective:1200px;margin-bottom:10px}
.fc{position:relative;min-height:190px;border-radius:var(--r-card);cursor:pointer;transform-style:preserve-3d;transition:transform .5s var(--spring)}
.fc.flip{transform:rotateY(180deg)}
.fc > div{position:absolute;inset:0;border-radius:var(--r-card);background:var(--surface);border:1px solid var(--line);padding:18px;display:grid;place-items:center;text-align:center;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.fc .f{font-family:var(--display);font-size:var(--t26);font-weight:var(--w-d);letter-spacing:var(--ls-d);line-height:1.15;text-wrap:balance}
.fc .b{transform:rotateY(180deg);background:var(--surface2);font-size:var(--t15);line-height:1.45;color:var(--ink)}
.fc .tag{position:absolute;left:14px;top:12px;font-size:11.5px;font-weight:600;color:var(--ink3);text-transform:lowercase;letter-spacing:.04em}
.fc .b .tag{color:var(--cls)}
.dnav{display:flex;align-items:center;gap:8px}
.dnav .cnt{margin-left:auto;font-size:var(--t13);color:var(--ink3);font-variant-numeric:tabular-nums;text-transform:lowercase}

/* timeline */
.tl{position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:6px;top:8px;bottom:8px;width:2px;background:var(--line)}
.tl .ev{position:relative;padding:6px 0 12px}
.tl .ev::before{content:"";position:absolute;left:-20px;top:11px;width:10px;height:10px;border-radius:3px;background:var(--cls)}
.tl .y{font-size:var(--t12);font-weight:600;letter-spacing:.04em;color:var(--cls);font-variant-numeric:tabular-nums;text-transform:lowercase}
.tl .t{font-size:var(--t16);font-weight:500;line-height:1.35}
.tl .d{font-size:var(--t15);color:var(--ink);line-height:1.45;margin-top:2px}

/* checklist */
.ck{display:flex;align-items:flex-start;gap:11px;width:100%;padding:11px 14px;border-top:1px solid var(--line);font-size:var(--t15);line-height:1.4}
.ck:first-child{border-top:0}
.ck .box{flex:none;width:20px;height:20px;border-radius:6px;border:1px solid var(--line2);margin-top:1px;display:grid;place-items:center;color:var(--surface);transition:background .16s var(--ease),border-color .16s var(--ease)}
.ck.on .box{background:var(--good);border-color:var(--good)}
.ck.on .t{color:var(--ink3);text-decoration:line-through}
.ck .d{display:block;font-size:var(--t12);color:var(--ink3);margin-top:1px}

/* footer */
footer{margin-top:34px;padding-top:16px;border-top:1px solid var(--line);font-size:var(--t12);line-height:1.6;color:var(--ink3);text-transform:lowercase}
footer a{color:var(--ink2);text-decoration:underline;text-decoration-color:var(--line2);text-underline-offset:3px}
footer .upd{display:block;margin-top:6px}

/* reveal on load */
.rv{opacity:0;transform:translateY(8px);animation:rise .5s var(--spring) forwards}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none !important;transition:none !important}.rv{opacity:1;transform:none}}
</style>
</head>

<header class="bar" id="bar">
  <div class="wrap">
    <a class="home" href="/" aria-label="all guides">
      <svg class="mark" viewBox="0 0 28 28" aria-hidden="true"><rect width="28" height="28" rx="5" fill="var(--accent)"/><path d="M8.98 20.80 4.67 7.20H8.65L11.36 17.68H11.47L14.27 7.20H18.03L13.72 20.80Z" fill="var(--on-accent)"/><circle cx="21.43" cy="18.90" r="1.9" fill="var(--hi)"/></svg>
      <h1>valentino guides</h1>
    </a>
    <div class="seg" role="group" aria-label="theme">
      <span class="thumb" aria-hidden="true"></span>
      <button type="button" data-set="auto" aria-pressed="true">auto</button>
      <button type="button" data-set="light" aria-pressed="false">light</button>
      <button type="button" data-set="dark" aria-pressed="false">dark</button>
    </div>
  </div>
</header>

<main class="wrap" id="main">
  <div class="crow rv" id="crow"></div>
  <h2 class="title rv" id="title"></h2>
  <p class="sub rv" id="sub" hidden></p>
  <div class="pdfs rv" id="pdfs" hidden></div>
  <div class="panes rv" id="panes" role="tablist"><span class="thumb" aria-hidden="true"></span></div>
  <div id="root" class="rv"></div>
  <footer>
    study guide written by a student, free to use. not affiliated with the school.
    check anything that matters against your own notes. <a href="/">all guides</a>
    <span class="upd" id="upd"></span>
  </footer>
</main>

<script>
/* ═══════════════════════════════════════════════════════════════════
   GUIDE — the only thing to edit. Delete panes you don't need from
   `panes`; delete the matching data too. Prose accepts **term**,
   ==fact== and !!trap!!. Everything is rendered from this object.
   ═══════════════════════════════════════════════════════════════════ */
const GUIDE = {
  id:    "apush",
  cls:   "AP US History",
  title: "Unit 2/A study guide",
  test:  "2026-09-23",
  meta:  "25 questions · 17 min",
  sub:   "population and the great awakening through choosing sides. for each act: what it was, why britain did it, why colonists were mad.",

  outline: [
    { w:3, t:"Cram sheet", d:"one line each, in order",
      steps:[
        "**French and Indian War** (1754-63): Britain beats France, French leave North America, Britain is left with a huge debt. Everything after starts here.",
        "**Treaty of Paris 1763**: Britain to the Mississippi; Louisiana and New Orleans go to Spain, not Britain.",
        "**Pontiac** (1763): Native uprising west of the Appalachians, beaten at Bushy Run.",
        "**Proclamation of 1763**: no settlement past the Appalachians. Land, not tax. Colonists ignored it.",
        "**Sugar Act 1764**: molasses duty lowered but enforced, for revenue. First tax for money instead of trade.",
        "**Currency Act 1764**: no colonial paper money.",
        "**Stamp Act 1765**: internal tax on paper. Never implemented. Mobs, Sons of Liberty, boycotts, Stamp Act Congress.",
        "**Quartering Act 1765**: colonies pay to house troops whose only job is watching colonists.",
        "**Declaratory Act 1766**: Stamp Act repealed, but Parliament keeps the right to tax.",
        "**Townshend Acts 1767**: duties on English goods to pay royal officials. Repealed 1770 except tea.",
        "**Boston Massacre 1770**: five dead. John Adams defends the soldiers; manslaughter, not murder.",
        "**Committees of Correspondence 1772**: Samuel Adams' information network between colonies.",
        "**Tea Act 1773**: cheap East India Company tea, feared monopoly. Boston Tea Party, Dec. 16.",
        "**Coercive Acts 1774**: port closed, charter gutted, trials moved. Quebec Act is separate.",
        "**First Continental Congress 1774**: Parliament may regulate trade, not tax. Continental Association boycott.",
        "**Committees of Observation** and **provincial conventions**: colonists run their own governments; Britain helpless.",
        "**Choosing sides**: about 2 in 5 Patriot, 2 in 5 neutral, 1 in 5 Loyalist. Enslaved people side with the British (Dunmore)."
      ] },

    { w:3, t:"Proclamation of 1763", d:"land, not tax",
      p:["Why it happened: the French were gone, so Native nations could no longer play empires against each other. **Pontiac**, an Ottawa chief, rose up west of the Appalachians and was beaten at **Bushy Run**. Britain was broke and wanted no more Indian wars."],
      cmp:{ a:{h:"what it did", p:["Drew a line along the crest of the **Appalachians**. No settlement past it until Britain negotiated with the tribes."]},
            b:{h:"why colonists were mad", p:["They and **land speculators** had already bought land past the line with borrowed money, planning to resell. The line froze their investment."]} },
      notes:[{k:"ok",t:"The twist: colonists ignored it and Britain did not enforce it. First sign London could not make its rules stick. On the test it is !!not a tax!!."}],
      terms:["Pontiac","Bushy Run","Proclamation of 1763","land speculators"] },

    { w:3, t:"Sugar Act and Currency Act (1764)", d:"why the taxes start",
      p:["Why it happened: the war left Britain a ==huge debt==. **George III** decided colonists would pay a share and the **Navigation Acts** would finally be enforced. Until then Britain had practiced **salutary neglect**: the Molasses Act (1733) put 6 pence a gallon on foreign molasses and nobody collected it."],
      cmp:{ a:{h:"what it did", p:["**Sugar Act**: cut the molasses duty to 3 pence but actually collected it (prime minister **Grenville**).","**Currency Act**: colonies could not issue paper money."]},
            b:{h:"why colonists were mad", p:["The Sugar Act was openly for **revenue**, not to steer trade. Parliament was taxing them to raise money.","The Currency Act tied their economy to scarce English money."]} },
      notes:[{k:"warn",t:"The Sugar Act !!lowered!! the rate. What changed was enforcement and purpose."}],
      terms:["war debt","salutary neglect","Sugar Act","Currency Act","revenue"] },

    { w:3, t:"Stamp Act (1765) and the Declaratory Act (1766)", d:"internal tax, never implemented",
      p:["Why it happened: the Sugar Act did not raise enough, so Parliament reached inside the colonies."],
      cmp:{ a:{h:"what it did", p:["Required a purchased **tax stamp** on newspapers, legal documents and printed items. No stamp, not legal."]},
            b:{h:"why colonists were mad", p:["An **internal tax**, felt directly by everyone. A tariff hides inside a price; this reached into the pocket."]} },
      steps:["Never implemented: **mobs** (tar and feathering, effigies) made every distributor resign.",
             "**Sons of Liberty**: the elite formed them to steer the mob at British officials so it would not go too far.",
             "**Boycotts** hurt British merchants, who lobbied Parliament for repeal.",
             "**James Otis**: Parliament should not tax the unrepresented, but obey anyway (moderate).",
             "**Patrick Henry**, Virginia Resolves: only Virginia's assembly may tax Virginians (radical).",
             "**Stamp Act Congress** in New York: one unified protest.",
             "Repealed 1766. Same day, the **Declaratory Act**: Parliament may tax and legislate in all cases. The tax died, the principle did not."],
      terms:["Stamp Act","internal tax","Sons of Liberty","James Otis","Patrick Henry","Stamp Act Congress","Declaratory Act"] },

    { w:3, t:"Quartering Act (1765)", d:"",
      cmp:{ a:{h:"what it did", p:["Colonies had to pay for and house British troops."]},
            b:{h:"why colonists were mad", p:["With the French gone, the troops had nothing to guard against. Their only job was watching colonists, and colonists paid for it. Most went to **Boston**, the most radical colony."]} },
      terms:["Quartering Act 1765"] },

    { w:3, t:"Townshend Acts (1767)", d:"the tea tax that survived",
      p:["Why it happened: after the Stamp Act failed, **Charles Townshend** tried an external tax, since colonists had said they would accept those."],
      cmp:{ a:{h:"what it did", p:["Duties on **English manufactured goods**: paint, glass, lead, tea.","Revenue paid the **salaries of royal officials**.","Customs board in Boston; **vice-admiralty courts** tried smugglers with no jury."]},
            b:{h:"why colonists were mad", p:["The goods could only be bought from England, so the duties regulated nothing; they were for revenue.","Assemblies had paid officials' salaries, which gave them leverage (**power of the purse**). London paying them took that away.","No jury."]} },
      steps:["**John Dickinson**, Letters from a Farmer: Parliament may regulate trade but not hide a tax in a regulation.",
             "Massachusetts **Circular Letter** (1768) asked other colonies to resist; the governor dissolved the assembly.",
             "**Daughters of Liberty**: homespun cloth and coffee so the boycott could work.",
             "Boycotts cost British merchants money. Repealed 1770, !!except tea!!, to keep the principle alive."],
      terms:["Townshend Acts","power of the purse","vice-admiralty courts","John Dickinson","Circular Letter","Daughters of Liberty"] },

    { w:3, t:"Tea Act (1773) and the Boston Tea Party", d:"cheaper tea, bigger fight",
      p:["Why it happened: the **East India Company** was near bankruptcy with unsold tea, and many members of Parliament owned its stock."],
      cmp:{ a:{h:"what it did", p:["Let the company skip the English tariff and sell through its own agents, cutting out American merchants. Legal tea got cheaper."]},
            b:{h:"why colonists were mad", p:["A **monopoly** felt like tyranny.","American merchants were shut out.","Cheap tea tempted people to pay the tax and concede the principle."]} },
      notes:[{k:"ok",t:"Why Boston: other ports sent ships away or stored the tea. Governor **Hutchinson** refused to let the ships leave, and unpaid cargo gets confiscated, so on Dec. 16, 1773 Samuel Adams gave the cue and men dressed as Mohawks dumped 342 chests."},
             {k:"warn",t:"The Tea Act made tea !!cheaper!!. The grievance was monopoly and principle, not price."}],
      terms:["Tea Act","East India Company","monopoly","Boston Tea Party","Thomas Hutchinson","Samuel Adams"] },

    { w:3, t:"Coercive Acts (1774) and the Quebec Act", d:"punish Massachusetts",
      p:["Why it happened: Parliament wanted to make an example of Massachusetts after the Tea Party. British name **Coercive**, colonial name **Intolerable**."],
      cmp:{ a:{h:"the three coercive acts", p:["**Boston Port Act**: port closed until the tea was paid for.","**Massachusetts Government Act**: charter revoked, council appointed not elected, town meetings only with the governor's permission.","**Justice Act**: officials accused of murder tried outside the colonies."]},
            b:{h:"separate laws, same session", p:["**Quebec Act**: Catholic Church and French civil law in Quebec, Quebec enlarged to the Ohio River, cutting off colonial land claims.","**Quartering Act 1774**: troops in homes and businesses.","Colonists hated both; !!neither is a Coercive Act!!."]} },
      notes:[{k:"ok",t:"Why colonists were mad: the Justice Act read as a promise officials would walk free; the Government Act ended self-rule. Effect: the other colonies saw it could happen to them and called a congress."}],
      terms:["Coercive Acts","Intolerable Acts","Boston Port Act","Massachusetts Government Act","Justice Act","Quebec Act"] },

    { w:3, t:"First Continental Congress (1774)", d:"Philadelphia, every colony but Georgia",
      p:["Why it happened: to answer the Coercive Acts. Jobs: list grievances, plan resistance, decide what Parliament may do to the colonies."],
      cmp:{ a:{h:"Richard Henry Lee (radical)", p:["Parliament is England's local legislature and cannot tax the colonies at all."]},
            b:{h:"Joseph Galloway (conservative)", p:["**Plan of Union**: an American legislature to approve or veto each act of Parliament. Lost by one vote."]} },
      steps:["Result: the **Declaration of Rights and Grievances**. Parliament may regulate trade; it may !!not tax for revenue!!. Coercive Acts unconstitutional.",
             "**Continental Association**: non-importation and non-exportation, a boycott that would be enforced locally.",
             "Not independence. Still loyal to the king; the fight is over Parliament."],
      terms:["First Continental Congress","Richard Henry Lee","Joseph Galloway","Declaration of Rights and Grievances","Continental Association"] },

    { w:3, t:"Representation: the argument under every act", d:"",
      cmp:{ a:{h:"Britain: virtual representation", p:["Every member of Parliament represents every subject, colonists included. So Parliament can tax them."]},
            b:{h:"Colonies: actual representation", p:["Only a body you elect can consent to your taxes. So only colonial assemblies can tax colonists. **No taxation without representation**."]} },
      p:["Behind the colonial view: the **Real Whigs**, English thinkers who feared a strong king and centralized power and warned that power always tries to crush liberty. Colonists read every act after 1763 as a plot against their rights as Englishmen, not a one-off tax. They wanted **limited government**: fine with the king and trade regulation, not with a legislature they never chose."],
      terms:["virtual representation","actual representation","Real Whigs","limited government"] },

    { w:2, t:"After the Congress: how Britain lost control, and choosing sides", d:"late 1774 to 1775",
      steps:["Governors dissolved legislatures that sent delegates.",
             "Legislatures reconvened themselves as **provincial conventions** and took over.",
             "Governors called the militia to stop them; the militia was the colonists and refused.",
             "**Committees of Observation**, elected by all voters, enforced the boycott and ran things for about six months.",
             "By early 1775 the crown held Boston and little else, so it turned to force."],
      cmp:{ a:{h:"sides", p:["About 2 in 5 **Patriots**, 2 in 5 neutral, 1 in 5 **Loyalists** (Tories).","In 1775 nobody was fighting for independence, only for rights as Englishmen. British looting pushed neutrals to the Patriots."]},
            b:{h:"enslaved people", p:["Colonies with the most enslaved people (the South) supported revolution least: the enslaved were their wealth.","**Lord Dunmore**, Virginia's governor, offered freedom to any enslaved person who joined the British. Enslaved people generally sided with the English."]} },
      terms:["provincial conventions","Committees of Observation","Patriots","Loyalists","Lord Dunmore's Proclamation"] },

    { w:2, t:"Boston Massacre (March 5, 1770)", d:"the trial is the point",
      p:["What: troops had been in Boston since 1768. A crowd taunted a sentry at the Custom House, Captain **Preston**'s squad arrived, rocks and packed snow flew, one soldier fired, others followed. Five colonists died, including **Crispus Attucks**. Preston never gave the order.",
         "Why the trial matters: Britain would never let colonists execute its soldiers, and the elite wanted the trial to look fair, so **John Adams** defended them. Preston acquitted; two soldiers convicted of **manslaughter**, not murder. Paul Revere's engraving is propaganda. 1770 to 1773 is the **superficial calm**: quiet on the surface, organizing underneath."],
      terms:["Boston Massacre","Thomas Preston","Crispus Attucks","John Adams","manslaughter","superficial calm"] },

    { w:2, t:"Committees of Correspondence (1772)", d:"",
      p:["**Samuel Adams** built them in Massachusetts, then pushed them into other colonies: first intracolonial, then **intercolonial**. Why it matters: news from Massachusetts reached Georgia fast, so the colonies could answer the Coercive Acts together. Information is the key to resistance."],
      terms:["Samuel Adams","Committees of Correspondence","intercolonial"] },

    { w:2, t:"French and Indian War (1754-63) and the Albany Congress", d:"the debt behind everything",
      p:["Earlier wars with France (**Queen Anne's War**, **King George's War**) settled nothing; the **Iroquois** stayed neutral and played the empires against each other. The **Albany Congress** (1754, seven colonies) tried to win the Iroquois and coordinate defense and failed at both; Franklin's **Plan of Union** was rejected by every colonial legislature. It matters as the first try at union.",
         "This war started in the colonies (young Washington at **Fort Necessity**) and spread overseas as the **Seven Years' War**. Britain lost early under officers who bought their commissions; **William Pitt** promoted on merit, paid colonial war costs, and won by 1763. Result: an empire, no French threat, and a huge debt."],
      terms:["Queen Anne's War","King George's War","Iroquois neutrality","Albany Congress","Albany Plan of Union","Fort Necessity","Seven Years' War","William Pitt"] },

    { w:2, t:"Treaty of Paris (1763)", d:"who got what",
      p:["**Treaty of Paris 1763**: France out of North America, keeping only St. Pierre and Miquelon and the sugar islands Martinique and Guadeloupe. Britain's western line: the eastern bank of the **Mississippi**. **Louisiana** and **New Orleans** went to Spain, not Britain."],
      terms:["Treaty of Paris 1763","Mississippi River","Louisiana to Spain","New Orleans"] },

    { w:2, t:"First Great Awakening", d:"a crisis in religion",
      p:["Why: religion was fading. **Jonathan Edwards** preached that only God's grace saves; **George Whitefield**, an English **itinerant preacher**, toured the colonies and drew crowds of thousands. Faith came back through emotion. Established **Old Lights** rejected it; **New Lights** embraced it.",
         "Effects: congregations splintered into many denominations, so no church held a majority and none could claim to be the true one. That pushed toward **religious toleration**. Colonists also learned that challenging authority could work."],
      notes:[{k:"warn",t:"The !!Second!! Great Awakening (1800s) is the reform movement. This is the First."}],
      terms:["Jonathan Edwards","George Whitefield","itinerant preacher","Old Lights","New Lights","religious toleration"] },

    { w:1, t:"Population growth", d:"",
      p:["The colonies grew about tenfold from 1700 to 1775, mostly by **natural increase** (families), not immigration; immigration only mattered after 1730. Africans came as **involuntary migrants**, the largest single group. Europeans: Irish and Scots, Germans (Pennsylvania), and the **Scots-Irish**, Protestant Scots planted in northern Ireland."],
      terms:["natural increase","involuntary migrants","Scots-Irish"] }
  ],

  practice: [
    { q:"Why did Britain begin taxing the colonies after 1763?", opts:["to punish smuggling","to pay the debt from the French and Indian War","to fund the East India Company","to pay for the Albany Congress"], a:1, why:"Huge war debt. Colonists would pay a share and the Navigation Acts would be enforced." },
    { q:"The Proclamation of 1763 was issued mainly to", opts:["raise revenue from land sales","keep settlers east of the Appalachians and avoid another Indian war","punish Pennsylvania","reward veterans with land"], a:1, why:"Britain was broke and Pontiac had just been beaten. Land, not tax." },
    { q:"Colonists resented the Proclamation of 1763 because", opts:["it taxed frontier land","they already owned land past the line and could not settle or sell it","it gave the Ohio country to Spain","it required them to house troops"], a:1, why:"Speculators' investment was frozen. Colonists ignored it; Britain did not enforce it." },
    { q:"The Sugar Act differed from the Molasses Act because the Sugar Act", opts:["raised the duty","was actually enforced and passed for revenue","applied only to British sugar","was repealed within a year"], a:1, why:"Rate went down; enforcement and purpose changed." },
    { q:"Colonists objected to the Sugar Act on the principle that", opts:["Parliament was taxing them for revenue, not to regulate trade","the duty was higher than before","it applied only to New England","it taxed English goods"], a:0, why:"Regulation they accepted; revenue without representation they did not." },
    { q:"Which act banned colonial paper money?", opts:["Sugar Act","Currency Act","Declaratory Act","Quartering Act"], a:1, why:"Currency Act, 1764." },
    { q:"The Stamp Act was worse than earlier duties because it was", opts:["an external tax","an internal tax paid directly","enforced by the navy","aimed only at merchants"], a:1, why:"A stamp on documents reaches the pocket; a tariff hides in a price." },
    { q:"Why was the Stamp Act never implemented?", opts:["Parliament repealed it before it started","mobs made every distributor resign and boycotts pressured Parliament","the Stamp Act Congress voided it","governors refused to enforce it"], a:1, why:"No distributors, no stamps. Repeal came after, in 1766." },
    { q:"The elite formed the Sons of Liberty to", opts:["arm a militia","control mob protest and aim it at British officials","enforce the Continental Association","pay the stamp tax"], a:1, why:"A leaderless mob scared them. Enforcing the Association is the Committees of Observation." },
    { q:"Boycotts pushed Parliament to repeal the Stamp Act because", opts:["they cut off tea","British merchants lost money and lobbied for repeal","vice-admiralty courts enforced them","the king ordered it"], a:1, why:"Hurt the merchants and they beg Parliament. Same lever repealed most Townshend duties." },
    { q:"James Otis argued that", opts:["colonists should disobey Parliament","Parliament could not tax the unrepresented, but colonists must still obey","Virginia alone could tax Virginians","the colonies should be independent"], a:1, why:"Otis is the moderate. Virginia-alone is Patrick Henry." },
    { q:"Patrick Henry introduced the Virginia Stamp Act Resolves in the", opts:["Stamp Act Congress","House of Burgesses","First Continental Congress","provincial convention"], a:1, why:"Virginia's own legislature. The Stamp Act Congress met in New York." },
    { q:"Why did Parliament pass the Declaratory Act on the day it repealed the Stamp Act?", opts:["to enforce the Stamp Act by force","to keep the principle that it could tax and legislate in all cases","to let assemblies tax","to repeal the Townshend duties"], a:1, why:"The tax died, the principle did not." },
    { q:"Colonists resented the Quartering Act of 1765 because", opts:["it sent troops against the Iroquois","the troops had no purpose but watching colonists, who paid for them","it drafted colonists","it applied only to Virginia"], a:1, why:"No enemy left. Most troops went to Boston." },
    { q:"The Townshend Acts placed duties on", opts:["foreign molasses","English manufactured goods like paint, glass, lead and tea","western land","legal documents"], a:1, why:"English goods. Foreign molasses is the Sugar Act; documents is the Stamp Act." },
    { q:"Why did colonists object to Townshend revenue paying royal officials?", opts:["it raised the total tax","assemblies lost leverage over officials whose pay they had controlled","it taxed land","governors had to leave"], a:1, why:"Power of the purse. Once London paid him, the assembly had nothing on him." },
    { q:"Vice-admiralty courts were resented because smugglers", opts:["were tried in England","were tried by officers with no jury","could not appeal","were tried by assemblies"], a:1, why:"No jury of peers. Trial outside the colonies for murder is the Justice Act." },
    { q:"John Dickinson argued that Parliament", opts:["had no authority at all","could regulate trade but not hide a tax in a regulation","could tax with the king's approval","should repeal the Navigation Acts"], a:1, why:"Regulation yes, hidden revenue no. No authority at all is Richard Henry Lee." },
    { q:"The Daughters of Liberty mainly", opts:["wrote pamphlets","made homespun cloth and substitutes so boycotts could work","carried messages","petitioned the king"], a:1, why:"A boycott only bites if you can replace the goods." },
    { q:"Why did Parliament keep the tea duty in 1770?", opts:["tea earned the most","to preserve the principle that it could tax","the East India Company demanded it","to fund the customs board"], a:1, why:"A symbol. That is why the Tea Act landed on an open wound." },
    { q:"At the Boston Massacre trial, John Adams", opts:["prosecuted Preston","defended the soldiers; Preston acquitted, two convicted of manslaughter","refused the case","won murder convictions"], a:1, why:"Showed colonial respect for law. Manslaughter, not murder." },
    { q:"The Committees of Correspondence mattered because they", opts:["enforced the boycott","spread information between colonies so resistance could be coordinated","collected the tea tax","organized the militia"], a:1, why:"Samuel Adams' network. Enforcing the boycott is the Committees of Observation." },
    { q:"The Tea Act of 1773 was passed to", opts:["raise the price of tea","save the East India Company from bankruptcy","punish Boston","repeal the tea tax"], a:1, why:"Unsold tea and members of Parliament holding stock. Tea got cheaper." },
    { q:"Colonists objected to the Tea Act even though tea got cheaper because", opts:["the duty rose","it created a monopoly, cut out American merchants, and tempted people to pay the tax","it banned Dutch tea","it applied only to Boston"], a:1, why:"Buy the cheap tea and you concede Parliament's right to tax." },
    { q:"Boston dumped the tea rather than turning the ships away because", opts:["Samuel Adams wanted war","Governor Hutchinson would not let the ships leave, and unpaid cargo would be confiscated","other ports had taken the tea","the company refused it back"], a:1, why:"Pay the tax or destroy the cargo. Other ports had a governor who let the ships go." },
    { q:"Which was NOT a Coercive Act?", opts:["Boston Port Act","Massachusetts Government Act","Quebec Act","Justice Act"], a:2, why:"Separate law from the same session about Catholicism, French law and Quebec's borders." },
    { q:"Parliament passed the Coercive Acts to", opts:["raise revenue","punish Massachusetts and make an example of it","protect Catholics","fund the Quartering Act"], a:1, why:"Punishment, not revenue. Effect: the other colonies called a congress." },
    { q:"The Massachusetts Government Act", opts:["closed the port","revoked the charter, made the council appointed, and limited town meetings","moved trials","housed troops"], a:1, why:"Each Coercive Act has one job." },
    { q:"Colonists feared the Justice Act because officials who killed colonists", opts:["would face a colonial jury","would be tried outside the colonies and, they assumed, go free","would be pardoned by Parliament","would face military courts in Boston"], a:1, why:"Read as a guarantee of acquittal." },
    { q:"The Quebec Act angered colonists because it", opts:["closed Quebec's port","recognized the Catholic Church and French civil law and enlarged Quebec into land the colonies claimed","imposed the Stamp Act on Canada","gave Quebec an assembly"], a:1, why:"Catholicism, no juries, and a border down to the Ohio." },
    { q:"The First Continental Congress declared that Parliament", opts:["had no authority","could regulate trade but not tax for revenue","could tax if colonists got seats","had authority over everything but religion"], a:1, why:"Between Lee (no authority) and Galloway (a colonial veto)." },
    { q:"The Continental Association was", opts:["an American legislature to review Parliament's laws","non-importation and non-exportation agreements, enforced locally","the first name of the army","a loyalist group"], a:1, why:"A boycott with teeth. The legislature idea is Galloway's Plan of Union." },
    { q:"Committees of Observation had popular support because they", opts:["were appointed by governors","were chosen by all qualified voters","were led by the Sons of Liberty","were created by Parliament"], a:1, why:"Elected locally, so they could enforce the boycott and govern for about six months." },
    { q:"Provincial conventions took over in 1774-75 because", opts:["Parliament authorized them","governors dissolved the legislatures, which reconvened themselves, and the militia would not stop them","Congress ordered them","the king recognized them"], a:1, why:"No troops, no loyal militia, no way to enforce anything." },
    { q:"Colonies with the most enslaved people supported revolution least because", opts:["they had no grievances","the enslaved were their wealth and revolt risked losing control of them","they were Catholic","they had no assemblies"], a:1, why:"Dunmore's offer of freedom made that fear real." },
    { q:"Lord Dunmore's Proclamation promised", opts:["freedom to enslaved people and servants who joined the British","pardons to Patriots","western land to loyalists","Virginia's neutrality"], a:0, why:"Aimed to wreck the Patriot economy. Enslaved people generally sided with the British." },
    { q:"In 1775 most Patriots were fighting for", opts:["independence","their rights as Englishmen","a French alliance","the Ohio country"], a:1, why:"Independence comes in 1776." },
    { q:"The Albany Plan of Union failed because", opts:["the Iroquois refused","every colonial legislature rejected it rather than give up authority","Parliament vetoed it","Franklin withdrew it"], a:1, why:"Delegates passed it; the assemblies killed it." },
    { q:"By the Treaty of Paris of 1763, Louisiana and New Orleans went to", opts:["Britain","Spain","the Iroquois","the United States"], a:1, why:"Britain stopped at the east bank of the Mississippi." },
    { q:"Britain's virtual representation argument held that", opts:["colonists could elect members of Parliament","every member of Parliament represented every subject, colonists included","only assemblies could tax","the king represented the colonies"], a:1, why:"The colonial reply: only a body you elect can consent to your taxes." },
    { q:"A main effect of the First Great Awakening was that", opts:["one church took over","congregations splintered, increasing toleration","people stopped going to church","the Anglican Church was banned"], a:1, why:"No church held a majority, so none could claim to be the true one." }
  ],

/* ═══ machinery. nothing below needs editing. ═══ */
const $=s=>document.querySelector(s);
const el=(t,c,h)=>{const n=document.createElement(t);if(c)n.className=c;if(h!=null)n.innerHTML=h;return n};
const REDUCED=matchMedia("(prefers-reduced-motion:reduce)").matches;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b class="kw">$1</b>').replace(/==(.+?)==/g,'<mark class="hl">$1</mark>').replace(/!!(.+?)!!/g,'<span class="trap">$1</span>');
const CHEV='<svg class="chev" width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3l4 4-4 4"/></svg>';
const ICON={
 apush:'<path d="M7 22V5"/><path d="M7 6.4h10.5c.8 0 1.2.9.7 1.5L16 10l2.2 2.1c.5.6.1 1.5-.7 1.5H7"/>',
 lang:'<path d="M6 22 9.3 15"/><path d="M9 15.4 17.4 5.2c.5-.6 1.4-.5 1.8.1l1.2 2c.3.6.1 1.4-.5 1.7L8.6 14.9"/><path d="M11.6 10.4 15 12.4"/>',
 psych:'<path d="M18.4 20.4v-2.6h1.9c.7 0 1.1-.7.8-1.3l-1.6-3a7.2 7.2 0 1 0-6.8 4.2"/><path d="M9.2 21v-3.3"/>',
 phys:'<circle cx="13.5" cy="13.5" r="2"/><ellipse cx="13.5" cy="13.5" rx="9" ry="3.6"/><ellipse cx="13.5" cy="13.5" rx="9" ry="3.6" transform="rotate(60 13.5 13.5)"/><ellipse cx="13.5" cy="13.5" rx="9" ry="3.6" transform="rotate(120 13.5 13.5)"/>',
 pre:'<path d="M5 5v16h16"/><path d="M7.5 18.6c3.2 0 3.6-9.4 6.6-9.4 2.6 0 3.3 6 6.6 6"/>',
 sem:'<path d="M4.6 8.2a2 2 0 0 1 2-2h8.6a2 2 0 0 1 2 2v4.4a2 2 0 0 1-2 2h-4l-3.4 2.7v-2.7h-1.2a2 2 0 0 1-2-2z"/><path d="M19.2 10.6h.4a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-.6v2.4l-2.9-2.4"/>',
 span:'<path d="M4.5 8a2.2 2.2 0 0 1 2.2-2.2h12.6A2.2 2.2 0 0 1 21.5 8v7.3a2.2 2.2 0 0 1-2.2 2.2h-7.4L7 21.6v-4.1H6.7a2.2 2.2 0 0 1-2.2-2.2z"/><path d="M11 9.4c.4-.9 1.3-1.4 2.2-1.2 1 .2 1.6 1.1 1.4 2-.2.8-1 1-1.4 1.7"/><path d="M13 14.1h.01"/>',
 apwh:'<circle cx="13" cy="13" r="8.6"/><path d="M4.4 13h17.2"/><ellipse cx="13" cy="13" rx="3.6" ry="8.6"/>',
 biz:'<path d="M5 5v16h16"/><rect x="8.4" y="13" width="3" height="5.2" rx=".8"/><rect x="13.4" y="9.6" width="3" height="8.6" rx=".8"/><rect x="18.4" y="6.4" width="3" height="11.8" rx=".8"/>',
 mor:'<path d="M13 4.5v17"/><path d="M7.5 9.5h11"/>',
 csp:'<path d="m9 8-5 5 5 5"/><path d="m17 8 5 5-5 5"/><path d="m14.5 5-3 16"/>'
};
const icon=id=>'<svg viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(ICON[id]||ICON.apush)+'</svg>';
const LABEL={outline:"guide",practice:"practice",problems:"problems",formulas:"formulas",cards:"cards",timeline:"timeline",checklist:"checklist"};

/* header */
document.documentElement.style.setProperty("--cls",`var(--c-${GUIDE.id})`);
document.title=`${GUIDE.title} · ${GUIDE.cls} · Valentino guides`;
$("#title").textContent=GUIDE.title;
if(GUIDE.sub){$("#sub").textContent=GUIDE.sub;$("#sub").hidden=false}
if(GUIDE.pdfs?.length){const d=$("#pdfs");d.innerHTML=(GUIDE.pdfsNote?`<p class="pn">${esc(GUIDE.pdfsNote)}</p>`:"")+GUIDE.pdfs.map((p,i)=>`<a class="btn${i?" ghost":""}" href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.t)}</a>`).join("");d.hidden=false}
$("#upd").textContent=GUIDE.updated?`last updated ${GUIDE.updated}`:"";
(function(){
  const c=$("#crow");
  c.appendChild(el("span","cname",icon(GUIDE.id)+"<span>"+esc(GUIDE.cls)+"</span>"));
  if(GUIDE.test){
    const t=new Date(GUIDE.test+"T00:00:00"), e=new Date((GUIDE.end||GUIDE.test)+"T00:00:00");
    const now=new Date(); now.setHours(0,0,0,0);
    const days=Math.round((t-now)/864e5);
    const md=`${t.getMonth()+1}/${t.getDate()}`+(GUIDE.end?`–${e.getMonth()+1}/${e.getDate()}`:"");
    let txt, past=e<now;
    if(past)txt=`test was ${md}`;
    else if(days<=0)txt=`test today · ${md}`;
    else if(days===1)txt=`test tomorrow · ${md}`;
    else if(days<=14)txt=`test in ${days} days · ${md}`;
    else txt=`test ${md}`;
    c.appendChild(el("span","chip"+(past?" past":" due"),esc(txt)));
  }
  if(GUIDE.meta)c.appendChild(el("span","chip",esc(GUIDE.meta)));
})();

/* panes */
const root=$("#root"), panesEl=$("#panes"), pthumb=panesEl.querySelector(".thumb");
const PANES=(GUIDE.panes||[]).filter(id=>Array.isArray(GUIDE[id])&&GUIDE[id].length||(id==="outline"&&GUIDE.top?.length));
const builders={outline:buildOutline,practice:buildPractice,problems:buildProblems,formulas:buildFormulas,cards:buildCards,timeline:buildTimeline,checklist:buildChecklist};
const tabs=[];
PANES.forEach((id,i)=>{
  const sec=el("section","pane"); sec.id="p-"+id; sec.setAttribute("role","tabpanel");
  builders[id](sec); root.appendChild(sec);
  const b=el("button",null,esc((GUIDE.labels||{})[id]||LABEL[id]||id)); b.type="button"; b.setAttribute("role","tab"); b.dataset.pane=id;
  b.addEventListener("click",()=>show(id,true)); panesEl.appendChild(b); tabs.push(b);
});
if(PANES.length<2)panesEl.classList.add("one");
function moveP(){const on=panesEl.querySelector('button[aria-selected="true"]');if(!on)return;pthumb.style.left=on.offsetLeft+"px";pthumb.style.width=on.offsetWidth+"px"}
function show(id,user){
  tabs.forEach(b=>b.setAttribute("aria-selected",String(b.dataset.pane===id)));
  document.querySelectorAll(".pane").forEach(p=>p.classList.toggle("on",p.id==="p-"+id));
  moveP(); if(user){try{history.replaceState(null,"","#"+id)}catch(e){}}
}
const want=location.hash.slice(1);
show(PANES.includes(want)?want:PANES[0],false);
requestAnimationFrame(moveP); addEventListener("resize",moveP);

/* outline */
function shead(txt,extra){const h=el("div","sh",`<h3>${esc(txt)}</h3>`+(extra?`<span class="shx">${esc(extra)}</span>`:""));return h}
function extras(s){
  let h="";
  if(s.cmp)h+=`<div class="cmp"><div><h5>${esc(s.cmp.a.h)}</h5>${s.cmp.a.p.map(x=>`<p>${fmt(x)}</p>`).join("")}</div><div><h5>${esc(s.cmp.b.h)}</h5>${s.cmp.b.p.map(x=>`<p>${fmt(x)}</p>`).join("")}</div></div>`;
  if(s.steps)h+=`<ol class="steps">${s.steps.map(x=>`<li>${fmt(x)}</li>`).join("")}</ol>`;
  if(s.notes)h+=s.notes.map(n=>`<div class="callout ${esc(n.k||"")}"><span class="cl">${({warn:"watch out",ex:"example",ok:"rule"})[n.k]||esc(n.k||"note")}</span>${fmt(n.t)}</div>`).join("");
  if(s.terms?.length)h+=`<div class="terms">${s.terms.map(t=>`<span class="term">${esc(t)}</span>`).join("")}</div>`;
  return h;
}
function buildOutline(sec){
  if(GUIDE.top?.length){
    sec.appendChild(shead("start here","the whole guide in one screen"));
    sec.appendChild(el("div","card top",GUIDE.top.map(x=>`<p>${fmt(x)}</p>`).join("")));
  }
  const list=GUIDE.outline||[]; if(!list.length)return;
  const n3=list.filter(s=>s.w===3).length;
  sec.appendChild(shead("the unit",`${list.length} sections`+(n3?` · ${n3} tested most`:"")));
  const g=el("div","group");
  list.forEach((s,i)=>{
    const row=el("button","row"); row.type="button"; row.setAttribute("aria-expanded",String(s.w===3));
    row.innerHTML=`<span class="rt"><span class="rn">${esc(s.t)}</span>${s.d?`<span class="rd">${esc(s.d)}</span>`:""}</span>`+(s.w>=2?`<span class="w w${s.w}">${s.w===3?"tested most":"tested"}</span>`:"")+CHEV;
    const body=el("div","body"+(s.w===3?" on":""),`<div><div class="in">${(s.p||[]).map(x=>`<p>${fmt(x)}</p>`).join("")}${extras(s)}</div></div>`);
    row.addEventListener("click",()=>{const on=!body.classList.contains("on");body.classList.toggle("on",on);row.setAttribute("aria-expanded",String(on))});
    g.appendChild(row); g.appendChild(body);
  });
  sec.appendChild(g);
  if(GUIDE.abbr&&Object.keys(GUIDE.abbr).length){
    sec.appendChild(shead("abbreviations"));
    sec.appendChild(el("div","card abbr",Object.entries(GUIDE.abbr).map(([k,v])=>`<b>${esc(k)}</b> ${esc(v)}`).join(" · ")));
  }
}

/* practice mc */
function buildPractice(sec){
  const qs=GUIDE.practice||[]; let done=0, right=0;
  sec.appendChild(shead("practice",`${qs.length} questions`));
  const sc=el("div","group score"); sc.innerHTML=`<b id="scn">0</b><span>of ${qs.length} right</span><button type="button" class="btn ghost" id="reset" style="margin-left:auto">start over</button>`; sc.hidden=true; const scn=sc.querySelector("#scn");
  qs.forEach((q,i)=>{
    const card=el("div","group q");
    card.innerHTML=`<div class="qt"><div class="qn">question ${i+1}</div>${fmt(q.q)}</div>`+
      q.opts.map((o,j)=>`<button type="button" class="opt" data-i="${j}"><span class="k">${"abcd"[j]||j+1}</span><span>${fmt(o)}</span></button>`).join("")+
      `<div class="why"><b>${"why"}</b>${fmt(q.why||"")}</div>`;
    card.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>{
      if(card.classList.contains("done"))return;
      card.classList.add("done"); const j=+b.dataset.i;
      if(j===q.a){b.classList.add("right");right++}else{b.classList.add("wrong");card.querySelectorAll(".opt")[q.a].classList.add("right")}
      done++; scn.textContent=right; sc.hidden=false; if(done===qs.length)sc.scrollIntoView({block:"nearest",behavior:REDUCED?"auto":"smooth"});
    }));
    sec.appendChild(card);
  });
  sec.appendChild(sc);
  sc.querySelector("#reset").addEventListener("click",()=>{done=0;right=0;scn.textContent=0;sc.hidden=true;sec.querySelectorAll(".q").forEach(c=>{c.classList.remove("done");c.querySelectorAll(".opt").forEach(o=>o.classList.remove("right","wrong"))});sec.scrollIntoView({behavior:REDUCED?"auto":"smooth"})});
}

/* problems / worked examples */
function buildProblems(sec){
  const ps=GUIDE.problems||[];
  sec.appendChild(shead("problems",`${ps.length} to work`));
  ps.forEach((p,i)=>{
    const card=el("div","group prob");
    card.innerHTML=`<div class="qt"><div class="qn">problem ${i+1}</div>${fmt(p.q)}</div><button type="button" class="go"><span>show the steps</span>${CHEV}</button><div class="reveal"><ol class="steps" style="margin-top:0">${(p.steps||[]).map(s=>`<li>${fmt(s)}</li>`).join("")}</ol>${p.ans?`<div class="ans"><b>answer</b>${fmt(p.ans)}</div>`:""}</div>`;
    const go=card.querySelector(".go");
    go.addEventListener("click",()=>{const on=!card.classList.contains("on");card.classList.toggle("on",on);go.firstElementChild.textContent=on?"hide the steps":"show the steps"});
    sec.appendChild(card);
  });
}

/* formulas */
function buildFormulas(sec){
  const fs=GUIDE.formulas||[];
  sec.appendChild(shead("formulas",`${fs.length}`));
  sec.appendChild(el("div","group",fs.map(f=>`<div class="fx"><span class="n">${esc(f.n)}</span><span class="f">${esc(f.f)}</span>${f.note?`<span class="note">${fmt(f.note)}</span>`:""}</div>`).join("")));
}

/* flashcards */
function buildCards(sec){
  const cs=GUIDE.cards||[]; let i=0, order=cs.map((_,k)=>k);
  sec.appendChild(shead("cards",`${cs.length}`));
  const deck=el("div","deck"); const fc=el("div","fc"); fc.setAttribute("role","button"); fc.tabIndex=0; deck.appendChild(fc); sec.appendChild(deck);
  const nav=el("div","dnav",`<button type="button" class="btn ghost" id="prev">back</button><button type="button" class="btn" id="next">next</button><button type="button" class="btn ghost" id="shuf">shuffle</button><span class="cnt" id="cnt"></span>`); sec.appendChild(nav);
  const cnt=nav.querySelector("#cnt");
  const draw=()=>{const c=cs[order[i]];fc.classList.remove("flip");fc.innerHTML=`<div class="f"><span class="tag">term</span><span>${esc(c.f)}</span></div><div class="b"><span class="tag">${esc(GUIDE.cls)}</span><span>${fmt(c.b)}</span></div>`;cnt.textContent=`${i+1} of ${cs.length}`};
  const flip=()=>fc.classList.toggle("flip");
  fc.addEventListener("click",flip); fc.addEventListener("keydown",e=>{if(e.key===" "||e.key==="Enter"){e.preventDefault();flip()}});
  nav.querySelector("#next").addEventListener("click",()=>{i=(i+1)%cs.length;draw()});
  nav.querySelector("#prev").addEventListener("click",()=>{i=(i-1+cs.length)%cs.length;draw()});
  nav.querySelector("#shuf").addEventListener("click",()=>{for(let k=order.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[order[k],order[j]]=[order[j],order[k]]}i=0;draw()});
  addEventListener("keydown",e=>{if(!sec.classList.contains("on")||e.target.tagName==="INPUT")return;if(e.key==="ArrowRight"){i=(i+1)%cs.length;draw()}if(e.key==="ArrowLeft"){i=(i-1+cs.length)%cs.length;draw()}});
  let x0=null; fc.addEventListener("touchstart",e=>{x0=e.touches[0].clientX},{passive:true}); fc.addEventListener("touchend",e=>{if(x0==null)return;const dx=e.changedTouches[0].clientX-x0;x0=null;if(dx<-40){i=(i+1)%cs.length;draw()}else if(dx>40){i=(i-1+cs.length)%cs.length;draw()}},{passive:true});
  draw();
}

/* timeline */
function buildTimeline(sec){
  const ts=GUIDE.timeline||[];
  sec.appendChild(shead("timeline",`${ts.length} events`));
  sec.appendChild(el("div","card",`<div class="tl">${ts.map(t=>`<div class="ev"><div class="y">${esc(t.y)}</div><div class="t">${fmt(t.t)}</div>${t.d?`<div class="d">${fmt(t.d)}</div>`:""}</div>`).join("")}</div>`));
}

/* checklist */
function buildChecklist(sec){
  const cs=GUIDE.checklist||[]; const key="ck:"+location.pathname; let saved={}; try{saved=JSON.parse(localStorage.getItem(key)||"{}")}catch(e){}
  sec.appendChild(shead("checklist",`${cs.length} items`));
  const g=el("div","group");
  cs.forEach((c,i)=>{
    const b=el("button","ck"+(saved[i]?" on":""),`<span class="box"><svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 6.5l2.5 2.5 4.5-5"/></svg></span><span><span class="t">${fmt(c.t)}</span>${c.d?`<span class="d">${fmt(c.d)}</span>`:""}</span>`);
    b.type="button"; b.addEventListener("click",()=>{b.classList.toggle("on");saved[i]=b.classList.contains("on");try{localStorage.setItem(key,JSON.stringify(saved))}catch(e){}});
    g.appendChild(b);
  });
  sec.appendChild(g);
}

/* theme (shared with the homepage via localStorage "theme") */
const seg=$(".seg"), thumb=$(".seg .thumb"), segBtns=[...seg.querySelectorAll("button")];
function moveThumb(){const on=seg.querySelector('button[aria-pressed="true"]')||segBtns[0];thumb.style.left=on.offsetLeft+"px";thumb.style.width=on.offsetWidth+"px"}
function setTheme(mode){
  const apply=()=>{if(mode==="auto")delete document.documentElement.dataset.theme;else document.documentElement.dataset.theme=mode};
  if(document.startViewTransition&&!REDUCED)document.startViewTransition(apply);else apply();
  segBtns.forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.set===mode)));moveThumb();
  try{mode==="auto"?localStorage.removeItem("theme"):localStorage.setItem("theme",mode)}catch(e){}
}
segBtns.forEach(b=>b.addEventListener("click",()=>setTheme(b.dataset.set)));
(function(){let saved=null;try{saved=localStorage.getItem("theme")}catch(e){}
  const mode=saved==="light"||saved==="dark"?saved:"auto";
  if(mode!=="auto")document.documentElement.dataset.theme=mode;
  segBtns.forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.set===mode)));
})();
requestAnimationFrame(moveThumb);addEventListener("resize",moveThumb);
document.fonts?.ready.then(()=>{moveThumb();moveP()});

/* sticky bar shadow + staggered reveal */
(function(){const bar=$("#bar");let raf=0;const tick=()=>{raf=0;bar.classList.toggle("stuck",scrollY>6)};addEventListener("scroll",()=>{if(!raf)raf=requestAnimationFrame(tick)},{passive:true});tick()})();
document.querySelectorAll(".rv").forEach((n,i)=>n.style.animationDelay=(i*55)+"ms");
</script>
