<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>study guide · valentino guides</title>
<meta name="description" content="A free study guide from valentinoguides.com. Made by a student.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#EEE8DC">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#151B20">
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg?v=3" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3">
<link rel="preload" href="/fonts/bricolage-grotesque.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/figtree.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* ═══ valentino guides · guide template v2 (kinari, wide layout, sept 29 2026) ═══
   Same tokens, type, corners and components as the homepage. Edit the GUIDE object below the machinery; leave the CSS alone. */
@font-face{font-family:"Bricolage Grotesque";font-style:normal;font-weight:200 800;font-display:swap;src:url(/fonts/bricolage-grotesque.woff2) format("woff2")}
@font-face{font-family:"Figtree";font-style:normal;font-weight:300 900;font-display:swap;src:url(/fonts/figtree.woff2) format("woff2")}
@font-face{font-family:"Figtree";font-style:italic;font-weight:300 900;font-display:swap;src:url(/fonts/figtree-italic.woff2) format("woff2")}

:root{--paper:#EEE8DC;--surface:#FBF8F1;--surface2:#F4EFE5;--line:#D4CABB;--line2:#B4ADA1;--ink:#20272B;--ink2:rgba(94,90,82,1);--ink3:rgba(94,90,82,.95);--accent:#294A5E;--on-accent:#FBF8F1;--hi:#944B34;--good:#4C6A48;--bad:#8E3F4C;
  --c-apush:#8A442D;--c-psych:#873E50;--c-phys:#28636A;--c-pre:#684A78;--c-sem:#56633B;--c-biz:#75601E;--c-mor:#69513D;--c-lang:#4A4E7A;--c-span:#8E3F3A;--c-apwh:#5F4A78;--c-csp:#4E5A63}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#151B20;--surface:#1D252A;--surface2:#192024;--line:#354149;--line2:#576064;--ink:#F2ECDF;--ink2:rgba(185,178,167,.97);--ink3:rgba(185,178,167,.77);--accent:#8FB7CA;--on-accent:#1D252A;--hi:#E18A67;--good:#9BBC8A;--bad:#DF8592;
  --c-apush:#E08B68;--c-psych:#DB8D9C;--c-phys:#75B8B6;--c-pre:#C39ACC;--c-sem:#AAB67A;--c-biz:#CBB15F;--c-mor:#C79E7B;--c-lang:#A9AEE0;--c-span:#E09490;--c-apwh:#BBA3D6;--c-csp:#A9B6BE}}
:root[data-theme="dark"]{--paper:#151B20;--surface:#1D252A;--surface2:#192024;--line:#354149;--line2:#576064;--ink:#F2ECDF;--ink2:rgba(185,178,167,.97);--ink3:rgba(185,178,167,.77);--accent:#8FB7CA;--on-accent:#1D252A;--hi:#E18A67;--good:#9BBC8A;--bad:#DF8592;
  --c-apush:#E08B68;--c-psych:#DB8D9C;--c-phys:#75B8B6;--c-pre:#C39ACC;--c-sem:#AAB67A;--c-biz:#CBB15F;--c-mor:#C79E7B;--c-lang:#A9AEE0;--c-span:#E09490;--c-apwh:#BBA3D6;--c-csp:#A9B6BE}

:root{
  --display:"Bricolage Grotesque",-apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",sans-serif;
  --sans:"Figtree",-apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",sans-serif;
  --w-d:600; --ls-d:-.025em;
  --t12:12px; --t13:13px; --t15:15px; --t16:16px; --t20:20px; --t26:26px;
  --r-card:14px; --r-btn:10px; --r-chip:8px;
  --spring:cubic-bezier(.32,.72,0,1); --ease:cubic-bezier(.22,.61,.36,1);
  --gap:16px;
  --cls:var(--accent);            /* set from GUIDE.id at runtime: the class color */
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;scroll-padding-top:calc(var(--barh,56px) + 62px)}
@media (min-width:960px){html{scroll-padding-top:calc(var(--barh,56px) + 16px)}}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:var(--t16);line-height:1.5;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;overflow-x:hidden;min-height:100vh;
  padding-bottom:calc(56px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:left}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
:root{--maxw:1180px;--gut:clamp(14px,3.4vw,36px)}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 var(--gut)}

/* reading aids */
.skipl{position:fixed;left:12px;top:-72px;z-index:200;padding:10px 15px;border-radius:var(--r-btn);background:var(--accent);color:var(--on-accent);font-weight:600;font-size:14px;transition:top .24s var(--spring)}
.skipl:focus{top:12px;outline:none}
#prog{position:fixed;top:0;left:0;right:0;height:2px;z-index:120;pointer-events:none}
#prog i{display:block;height:100%;width:0;background:var(--cls)}

/* bar */
.bar{position:sticky;top:0;z-index:40;background:var(--paper);padding:max(10px,env(safe-area-inset-top)) 0 10px;transition:box-shadow .3s var(--ease)}
.bar.stuck{box-shadow:0 1px 0 0 var(--line)}
.bar .wrap{display:flex;align-items:center;gap:10px}
.home{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:26px;height:26px;border-radius:5px;flex:none;display:block}
.bar h1{margin:0;font-family:var(--display);font-size:var(--t20);font-weight:var(--w-d);letter-spacing:var(--ls-d);text-transform:lowercase;white-space:nowrap}
@media (max-width:379px){.bar h1{display:none}}
.seg{position:relative;display:flex;border:1px solid var(--line);border-radius:8px;padding:2px;isolation:isolate;flex:none;background:var(--surface)}
.seg button{position:relative;z-index:2;padding:4px 9px;border-radius:6px;font-size:var(--t12);font-weight:500;color:var(--ink3);text-transform:lowercase;text-align:center;transition:color .2s var(--ease)}
.seg button[aria-pressed="true"]{color:var(--on-accent)}
.seg .thumb{position:absolute;z-index:1;top:2px;bottom:2px;left:2px;width:0;border-radius:6px;background:var(--ink);transition:left .36s var(--spring),width .36s var(--spring)}
.bar .seg{margin-left:auto}

/* hero */
main{padding-top:22px}
.crow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.cname{display:flex;align-items:center;gap:7px;font-size:var(--t13);font-weight:600;letter-spacing:.03em;color:var(--cls);text-transform:lowercase}
.cname svg{width:20px;height:20px;flex:none}
.chip{flex:none;font-size:var(--t12);font-weight:500;padding:3px 8px;border-radius:var(--r-chip);background:var(--surface);color:var(--ink2);white-space:nowrap;font-variant-numeric:tabular-nums;border:1px solid var(--line);text-transform:lowercase}
.chip.due{color:var(--cls);border-color:var(--cls);background:transparent}
.chip.past{color:var(--ink3)}
h2.title{margin:0 0 8px;font-family:var(--display);font-size:clamp(30px,5.2vw,50px);font-weight:var(--w-d);letter-spacing:var(--ls-d);line-height:1.02;text-transform:lowercase;text-wrap:balance}
.sub{margin:0 0 16px;font-size:var(--t16);line-height:1.5;color:var(--ink2);max-width:70ch}
.pdfs{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 18px}
.pdfs .pn{font-size:var(--t13);color:var(--ink2);width:100%;margin:0 0 2px;text-transform:lowercase}

/* pane switcher */
.panes{display:inline-flex;max-width:100%;gap:2px;margin:6px 0 22px;padding:2px;border:1px solid var(--line);border-radius:10px;background:var(--surface);position:relative;isolation:isolate;overflow-x:auto;scrollbar-width:none;vertical-align:top}
.panes::-webkit-scrollbar{display:none}
.panes button{flex:0 0 auto;position:relative;z-index:2;padding:8px 16px;border-radius:8px;text-align:center;font-size:var(--t15);font-weight:500;color:var(--ink3);text-transform:lowercase;white-space:nowrap;transition:color .2s var(--ease)}
.panes button[aria-selected="true"]{color:var(--on-accent)}
.panes .thumb{position:absolute;z-index:1;top:2px;bottom:2px;left:2px;width:0;border-radius:8px;background:var(--ink);transition:left .36s var(--spring),width .36s var(--spring)}
.panes.one{display:none}
@media (max-width:599px){.panes{display:flex}.panes button{flex:1 0 auto;padding:7px 12px;font-size:var(--t13)}}
.pane{display:none;container-type:inline-size}
.pane.on{display:block;animation:rise .38s var(--spring) both}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* small section label */
.sh{display:flex;align-items:center;gap:10px;margin:28px 0 12px}
.sh:first-child{margin-top:0}
.sh h3{margin:0;font-size:var(--t12);font-weight:600;letter-spacing:.05em;color:var(--ink3);text-transform:lowercase;white-space:nowrap}
.sh::after{content:"";flex:1;height:1px;background:var(--line);order:2}
.shx{order:3;font-size:var(--t12);color:var(--ink3);text-transform:lowercase;font-variant-numeric:tabular-nums;white-space:nowrap}

/* ═══ outline: side menu + all-open sections ═══ */
.ol{display:grid;grid-template-columns:1fr;gap:0 32px;align-items:start}
@media (min-width:960px){.ol{grid-template-columns:212px minmax(0,1fr)}}
.toc{position:sticky;top:var(--barh,56px);z-index:30;background:var(--paper);margin:0 calc(var(--gut) * -1) 14px;padding:6px var(--gut) 8px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line)}
.toc::-webkit-scrollbar{display:none}
.toc .tl{display:none}
.toc a{flex:none;display:flex;align-items:center;gap:7px;padding:6px 10px;border-radius:var(--r-chip);font-size:var(--t13);font-weight:500;color:var(--ink2);border:1px solid var(--line);background:var(--surface);white-space:nowrap;transition:color .16s var(--ease),background .16s var(--ease),border-color .16s var(--ease)}
.toc a.on{color:var(--on-accent);background:var(--ink);border-color:var(--ink)}
.toc i{flex:none;width:8px;height:8px;border-radius:3px;border:1.5px solid var(--cls)}
.toc i.w3{background:var(--cls)} .toc i.w2{background:color-mix(in srgb,var(--cls) 40%,transparent)}
.toc a.on i{border-color:var(--on-accent)} .toc a.on i.w3{background:var(--on-accent)}
@media (min-width:960px){
  .toc{top:calc(var(--barh,56px) + 12px);margin:0;padding:0;display:block;overflow:visible;border:0;background:none;max-height:calc(100vh - var(--barh,56px) - 32px);overflow-y:auto}
  .toc .tl{display:block;font-size:var(--t12);font-weight:600;letter-spacing:.05em;color:var(--ink3);text-transform:lowercase;margin:2px 0 8px 10px}
  .toc a{display:flex;align-items:flex-start;white-space:normal;border:0;background:none;padding:7px 10px;line-height:1.3;border-radius:8px}
  .toc a i{margin-top:5px}
  .toc a:hover{background:var(--surface)}
  .toc a.on{background:var(--surface);color:var(--ink);box-shadow:inset 2px 0 0 var(--cls);border-radius:0 8px 8px 0}
  .toc a.on i{border-color:var(--cls)} .toc a.on i.w3{background:var(--cls)}
  .toc .leg{display:flex;flex-direction:column;gap:4px;margin:14px 0 0 10px;padding-top:12px;border-top:1px solid var(--line);font-size:var(--t12);color:var(--ink3);text-transform:lowercase}
  .toc .leg span{display:flex;align-items:center;gap:7px}
}
.toc .leg{display:none}
@media (min-width:960px){.toc .leg{display:flex}}

/* start here tiles */
.tops{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px;margin-bottom:26px;counter-reset:tp}
.tops .tp{counter-increment:tp;position:relative;padding:14px 16px 14px 48px;border-radius:var(--r-card);background:var(--surface);border:1px solid var(--line);font-size:var(--t15);line-height:1.45}
.tops .tp::before{content:counter(tp);position:absolute;left:14px;top:13px;width:24px;height:24px;border-radius:7px;background:var(--cls);color:var(--surface);font-weight:650;font-size:var(--t13);display:grid;place-items:center;font-variant-numeric:tabular-nums}

/* section card */
.sec{container-type:inline-size;border-radius:var(--r-card);background:var(--surface);border:1px solid var(--line);margin-bottom:16px;overflow:hidden}
.sec > header{display:flex;align-items:flex-start;gap:12px;padding:16px 18px 12px;border-bottom:1px solid var(--line)}
.sec .num{flex:none;font-family:var(--display);font-weight:var(--w-d);font-size:var(--t15);color:var(--cls);font-variant-numeric:tabular-nums;padding-top:4px;min-width:1.4em}
.sec .ht{flex:1;min-width:0}
.sec h3{margin:0;font-family:var(--display);font-size:clamp(20px,2.4vw,24px);font-weight:var(--w-d);letter-spacing:var(--ls-d);line-height:1.15;text-wrap:balance}
.sec .sd{margin:3px 0 0;font-size:var(--t13);color:var(--ink2);line-height:1.4}
.w{flex:none;font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:var(--r-chip);text-transform:lowercase;white-space:nowrap;margin-top:3px}
@container (max-width:520px){.sec > header{flex-wrap:wrap;row-gap:6px}.sec .ht{flex:1 1 calc(100% - 3em)}.sec > header .w{order:3;margin:0 0 0 calc(1.4em + 12px)}}
.w3{background:var(--cls);color:var(--surface)}
.w2{background:color-mix(in srgb,var(--cls) 14%,transparent);color:var(--cls)}
.sb{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;padding:16px 18px 18px}
@container (min-width:700px){
  .sb .duo{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:20px;align-items:start}
  .sb .duo.wide-side{grid-template-columns:minmax(0,1fr) minmax(0,1.15fr)}
}
.sb .duo{display:grid;gap:16px}
.duo > .main,.duo > .side{container-type:inline-size;min-width:0}
.sb .main > :first-child{margin-top:0}
.sb .main.solo{max-width:72ch}
.sb p{margin:0 0 10px;line-height:1.55}
.sb p:last-child{margin-bottom:0}
b.kw{font-weight:680;color:var(--ink)}

/* bullets */
.pts{margin:10px 0 0;padding:0;list-style:none}
.pts:first-child{margin-top:0}
.pts li{position:relative;padding:4px 0 4px 18px;line-height:1.5}
.pts li::before{content:"";position:absolute;left:2px;top:12px;width:6px;height:6px;border-radius:2px;background:var(--cls)}
.pts.two{columns:2 220px;column-gap:24px}
.pts.two li{break-inside:avoid}

/* label rows */
.rows{margin:10px 0 0;display:grid;grid-template-columns:max-content 1fr;column-gap:14px}
.rows:first-child{margin-top:0}
.rows dt{padding:7px 0;font-size:var(--t12);font-weight:600;letter-spacing:.04em;line-height:22px;color:var(--cls);text-transform:lowercase;border-top:1px solid var(--line)}
.rows dd{margin:0;padding:7px 0;font-size:var(--t15);line-height:1.45;border-top:1px solid var(--line)}
.rows dt:first-of-type,.rows dd:first-of-type{border-top:0}

/* numbered steps */
.steps{margin:10px 0 0;padding:0;list-style:none;counter-reset:s}
.steps:first-child{margin-top:0}
.steps li{position:relative;padding:7px 0 7px 32px;font-size:var(--t15);line-height:1.45;counter-increment:s}
.steps li::before{content:counter(s);position:absolute;left:0;top:8px;width:21px;height:21px;border-radius:6px;background:var(--cls);color:var(--surface);font-size:11.5px;font-weight:650;display:grid;place-items:center}
.steps li + li{border-top:1px solid var(--line)}

/* flow: cause -> effect chain */
.flow{display:flex;flex-wrap:wrap;align-items:stretch;gap:10px 0;margin:0;padding:0;list-style:none}
.flow li{position:relative;flex:1 1 0;min-width:120px;display:flex;align-items:center;padding:10px 12px;border-radius:var(--r-btn);background:var(--surface2);border:1px solid var(--line);font-size:var(--t15);line-height:1.35;margin-right:26px}
.flow li:last-child{margin-right:0;border-color:var(--cls);background:color-mix(in srgb,var(--cls) 9%,var(--surface))}
.flow li:not(:last-child)::after{content:"";position:absolute;right:-19px;top:50%;width:12px;height:12px;margin-top:-6px;background:var(--ink3);clip-path:polygon(0 15%,100% 50%,0 85%)}
@container (max-width:519px){
  .flow{flex-direction:column;gap:0}
  .flow li{margin:0 0 22px;min-width:0}
  .flow li:last-child{margin-bottom:0}
  .flow li:not(:last-child)::after{right:auto;left:50%;top:auto;bottom:-17px;margin:0 0 0 -6px;clip-path:polygon(15% 0,85% 0,50% 100%)}
}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.tiles > div{padding:11px 13px 12px;border-radius:var(--r-btn);background:var(--surface2);border:1px solid var(--line);border-top:3px solid var(--cls)}
.tiles h5{margin:0 0 3px;font-size:var(--t15);font-weight:650;line-height:1.3}
.tiles p{margin:0;font-size:var(--t13);line-height:1.45;color:var(--ink)}
.tiles .tk{display:inline-block;margin-top:6px;font-size:11.5px;font-weight:600;color:var(--cls);text-transform:lowercase}

/* tree (org chart; indented list on narrow cards) */
.tree{overflow-x:auto}
.tree ul{position:relative;display:flex;justify-content:center;margin:0;padding:16px 0 0;list-style:none}
.tree > ul{padding-top:0}
.tree li{position:relative;flex:1 1 0;padding:16px 4px 0;text-align:center;min-width:0}
.tree li::before,.tree li::after{content:"";position:absolute;top:0;right:50%;width:50%;height:16px;border-top:1.5px solid var(--line2)}
.tree li::after{right:auto;left:50%;border-left:1.5px solid var(--line2)}
.tree li:only-child::before,.tree li:only-child::after{display:none}
.tree li:only-child{padding-top:0}
.tree li:first-child::before,.tree li:last-child::after{border:0}
.tree li:last-child::before{border-right:1.5px solid var(--line2);border-radius:0 6px 0 0}
.tree li:first-child::after{border-radius:6px 0 0 0}
.tree ul ul::before{content:"";position:absolute;top:0;left:50%;height:16px;border-left:1.5px solid var(--line2)}
.tree .nd{display:inline-block;max-width:100%;padding:7px 10px;border-radius:var(--r-btn);background:var(--surface2);border:1px solid var(--line);font-size:var(--t13);line-height:1.3;vertical-align:top}
.tree .nd b{display:block;font-size:var(--t15);font-weight:650}
.tree .nd span{display:block;color:var(--ink2);margin-top:2px}
.tree > ul > li > .nd{background:var(--cls);border-color:var(--cls);color:var(--surface)}
.tree > ul > li > .nd span{color:color-mix(in srgb,var(--surface) 85%,transparent)}
.tree > ul > li > ul > li > .nd{border-color:var(--cls);background:color-mix(in srgb,var(--cls) 9%,var(--surface))}
@container (max-width:379px){
  .tree ul{display:block;padding:0 0 0 18px}
  .tree > ul{padding-left:0}
  .tree li{padding:6px 0 0 16px;text-align:left}
  .tree > ul > li{padding-left:0}
  .tree li::before{top:0;left:0;right:auto;width:12px;height:22px;border-top:0;border-left:1.5px solid var(--line2);border-bottom:1.5px solid var(--line2);border-radius:0 0 0 6px}
  .tree li::after{top:22px;left:0;right:auto;width:0;height:calc(100% - 22px);border:0;border-left:1.5px solid var(--line2);border-radius:0}
  .tree li:last-child::after{display:none}
  .tree li:first-child::before,.tree li:last-child::before{border-top:0;border-right:0;border-left:1.5px solid var(--line2);border-bottom:1.5px solid var(--line2);border-radius:0 0 0 6px}
  .tree li:first-child::after{border-radius:0}
  .tree > ul > li::before,.tree > ul > li::after{display:none}
  .tree ul ul::before{display:none}
  .tree li:only-child::before{display:block}
  .tree li:only-child{padding-top:6px}
  .tree > ul > li:only-child{padding:0}
  .tree > ul > li:only-child::before,.tree > ul > li:only-child::after{display:none}
}

/* figure (inline svg drawn per guide) */
.fig{margin:0;padding:14px;border-radius:var(--r-btn);background:var(--surface2);border:1px solid var(--line)}
.fig svg{display:block;width:100%;height:auto;max-height:440px;font-family:var(--sans);overflow:visible}
.fig figcaption{margin-top:8px;font-size:var(--t13);color:var(--ink2);line-height:1.4}
.fig .ln{fill:none;stroke:var(--ink2);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.fig .lc{fill:none;stroke:var(--cls);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.fig .la{fill:none;stroke:var(--accent);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.fig .lb{fill:none;stroke:var(--bad);stroke-width:2;stroke-linecap:round}
.fig .lg{fill:none;stroke:var(--good);stroke-width:2;stroke-linecap:round}
.fig .dash{stroke-dasharray:5 5}
.fig .fc{fill:var(--cls)} .fig .fa{fill:var(--accent)} .fig .fb{fill:var(--bad)} .fig .fg{fill:var(--good)} .fig .fi{fill:var(--ink)}
.fig .fs{fill:color-mix(in srgb,var(--cls) 18%,var(--surface))}
.fig .fsa{fill:color-mix(in srgb,var(--accent) 16%,var(--surface))}
.fig .fp{fill:var(--surface);stroke:var(--line2);stroke-width:1.2}
.fig .fn{fill:none}
.fig text{fill:var(--ink);font-size:14px}
.fig .tm{fill:var(--ink2);font-size:12.5px}
.fig .tb{font-weight:650}
.fig .tc{fill:var(--cls);font-weight:650}
.fig .ta{fill:var(--accent);font-weight:650}
.fig .tw{fill:var(--surface);font-weight:650}
.fig .tbd{fill:var(--bad);font-weight:650}
.fig .mid{text-anchor:middle} .fig .end{text-anchor:end}
.mk-ink{fill:var(--ink2)} .mk-cls{fill:var(--cls)} .mk-acc{fill:var(--accent)} .mk-bad{fill:var(--bad)}

/* compare */
.cmp{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.cmp > div{padding:12px 14px;border-radius:var(--r-btn);background:var(--surface2);border:1px solid var(--line)}
.cmp h5{margin:0 0 6px;font-size:var(--t13);font-weight:650;letter-spacing:.03em;color:var(--cls);text-transform:lowercase}
.cmp p{margin:0 0 6px;font-size:var(--t15);line-height:1.45} .cmp p:last-child{margin:0}

/* tables */
.tbw{overflow-x:auto;border-radius:var(--r-btn);border:1px solid var(--line);background:var(--surface)}
.tbl{width:100%;border-collapse:collapse;font-size:var(--t15);line-height:1.45}
.tbl th{padding:9px 12px;text-align:left;font-size:var(--t12);font-weight:600;letter-spacing:.04em;color:var(--ink3);text-transform:lowercase;background:var(--surface2);border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:9px 12px;vertical-align:top;border-top:1px solid var(--line)}
.tbl tbody tr:first-child td{border-top:0}
.tbl td:first-child{font-weight:650}
.tcap{margin:0 0 8px;font-size:var(--t13);font-weight:600;color:var(--ink2);text-transform:lowercase}
@container (max-width:519px){
  .tbw .tbl thead{display:none}
  .tbw .tbl tr{display:block;padding:10px 14px;border-top:1px solid var(--line)}
  .tbw .tbl tbody tr:first-child{border-top:0}
  .tbw .tbl td{display:block;padding:0;border:0}
  .tbw .tbl.two td:not(:first-child)::before{display:none}
  .tbw .tbl.two td:first-child{margin-bottom:2px}
  .tbw .tbl td:not(:first-child)::before{content:attr(data-l);display:block;margin-top:6px;font-size:var(--t12);font-weight:600;letter-spacing:.04em;color:var(--cls);text-transform:lowercase}
}

/* on the test (example) */
.exs{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
.tq{border-radius:var(--r-btn);border:1px solid var(--line);background:var(--surface);overflow:hidden;display:flex;flex-direction:column}
.tq .el{display:flex;align-items:center;gap:6px;padding:10px 13px 0;font-size:11.5px;font-weight:650;letter-spacing:.05em;color:var(--accent);text-transform:lowercase}
.tq .el svg{flex:none}
.tq .eq{padding:4px 13px 12px;font-size:var(--t15);line-height:1.45;font-weight:500;flex:1}
.tq .eb{display:flex;align-items:center;justify-content:space-between;width:100%;padding:9px 13px;border-top:1px solid var(--line);font-size:var(--t13);font-weight:600;color:var(--accent);text-transform:lowercase}
.tq .eb .chev{transition:transform .24s var(--spring)}
.tq.on .eb .chev{transform:rotate(90deg)}
.tq .ea{display:none;padding:10px 13px 12px;border-top:1px solid var(--line);background:var(--surface2);font-size:var(--t15);line-height:1.45}
.tq.on .ea{display:block;animation:rise .3s var(--spring) both}
.tq .ea b.aa{display:block;font-weight:680;margin-bottom:3px}
.tq .ea .why{color:var(--ink2)}

/* watch out + callouts */
.watch{border-radius:var(--r-btn);background:color-mix(in srgb,var(--bad) 7%,var(--surface));border:1px solid color-mix(in srgb,var(--bad) 30%,var(--line));padding:11px 14px 12px}
.watch .wl,.callout .cl{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:650;letter-spacing:.05em;color:var(--bad);text-transform:lowercase;margin-bottom:4px}
.watch ul{margin:0;padding:0;list-style:none}
.watch li{position:relative;padding:3px 0 3px 16px;font-size:var(--t15);line-height:1.45}
.watch li::before{content:"";position:absolute;left:1px;top:11px;width:8px;height:2px;border-radius:1px;background:var(--bad)}
.callout{border-radius:var(--r-btn);padding:10px 14px 11px;font-size:var(--t15);line-height:1.45;background:var(--surface2);border:1px solid var(--line);border-left:3px solid var(--cls)}
.callout.ok{border-left-color:var(--good)} .callout.ok .cl{color:var(--good)}
.callout.ex{border-left-color:var(--accent)} .callout.ex .cl{color:var(--accent)}
.callout.cls .cl{color:var(--cls)}

/* terms */
.terms{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.terms .tl{font-size:var(--t12);font-weight:600;letter-spacing:.04em;color:var(--ink3);text-transform:lowercase;margin-right:2px}
.term{font-size:var(--t13);font-weight:500;padding:3px 9px;border-radius:var(--r-chip);border:1px solid var(--line);background:var(--surface2);color:var(--ink)}

.abbr{padding:14px 16px;border-radius:var(--r-card);background:var(--surface);border:1px solid var(--line);font-size:var(--t13);color:var(--ink2);line-height:1.7}
.abbr b{color:var(--ink);font-weight:650}

/* generic cards / groups */
.card{border-radius:var(--r-card);background:var(--surface);border:1px solid var(--line);padding:14px 16px;margin-bottom:12px}
.card.top{border-left:4px solid var(--cls);padding-left:15px}
.card.top p{margin:0 0 8px} .card.top p:last-child{margin-bottom:0}
.group{border-radius:var(--r-card);overflow:hidden;background:var(--surface);border:1px solid var(--line);margin-bottom:12px}
.row{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:12px 14px;position:relative;z-index:1;cursor:pointer;transition:background .16s var(--ease)}
.row + .row,.body + .row{border-top:1px solid var(--line)}
@media (hover:hover){.row:hover{background:var(--surface2)}}
.rt{min-width:0;flex:1}
.rn{display:block;font-size:var(--t16);font-weight:550;line-height:1.3}
.rd{display:block;font-size:var(--t12);color:var(--ink3);margin-top:1px;text-transform:lowercase}
.chev{flex:none;color:var(--ink3);transition:transform .24s var(--spring)}
.row[aria-expanded="true"] .chev{transform:rotate(90deg)}
.body{display:grid;grid-template-rows:0fr;background:var(--surface2);border-top:1px solid var(--line);transition:grid-template-rows .36s var(--spring)}
.body.on{grid-template-rows:1fr}
.body > div{overflow:hidden}
.body .in{padding:12px 16px 14px;display:grid;gap:10px}
.body p{margin:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 14px;border-radius:var(--r-btn);background:var(--accent);color:var(--on-accent);font-size:var(--t15);font-weight:600;text-transform:lowercase;transition:filter .18s var(--ease)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
@media (hover:hover){.btn:hover{filter:brightness(1.06)}}
.btn:active{transform:scale(.987)}

/* practice mc */
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,440px),1fr));gap:12px;align-items:start}
.q{margin:0}
.q .qt{padding:14px 16px 10px;font-size:var(--t16);font-weight:500;line-height:1.4}
.qn{font-size:var(--t12);color:var(--ink3);font-variant-numeric:tabular-nums;margin-bottom:4px;text-transform:lowercase}
.opt{display:flex;align-items:flex-start;gap:11px;width:100%;padding:11px 14px;border-top:1px solid var(--line);font-size:var(--t15);line-height:1.4;transition:background .16s var(--ease)}
@media (hover:hover){.q:not(.done) .opt:hover{background:var(--surface2)}}
.opt .k{flex:none;width:22px;height:22px;border-radius:6px;border:1px solid var(--line);display:grid;place-items:center;font-size:11.5px;font-weight:600;color:var(--ink3);margin-top:1px}
.q.done .opt{cursor:default}
.opt.right{background:color-mix(in srgb,var(--good) 14%,transparent)}
.opt.right .k{background:var(--good);border-color:var(--good);color:var(--surface)}
.opt.wrong{background:color-mix(in srgb,var(--bad) 12%,transparent)}
.opt.wrong .k{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.q .why{display:none;padding:10px 16px 12px;border-top:1px solid var(--line);background:var(--surface2);font-size:var(--t15);line-height:1.45}
.q .why b{color:var(--ink3);font-weight:600;font-size:var(--t12);text-transform:lowercase;letter-spacing:.04em;display:block;margin-bottom:2px}
.q.done .why{display:block}
.scorepill{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(140%);z-index:60;display:flex;align-items:center;gap:12px;padding:8px 8px 8px 16px;border-radius:12px;background:var(--ink);color:var(--paper);font-size:var(--t15);box-shadow:0 8px 28px rgba(0,0,0,.18);opacity:0;pointer-events:none;transition:transform .4s var(--spring),opacity .25s var(--ease)}
.scorepill.show{transform:translateX(-50%);opacity:1;pointer-events:auto}
.scorepill b{font-family:var(--display);font-weight:var(--w-d);font-size:var(--t20);font-variant-numeric:tabular-nums}
.scorepill button{padding:6px 11px;border-radius:8px;background:color-mix(in srgb,var(--paper) 16%,transparent);color:var(--paper);font-size:var(--t13);font-weight:600;text-transform:lowercase}

/* problems */
.pgrid{display:grid;gap:12px}
.prob{container-type:inline-size;margin:0}
.prob .pi{display:grid;grid-template-columns:minmax(0,1fr)}
.prob .qt{padding:14px 16px;font-size:var(--t16);font-weight:500;line-height:1.45}
.prob .go{border-top:1px solid var(--line);padding:11px 16px;display:flex;justify-content:space-between;align-items:center;font-size:var(--t13);font-weight:600;color:var(--accent);text-transform:lowercase;width:100%}
.prob .reveal{display:none;border-top:1px solid var(--line);background:var(--surface2);padding:12px 16px 14px}
.prob.on .reveal{display:block;animation:rise .3s var(--spring) both}
.prob.on .go .chev{transform:rotate(90deg)}
@container (min-width:820px){
  .prob .pi{grid-template-columns:minmax(0,5fr) minmax(0,7fr)}
  .prob .qside{border-right:1px solid var(--line);display:flex;flex-direction:column}
  .prob .qside .qt{flex:1}
  .prob .reveal{border-top:0;display:block;min-height:100%}
  .prob:not(.on) .reveal::before{content:"work it first, then show the steps";display:grid;place-items:center;height:100%;min-height:120px;font-size:var(--t13);color:var(--ink3);text-transform:lowercase}
  .prob:not(.on) .reveal > *{display:none}
}
.ans{margin-top:10px;padding:9px 12px;border-radius:var(--r-btn);background:var(--surface);border:1px solid var(--line);font-size:var(--t15);border-left:3px solid var(--good)}
.ans b{color:var(--ink3);font-weight:600;font-size:var(--t12);text-transform:lowercase;letter-spacing:.04em;margin-right:6px}
.work{margin:0;padding:0;list-style:none}
.work li{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:2px 16px;padding:7px 0;align-items:baseline}
.work li + li{border-top:1px solid var(--line)}
.work .wm{font-size:var(--t15);line-height:1.45;color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums}
.work .wm.cont{padding-left:1.1em}
.work .wy{font-size:var(--t13);line-height:1.45;color:var(--ink2);padding-left:12px;border-left:2px solid var(--line)}
.work .wy:empty{border-left-color:transparent}
.work li.hd{padding:0 0 4px}
.work .wh{font-size:var(--t12);font-weight:600;letter-spacing:.04em;text-transform:lowercase;color:var(--ink3)}
.work li.hd .wh + .wh{padding-left:14px}
@container (max-width:479px){.work li{grid-template-columns:1fr;gap:1px}.work .wy{border-left:0;padding-left:0}.work li.hd{display:none}}

/* formulas */
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:10px}
.fx{padding:12px 14px;border-radius:var(--r-btn);background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.fx .n{font-size:var(--t12);font-weight:600;letter-spacing:.04em;color:var(--cls);text-transform:lowercase}
.fx .f{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:var(--t16);font-weight:500;overflow-wrap:anywhere}
.fx .note{font-size:var(--t13);color:var(--ink2);line-height:1.45}

/* flashcards */
.dk{display:grid;gap:14px;max-width:760px;margin:0 auto}
.deck{position:relative;perspective:1200px}
.fc{position:relative;min-height:230px;border-radius:var(--r-card);cursor:pointer;transform-style:preserve-3d;transition:transform .5s var(--spring)}
.fc.flip{transform:rotateY(180deg)}
.fc > div{position:absolute;inset:0;border-radius:var(--r-card);background:var(--surface);border:1px solid var(--line);padding:22px;display:grid;place-items:center;text-align:center;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.fc .f{font-family:var(--display);font-size:clamp(24px,3.4vw,32px);font-weight:var(--w-d);letter-spacing:var(--ls-d);line-height:1.15;text-wrap:balance}
.fc .b{transform:rotateY(180deg);background:var(--surface2);font-size:var(--t16);line-height:1.5;color:var(--ink)}
.fc .tag{position:absolute;left:16px;top:13px;font-size:11.5px;font-weight:600;color:var(--ink3);text-transform:lowercase;letter-spacing:.04em}
.fc .b .tag{color:var(--cls)}
.dnav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dnav .cnt{margin-left:auto;font-size:var(--t13);color:var(--ink3);font-variant-numeric:tabular-nums;text-transform:lowercase}
.clist{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:10px;margin-top:6px}
.clist > div{padding:12px 14px;border-radius:var(--r-btn);background:var(--surface);border:1px solid var(--line)}
.clist b{display:block;font-weight:650;margin-bottom:3px}
.clist span{font-size:var(--t15);line-height:1.45;color:var(--ink)}

/* timeline */
.tln{border-radius:var(--r-card);background:var(--surface);border:1px solid var(--line);overflow:hidden}
.tln .ev{display:grid;grid-template-columns:96px minmax(0,1fr);gap:4px 18px;padding:12px 16px;border-top:1px solid var(--line);position:relative}
.tln .ev:first-child{border-top:0}
.tln .y{font-family:var(--display);font-weight:var(--w-d);font-size:var(--t16);color:var(--cls);font-variant-numeric:tabular-nums;line-height:1.35}
.tln .t{font-size:var(--t16);font-weight:600;line-height:1.35}
.tln .d{font-size:var(--t15);color:var(--ink);line-height:1.45;margin-top:2px}
@media (min-width:900px){.tln .ev{grid-template-columns:110px minmax(0,.9fr) minmax(0,1.3fr)}.tln .d{margin-top:0}}
@media (max-width:479px){.tln .ev{grid-template-columns:1fr;gap:2px}}

/* cram */
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,460px),1fr));gap:12px;align-items:start}
.cgrid .group{margin:0}
.cgrid .gh{padding:11px 14px;border-bottom:1px solid var(--line);font-size:var(--t12);font-weight:600;letter-spacing:.05em;color:var(--cls);text-transform:lowercase;display:flex;justify-content:space-between;gap:10px}
.cgrid .gh span{color:var(--ink3);font-weight:500}
.cr{display:grid;grid-template-columns:minmax(0,10em) 1fr;gap:2px 14px;padding:9px 14px;border-top:1px solid var(--line)}
.gh + .cr{border-top:0}
.cr .n{font-size:var(--t15);font-weight:650;line-height:1.35}
.cr .y{display:block;margin-top:2px;font-size:var(--t12);font-weight:600;color:var(--cls);font-variant-numeric:tabular-nums}
.cr .t{font-size:var(--t15);line-height:1.45}
@media (max-width:479px){.cr{grid-template-columns:1fr}.cr .n{display:flex;align-items:baseline;flex-wrap:wrap;gap:0 8px}.cr .y{margin:0}}

/* tables pane */
.tpane{display:grid;gap:22px}
.tpane .tblk{container-type:inline-size}

/* checklist */
.ckg{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,420px),1fr));gap:0 12px}
.ck{display:flex;align-items:flex-start;gap:11px;width:100%;padding:12px 14px;border-radius:var(--r-btn);font-size:var(--t15);line-height:1.4;background:var(--surface);border:1px solid var(--line);margin-bottom:8px}
.ck .box{flex:none;width:20px;height:20px;border-radius:6px;border:1px solid var(--line2);margin-top:1px;display:grid;place-items:center;color:var(--surface);transition:background .16s var(--ease),border-color .16s var(--ease)}
.ck.on .box{background:var(--good);border-color:var(--good)}
.ck.on .t{color:var(--ink3);text-decoration:line-through}
.ck .d{display:block;font-size:var(--t12);color:var(--ink3);margin-top:1px}

/* essay panes (leq / prompts) */
.bul{margin:0;padding-left:18px}
.bul li{margin:3px 0;line-height:1.45}
.pl{font-size:var(--t12);font-weight:600;letter-spacing:.05em;color:var(--cls);text-transform:lowercase;margin-top:6px}
.so{padding:9px 12px;border-radius:var(--r-btn);background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--accent);font-size:var(--t15)}
.so .cl{display:block;font-size:11.5px;font-weight:650;color:var(--accent);letter-spacing:.05em;text-transform:lowercase}
.pace{display:flex;height:34px;border-radius:8px;overflow:hidden;gap:2px}
.pace > div{display:grid;place-items:center;color:var(--surface);font-size:var(--t12);font-weight:650;background:var(--cls)}
.pace > div:nth-child(2n){background:var(--accent)}
.pace > div:nth-child(3n){background:var(--ink2)}
.fnl{margin:0;padding-left:20px;font-size:var(--t15)}
.fnl li{margin:4px 0}

/* footer */
footer{margin-top:40px;padding-top:16px;border-top:1px solid var(--line);font-size:var(--t12);line-height:1.6;color:var(--ink3);text-transform:lowercase}
footer a{color:var(--ink2);text-decoration:underline;text-decoration-color:var(--line2);text-underline-offset:3px}
footer .upd{display:block;margin-top:6px}

.rv{opacity:0;transform:translateY(8px);animation:rise .5s var(--spring) forwards}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none !important;transition:none !important}.rv{opacity:1;transform:none}}

@media print{
  :root{--paper:#fff;--surface:#fff;--surface2:#f6f6f6;--ink:#111;--ink2:#333;--ink3:#555;--line:#ccc;--line2:#999}
  .bar,.toc,.panes,.skipl,#prog,.scorepill,.tq .eb,.prob .go,.seg{display:none !important}
  .ol{display:block} .rv{opacity:1 !important;transform:none !important;animation:none !important}
  .tq .ea,.prob .reveal,.q .why{display:block !important}
  .prob:not(.on) .reveal > *{display:block !important;visibility:visible !important}
  .prob:not(.on) .reveal::before{display:none}
  .sec,.group,.card,.tq,.fig,.tiles > div{break-inside:avoid}
  @page{margin:.6in}
}
</style>
</head>
<body>
<a class="skipl" href="#main">skip to the guide</a>
<div id="prog" aria-hidden="true"><i></i></div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 10 5 0 9z" class="mk-ink"/></marker>
  <marker id="ahc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 10 5 0 9z" class="mk-cls"/></marker>
  <marker id="aha" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 10 5 0 9z" class="mk-acc"/></marker>
  <marker id="ahb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 10 5 0 9z" class="mk-bad"/></marker>
</defs></svg>
<header class="bar" id="bar">
  <div class="wrap">
    <a class="home" href="/" aria-label="all guides">
      <svg class="mark" viewBox="0 0 28 28" aria-hidden="true"><rect width="28" height="28" rx="5" fill="var(--accent)"/><path d="M8.98 20.80 4.67 7.20H8.65L11.36 17.68H11.47L14.27 7.20H18.03L13.72 20.80Z" fill="var(--on-accent)"/><circle cx="21.43" cy="18.90" r="1.9" fill="var(--hi)"/></svg>
      <h1>valentino guides</h1>
    </a>
    <div class="seg" role="group" aria-label="theme">

const VIS=["fig","tree","tiles"];
function section(s,i){
  scope();
  const watch=[...(s.watch||[]),...(s.notes||[]).filter(n=>n.k==="warn").map(n=>n.t)];
  const notes=(s.notes||[]).filter(n=>n.k!=="warn");
  const mainKeys=["p","pts","rows","flow","steps"].filter(k=>has(s[k]));
  const vis=VIS.filter(k=>has(s[k]));
  let sideKey=vis[0]||null;
  const main=mainKeys.map(k=>B[k](s[k])).join("")+(notes.length?B.notes(notes):"");
  let side="", watchPlaced=false;
  if(sideKey)side=B[sideKey](s[sideKey]);
  else if(watch.length&&main){side=B.watch(watch);watchPlaced=true}
  let h="";
  if(main&&side)h+=`<div class="duo${sideKey==="tree"||sideKey==="fig"?" wide-side":""}"><div class="main">${main}</div><div class="side">${side}</div></div>`;
  else if(main)h+=`<div class="main solo">${main}</div>`;
  else if(side)h+=side;
  const rest=vis.filter(k=>k!==sideKey).concat(["table","cmp"].filter(k=>has(s[k])));
  if(sideKey&&!main){/* visual already placed alone */}
  rest.forEach(k=>{h+=B[k](s[k])});
  if(has(s.tables))s.tables.forEach(t=>{h+=B.table(t)});
  if(has(s.ex))h+=B.ex(s.ex);
  if(watch.length&&!watchPlaced)h+=B.watch(watch);
  if(has(s.terms))h+=B.terms(s.terms);
  const n=String(i+1).padStart(2,"0");
  const badge=s.w===3?`<span class="w w3">tested most</span>`:s.w===2?`<span class="w w2">tested</span>`:"";
  const node=el("section","sec",`<header><span class="num">${n}</span><div class="ht"><h3>${esc(s.t)}</h3>${s.d?`<p class="sd">${esc(s.d)}</p>`:""}</div>${badge}</header><div class="sb">${h}</div>`);
  node.id="s-"+(i+1);
  SEEN=null;
  return node;
}

      q.opts.map((o,j)=>`<button type="button" class="opt" data-i="${j}"><span class="k">${"abcde"[j]||j+1}</span><span>${plain(o)}</span></button>`).join("")+

    card.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>{
      if(card.classList.contains("done"))return;
      card.classList.add("done"); const j=+b.dataset.i;
      if(j===q.a){b.classList.add("right");SCORE.right++}else{b.classList.add("wrong");card.querySelectorAll(".opt")[q.a].classList.add("right")}
      SCORE.done++; $("#scn").textContent=SCORE.right; scoreVis();
    }));
    g.appendChild(card);
  });
  sec.appendChild(g);
  $("#reset").addEventListener("click",()=>{SCORE.done=0;SCORE.right=0;$("#scn").textContent=0;scoreVis();sec.querySelectorAll(".q").forEach(c=>{c.classList.remove("done");c.querySelectorAll(".opt").forEach(o=>o.classList.remove("right","wrong"))});sec.scrollIntoView({behavior:REDUCED?"auto":"smooth"})});
}

/* problems: steps are strings (numbered) or [work, why] pairs (line by line) */
function stepsHTML(st){st=st||[];if(!st.some(Array.isArray))return `<ol class="steps">${st.map(s=>`<li>${plain(s)}</li>`).join("")}</ol>`;return `<ul class="work"><li class="hd"><span class="wh">work</span><span class="wh">why</span></li>${st.map(s=>{const [m,y]=Array.isArray(s)?s:[s,""];return `<li><div class="wm${/^\s*=/.test(m)?" cont":""}">${plain(m)}</div><div class="wy">${y?plain(y):""}</div></li>`}).join("")}</ul>`}
function buildProblems(sec){
  const ps=GUIDE.problems||[];
  sec.appendChild(shead("problems",`${ps.length} to work`));
  const g=el("div","pgrid");
  ps.forEach((p,i)=>{
    const card=el("div","group prob");
    card.innerHTML=`<div class="pi"><div class="qside"><div class="qt"><div class="qn">problem ${i+1}</div>${plain(p.q)}</div><button type="button" class="go"><span>show the steps</span>${CHEV}</button></div><div class="reveal">${stepsHTML(p.steps)}${p.ans?`<div class="ans"><b>answer</b>${plain(p.ans)}</div>`:""}</div></div>`;
    const go=card.querySelector(".go");
    go.addEventListener("click",()=>{const on=!card.classList.contains("on");card.classList.toggle("on",on);go.firstElementChild.textContent=on?"hide the steps":"show the steps"});
    g.appendChild(card);
  });
  sec.appendChild(g);
}

/* formulas */
function buildFormulas(sec){
  const fs=GUIDE.formulas||[];
  sec.appendChild(shead("formulas",`${fs.length}`));
  sec.appendChild(el("div","fgrid",fs.map(f=>`<div class="fx"><span class="n">${esc(f.n)}</span><span class="f">${esc(f.f)}</span>${f.note?`<span class="note">${plain(f.note)}</span>`:""}</div>`).join("")));
}

/* flashcards: flip deck, plus the whole list */
function buildCards(sec){
  const cs=GUIDE.cards||[]; let i=0, order=cs.map((_,k)=>k);
  sec.appendChild(shead("cards",`${cs.length} · tap to flip, swipe for next`));
  const dk=el("div","dk");
  const deck=el("div","deck"); const fc=el("div","fc"); fc.setAttribute("role","button"); fc.tabIndex=0; deck.appendChild(fc); dk.appendChild(deck);
  const nav=el("div","dnav",`<button type="button" class="btn ghost" data-a="prev">back</button><button type="button" class="btn" data-a="next">next</button><button type="button" class="btn ghost" data-a="shuf">shuffle</button><span class="cnt"></span>`); dk.appendChild(nav);
  sec.appendChild(dk);
  const cnt=nav.querySelector(".cnt");
  const draw=()=>{const c=cs[order[i]];fc.classList.remove("flip");fc.innerHTML=`<div class="f"><span class="tag">term</span><span>${plain(c.f)}</span></div><div class="b"><span class="tag">${esc(GUIDE.cls)}</span><span>${plain(c.b)}</span></div>`;cnt.textContent=`${i+1} of ${cs.length}`};
  const go=d=>{i=(i+d+cs.length)%cs.length;draw()};
  fc.addEventListener("click",()=>fc.classList.toggle("flip")); fc.addEventListener("keydown",e=>{if(e.key===" "||e.key==="Enter"){e.preventDefault();fc.classList.toggle("flip")}});
  nav.querySelector('[data-a="next"]').addEventListener("click",()=>go(1));
  nav.querySelector('[data-a="prev"]').addEventListener("click",()=>go(-1));
  nav.querySelector('[data-a="shuf"]').addEventListener("click",()=>{for(let k=order.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[order[k],order[j]]=[order[j],order[k]]}i=0;draw()});
  addEventListener("keydown",e=>{if(!sec.classList.contains("on")||e.target.tagName==="INPUT")return;if(e.key==="ArrowRight")go(1);if(e.key==="ArrowLeft")go(-1)});
  let x0=null; fc.addEventListener("touchstart",e=>{x0=e.touches[0].clientX},{passive:true}); fc.addEventListener("touchend",e=>{if(x0==null)return;const dx=e.changedTouches[0].clientX-x0;x0=null;if(dx<-40)go(1);else if(dx>40)go(-1)},{passive:true});
  draw();
  sec.appendChild(shead("all cards",`${cs.length}`));
  sec.appendChild(el("div","clist",cs.map(c=>`<div><b>${plain(c.f)}</b><span>${plain(c.b)}</span></div>`).join("")));
}

/* timeline */
function buildTimeline(sec){
  const ts=GUIDE.timeline||[];

  sec.appendChild(el("div","tln",ts.map(t=>`<div class="ev"><div class="y">${esc(t.y)}</div><div class="t">${plain(t.t)}</div>${t.d?`<div class="d">${plain(t.d)}</div>`:"<div></div>"}</div>`).join("")));

/* checklist */
function buildChecklist(sec){
  const cs=GUIDE.checklist||[]; const key="ck:"+location.pathname; let saved={}; try{saved=JSON.parse(localStorage.getItem(key)||"{}")}catch(e){}
  sec.appendChild(shead("checklist",`${cs.length} items`));
  const g=el("div","ckg");
  cs.forEach((c,i)=>{
    const b=el("button","ck"+(saved[i]?" on":""),`<span class="box"><svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 6.5l2.5 2.5 4.5-5"/></svg></span><span><span class="t">${plain(c.t)}</span>${c.d?`<span class="d">${plain(c.d)}</span>`:""}</span>`);
    b.type="button"; b.addEventListener("click",()=>{b.classList.toggle("on");saved[i]=b.classList.contains("on");try{localStorage.setItem(key,JSON.stringify(saved))}catch(e){}});

}

/* cram sheet: [{h, d, items:[{n, y, t}]}] */
function buildCram(sec){
  const gs=GUIDE.cram||[];

/* essay panes (used by the LEQ guide): prompts + leq + fn */
function buildPrompts(sec){
  const ps=GUIDE.prompts||[];
  if(has(GUIDE.prompts_note)){sec.appendChild(shead("how points are earned"));sec.appendChild(el("div","card top",GUIDE.prompts_note.map(x=>`<p>${fmt(x)}</p>`).join("")))}
  sec.appendChild(shead("possible prompts",`${ps.length}`));
  ps.forEach((p,i)=>{
    scope();
    const g=el("div","group");
    const row=el("button","row"); row.type="button"; row.setAttribute("aria-expanded","false");
    row.innerHTML=`<span class="rt"><span class="rd">prompt ${i+1}</span><span class="rn">${esc(p.q)}</span></span>`+CHEV;
    const inner=(p.tldr?`<div class="pl">tldr</div><ul class="bul">${p.tldr.map(x=>`<li>${fmt(x)}</li>`).join("")}</ul>`:"")+
      `<div class="pl">context</div><ul class="bul">${(p.ctx||[]).map(x=>`<li>${fmt(x)}</li>`).join("")}</ul>`+
      `<div class="pl">thesis</div><div class="ans">${esc(p.thesis)}</div>`+
      (p.body||[]).map((bd,j)=>`<div class="pl">body ${j+1} · ${esc(bd.h)}</div><ul class="bul">${bd.ev.map(x=>`<li>${fmt(x)}</li>`).join("")}</ul><div class="so"><span class="cl">what this evidence shows</span>${fmt(bd.so)}</div>`).join("")+
      `<div class="pl">conclusion</div><ul class="bul">${(p.concl||[]).map(x=>`<li>${fmt(x)}</li>`).join("")}</ul>`;
    const body=el("div","body",`<div><div class="in">${inner}</div></div>`);
    row.addEventListener("click",()=>{const on=!body.classList.contains("on");body.classList.toggle("on",on);row.setAttribute("aria-expanded",String(on))});
    g.appendChild(row); g.appendChild(body); sec.appendChild(g);
  });
  SEEN=null;
}
function buildLeq(sec){
  const L=GUIDE.leq;
  sec.appendChild(shead("how it runs"));
  sec.appendChild(el("div","card top",`<p>${fmt(L.format)}</p>${L.math?`<p>${fmt(L.math)}</p>`:""}`));
  if(has(L.rows)){
    sec.appendChild(shead("the rubric",`${L.rows.length} rows`));
    sec.appendChild(el("div","tbw",`<table class="tbl"><thead><tr><th>row</th><th>earns it</th><th>loses it</th><th>class tips</th></tr></thead><tbody>${L.rows.map(r=>`<tr><td data-l="row">${esc(r.n)}</td><td data-l="earns it">${plain(r.earn)}</td><td data-l="loses it">${plain(r.lose)}</td><td data-l="class tips">${plain(r.cls||"")}</td></tr>`).join("")}</tbody></table>`));
  }
  if(has(L.codes))sec.appendChild(el("div","card",`<div class="terms"><span class="tl">margin codes</span>${L.codes.map(([a,b])=>`<span class="term">${esc(a)} · ${esc(b)}</span>`).join("")}</div>`));
  if(has(L.shape)){sec.appendChild(shead("the shape"));sec.appendChild(el("div","card",B.steps(L.shape)))}
  if(has(L.pace)){
    const tot=L.pace.reduce((a,p)=>a+p.m,0);
    sec.appendChild(shead(`${tot} minutes`,"minute by minute"));
    sec.appendChild(el("div","card",`<div class="pace">${L.pace.map(p=>`<div style="flex:${p.m}" title="${esc(p.l)} · ${p.m} min"><span>${p.m}</span></div>`).join("")}</div>${B.steps(L.pace.map(p=>`**${p.l} · ${p.m} min.** ${p.t}`))}`));
  }
  if(has(GUIDE.fn)){sec.appendChild(shead("notes",`${GUIDE.fn.length}`));sec.appendChild(el("div","card",`<ol class="fnl">${GUIDE.fn.map(x=>`<li>${fmt(x)}</li>`).join("")}</ol>`))}
}

/* panes */
const root=$("#root"), panesEl=$("#panes"), pthumb=panesEl.querySelector(".thumb");
const builders={outline:buildOutline,practice:buildPractice,problems:buildProblems,formulas:buildFormulas,cards:buildCards,timeline:buildTimeline,checklist:buildChecklist,cram:buildCram,tables:buildTables,leq:buildLeq,prompts:buildPrompts};
const PANES=(GUIDE.panes||[]).filter(id=>builders[id]&&(has(GUIDE[id])||(id==="outline"&&has(GUIDE.top))));
const tabs=[];
PANES.forEach(id=>{
  const sec=el("section","pane"); sec.id="p-"+id; sec.setAttribute("role","tabpanel");
  scope(); builders[id](sec); SEEN=null; root.appendChild(sec);
  const b=el("button",null,esc((GUIDE.labels||{})[id]||LABEL[id]||id)); b.type="button"; b.setAttribute("role","tab"); b.dataset.pane=id;
  b.addEventListener("click",()=>show(id,true)); panesEl.appendChild(b); tabs.push(b);
});
if(PANES.length<2)panesEl.classList.add("one");
function moveP(){const on=panesEl.querySelector('button[aria-selected="true"]');if(!on)return;pthumb.style.left=on.offsetLeft+"px";pthumb.style.width=on.offsetWidth+"px"}
let CUR=null;
function show(id,user){
  CUR=id;
  tabs.forEach(b=>b.setAttribute("aria-selected",String(b.dataset.pane===id)));
  document.querySelectorAll(".pane").forEach(p=>p.classList.toggle("on",p.id==="p-"+id));
  moveP(); scoreVis();
  if(user){try{history.replaceState(null,"","#"+id)}catch(e){}; const top=panesEl.getBoundingClientRect().top+scrollY-bar.offsetHeight-12; if(scrollY>top)scrollTo({top,behavior:REDUCED?"auto":"smooth"})}
}
const want=location.hash.slice(1);
show(PANES.includes(want)?want:PANES[0],false);
requestAnimationFrame(moveP); addEventListener("resize",moveP);


/* theme (shared with the homepage via localStorage "theme") */
const seg=$(".seg"), thumb=$(".seg .thumb"), segBtns=[...seg.querySelectorAll("button")];
function moveThumb(){const on=seg.querySelector('button[aria-pressed="true"]')||segBtns[0];thumb.style.left=on.offsetLeft+"px";thumb.style.width=on.offsetWidth+"px"}
function setTheme(mode){
  const apply=()=>{if(mode==="auto")delete document.documentElement.dataset.theme;else document.documentElement.dataset.theme=mode};
  if(document.startViewTransition&&!REDUCED)document.startViewTransition(apply);else apply();
  segBtns.forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.set===mode)));moveThumb();
  try{mode==="auto"?localStorage.removeItem("theme"):localStorage.setItem("theme",mode)}catch(e){}
}
segBtns.forEach(b=>b.addEventListener("click",()=>setTheme(b.dataset.set)));
(function(){let saved=null;try{saved=localStorage.getItem("theme")}catch(e){}
  const mode=saved==="light"||saved==="dark"?saved:"auto";
  if(mode!=="auto")document.documentElement.dataset.theme=mode;
  segBtns.forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.set===mode)));
})();
requestAnimationFrame(moveThumb);addEventListener("resize",moveThumb);
document.fonts?.ready.then(()=>{moveThumb();moveP();setBarH()});

document.querySelectorAll(".rv").forEach((n,i)=>n.style.animationDelay=(i*55)+"ms");
