<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>catholic morality ch 1-2 · study guide</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
</head>
<body>
<style>
:root{
  --text:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro",system-ui,sans-serif;
  --display:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro",system-ui,sans-serif;
  --round:ui-rounded,"SF Pro Rounded","SF Compact Rounded",-apple-system,system-ui,sans-serif;

  --accent:#A2845E;                       /* catholic morality */
  --amb1:var(--accent);                   /* blob 1 is always the class color */
  --amb2:#30D158; --amb3:#40C8E0; --amb4:#F0B429;   /* palette: field */
  --ground:color-mix(in oklab,#E3E3EE 91%,var(--amb1));

  --ink:#08080D; --ink2:rgba(56,56,64,.68); --ink3:rgba(56,56,64,.40);
  --glass:rgba(255,255,255,.54); --glass-hi:rgba(255,255,255,.72);
  --rim-a:rgba(255,255,255,.95); --rim-b:rgba(255,255,255,.10); --rim-c:rgba(255,255,255,.42);
  --gloss:rgba(255,255,255,.55); --spec:rgba(255,255,255,.34);
  --sep:rgba(56,56,64,.10); --fill:rgba(118,118,128,.10); --fill2:rgba(118,118,128,.055);
  --blue:#007AFF; --good:#2FB350; --bad:#FF3B30;
  --blur:22px; --sat:195%;
  --shadow:0 1px 1px rgba(14,14,38,.04), 0 10px 28px -10px rgba(14,14,38,.22);
  --spring:cubic-bezier(.32,.72,0,1); --ease:cubic-bezier(.22,.61,.36,1);
  --amb:.82; --amb-blur:66px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --accent:#B4966F; --ground:color-mix(in oklab,#06060B 89%,var(--amb1)); --ink:#FFFFFF;
  --ink2:rgba(235,235,245,.66); --ink3:rgba(235,235,245,.38);
  --glass:rgba(255,255,255,.06); --glass-hi:rgba(255,255,255,.095);
  --rim-a:rgba(255,255,255,.42); --rim-b:rgba(255,255,255,.04); --rim-c:rgba(255,255,255,.16);
  --gloss:rgba(255,255,255,.16); --spec:rgba(255,255,255,.14);
  --sep:rgba(255,255,255,.085); --fill:rgba(255,255,255,.085); --fill2:rgba(255,255,255,.045);
  --blue:#0A84FF; --good:#30D158; --bad:#FF453A;
  --blur:26px; --sat:175%;
  --shadow:0 1px 1px rgba(0,0,0,.5), 0 12px 32px -12px rgba(0,0,0,.85);
  --amb:.62; --amb-blur:82px;
}}
:root[data-theme="dark"]{
  --accent:#B4966F; --ground:color-mix(in oklab,#06060B 89%,var(--amb1)); --ink:#FFFFFF;
  --ink2:rgba(235,235,245,.66); --ink3:rgba(235,235,245,.38);
  --glass:rgba(255,255,255,.06); --glass-hi:rgba(255,255,255,.095);
  --rim-a:rgba(255,255,255,.42); --rim-b:rgba(255,255,255,.04); --rim-c:rgba(255,255,255,.16);
  --gloss:rgba(255,255,255,.16); --spec:rgba(255,255,255,.14);
  --sep:rgba(255,255,255,.085); --fill:rgba(255,255,255,.085); --fill2:rgba(255,255,255,.045);
  --blue:#0A84FF; --good:#30D158; --bad:#FF453A;
  --blur:26px; --sat:175%;
  --shadow:0 1px 1px rgba(0,0,0,.5), 0 12px 32px -12px rgba(0,0,0,.85);
  --amb:.62; --amb-blur:82px;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--text);
  font-optical-sizing:auto;font-size:17px;line-height:1.45;letter-spacing:-.012em;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;min-height:100vh;
  padding-bottom:calc(48px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
input{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--blue);outline-offset:3px;border-radius:11px}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}
.hidden{display:none !important}

/* ambient */
#amb{position:fixed;inset:-20vh -20vw;z-index:-1;pointer-events:none;contain:strict;
  filter:blur(var(--amb-blur)) saturate(160%);opacity:var(--amb);animation:hue 120s linear infinite}
#amb i{position:absolute;display:block;border-radius:50%;animation:drift 34s var(--ease) infinite alternate}
#amb i:nth-child(1){width:64vw;height:64vw;left:-12vw;top:-10vh;
  background:radial-gradient(circle,var(--amb1),transparent 66%);animation-duration:36s}
#amb i:nth-child(2){width:58vw;height:58vw;right:-14vw;top:4vh;
  background:radial-gradient(circle,var(--amb2),transparent 66%);animation-duration:44s;animation-delay:-9s}
#amb i:nth-child(3){width:70vw;height:70vw;left:2vw;top:44vh;
  background:radial-gradient(circle,var(--amb3),transparent 66%);animation-duration:39s;animation-delay:-18s}
#amb i:nth-child(4){width:52vw;height:52vw;right:-8vw;bottom:-8vh;
  background:radial-gradient(circle,var(--amb4),transparent 66%);animation-duration:48s;animation-delay:-27s}
@keyframes drift{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(7vw,-6vh,0) scale(1.2)}}
@keyframes hue{
  0%,100%{filter:blur(var(--amb-blur)) saturate(160%) hue-rotate(-7deg)}
  50%{filter:blur(var(--amb-blur)) saturate(172%) hue-rotate(7deg)}}

/* glass, four layers */
.g{position:relative;isolation:isolate;background:var(--glass);
  -webkit-backdrop-filter:blur(var(--blur)) saturate(var(--sat));
  backdrop-filter:blur(var(--blur)) saturate(var(--sat));box-shadow:var(--shadow)}
.g::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;z-index:3;
  background:linear-gradient(150deg,var(--rim-a),var(--rim-b) 32%,transparent 56%,var(--rim-c));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  mask-composite:exclude}
.g::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:2;
  background:linear-gradient(180deg,var(--gloss),transparent 38%);opacity:.5}
.spec{position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:2;opacity:0;
  background:radial-gradient(260px circle at var(--mx,50%) var(--my,0%),var(--spec),transparent 68%);
  transition:opacity .4s var(--ease)}
@media (hover:hover){.g:hover > .spec{opacity:1}}

/* header */
header{position:sticky;top:0;z-index:40;background:var(--glass);
  -webkit-backdrop-filter:blur(20px) saturate(var(--sat));backdrop-filter:blur(20px) saturate(var(--sat));
  transition:background .4s var(--ease),box-shadow .4s var(--ease)}
header.stuck{background:var(--glass-hi);box-shadow:inset 0 -.5px 0 0 var(--sep),0 6px 26px -12px rgba(14,14,38,.4)}
.hrow{display:flex;align-items:center;gap:12px;padding:14px 0 12px}
.glyph{width:40px;height:40px;border-radius:12px;flex:none;
  background:linear-gradient(160deg,color-mix(in srgb,var(--accent) 80%,#fff),var(--accent));
  box-shadow:inset 0 .5px 0 rgba(255,255,255,.55),0 4px 10px -4px rgba(0,0,0,.4)}
.glyph path,.glyph circle,.glyph ellipse{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.1s var(--ease) .15s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.cls{font-family:var(--round);font-size:12.5px;font-weight:740;color:var(--accent);text-transform:lowercase}
h1{margin:0;font-family:var(--display);font-size:25.8px;font-weight:400;letter-spacing:-.012em;word-spacing:.08em;line-height:1.08;text-transform:lowercase}
.chip{font-family:var(--round);font-size:12.5px;font-weight:700;padding:5px 11px;border-radius:999px;
  background:color-mix(in srgb,var(--accent) 22%,transparent);color:var(--accent);
  white-space:nowrap;margin-left:auto;flex:none;text-transform:lowercase}

/* segmented control */
.seg{position:relative;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:2px;
  background:var(--fill);border-radius:11px;padding:2px;margin-bottom:14px;box-shadow:inset 0 .5px 0 0 var(--gloss)}
.seg button{position:relative;z-index:1;padding:7px 2px;border-radius:9px;font-family:var(--round);
  font-size:13px;font-weight:640;color:var(--ink2);text-transform:lowercase;transition:color .25s var(--ease)}
.seg button[aria-selected="true"]{color:var(--ink)}
.seg .ind{position:absolute;z-index:0;top:2px;bottom:2px;border-radius:9px;background:var(--glass-hi);
  box-shadow:inset 0 .5px 0 0 var(--gloss),0 2px 6px -2px rgba(0,0,0,.28);
  transition:transform .42s var(--spring),width .42s var(--spring)}

main{padding-top:20px}
.sh{font-family:var(--round);font-size:13.5px;font-weight:680;color:var(--ink3);margin:30px 4px 10px;text-transform:lowercase}
.sh:first-child{margin-top:0}

/* intro */
.intro{border-radius:18px;padding:16px;margin-bottom:14px}
.intro p{margin:0;font-size:15.5px;line-height:1.5;color:var(--ink2);text-transform:lowercase;position:relative;z-index:1}
.intro p + p{margin-top:8px}
.fmt{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0;position:relative;z-index:1}
.fmt > div{background:var(--fill2);border-radius:12px;padding:9px 10px;box-shadow:inset 0 .5px 0 0 var(--gloss)}
.fmt .n{font-family:var(--round);font-size:11px;font-weight:740;color:var(--ink3);text-transform:lowercase}
.fmt .v{font-size:13.5px;font-weight:580;line-height:1.3;margin-top:2px;text-transform:lowercase}

/* outline */
.card{border-radius:18px;overflow:hidden;margin-bottom:10px}
.chead{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:14px 16px;
  position:relative;z-index:1;transition:transform .34s var(--spring)}
.chead:active{transform:scale(.99)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--accent);flex:none;
  box-shadow:0 0 10px color-mix(in srgb,var(--accent) 70%,transparent)}
.dot.hot{background:var(--good);box-shadow:0 0 10px color-mix(in srgb,var(--good) 70%,transparent)}
.ct{flex:1;font-size:16.5px;font-weight:580;letter-spacing:-.018em;text-transform:lowercase}
.tw{color:var(--ink3);transition:transform .34s var(--spring)}
.chead[aria-expanded="true"] .tw{transform:rotate(90deg)}
.cbody{display:grid;grid-template-rows:0fr;transition:grid-template-rows .44s var(--spring)}
.cbody.on{grid-template-rows:1fr}
.cbody > div{overflow:hidden}
.cbody p{margin:0 0 10px;padding:0 16px;font-size:15.5px;line-height:1.5;color:var(--ink2);text-transform:lowercase}
.cbody p:last-child{padding-bottom:16px}
.cbody p b{color:var(--ink);font-weight:640}
.terms{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 16px}
.term{font-family:var(--round);font-size:12.5px;font-weight:640;padding:5px 10px;border-radius:9px;
  background:var(--fill2);color:var(--ink2);box-shadow:inset 0 .5px 0 0 var(--gloss);text-transform:lowercase}

/* glossary */
.search{display:block;width:100%;border:0;background:var(--fill);border-radius:12px;padding:11px 14px;
  font-size:16px;margin-bottom:12px;box-shadow:inset 0 .5px 0 0 var(--gloss);text-transform:lowercase}
.search::placeholder{color:var(--ink3)}
.gl{border-radius:18px;margin-bottom:12px;overflow:hidden}
.gl .gh{font-family:var(--round);font-size:12.5px;font-weight:740;color:var(--accent);padding:13px 16px 4px;text-transform:lowercase;position:relative;z-index:1}
.grow{padding:10px 16px 11px;border-top:.5px solid var(--sep);position:relative;z-index:1}
.grow:first-of-type{border-top:0}
.grow .gt{font-family:var(--round);font-size:15px;font-weight:700;letter-spacing:-.01em;text-transform:lowercase;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.grow .src{font-family:var(--round);font-size:10.5px;font-weight:740;color:var(--ink3);padding:2px 7px;border-radius:6px;background:var(--fill2);text-transform:lowercase}
.grow .gd{font-size:14.5px;line-height:1.45;color:var(--ink2);margin-top:3px;text-transform:lowercase}
.empty{font-size:14.5px;color:var(--ink3);text-align:center;padding:24px 0;text-transform:lowercase}

/* drill */
.picks{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.pick{font-family:var(--round);font-size:12.5px;font-weight:660;padding:7px 12px;border-radius:999px;
  background:var(--fill2);color:var(--ink2);box-shadow:inset 0 .5px 0 0 var(--gloss);text-transform:lowercase;
  transition:background .2s var(--ease),color .2s var(--ease),transform .3s var(--spring)}
.pick:active{transform:scale(.96)}
.pick[aria-pressed="true"]{background:color-mix(in srgb,var(--accent) 24%,transparent);color:var(--accent)}
.scorebar{display:flex;justify-content:space-between;align-items:center;font-family:var(--round);font-size:13px;
  color:var(--ink3);margin:0 4px 10px;font-variant-numeric:tabular-nums;text-transform:lowercase}
.scorebar button{color:var(--blue);font-weight:660}
.qcard{border-radius:18px;padding:18px 16px;margin-bottom:12px}
.qn{font-family:var(--round);font-size:12px;font-weight:740;color:var(--ink3);text-transform:lowercase;position:relative;z-index:1}
.qt{margin:6px 0 14px;font-size:17px;font-weight:560;line-height:1.35;letter-spacing:-.02em;text-transform:lowercase;position:relative;z-index:1}
.opt{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:12px 13px;border-radius:12px;
  background:var(--fill2);margin-bottom:7px;font-size:15.5px;box-shadow:inset 0 .5px 0 0 var(--gloss);
  text-transform:lowercase;position:relative;z-index:1;
  transition:background .2s var(--ease),transform .3s var(--spring),opacity .3s var(--ease)}
.opt:active{transform:scale(.988)}
.opt .k{font-family:var(--round);font-weight:740;font-size:13px;color:var(--ink3);flex:none;width:20px;text-transform:uppercase}
.opt.right{background:color-mix(in srgb,var(--good) 20%,transparent);color:var(--good)}
.opt.wrong{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.opt.right .k,.opt.wrong .k{color:inherit}
.why{margin:10px 2px 0;font-size:13.5px;line-height:1.5;color:var(--ink3);text-transform:lowercase;position:relative;z-index:1}
.why b{color:var(--ink2);font-weight:640}
/* matching */
.mgrid{display:grid;grid-template-columns:1fr 1.4fr;gap:10px;position:relative;z-index:1}
.mcol{display:grid;gap:7px;align-content:start}
.mcol .lab{font-family:var(--round);font-size:11.5px;font-weight:740;color:var(--ink3);margin:0 0 -1px 2px;text-transform:lowercase}
.mi{text-align:left;width:100%;padding:11px 12px;border-radius:12px;background:var(--fill2);font-size:14.5px;line-height:1.35;
  box-shadow:inset 0 .5px 0 0 var(--gloss);text-transform:lowercase;
  transition:background .2s var(--ease),transform .3s var(--spring),opacity .3s var(--ease)}
.mi .t{font-family:var(--round);font-weight:700}
.mi.sel{background:color-mix(in srgb,var(--blue) 18%,transparent);color:var(--blue)}
.mi.done{opacity:.4;background:color-mix(in srgb,var(--good) 16%,transparent);cursor:default}
.mi.miss{background:color-mix(in srgb,var(--bad) 18%,transparent);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@media (max-width:440px){.mgrid{grid-template-columns:1fr}.fmt{grid-template-columns:1fr}.fmt > div{display:flex;gap:10px;align-items:baseline}.fmt .v{margin:0}}

/* short answers */
.acard{border-radius:18px;padding:16px;margin-bottom:12px}
.acard .an{font-family:var(--round);font-size:12px;font-weight:740;color:var(--accent);text-transform:lowercase;position:relative;z-index:1}
.acard .ap{margin:5px 0 12px;font-size:17px;font-weight:580;line-height:1.32;letter-spacing:-.02em;text-transform:lowercase;position:relative;z-index:1}
.beats{list-style:none;margin:0 0 12px;padding:0;display:grid;gap:6px;position:relative;z-index:1}
.beats li{display:flex;gap:9px;font-size:14.5px;line-height:1.4;color:var(--ink2);text-transform:lowercase}
.beats .b{flex:none;width:19px;height:19px;border-radius:50%;background:var(--fill);color:var(--ink3);
  font-family:var(--round);font-size:11px;font-weight:740;display:grid;place-items:center;margin-top:2px;font-variant-numeric:tabular-nums}
.model{border-top:.5px solid var(--sep);padding-top:11px;position:relative;z-index:1}
.model .mh{font-family:var(--round);font-size:11.5px;font-weight:740;color:var(--ink3);margin-bottom:6px;text-transform:lowercase}
.model p{margin:0;font-size:15px;line-height:1.5;text-transform:lowercase}

/* flashcards */
.deck{perspective:1400px;margin-bottom:14px}
.fc{position:relative;width:100%;min-height:220px;transform-style:preserve-3d;transition:transform .62s var(--spring);cursor:pointer;will-change:transform}
.fc.flip{transform:rotateY(180deg)}
.face{position:absolute !important;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:20px;
  display:grid;place-items:center;padding:26px;text-align:center}
.face.back{transform:rotateY(180deg)}
.face .fw{font-family:var(--display);font-size:26.9px;font-weight:400;letter-spacing:-.012em;word-spacing:.08em;line-height:1.15;text-transform:lowercase;position:relative;z-index:1}
.face.back .fw{font-family:var(--text);font-size:16px;font-weight:480;letter-spacing:-.014em;line-height:1.45;color:var(--ink2)}
.fbar{display:flex;align-items:center;gap:12px}
.fbar button{font-family:var(--round);font-size:14px;font-weight:660;color:var(--blue);padding:8px 12px;border-radius:10px;text-transform:lowercase}
.fcount{margin-left:auto;font-family:var(--round);font-size:13px;color:var(--ink3);font-variant-numeric:tabular-nums;text-transform:lowercase}

.rise{opacity:0;transform:translateY(18px) scale(.98);filter:blur(8px);animation:rise .9s var(--spring) forwards;animation-delay:calc(var(--i,0)*55ms)}
@keyframes rise{to{opacity:1;transform:none;filter:blur(0)}}
footer{text-align:center;font-size:12.5px;line-height:1.6;color:var(--ink3);padding:42px 8px 6px;text-transform:lowercase}

@media (prefers-reduced-motion:reduce){
  #amb{animation:none}
  #amb i{animation:none}
  .rise{opacity:1;transform:none;filter:none;animation:none}
  .glyph path,.glyph circle,.glyph ellipse{animation:none;stroke-dashoffset:0}
  *,*::before,*::after{transition-duration:.01ms !important;animation-duration:.01ms !important}
}

/* ═══════════ reading aids: skip link, scroll progress, print ═══════════ */
.skipl{position:fixed;left:12px;top:-72px;z-index:200;padding:10px 15px;border-radius:12px;
  background:var(--accent);color:#fff;font-weight:700;font-size:14px;letter-spacing:-.01em;
  box-shadow:0 10px 28px rgba(0,0,0,.32);transition:top .24s cubic-bezier(.32,.72,0,1)}
.skipl:focus{top:12px;outline:none}
#prog{position:fixed;top:0;left:0;right:0;height:3px;z-index:120;pointer-events:none}
#prog i{display:block;height:100%;width:0;border-radius:0 3px 3px 0;background:var(--accent);
  box-shadow:0 0 12px color-mix(in srgb,var(--accent) 55%,transparent)}
.upd{display:block;margin-top:6px;font-size:12px;opacity:.75}
@media (prefers-reduced-motion:no-preference){#prog i{transition:width .09s linear}}
@media print{
  @page{margin:.6in}
  :root,:root[data-theme="dark"],:root[data-theme="light"]{
    --ink:#000!important;--ink2:#26262b!important;--ink3:#45454d!important;
    --ground:#fff!important;--fill:rgba(0,0,0,.055)!important;--fill2:rgba(0,0,0,.03)!important;
    --gloss:transparent!important;--rim:rgba(0,0,0,.2)!important}
  #amb,#prog,.skipl,.seg,#seg,.ind{display:none!important}
  html,body{background:#fff!important;color:#000!important;font-size:12pt}
  *,*::before,*::after{-webkit-backdrop-filter:none!important;backdrop-filter:none!important;
    box-shadow:none!important;text-shadow:none!important;filter:none!important;
    animation:none!important;transition:none!important;opacity:1!important;transform:none!important}
  .spec,.gloss,.rim{display:none!important}
  header,#hdr{position:static!important;background:none!important;border:0!important;
    padding:0 0 10px!important;margin-bottom:10px!important;border-bottom:1px solid #999!important}
  .g,.card,.tl,.row,.ftable,section{background:#fff!important;border:1px solid #ccc!important;
    color:#000!important}
  .pane{display:block!important}
  .cbody,.ra,.sol>div,.cbody>div,.body{grid-template-rows:1fr!important;height:auto!important;
    max-height:none!important;overflow:visible!important;display:block!important}
  .card,.row,.tl,.qitem,.ftable{break-inside:avoid;page-break-inside:avoid}
  h1,h2,h3{break-after:avoid;page-break-after:avoid}
  main,main *{color:#111!important}
  .trap,.warn,.bad,.no{color:#b3261e!important}
  .good,.yes{color:#14622a!important}
  a{color:#000!important;text-decoration:none}
  footer,footer *{color:#444!important}
}
</style>
<style id="stone">

  answers:[
    {p:"name and explain the three major aspects of every moral action. which is most important?",
     b:["name all three: moral object, intention, circumstances.","define each with its question: what, why, and who when where how.","state the rule: all three must be good.","say the moral object is decisive and why.","close with the chart's question: can it make an evil act good? no, three times."],
     m:"every moral action has three elements: the moral object, the intention, and the circumstances. the moral object answers what you will do, the intention answers why you do it, and the circumstances are the w questions of who, when, where, and how. to judge an action you must weigh all three, and all three have to be good for the action to be good. the moral object is the most important because it is the decisive element; if what you do is evil in itself, like murder or adultery, no intention and no circumstance can make it good. intention can contaminate a good act and circumstances can increase or diminish responsibility, but neither can change the moral quality of the act."},

     m:"prayer is conversation with god, the living relationship of the children of god with the father, the son, and the holy spirit. like any conversation it has two parts, talking and listening. in the talking part we praise god, thank him, express sorrow, and ask for help; in the listening part we must slow down and seek silence so that we can hear god speaking to us. two ways of listening are meditation, where you focus the mind to see and understand what god is saying, and contemplation, which is mental prayer. prayer is the p in stop and is essential because it gives us guidance, and even talking and listening to the advice of others can be a prayer."},

     b:["quote aquinas: right reason in action.","give the fuller definition.","separate it from discernment.","say what it does: helps conscience judge, sets rule and measure, gives foresight.","use the alaska photographer or your own example."],
     m:"aquinas described prudence as right reason in action. it is the moral virtue that inclines you to discern a good, ethical, and moral life and to choose the means to accomplish it, or more simply, the virtue that helps you make the right choice. it is different from discernment, which is the process of thinking what to do; prudence is the virtue that makes you good at that process. prudence helps your conscience make correct judgments about right and wrong and shows you how to act with foresight. the photographer in alaska planned his whole trip but never arranged for a pilot to pick him up, and that lack of foresight is exactly what prudence would have supplied."},
    {p:"explain what it means that god created humans male and female as complementary.",
     b:["define complementary.","state that neither is superior.","say what each does for the other.","connect to marriage.","close on god's plan."],
     m:"god created humans as complementary beings, male and female. complementary means things that combine to bring out the best in one another, so male and female complete each other. neither is superior to the other; each needs and completes the other. this is why the church teaches that only through the committed union of a husband and wife in marriage can the procreation and education of children take place in a setting that is secure, nurturing, and consistent with what god intends. the union of male and female is part of god's plan for creation, written into human nature itself."},
    {p:"explain st. augustine's words: you have made us for yourself, o god, and so our hearts are restless until they rest in you.",
     b:["start from the soul.","say what it refuses to settle for.","name the ultimate question.","state the thirst only god satisfies.","close on the restlessness ending in god."],

    {p:"explain how others can help you make good moral decisions.",
     b:["name the o in stop.","list who: parents, friends, mentors, coaches, godparents, alumni.","say why someone outside the situation helps.","add the magisterium and the sacrament of penance.","close on jesus and the gospels."],
     m:"the o in the stop process stands for others, because others can help you make good decisions. parents, friends, mentors, coaches, godparents, and people who have been through the situation before are trusted sources of advice, and someone outside the situation can look at it objectively without the emotion attached. the church also helps through the magisterium, the bishops in union with the pope, which in practice means a priest or deacon you can talk to, and through the sacrament of penance where you can ask for practical advice. above all, jesus gives guidance through his moral teaching in the gospels. no one has all the wisdom they need alone, so asking for help is itself part of acting prudently."}

/* glossary */
(function(){
  const host=$("#p-glossary");
  const inp=el("input","search"); inp.type="search"; inp.placeholder="search the glossary"; inp.setAttribute("aria-label","search glossary");
  host.appendChild(inp);
  const picks=el("div","picks"); picks.setAttribute("role","group");
  const srcs=[["all","all"],["cw","crossword"],["rv","review sheet"],["cl","class review"]];
  let src="all",q="";
  srcs.forEach(([k,l],i)=>{const b=el("button","pick");b.textContent=l;b.setAttribute("aria-pressed",String(i===0));
    b.onclick=()=>{src=k;$$(".pick",picks).forEach(x=>x.setAttribute("aria-pressed",String(x===b)));draw()};picks.appendChild(b)});
  host.appendChild(picks);
  const out=el("div"); host.appendChild(out);
  const SRC={cw:"crossword",rv:"review",cl:"class"};
  function draw(){
    out.innerHTML="";
    [1,2].forEach(ch=>{
      const rows=GUIDE.glossary.filter(g=>g.ch===ch && (src==="all"||g.s===src) && (!q || (g.t+" "+g.d).toLowerCase().includes(q)));
      if(!rows.length) return;
      const card=el("div","gl g"); card.innerHTML=spec+'<div class="gh">chapter '+ch+' · '+rows.length+'</div>';
      rows.forEach(g=>{const r=el("div","grow");
        r.innerHTML='<div class="gt"><span></span><span class="src">'+SRC[g.s]+'</span></div><div class="gd"></div>';
        r.querySelector(".gt span").textContent=g.t; r.querySelector(".gd").textContent=g.d; card.appendChild(r)});
      out.appendChild(card);
    });
    if(!out.children.length){const e=el("div","empty");e.textContent="nothing matches. try a shorter word.";out.appendChild(e)}
  }
  inp.oninput=()=>{q=inp.value.trim().toLowerCase();draw()};
  draw();
})();

/* drill: mc sets + matching sets */
(function(){
  const host=$("#p-drill");
  const picks=el("div","picks"); host.appendChild(picks);
  const out=el("div"); host.appendChild(out);
  const items=[...GUIDE.mc.map((s,i)=>({k:"mc",i,label:s.name})),...GUIDE.match.map((s,i)=>({k:"ma",i,label:s.name}))];
  items.forEach((it,n)=>{const b=el("button","pick");b.textContent=it.label;b.setAttribute("aria-pressed",String(n===0));
    b.onclick=()=>{$$(".pick",picks).forEach(x=>x.setAttribute("aria-pressed",String(x===b)));it.k==="mc"?drawMC(it.i):drawMatch(it.i)};picks.appendChild(b)});

  function drawMC(i){
    out.innerHTML=""; const set=GUIDE.mc[i]; let score=0,done=0;
    const bar=el("div","scorebar"); bar.innerHTML='<span></span><button>restart</button>';
    const upd=()=>bar.firstChild.textContent=set.name+" · "+score+" of "+done+" right";
    bar.querySelector("button").onclick=()=>drawMC(i); upd(); out.appendChild(bar);
    set.qs.forEach((q,n)=>{
      const card=el("div","qcard g"); card.innerHTML=spec+'<div class="qn">question '+(n+1)+'</div><div class="qt"></div>';
      card.querySelector(".qt").textContent=q.q;
      q.opts.forEach((o,j)=>{const b=el("button","opt");b.innerHTML='<span class="k">'+"abcd"[j]+'</span><span></span>';b.lastChild.textContent=o;
        b.onclick=()=>{if(card.dataset.done)return;card.dataset.done="1";done++;if(j===q.a)score++;upd();
          $$(".opt",card).forEach((x,k)=>{if(k===q.a)x.classList.add("right");else if(k===j)x.classList.add("wrong")});
          const w=el("p","why");w.innerHTML=(j===q.a?"<b>right.</b> ":"<b>not quite.</b> ")+q.why;card.appendChild(w)};
        card.appendChild(b)});
      rise(card,n); out.appendChild(card);
    });
  }
  function drawMatch(i){
    out.innerHTML=""; const set=GUIDE.match[i]; let sel=null,matched=0,tries=0;
    const bar=el("div","scorebar"); bar.innerHTML='<span></span><button>reset</button>';
    const upd=()=>{bar.firstChild.textContent=set.name+" · "+matched+" of "+set.pairs.length+" matched"+(tries?" · "+tries+(tries===1?" try":" tries"):"")};
    bar.querySelector("button").onclick=()=>drawMatch(i); upd(); out.appendChild(bar);
    const card=el("div","qcard g"); card.innerHTML=spec+'<div class="mgrid"><div class="mcol"><div class="lab">term</div></div><div class="mcol"><div class="lab">definition</div></div></div>';
    const [L,R]=$$(".mcol",card);
    const order=set.pairs.map((_,k)=>k).sort(()=>Math.random()-.5);
    set.pairs.forEach((p,k)=>{const b=el("button","mi");b.innerHTML='<span class="t"></span>';b.firstChild.textContent=p[0];b.dataset.i=k;
      b.onclick=()=>{if(b.classList.contains("done"))return;$$(".mi",L).forEach(x=>x.classList.remove("sel"));b.classList.add("sel");sel=k};L.appendChild(b)});
    order.forEach(k=>{const b=el("button","mi");b.textContent=set.pairs[k][1];b.dataset.i=k;
      b.onclick=()=>{if(b.classList.contains("done")||sel===null)return;tries++;
        const lb=$$(".mi",L).find(x=>+x.dataset.i===sel);
        if(k===sel){b.classList.add("done");lb.classList.remove("sel");lb.classList.add("done");matched++;sel=null}
        else{b.classList.add("miss");setTimeout(()=>b.classList.remove("miss"),400)}
        upd()};R.appendChild(b)});
    rise(card,0); out.appendChild(card);
  }
  drawMC(0);
})();

/* flashcards, built from the glossary */
(function(){
  const host=$("#p-cards"); let deckSrc=GUIDE.glossary.slice(),n=0;
  const picks=el("div","picks"); const opts=[["all","all"],[1,"chapter 1"],[2,"chapter 2"],["shuffle","shuffle"]];
  opts.forEach(([k,l],i)=>{const b=el("button","pick");b.textContent=l;b.setAttribute("aria-pressed",String(i===0));
    b.onclick=()=>{if(k==="shuffle"){deckSrc=deckSrc.slice().sort(()=>Math.random()-.5)}else{deckSrc=GUIDE.glossary.filter(g=>k==="all"||g.ch===k);$$(".pick",picks).forEach(x=>x.setAttribute("aria-pressed",String(x===b)))}n=0;draw()};picks.appendChild(b)});
  host.appendChild(picks);
  const deck=el("div","deck"),fc=el("div","fc");
  fc.innerHTML='<div class="face front g">'+spec+'<div class="fw"></div></div><div class="face back g">'+spec+'<div class="fw"></div></div>';
  deck.appendChild(fc);
  const bar=el("div","fbar"); bar.innerHTML='<button id="prev">back</button><button id="next">next</button><span class="fcount"></span>';
  const draw=()=>{fc.classList.remove("flip");fc.querySelector(".front .fw").textContent=deckSrc[n].t;fc.querySelector(".back .fw").textContent=deckSrc[n].d;bar.querySelector(".fcount").textContent=(n+1)+" of "+deckSrc.length};
  fc.onclick=()=>fc.classList.toggle("flip");
  bar.querySelector("#prev").onclick=()=>{n=(n-1+deckSrc.length)%deckSrc.length;draw()};
  bar.querySelector("#next").onclick=()=>{n=(n+1)%deckSrc.length;draw()};
  addEventListener("keydown",e=>{if($("#p-cards").classList.contains("hidden"))return;
    if(e.key==="ArrowRight")bar.querySelector("#next").click();if(e.key==="ArrowLeft")bar.querySelector("#prev").click();
    if(e.key===" "){e.preventDefault();fc.click()}});
  host.append(deck,bar); draw();
})();

  tabs.forEach(([id,label],i)=>{const b=el("button");b.textContent=label;b.setAttribute("role","tab");b.setAttribute("aria-selected",String(i===0));b.onclick=()=>select(i);seg.appendChild(b)});
  function select(i){const btns=$$("button",seg);btns.forEach((b,j)=>b.setAttribute("aria-selected",String(i===j)));tabs.forEach(([id],j)=>$("#p-"+id).classList.toggle("hidden",i!==j));move()}
  function move(){const btns=$$("button",seg);const i=btns.findIndex(b=>b.getAttribute("aria-selected")==="true");const b=btns[i];if(!b)return;ind.style.width=b.offsetWidth+"px";ind.style.transform="translateX("+(b.offsetLeft-2)+"px)"}
  seg.addEventListener("keydown",e=>{const btns=$$("button",seg);const i=btns.findIndex(b=>b.getAttribute("aria-selected")==="true");
    const d=e.key==="ArrowRight"?1:e.key==="ArrowLeft"?-1:0;if(!d)return;e.preventDefault();const n=(i+d+btns.length)%btns.length;btns[n].focus();select(n)});
  addEventListener("resize",move); requestAnimationFrame(move); addEventListener("load",move);
})();

/* header state + pointer specular */
(function(){
  const hdr=$("#hdr"); let raf=0;
  addEventListener("scroll",()=>{if(raf)return;raf=requestAnimationFrame(()=>{raf=0;hdr.classList.toggle("stuck",scrollY>6)})},{passive:true});
  if(matchMedia("(hover:hover)").matches && !REDUCED){
    addEventListener("pointermove",e=>{const c=e.target.closest&&e.target.closest(".g");if(!c)return;const r=c.getBoundingClientRect();
      c.style.setProperty("--mx",(e.clientX-r.left)+"px");c.style.setProperty("--my",(e.clientY-r.top)+"px")},{passive:true});
  }
})();
</script>

(function(){var b=document.querySelector("#prog i");if(!b)return;
 var t=0;function u(){var d=document.scrollingElement||document.documentElement,
 h=d.scrollHeight-d.clientHeight;
 b.style.width=(h>4?Math.max(0,Math.min(100,d.scrollTop/h*100)):0)+"%";}
 addEventListener("scroll",function(){if(t)return;t=requestAnimationFrame(function(){t=0;u()})},{passive:true});
 addEventListener("resize",u);u();})();
